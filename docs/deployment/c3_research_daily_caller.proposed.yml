name: C3 approved research daily caller
on:
  workflow_run:
    workflows: ['KRX daily candidate scan']
    types: [completed]
    branches: [main]
  schedule:
    # Retry windows, not a provider publication SLA. KST 22:15 and 08:20.
    - cron: '15 13 * * 1-5'
    - cron: '20 23 * * 0-4'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/c3_research_daily_caller.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-approved-daily-caller
  cancel-in-progress: false
jobs:
  review-manifest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/workflows/c3_research_daily_caller.yml
          sparse-checkout-cone-mode: false
      - name: Validate the one-file deployment pin without running collection
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p=Path('.github/workflows/c3_research_daily_caller.yml').read_text()
          import re
          pin='e759e56f2e3f240b97ffa3f5422ff62244b68ba7'
          job=p.split('\n  research:\n',1)[1]
          called=re.search(r'uses: shdmfpsj-beep/krx-auto-scanner/\.github/workflows/c3_daily_research_v8\.yml@([a-f0-9]{40})',job)
          configured=re.search(r'^      engine_ref: ([a-f0-9]{40})$',job,re.M)
          assert called and configured and called[1]==configured[1]==pin
          secrets=job.split('\n    secrets:\n',1)[1]
          assert 'inherit' not in secrets
          assert set(re.findall(r'^      ([A-Z_]+):',secrets,re.M))=={'KRX_AUTH_KEY'}
          assert 'caller_mode: approved_daily' in job and 'refs/heads/main' in job
          print('Pinned research caller manifest valid; production invocation remains disabled on PR')
          PYCODE
  research:
    if: github.repository == 'shdmfpsj-beep/krx-auto-scanner' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    permissions:
      contents: write
      actions: read
    uses: shdmfpsj-beep/krx-auto-scanner/.github/workflows/c3_daily_research_v8.yml@e759e56f2e3f240b97ffa3f5422ff62244b68ba7
    with:
      engine_ref: e759e56f2e3f240b97ffa3f5422ff62244b68ba7
      caller_mode: approved_daily
    secrets:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
