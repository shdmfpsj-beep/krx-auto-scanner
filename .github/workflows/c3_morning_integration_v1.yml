name: C3 morning full-market integration (NO SEND / NO LEDGER WRITES)
on:
  push:
    branches: ['fix/c3-morning-orchestration-20261112']
    paths: ['scripts/c3_*v1.py','scripts/c3_candidate_entry_review_v2.py','scripts/test_c3_morning_v1.py','.github/workflows/c3_morning_integration_v1.yml','.github/workflows/c3_morning_research_adapter_v1.yml']
  pull_request:
    paths: ['scripts/c3_morning_source_v1.py','scripts/c3_morning_final_v1.py','scripts/c3_candidate_entry_review_v2.py','scripts/c3_company_quality_review_v1.py','scripts/test_c3_morning_v1.py','.github/workflows/c3_morning_integration_v1.yml','.github/workflows/c3_morning_research_adapter_v1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/*.py
            /config/*.json
            /.github/workflows/c3_morning_research_adapter_v1.yml
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: 54e7120b01966930e176d431e85b679347210c41
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: research/c3-ledger-integrity-audit-20261104
          path: state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
      - name: Install existing dependencies and pinned reference calendar
        run: python -m pip install requests pillow pandas==2.2.3 pykrx==1.2.9 'cryptography>=43,<47' exchange-calendars==4.13.2 --disable-pip-version-check
      - name: Calendar, source agreement, immutable-plan and financial-date faults
        env:
          PYTHONPATH: scripts:engine/scripts
        run: python -m unittest discover -s scripts -p 'test_c3_morning_v1.py' -v
      - name: Actual prior-session official/cache agreement, no fallback
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: scripts:engine/scripts
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python scripts/c3_morning_source_v1.py --date 2026-11-11 --outdir evidence
      - name: Reproduce original scope then inspect every technical candidate
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: scripts:engine/scripts
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          C3_KEY_ENVELOPES_DIR: ${{ github.workspace }}/state/reports/c3_forward_v8/key_envelopes
        run: python scripts/c3_candidate_entry_review_v2.py --date 2026-11-11 --engine engine --state state --source-proof evidence/morning_source.json --outdir evidence/entry
      - name: Reuse the existing public corporation mapping
        uses: actions/cache@v4
        with:
          path: .cache/c3-dart/
          key: c3-dart-corp-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: c3-dart-corp-v1-${{ runner.os }}-
      - name: Review documented company facts across the full technical pool
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: scripts
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_sha=$(python scripts/c3_nov11_company_snapshot_reuse_v1.py --out /tmp/c3-nov11-company.json)
          python scripts/c3_company_quality_review_v1.py --candidates evidence/entry/technical_candidates.json --entry evidence/entry/reselection_summary.json --outdir evidence/company --reuse-file /tmp/c3-nov11-company.json --reuse-sha "$snapshot_sha"
      - name: Create the source-matched PNG and check real prior receipts without Telegram credentials
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: scripts:engine/scripts
          GH_TOKEN: ${{ github.token }}
        run: python scripts/c3_morning_final_v1.py --source evidence/morning_source.json --entry evidence/entry/reselection_summary.json --company evidence/company/combined_review.json --outdir evidence/final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-morning-integration-v1
          path: |
            evidence/morning_source.json
            evidence/entry/reselection_summary.json
            evidence/entry/all_technical_entry_diagnostics.json
            evidence/entry/technical_candidates.json
            evidence/company/*.json
            evidence/final/*.json
            evidence/final/*.png
          retention-days: 90
          if-no-files-found: warn
