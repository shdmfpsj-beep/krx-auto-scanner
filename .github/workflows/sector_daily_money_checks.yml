name: Daily money-flow sector replay integrity checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sector_daily_money.py'
      - 'scripts/test_sector_daily_money.py'
      - 'scripts/sector_evidence_bridge.py'
      - 'scripts/test_sector_evidence_bridge.py'
      - 'scripts/sector_first_daily.py'
      - 'scripts/entry_setup_audit.py'
      - 'scripts/test_entry_setup_audit.py'
      - 'scripts/sector_dynamic_structure.py'
      - 'scripts/test_sector_dynamic_structure.py'
      - 'scripts/focus_daily_structure.py'
      - 'scripts/focus_structure_join.py'
      - 'scripts/focus_daily_structure.py'
      - 'scripts/sector_dynamic_structure.py'
      - 'scripts/sector_financial_join.py'
      - 'scripts/stock_evidence_matrix.py'
      - 'scripts/test_stock_evidence_matrix.py'
      - '.github/workflows/sector_daily_money_checks.yml'

permissions:
  contents: read
  actions: read

jobs:
  evidence-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/sector_daily_money.py
            /scripts/test_sector_daily_money.py
            /scripts/sector_evidence_bridge.py
            /scripts/test_sector_evidence_bridge.py
            /scripts/sector_first_daily.py
            /scripts/entry_setup_audit.py
            /scripts/test_entry_setup_audit.py
            /scripts/focus_structure_join.py
            /scripts/focus_daily_structure.py
            /scripts/sector_dynamic_structure.py
            /scripts/test_sector_dynamic_structure.py
            /scripts/sector_financial_join.py
            /scripts/stock_evidence_matrix.py
            /scripts/test_stock_evidence_matrix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Offline safety tests
        run: |
          python -m py_compile scripts/sector_daily_money.py scripts/test_sector_daily_money.py
          python -m unittest discover -s scripts -p test_sector_daily_money.py -v

      - name: Download real 2026-10-21 completed v18 source ZIP
        run: |
          mkdir -p inputs output
          gh api -X GET "repos/${{ github.repository }}/actions/artifacts/12340585342/zip" > inputs/dated_evidence.zip

      - name: Repeat original KRX money calculation, no broker trading
        run: |
          python scripts/sector_daily_money.py \
            --evidence inputs/dated_evidence.zip \
            --asof 2026-10-21 \
            --out output
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/sector_daily_money.json").read_text())
          print("ASOF_KRX_DAILY_FLOW_TOP3",[(x["sector_id"],x["raw_day_net_flow_krw"],
                x["incremental_day_net_flow_krw"]) for x in r["selected_top3"]])
          assert r["asof"]=="2026-10-21"
          assert [s["sector_id"] for s in r["selected_top3"]]==[
              "SEMICON","DEFENSE","POWER"]
          assert not r["trade_approved"] and r["decision"]=="CASH"
          assert r["selected_top3"][0]["cash_lines_excluded"]>=1
          assert all(x["incremental_day_net_flow_krw"]>0 for x in r["selected_top3"])
          assert all(x["trade_approval"]=="NO" for x in r["selected_top3"])
          assert any(x["day_breadth_pct"]<60 for x in r["selected_top3"])
          assert r["pre_expansion_sector_count"]>=1
          print("REAL_DAY_MONEY_REPLAY_PASSED")
          PY

      - name: Replay actual 10-21 KRX stocks through full TOP3-to-TOP5 bridge
        run: |
          unzip -q inputs/dated_evidence.zip -d inputs/asof_evidence
          python - <<'PY'
          import json
          from pathlib import Path
          Path("inputs/dated_scan_fixture.json").write_text(
              json.dumps({"market_data_date":"2026-10-21",
                          "test_type":"HISTORICAL_ASOF_ALIGNMENT_ONLY"}))
          PY
          python scripts/sector_evidence_bridge.py \
            --evidence inputs/asof_evidence \
            --scan-status inputs/dated_scan_fixture.json \
            --daily-money output/sector_daily_money.json \
            --out output > output/bridge_debug_log.json
          python scripts/sector_first_daily.py --input output --out output --today 2026-10-21
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("output/sector_bridge_status.json").read_text())
          report=json.loads(Path("output/sector_first_daily_status.json").read_text())
          assert s["daily_money_rank_applied"]
          assert s["research_top3_sector_ids"]==["SEMICON","DEFENSE","POWER"]
          assert [s["sector_id"] for s in report["sector_top3"]]==[
             "SEMICON","DEFENSE","POWER"]
          assert all(x["sector_id"] in s["research_top3_sector_ids"]
                     for x in report["stock_research_top5"])
          assert report["decision"]=="CASH"
          assert not report["trade_approved"]
          leaders=report["sector_leader_watch"]
          observed=[x["sector_id"] for x in leaders]
          assert len(observed)==len(set(observed))
          assert set(observed)<=set(s["sector_id"] for s in report["sector_top3"])
          assert not report["sector_watch_is_buy_recommendation"]
          print("REAL_ASOF_SECTOR_LEADERS",
                [(x["sector_id"],x["ticker"],x["name"]) for x in leaders])
          print("REAL_ASOF_TOP5_COUNTS",report["stock_top5_sector_counts"])
          print("REAL_ASOF_TOP5_CONCENTRATION",
                report["stock_top5_concentration_warning"])
          print("REAL_20261021_SECTOR_TO_STOCK_BRIDGE_PASSED",
                "stock_research_count",len(report["stock_research_top5"]))
          PY

      - name: Replay actual KRX TOP5 company evidence safely without retroactive earnings
        run: |
          python -m unittest discover -s scripts -p test_stock_evidence_matrix.py -v
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from stock_evidence_matrix import build,render
          actual=json.loads(Path("output/sector_first_daily_status.json").read_text())
          result=build(actual)
          assert result["asof"]=="2026-10-21"
          assert result["candidate_count"]>=5
          assert result["sector_money_asof_aligned"]
          assert result["decision"]=="CASH" and not result["trade_approved"]
          assert result["company_catalyst_verified_count"]==0
          assert all(not x["checks"]["annual_filing_verified"]
                     and not x["final_85_score_verified"]
                     for x in result["candidates"])
          assert all(x["cohort"]!="ABSOLUTE_TOP5" or x["ticker"] in
                     [v["ticker"] for v in actual["stock_research_top5"]]
                     for x in result["candidates"])
          Path("output/company_evidence_matrix.json").write_text(
               json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("output/company_evidence_matrix_mobile.md").write_text(
               render(result),encoding="utf-8")
          print("REAL_KRX_20261021_COMPANY_EVIDENCE_CHECK_PASSED",
                [(x["ticker"],x["cohort"]) for x in result["candidates"]])
          PY

      - name: Run real Oct21 KRX completed 65+ bars through daily geometry and support bridge
        run: |
          python -m unittest discover -s scripts -p test_entry_setup_audit.py -v
          python -m unittest discover -s scripts -p test_sector_dynamic_structure.py -v
          python scripts/sector_dynamic_structure.py \
             --status output/sector_bridge_status.json \
             --watchlist output/sector_stock_research_ranking.csv \
             --evidence-root inputs/asof_evidence \
             --out output/dynamic \
             --asof 2026-10-21 --max-total 12 --per-sector 4
          python scripts/focus_structure_join.py --root output
          python scripts/sector_financial_join.py --root output
          python scripts/entry_setup_audit.py --root output
          python - <<'PY'
          import csv,json
          from pathlib import Path
          s=json.loads(Path("output/entry_setup_audit.json").read_text())
          market=json.loads(Path("output/sector_first_with_prices.json").read_text())
          with Path("output/dynamic/focus_daily_structure_prices.csv").open(
                 encoding="utf-8-sig") as f:
              rows=list(csv.DictReader(f))
          assert s["asof"]=="2026-10-21"
          assert s["decision"]=="CASH" and s["prospective_trades_created"]==0
          assert s["stock_count"]==len(market["stock_research_top5"])
          assert len(rows)>=5
          assert all(r["latest_complete_date"]<="2026-10-21" for r in rows
                     if r["latest_complete_date"])
          assert all(r["data_source"]=="V18_KRX_CACHED"
                     for r in rows if r["latest_complete_date"]=="2026-10-21")
          assert all(x["stop_krw"] is None or x["stop_krw"]>0 for x in s["candidates"])
          print("REAL_ASOF_20261021_ENTRY_GEOMETRY_RISK_AUDIT_PASSED",
                "total=",s["stock_count"],
                "ready=",s["technical_geometry_pass_count"],
                "outcomes=",[(x["ticker"],x["name"],x["code"],
                             x["first_entry_krw"],x["second_entry_support_krw"],
                             x["stop_krw"],x["resistance_krw"],
                             x["forward_rr_at_first_ceiling"],
                             x["required_atr_to_2r"],
                             x["five_day_2r_stretch_warning"])
                            for x in s["candidates"]])
          PY

      - name: Save independently calculated money-first TOP3 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-money-real-20261021
          path: |
            output/sector_daily_money.json
            output/sector_daily_money_mobile.md
            output/sector_bridge_status.json
            output/sector_first_daily_status.json
            output/sector_first_daily_mobile.md
            output/company_evidence_matrix.json
            output/company_evidence_matrix_mobile.md
            output/dynamic/focus_daily_structure_status.json
            output/sector_first_with_prices.json
            output/entry_setup_audit.json
            output/entry_setup_audit_mobile.md
          if-no-files-found: warn
          retention-days: 30
