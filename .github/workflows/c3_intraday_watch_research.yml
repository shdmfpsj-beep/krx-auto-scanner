name: C3 TOP2 intraday watch research checks (NO LIVE QUOTES)
on:
  workflow_dispatch:
  push:
    branches: [research/c3-intraday-watch-20261102]
    paths:
      - 'scripts/c3_intraday_watch_v1.py'
      - 'scripts/test_c3_intraday_watch_v1.py'
      - '.github/workflows/c3_intraday_watch_research.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/c3_intraday_watch_v1.py
            /scripts/test_c3_intraday_watch_v1.py
            /config/c3_paper_top2_plans.csv
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Unit tests only; never request or simulate a market quote
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_c3_intraday_watch_v1.py -v
