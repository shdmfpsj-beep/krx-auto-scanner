name: Kiwoom REST credential preflight (no API call)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check credential presence without displaying secret data
        shell: bash
        env:
          KTSCA_API_KEY: ${{ secrets.KTSCA_API_KEY }}
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
        run: |
          set -euo pipefail
          # Only print boolean presence of environment secrets, never their values,
          # lengths, substrings, or request/response payloads.
          if [[ -n "${KTSCA_API_KEY:-}" ]]; then
            echo "PRESENT: KTSCA_API_KEY (credential type not verified)"
          else
            echo "MISSING: KTSCA_API_KEY"
          fi
          if [[ -n "${KIWOOM_APP_KEY:-}" ]]; then
            echo "PRESENT: KIWOOM_APP_KEY"
          else
            echo "MISSING: KIWOOM_APP_KEY"
          fi
          if [[ -n "${KIWOOM_APP_SECRET:-}" ]]; then
            echo "PRESENT: KIWOOM_APP_SECRET"
          else
            echo "MISSING: KIWOOM_APP_SECRET"
          fi
          if [[ -n "${KIWOOM_APP_KEY:-}" && -n "${KIWOOM_APP_SECRET:-}" ]]; then
            echo "CONFIGURED: canonical Kiwoom credential names are available."
          else
            echo "NOT_READY: canonical Kiwoom App Key + App Secret are not both configured."
          fi
          echo "This preflight does not verify credentials, registered source IP, or API access."
          echo "No live network request was made; no trading endpoint was called."
