name: Kiwoom REST credentials preflight (no API call)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check App Key and App Secret availability
        shell: bash
        env:
          KIWOOM_APP_KEY: ${{ secrets.KTSCA_API_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
        run: |
          set -euo pipefail
          # KTSCA_API_KEY has been confirmed by the user as the Kiwoom App Key.
          # Report only presence flags; never reveal secret values or their lengths.
          if [[ -z "${KIWOOM_APP_KEY:-}" ]]; then
            echo "::error::Missing KTSCA_API_KEY (Kiwoom App Key)."
            exit 1
          fi
          echo "PASS: KTSCA_API_KEY is available as KIWOOM_APP_KEY."
          if [[ -z "${KIWOOM_APP_SECRET:-}" ]]; then
            echo "::error::Missing KIWOOM_APP_SECRET (Kiwoom App Secret)."
            exit 1
          fi
          echo "PASS: KIWOOM_APP_SECRET is available."
          echo "PRECHECK_OK: both Kiwoom credentials are present in this job."
          echo "This does NOT validate key correctness, API authentication, registered IP, or market-data access."
          echo "No network request or trading endpoint is called."
