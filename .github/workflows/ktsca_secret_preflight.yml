name: KTSCA credential preflight (no API call)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Actions received KTSCA_API_KEY
        shell: bash
        env:
          KTSCA_API_KEY: ${{ secrets.KTSCA_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${KTSCA_API_KEY:-}" ]]; then
            echo "::error title=Missing repository secret::Set KTSCA_API_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "PASS: KTSCA_API_KEY is available to this GitHub Actions job."
          echo "No secret value or metadata has been printed."
          echo "Authentication, API provider and market-data retrieval have NOT been validated."
