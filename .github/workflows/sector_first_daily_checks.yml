name: Sector First daily report safe tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sector_first_daily.py'
      - 'scripts/test_sector_first_daily.py'
      - 'scripts/sector_evidence_bridge.py'
      - 'scripts/test_sector_evidence_bridge.py'
      - 'scripts/sector_daily_money.py'
      - 'scripts/test_sector_daily_money.py'
      - 'scripts/global_sector_news.py'
      - 'scripts/test_global_sector_news.py'
      - 'scripts/global_sector_join.py'
      - 'scripts/test_global_sector_join.py'
      - 'scripts/global_preopen_brief.py'
      - 'scripts/test_global_preopen_brief.py'
      - 'scripts/focus_daily_structure.py'
      - 'scripts/test_focus_daily_structure.py'
      - 'scripts/focus_structure_join.py'
      - 'scripts/test_focus_structure_join.py'
      - 'scripts/sector_dynamic_structure.py'
      - 'scripts/test_sector_dynamic_structure.py'
      - 'scripts/sector_first_compact_report.py'
      - 'scripts/test_sector_first_compact_report.py'
      - 'scripts/dart_interim_periods.py'
      - 'scripts/test_dart_interim_periods.py'
      - 'scripts/dart_financial_screen.py'
      - 'scripts/test_dart_financial_screen.py'
      - 'scripts/sector_financial_join.py'
      - 'scripts/test_sector_financial_join.py'
      - 'scripts/stock_evidence_matrix.py'
      - 'scripts/test_stock_evidence_matrix.py'
      - 'scripts/shadow_trade_audit.py'
      - 'scripts/test_shadow_trade_audit.py'
      - 'scripts/shadow_entry_comparison.py'
      - 'scripts/test_shadow_entry_comparison.py'
      - 'scripts/c3_one_slot_equity.py'
      - 'scripts/test_c3_one_slot_equity.py'
      - 'scripts/sector_catalyst_enrich.py'
      - 'scripts/test_sector_catalyst_enrich.py'
      - '.github/workflows/sector_first_daily_checks.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Safe sparse checkout for known valid file paths
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/sector_first_daily.py
            /scripts/test_sector_first_daily.py
            /scripts/sector_evidence_bridge.py
            /scripts/test_sector_evidence_bridge.py
            /scripts/sector_daily_money.py
            /scripts/test_sector_daily_money.py
            /scripts/global_sector_news.py
            /scripts/test_global_sector_news.py
            /scripts/global_sector_join.py
            /scripts/test_global_sector_join.py
            /scripts/global_preopen_brief.py
            /scripts/test_global_preopen_brief.py
            /scripts/focus_daily_structure.py
            /scripts/test_focus_daily_structure.py
            /scripts/focus_structure_join.py
            /scripts/test_focus_structure_join.py
            /scripts/sector_dynamic_structure.py
            /scripts/test_sector_dynamic_structure.py
            /scripts/sector_first_compact_report.py
            /scripts/test_sector_first_compact_report.py
            /scripts/dart_interim_periods.py
            /scripts/test_dart_interim_periods.py
            /scripts/dart_financial_screen.py
            /scripts/test_dart_financial_screen.py
            /scripts/sector_financial_join.py
            /scripts/test_sector_financial_join.py
            /scripts/stock_evidence_matrix.py
            /scripts/test_stock_evidence_matrix.py
            /scripts/shadow_trade_audit.py
            /scripts/test_shadow_trade_audit.py
            /scripts/shadow_entry_comparison.py
            /scripts/test_shadow_entry_comparison.py
            /scripts/c3_one_slot_equity.py
            /scripts/test_c3_one_slot_equity.py
            /scripts/sector_catalyst_enrich.py
            /scripts/test_sector_catalyst_enrich.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax and sector-first evidence tests
        run: |
          python -m py_compile scripts/sector_first_daily.py scripts/test_sector_first_daily.py scripts/sector_catalyst_enrich.py scripts/test_sector_catalyst_enrich.py scripts/sector_evidence_bridge.py scripts/test_sector_evidence_bridge.py
          python -m unittest discover -s scripts -p 'test_sector_first_daily.py' -v
          python -m unittest discover -s scripts -p 'test_sector_catalyst_enrich.py' -v
          python -m unittest discover -s scripts -p 'test_sector_evidence_bridge.py' -v
          python -m py_compile scripts/sector_daily_money.py scripts/test_sector_daily_money.py
          python -m unittest discover -s scripts -p 'test_sector_daily_money.py' -v
          python -m py_compile scripts/global_sector_news.py scripts/global_sector_join.py scripts/test_global_sector_news.py scripts/test_global_sector_join.py
          python -m unittest discover -s scripts -p 'test_global_sector_news.py' -v
          python -m unittest discover -s scripts -p 'test_global_sector_join.py' -v
          python -m py_compile scripts/global_preopen_brief.py scripts/test_global_preopen_brief.py
          python -m unittest discover -s scripts -p 'test_global_preopen_brief.py' -v
          python -m py_compile scripts/focus_daily_structure.py scripts/test_focus_daily_structure.py scripts/focus_structure_join.py scripts/test_focus_structure_join.py
          python -m unittest discover -s scripts -p 'test_focus_daily_structure.py' -v
          python -m unittest discover -s scripts -p 'test_focus_structure_join.py' -v
          python -m py_compile scripts/sector_dynamic_structure.py scripts/test_sector_dynamic_structure.py
          python -m unittest discover -s scripts -p 'test_sector_dynamic_structure.py' -v
          python -m py_compile scripts/sector_first_compact_report.py scripts/test_sector_first_compact_report.py
          python -m unittest discover -s scripts -p 'test_sector_first_compact_report.py' -v
          python -m py_compile scripts/dart_interim_periods.py scripts/test_dart_interim_periods.py scripts/dart_financial_screen.py scripts/test_dart_financial_screen.py scripts/sector_financial_join.py scripts/test_sector_financial_join.py
          python -m unittest discover -s scripts -p 'test_dart_interim_periods.py' -v
          python -m unittest discover -s scripts -p 'test_dart_financial_screen.py' -v
          python -m unittest discover -s scripts -p 'test_sector_financial_join.py' -v
          python -m py_compile scripts/stock_evidence_matrix.py scripts/test_stock_evidence_matrix.py
          python -m unittest discover -s scripts -p 'test_stock_evidence_matrix.py' -v
          python -m py_compile scripts/shadow_trade_audit.py scripts/test_shadow_trade_audit.py
          python -m unittest discover -s scripts -p 'test_shadow_trade_audit.py' -v
          python -m py_compile scripts/shadow_entry_comparison.py scripts/test_shadow_entry_comparison.py
          python -m unittest discover -s scripts -p 'test_shadow_entry_comparison.py' -v
          python -m py_compile scripts/c3_one_slot_equity.py scripts/test_c3_one_slot_equity.py
          python -m unittest discover -s scripts -p 'test_c3_one_slot_equity.py' -v

      - name: Simulate missing evidence safely
        run: |
          mkdir -p source_empty output
          python scripts/sector_first_daily.py --input source_empty --out output
          python scripts/sector_catalyst_enrich.py --report-root output --evidence-root source_empty
          python scripts/global_sector_join.py --report-root output --news-root source_empty
          python scripts/global_preopen_brief.py --root source_empty
          python scripts/focus_structure_join.py --root output
          python scripts/sector_first_compact_report.py --root output
          python scripts/dart_financial_screen.py --input source_empty/unavailable.csv --out output
          python scripts/sector_financial_join.py --root output
          python scripts/stock_evidence_matrix.py --root output
          python scripts/shadow_trade_audit.py --report output/sector_first_with_prices.json --dynamic source_empty/no_daily_rows.csv --history source_empty --out output
          python scripts/shadow_entry_comparison.py --signals output/shadow_signals.json --baseline-results output/shadow_results.json --evidence source_empty --out output
          python scripts/c3_one_slot_equity.py --signals output/shadow_signals.json --history source_empty --out output
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/sector_first_daily_status.json').read_text())
          assert r['decision']=='CASH'
          assert r['sector_top3']==[]
          assert r['stock_research_top5']==[]
          assert not r['trade_approved']
          enriched=json.loads(Path('output/sector_first_with_catalysts.json').read_text())
          assert enriched['decision']=='CASH'
          assert enriched['sector_top3']==[]
          assert enriched['catalyst_positive_count_verified']==0
          global_report=json.loads(Path('output/sector_first_global.json').read_text())
          assert global_report['decision']=='CASH'
          assert global_report['sector_top3']==[]
          assert global_report['global_positive_catalysts_verified']==0
          preopen=json.loads(Path('source_empty/global_preopen_brief.json').read_text())
          assert preopen['decision']=='CASH'
          assert preopen['global_early_watch']==[]
          combined=json.loads(Path('output/sector_first_with_prices.json').read_text())
          assert combined['decision']=='CASH'
          assert combined['focus_daily_structure_research']==[]
          md=Path('output/sector_first_compact_mobile.md').read_text(encoding='utf-8')
          assert 'CASH' in md
          assert 'TOP5' in md
          finance=json.loads(Path('output/financial_research.json').read_text())
          assert finance['decision']=='CASH'
          assert finance['screen_pass_count'] if 'screen_pass_count' in finance else True
          financial_join=json.loads(Path('output/sector_first_with_financials.json').read_text())
          assert financial_join['decision']=='CASH'
          assert not financial_join['fundamentals_full_final_15_points_scored']
          matrix=json.loads(Path('output/company_evidence_matrix.json').read_text())
          assert matrix['decision']=='CASH'
          assert matrix['candidate_count']==0
          assert not matrix['trade_approved']
          assert matrix['company_catalyst_verified_count']==0
          shadow=json.loads(Path('output/shadow_scorecard.json').read_text())
          assert shadow['signal_count']==0
          assert shadow['realised_paper_win_rate_pct'] is None
          assert not shadow['orders_enabled']
          entry_ab=json.loads(Path('output/entry_ab_scorecard.json').read_text())
          assert entry_ab['next_open']['closed']==0
          assert entry_ab['pullback_limit']['closed']==0
          assert not entry_ab['trade_approved']
          c3=json.loads(Path('output/c3_one_slot_equity.json').read_text())
          assert c3['decision']=='CASH'
          assert not c3['research_valid']
          assert c3['traded_positions']==0
          print('CASH_FALLBACK_TEST_PASSED')
          PY

      - name: Upload phone-readable example (no live recommendations)
        uses: actions/upload-artifact@v4
        with:
          name: sector-first-safety-test
          path: |
            output/sector_first_daily_status.json
            output/sector_first_daily_mobile.md
            output/sector_first_with_catalysts_mobile.md
            output/sector_first_with_catalysts.json
            output/sector_first_global_mobile.md
            output/sector_first_global.json
            source_empty/global_preopen_brief.json
            source_empty/global_preopen_brief_mobile.md
            output/sector_first_with_prices.json
            output/sector_first_with_prices_mobile.md
            output/sector_first_compact_mobile.md
            output/company_evidence_matrix.json
            output/company_evidence_matrix_mobile.md
            output/shadow_signals.json
            output/shadow_scorecard.json
            output/shadow_scorecard_mobile.md
            output/entry_ab_results.json
            output/entry_ab_scorecard.json
            output/entry_ab_mobile.md
            output/c3_one_slot_equity.json
            output/c3_one_slot_mobile.md
          retention-days: 7
