name: C3 TOP2 30-minute research diagnostics (NO LIVE QUOTES)
on:
  schedule:
    # UTC 00:00-06:30 weekdays; KST 09:00-15:30. Cron may be delayed.
    - cron: '0,30 0-6 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/c3_top2_30min_research.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Korean regular session and report provider status
        env:
          TZ: Asia/Seoul
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import os
          now=datetime.now(ZoneInfo('Asia/Seoul'))
          in_session=now.weekday()<5 and time(9)<=now.time()<=time(15,30)
          lines=['# C3 TOP2 30-minute diagnostic',f'- Checked (KST): {now.isoformat(timespec="seconds")}',f'- Regular-session clock window: {in_session}', '- Provider: NOT_CONNECTED (no authorized automated intraday quote feed)', '- Verified intraday quotes: 0', '- Next step: evaluate permitted provider access; do not scrape undocumented endpoints without permission', '- 오리온(271560): NO_VERIFIED_QUOTE', '- 동서(026960): NO_VERIFIED_QUOTE', '- Trading: DISABLED', '- Paper fill: DISABLED', '- This job is a schedule/availability check, not a live quote feed.','- Korean holidays are not validated; calendar window is not proof of an open exchange.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f: f.write('\\n'.join(lines)+'\\n')
          print('\\n'.join(lines))
          PY
