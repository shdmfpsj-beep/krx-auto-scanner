name: C3 K100 Sector First simple daily report

on:
  workflow_dispatch:
  schedule:
    # 22:00 Asia/Seoul weekdays, after sector v18 collection window.
    - cron: '0 13 * * 1-5'

permissions:
  actions: read
  contents: read

concurrency:
  group: sector-first-simple-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Sparse checkout only sector-first scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/sector_evidence_bridge.py
            /scripts/test_sector_evidence_bridge.py
            /scripts/sector_daily_money.py
            /scripts/test_sector_daily_money.py
            /scripts/sector_first_daily.py
            /scripts/test_sector_first_daily.py
            /scripts/sector_catalyst_enrich.py
            /scripts/test_sector_catalyst_enrich.py
            /scripts/global_sector_news.py
            /scripts/test_global_sector_news.py
            /scripts/global_sector_join.py
            /scripts/test_global_sector_join.py
            /scripts/focus_structure_join.py
            /scripts/focus_daily_structure.py
            /scripts/sector_dynamic_structure.py
            /scripts/test_sector_dynamic_structure.py
            /scripts/sector_first_compact_report.py
            /scripts/dart_interim_periods.py
            /scripts/test_dart_interim_periods.py
            /scripts/dart_financial_screen.py
            /scripts/test_dart_financial_screen.py
            /scripts/sector_financial_join.py
            /scripts/stock_evidence_matrix.py
            /scripts/dart_contract_terms.py
            /scripts/test_dart_contract_terms.py
            /scripts/dart_contract_documents.py
            /scripts/test_dart_contract_documents.py
            /scripts/entry_setup_audit.py
            /scripts/test_entry_setup_audit.py
            /scripts/test_stock_evidence_matrix.py
            /scripts/test_sector_financial_join.py
            /scripts/test_sector_first_compact_report.py
            /scripts/shadow_trade_audit.py
            /scripts/test_shadow_trade_audit.py
            /scripts/shadow_entry_comparison.py
            /scripts/test_shadow_entry_comparison.py
            /scripts/c3_one_slot_equity.py
            /scripts/test_c3_one_slot_equity.py
            /requirements.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check sector-first report safety
        run: |
          python -m py_compile scripts/sector_first_daily.py scripts/sector_evidence_bridge.py
          python scripts/test_sector_first_daily.py
          python scripts/test_sector_evidence_bridge.py
          python scripts/test_sector_daily_money.py
          python scripts/test_sector_catalyst_enrich.py
          python scripts/test_global_sector_news.py
          python scripts/test_global_sector_join.py
          python scripts/test_sector_dynamic_structure.py
          python scripts/test_sector_first_compact_report.py
          python scripts/test_dart_interim_periods.py
          python scripts/test_dart_financial_screen.py
          python scripts/test_sector_financial_join.py
          python scripts/test_stock_evidence_matrix.py
          python scripts/test_dart_contract_terms.py
          python scripts/test_dart_contract_documents.py
          python scripts/test_entry_setup_audit.py
          python scripts/test_shadow_trade_audit.py
          python scripts/test_shadow_entry_comparison.py
          python scripts/test_c3_one_slot_equity.py

      - name: Collect global industry and macro news from GDELT (free, read only)
        if: always()
        run: python scripts/global_sector_news.py --out output

      - name: Download latest matching artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/scan inputs/evidence output
          python - <<'PY'
          import json,os,subprocess,zipfile,io
          from pathlib import Path
          repo=os.environ["GH_REPO"]
          for wf,name,dest in [
            ("krx_recovery_scan.yml","krx-recovery-scan","inputs/scan"),
            ("sector_evidence_v18.yml","sector-evidence-v18-report","inputs/evidence")]:
              p=subprocess.run(["gh","api","-X","GET",f"repos/{repo}/actions/workflows/{wf}/runs",
                                "-f","per_page=20"],capture_output=True,text=True,check=True)
              runs=json.loads(p.stdout)["workflow_runs"]
              candidates=[r for r in runs if r.get("conclusion")=="success"]
              if wf=="sector_evidence_v18.yml":
                # Scheduled and manually dispatched evidence are both eligible,
                # but the full ZIP provenance/completeness checks below still apply.
                candidates=[r for r in candidates
                            if r.get("event") in ("schedule","workflow_dispatch")]
              if not candidates: raise SystemExit(f"NO_SUCCESSFUL_RUN:{wf}")
              found=False
              for run in candidates:
                a=subprocess.run(["gh","api","-X","GET",f"repos/{repo}/actions/runs/{run['id']}/artifacts"],
                                 capture_output=True,text=True,check=True)
                artifacts=json.loads(a.stdout).get("artifacts",[])
                match=next((x for x in artifacts if x["name"]==name and not x.get("expired")),None)
                if not match: continue
                z=subprocess.run(["gh","api","-X","GET",f"repos/{repo}/actions/artifacts/{match['id']}/zip"],
                                 capture_output=True,check=True)
                with zipfile.ZipFile(io.BytesIO(z.stdout)) as archive:
                  names=archive.namelist()
                  if wf=="sector_evidence_v18.yml":
                    # Baseline-only runs can succeed but have no current
                    # sector features. Prefer the latest complete backfill.
                    features=[n for n in names if n.endswith("research/sector_evidence_latest.csv")]
                    statuses=[n for n in names if n.endswith("diagnostics/collection_status.json")]
                    if len(features)!=1 or len(statuses)!=1:
                      print(f"SKIP_NON_BACKFILL run_id={run['id']}")
                      continue
                    state=json.loads(archive.read(statuses[0]))
                    needed=("prices","flows","etf_prices","holdings","normalization")
                    if any(state.get("datasets",{}).get(k,{}).get("status")!="OK" for k in needed):
                      print(f"SKIP_INCOMPLETE_CORE run_id={run['id']}")
                      continue
                  for entry in archive.infolist():
                    target=Path(dest,entry.filename)
                    if target.resolve()!=Path(dest).resolve() and Path(dest).resolve() not in target.resolve().parents:
                      raise SystemExit("UNSAFE_ARTIFACT_PATH")
                  archive.extractall(dest)
                print(f"SELECTED_ARTIFACT workflow={wf} run_id={run['id']} created_at={run.get('created_at')} artifact_id={match['id']}")
                found=True
                break
              if not found: raise SystemExit(f"ARTIFACT_UNAVAILABLE:{name}")
          PY
      - name: Calculate completed 1-day KRX constituent money and remove ETF overlaps
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          matches=list(Path("inputs/evidence").rglob("diagnostics/collection_status.json"))
          if len(matches)!=1:
              raise SystemExit("AMBIGUOUS_KRX_EVIDENCE_STATUS")
          status=json.loads(matches[0].read_text(encoding="utf-8"))
          subprocess.run([sys.executable,"scripts/sector_daily_money.py",
               "--evidence",str(matches[0].parent.parent),
               "--asof",status["asof"],"--out","output"],check=True)
          PY

      - name: Produce research-only sector ranking
        run: |
          python - <<'PY'
          import subprocess,sys
          from pathlib import Path
          root=Path("inputs/evidence")
          matches=list(root.rglob("diagnostics/collection_status.json"))
          scan=list(Path("inputs/scan").rglob("status.json"))
          if len(matches)!=1 or len(scan)!=1:
              raise SystemExit(f"AMBIGUOUS_OR_MISSING_INPUT evidence={len(matches)} scan={len(scan)}")
          subprocess.run([sys.executable,"scripts/sector_evidence_bridge.py",
                          "--evidence",str(matches[0].parent.parent),
                          "--scan-status",str(scan[0]),"--out","output",
                          "--daily-money","output/sector_daily_money.json"],check=True)
          PY
      - name: Install no-cost OHLCV collectors for dynamically chosen TOP3 stocks
        if: success()
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Compute independent daily stops for freshly selected TOP3-sector stocks
        if: always()
        run: |
          mkdir -p output/dynamic
          python scripts/sector_dynamic_structure.py \
            --status output/sector_bridge_status.json \
            --watchlist output/sector_stock_research_ranking.csv \
            --out output/dynamic \
            --max-total 12 --per-sector 4 \
            --asof "$(TZ=Asia/Seoul date +%F)"

      - name: Render mobile report (CASH on missing or stale evidence)
        if: always()
        run: python scripts/sector_first_daily.py --input output --out output

      - name: Add dated source news and DART filings to sector-first report
        if: always()
        run: python scripts/sector_catalyst_enrich.py --report-root output --evidence-root inputs/evidence

      - name: Combine worldwide early signals with Korean sector TOP3
        if: always()
        run: python scripts/global_sector_join.py --report-root output --news-root output

      - name: Fetch latest independently computed daily price evidence
        if: always()
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import io,json,os,subprocess,zipfile
          from pathlib import Path
          repo=os.environ["GH_REPO"]
          def api(url):
              return subprocess.run(["gh","api","-X","GET",url],
                                    capture_output=True,check=True).stdout
          try:
              runs=json.loads(api(f"repos/{repo}/actions/workflows/focus_daily_structure.yml/runs?per_page=12")).get("workflow_runs",[])
              candidates=[r for r in runs if r.get("conclusion")=="success"]
              found=False
              for run in candidates:
                  artifacts=json.loads(api(f"repos/{repo}/actions/runs/{run['id']}/artifacts")).get("artifacts",[])
                  target=next((a for a in artifacts if a.get("name")=="focus-daily-structure" and not a.get("expired")),None)
                  if not target:continue
                  with zipfile.ZipFile(io.BytesIO(api(f"repos/{repo}/actions/artifacts/{target['id']}/zip"))) as archive:
                      allowed={"focus_daily_structure_prices.csv","focus_daily_structure_status.json",
                               "focus_daily_structure_mobile.md"}
                      selected=[i for i in archive.infolist() if i.filename in allowed and not i.is_dir()]
                      for item in selected:
                          (Path("output")/item.filename).write_bytes(archive.read(item))
                      found=bool(selected)
                  if found:
                      print(f"FOCUS_REFERENCE_DOWNLOADED run_id={run['id']}")
                      break
              if not found:print("FOCUS_PRICE_ARTIFACT_MISSING")
          except Exception as e:
              print("FOCUS_PRICE_ARTIFACT_UNAVAILABLE",type(e).__name__)
          PY

      - name: Join independently computed support references into final phone report
        if: always()
        run: python scripts/focus_structure_join.py --root output

      - name: Produce short phone-first TOP3 sector and TOP5 price report
        if: always()
        run: python scripts/sector_first_compact_report.py --root output

      - name: Collect as-of official OpenDART annual figures for up to 20 sector stocks
        if: always()
        env:
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY || secrets.DART_API_KEY }}
        run: |
          python scripts/dart_financial_screen.py \
            --input output/sector_stock_research_ranking.csv \
            --asof "$(TZ=Asia/Seoul date +%F)" \
            --out output

      - name: Add dated annual fundamentals to mobile report (never final score)
        if: always()
        run: python scripts/sector_financial_join.py --root output

      - name: Check actual issuer contract filings against original official OpenDART XML
        if: always()
        env:
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY || secrets.DART_API_KEY }}
        run: python scripts/dart_contract_documents.py --root output

      - name: Cross-check direct issuer DART, latest earnings, 1D money, global sector news and chart stops
        if: always()
        run: python scripts/stock_evidence_matrix.py --root output

      - name: Evaluate structure-first 1st and 2nd entry, KRX ticks and 2R for TOP5
        if: always()
        run: python scripts/entry_setup_audit.py --root output

      - name: Recover the last prospective shadow-trade signal ledger (if any)
        if: always()
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import io,json,os,subprocess,zipfile
          from pathlib import Path
          try:
              repo=os.environ["GH_REPO"]
              def api(url):
                  return subprocess.run(["gh","api","-X","GET",url],
                                        capture_output=True,check=True).stdout
              runs=json.loads(api(f"repos/{repo}/actions/workflows/sector_first_daily.yml/runs?per_page=25")).get("workflow_runs",[])
              found=False
              for run in runs:
                  if run.get("conclusion")!="success":continue
                  artifacts=json.loads(api(f"repos/{repo}/actions/runs/{run['id']}/artifacts")).get("artifacts",[])
                  match=next((a for a in artifacts if a.get("name")=="sector-first-daily" and not a.get("expired")),None)
                  if not match:continue
                  with zipfile.ZipFile(io.BytesIO(api(f"repos/{repo}/actions/artifacts/{match['id']}/zip"))) as archive:
                      signals=[m for m in archive.infolist() if Path(m.filename).name=="shadow_signals.json"
                               and not m.is_dir() and m.file_size<=1000000]
                      results=[m for m in archive.infolist() if Path(m.filename).name=="shadow_results.json"
                               and not m.is_dir() and m.file_size<=1500000]
                      if len(signals)!=1 or len(results)!=1:continue
                      old_signals=archive.read(signals[0])
                      old_results=archive.read(results[0])
                      if not isinstance(json.loads(old_signals.decode("utf-8")),list):continue
                      if not isinstance(json.loads(old_results.decode("utf-8")),list):continue
                      Path("output/previous_shadow_signals.json").write_bytes(old_signals)
                      Path("output/previous_shadow_results.json").write_bytes(old_results)
                      found=True
                      print("SHADOW_LEDGER_CONTINUED_FROM_RUN",run["id"])
                      break
              if not found:print("SHADOW_LEDGER_NEW_OR_PREVIOUS_ARTIFACT_UNAVAILABLE")
          except Exception as err:
              print("SHADOW_LEDGER_RECOVERY_FAILED",type(err).__name__)
          PY

      - name: Score next-day-open prospective 5-session trades with costs
        if: always()
        run: |
          python scripts/shadow_trade_audit.py \
            --report output/sector_first_with_prices.json \
            --dynamic output/dynamic/focus_daily_structure_prices.csv \
            --history inputs/evidence \
            --previous output/previous_shadow_signals.json \
            --previous-results output/previous_shadow_results.json \
            --out output

      - name: Compare next-open and first-two-day pullback limit entry experiments
        if: always()
        run: |
          python scripts/shadow_entry_comparison.py \
            --signals output/shadow_signals.json \
            --baseline-results output/shadow_results.json \
            --evidence inputs/evidence \
            --out output

      - name: Run C3 one-position account-level paper risk and equity simulation
        if: always()
        run: |
          python scripts/c3_one_slot_equity.py \
            --signals output/shadow_signals.json \
            --history inputs/evidence \
            --initial-cash 1000000 \
            --risk-budget-pct 2.0 \
            --out output

      - name: Upload simple mobile summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-first-daily
          path: |
            output/sector_first_daily_mobile.md
            output/sector_first_daily_status.json
            output/sector_first_with_catalysts_mobile.md
            output/sector_first_with_catalysts.json
            output/global_sector_articles.csv
            output/global_sector_news_status.json
            output/sector_first_global_mobile.md
            output/sector_first_global.json
            output/focus_daily_structure_prices.csv
            output/focus_daily_structure_status.json
            output/dynamic/focus_daily_structure_prices.csv
            output/dynamic/focus_daily_structure_status.json
            output/dynamic/focus_daily_structure_mobile.md
            output/sector_first_with_prices.json
            output/sector_first_with_prices_mobile.md
            output/sector_first_compact_mobile.md
            output/financial_research.json
            output/financial_research_mobile.md
            output/sector_first_with_financials.json
            output/company_evidence_matrix.json
            output/company_evidence_matrix_mobile.md
            output/direct_dart_contracts.json
            output/direct_dart_contracts_mobile.md
            output/entry_setup_audit.json
            output/entry_setup_audit_mobile.md
            output/shadow_signals.json
            output/shadow_results.json
            output/shadow_scorecard.json
            output/shadow_scorecard_mobile.md
            output/entry_ab_results.json
            output/entry_ab_scorecard.json
            output/entry_ab_mobile.md
            output/c3_one_slot_equity.json
            output/c3_one_slot_mobile.md
            output/sector_research_ranking.csv
            output/sector_stock_research_ranking.csv
            output/sector_bridge_status.json
            output/sector_daily_money.json
            output/sector_daily_money_mobile.md
          if-no-files-found: warn
          retention-days: 90
