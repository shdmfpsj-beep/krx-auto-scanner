name: KRX recovery scan (safe sparse checkout)

on:
  workflow_dispatch:
  # Run only on weekdays AFTER the 20:00 KRX after-market; do not
  # assume the 16:10 partial day or 17:18 per-ticker data are final.
  # Source-policy pushes are offline-tested elsewhere, not 100-minute scans.
  schedule:
    - cron: '45 11 * * 1-5'

permissions:
  contents: read

concurrency:
  group: krx-recovery-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout only known valid scanner paths
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/run.py
            /scripts/market_session_policy_v66.py
            /scripts/test_market_session_policy_v66.py
            /scripts/rank_candidates.py
            /scripts/test_rank_candidates.py
            /scripts/free_structural_v52.py
            /scripts/test_free_structural_v52.py
            /requirements.txt
            /reports/candidates.csv
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline ranking safety regression tests
        run: python -m unittest discover -s scripts -p 'test_rank_candidates.py' -v

      - name: Verify no-cost daily structural analysis safety (offline)
        run: python -m unittest discover -s scripts -p 'test_free_structural_v52.py' -v

      - name: Validate post-20:00 KRX source-day policy and timezone
        run: python -m unittest discover -s scripts -p 'test_market_session_policy_v66.py' -v

      - name: Collect latest completed after-market KRX OHLCV (research only)
        run: python scripts/run.py

      - name: Verify scan date and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/status.json')
          if not p.exists():
              raise SystemExit('MISSING_STATUS')
          s=json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({k:s.get(k) for k in ('run_kst','market_data_date','universe','valid_ohlcv','coverage_ratio','scan_complete','data_date_verified')},ensure_ascii=False))
          if not s.get('scan_complete') or not s.get('data_date_verified'):
              raise SystemExit('SCAN_INCOMPLETE_OR_DATE_UNVERIFIED')
          PY

      - name: Rank technical candidates (research only)
        run: python scripts/rank_candidates.py

      - name: Build research-only structural stop and two-entry reference report
        run: python scripts/free_structural_v52.py

      - name: Publish scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-recovery-scan
          path: |
            reports/status.json
            reports/candidates.csv
            reports/c3_preliminary.csv
            reports/k100_preliminary.csv
            reports/ranking_status.json
            reports/candidate_daily_history_v52.csv
            reports/free_structural_v52_all.csv
            reports/free_structural_v52_status.json
            reports/free_structural_v52_mobile.md
          if-no-files-found: warn
          retention-days: 14
