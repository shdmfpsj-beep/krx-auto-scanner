name: KRX daily candidate scan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select scan, rerank, backtest or diagnosis'
        required: true
        type: choice
        default: rerank_only
        options:
          - rerank_only
          - full_scan
          - backtest_c3
          - pit_test_v10
          - diagnose_universe
          - walkforward_v14
          - holding_v30
          - paired_v31
          - entry_v32
          - rules_v33
          - portfolio_v34
          - audit_v35
          - realism_v36
          - split_v37
          - dip_v38
          - entry_v40
          - regime_v41
          - regime_v42
          - audit_v43
          - exposure_v44
          - validation_v45
          - pit_audit_v46
          - universe_audit_v47
          - universe_restore_v48
          - entry_geometry_v49
          - entry_selection_v50
          - market_entry_v51
          - market_data_v52
          - retry_missing_v58
          - preliminary_v59
          - validate_v60
          - entry_v61
          - sector_v63
          - sector_v64
          - sector_v65
          - sector_v66
          - sector_v67
          - sector_v68
          - sector_v69
          - sector_v70
          - sector_v71
          - sector_v72
          - sector_v73
          - sector_v74
          - sector_v75
          - sector_v76
          - sector_v77
          - sector_v78
          - sector_v79
          - sector_v80
          - sector_v81
          - sector_v82
          - sector_v83
          - sector_v84
          - entry_ab_v85
          - entry_tournament_v86
          - preignition_v87
          - preignition_quality_v88
          - preignition_integrated_v90
          - diagnose_v363

  schedule:
    # 20:20 KST: current collector chooses today's date only after 20:15.
    # This does not certify regular-session prices; keep source gates separate.
    - cron: '20 11 * * 1-5'

permissions:
  contents: write
  actions: read

concurrency:
  group: krx-report-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Full checkout fails on legacy accidentally committed non-portable
      # paths (embedded newlines/overlong directory names). Scheduled scans
      # only need ordinary Python scripts, dated CSV inputs and requirements.
      # Include research report caches for manual modes, but avoid malformed
      # historic repository paths until they are repaired separately.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/*.py
            /config/*.csv
            /config/krx_close_crosscheck_20261021.json
            /config/c3_screening_evidence/**
            /reports/**
            /requirements.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify saved candidate data for rerank
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rerank_only'
        shell: bash
        run: |
          test -s reports/candidates.csv || {
            echo 'Missing or empty reports/candidates.csv'
            exit 1
          }

          python - <<'PY'
          import csv
          from pathlib import Path

          with Path('reports/candidates.csv').open(
              encoding='utf-8-sig',
              newline=''
          ) as f:
              reader = csv.DictReader(f)

              required = {
                  'ticker',
                  'close',
                  'ma20',
                  'ma60',
                  'ma120',
                  'rvol20'
              }

              if not required.issubset(
                  set(reader.fieldnames or [])
              ):
                  raise SystemExit(
                      'Existing candidates.csv is missing required columns'
                  )

              if next(reader, None) is None:
                  raise SystemExit(
                      'Existing candidates.csv has no data rows'
                  )
          PY

      - name: Collect and screen
        id: collect
        if: github.event_name == 'schedule' || inputs.mode == 'full_scan' || inputs.mode == 'sector_v80' || inputs.mode == 'sector_v81' || inputs.mode == 'sector_v82' || inputs.mode == 'sector_v83' || inputs.mode == 'sector_v84'
        continue-on-error: true
        run: python scripts/run.py

      - name: Rank C3 and K100 candidates
        if: steps.collect.outcome != 'failure' && (github.event_name == 'schedule' || inputs.mode == 'full_scan' || inputs.mode == 'rerank_only' || inputs.mode == 'sector_v80' || inputs.mode == 'sector_v81' || inputs.mode == 'sector_v82' || inputs.mode == 'sector_v83' || inputs.mode == 'sector_v84')
        run: python scripts/rank_candidates.py

      - name: Test and record C3 screening timestamps
        if: steps.collect.outcome == 'success' && (github.event_name == 'schedule' || inputs.mode == 'full_scan' || inputs.mode == 'sector_v80' || inputs.mode == 'sector_v81' || inputs.mode == 'sector_v82' || inputs.mode == 'sector_v83' || inputs.mode == 'sector_v84')
        run: |
          python -m unittest discover -s scripts -p 'test_record_screening_times_v1.py' -v
          python scripts/record_screening_times_v1.py --outdir reports

      - name: Audit C3 candidate business scope and dated source evidence
        if: steps.collect.outcome == 'success' && (github.event_name == 'schedule' || inputs.mode == 'full_scan' || inputs.mode == 'sector_v80' || inputs.mode == 'sector_v81' || inputs.mode == 'sector_v82' || inputs.mode == 'sector_v83' || inputs.mode == 'sector_v84')
        run: |
          python -m unittest discover -s scripts -p 'test_c3_candidate_evidence_v1.py' -v
          python scripts/c3_candidate_evidence_v1.py --reports reports --outdir reports

      - name: Freeze v8.0 prospective C3 and K100 cohorts and evaluate older observations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v80' && steps.collect.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/candidates.csv
          test -s reports/c3_preliminary.csv
          test -s reports/k100_preliminary.csv
          python -m pip install finance-datareader
          python scripts/krx_investment_sector_v80.py \
            --candidates reports/candidates.csv \
            --c3 reports/c3_preliminary.csv \
            --k100 reports/k100_preliminary.csv \
            --outdir reports \
            --forward-cache reports/v80_forward_cache \
            --topn 3 \
            --max-tickers 40 \
            --fetch

      - name: Freeze v8.1 date-level immutable cohorts and evaluate older observations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v81' && steps.collect.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/candidates.csv
          test -s reports/c3_preliminary.csv
          test -s reports/k100_preliminary.csv
          python -m pip install finance-datareader
          python scripts/krx_investment_sector_v81.py \
            --candidates reports/candidates.csv \
            --c3 reports/c3_preliminary.csv \
            --k100 reports/k100_preliminary.csv \
            --outdir reports \
            --forward-cache reports/v80_forward_cache \
            --topn 3 \
            --max-tickers 40 \
            --fetch

      - name: Freeze v8.2 C3-only cohorts and review K100 holdings
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v82' && steps.collect.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/candidates.csv
          test -s reports/c3_preliminary.csv
          test -s config/k100_holdings.csv
          python -m pip install finance-datareader
          python scripts/krx_investment_sector_v82.py \
            --candidates reports/candidates.csv \
            --c3 reports/c3_preliminary.csv \
            --k100-holdings config/k100_holdings.csv \
            --outdir reports \
            --forward-cache reports/v80_forward_cache \
            --k100-cache reports/v82_k100_history_cache \
            --topn 3 \
            --max-tickers 40 \
            --fetch

      - name: Freeze v8.3 separate C3 and K100 Tactical TOP3 and review 4 K100 Core holdings
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'sector_v83' || inputs.mode == 'sector_v84'))) && steps.collect.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/candidates.csv
          test -s reports/c3_preliminary.csv
          test -s reports/k100_preliminary.csv
          test -s config/k100_holdings.csv
          python -m pip install finance-datareader
          python scripts/krx_investment_sector_v83.py \
            --candidates reports/candidates.csv \
            --c3 reports/c3_preliminary.csv \
            --k100 reports/k100_preliminary.csv \
            --k100-holdings config/k100_holdings.csv \
            --outdir reports \
            --forward-cache reports/v80_forward_cache \
            --k100-cache reports/v83_k100_core_history_cache \
            --topn 3 \
            --max-tickers 40 \
            --fetch

      - name: Audit v8.4 frozen close-price consistency (non-destructive)
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v84')) && steps.collect.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_krx_price_integrity_v84.py' -v
          python scripts/krx_price_integrity_v84.py --outdir reports --max-price-drift-pct 0.5

      - name: Research-only v8.5 A/B entry geometry backtest (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'entry_ab_v85'
        shell: bash
        run: |
          set -euo pipefail
          test -d reports/v36_ohlcv_cache
          python -m unittest discover -s scripts -p 'test_entry_ab_v85.py' -v
          python scripts/krx_entry_ab_v85.py --cache-dir reports/v36_ohlcv_cache --outdir reports --entry-window 2 --hold 5 --rr 2 --cost-bps 35

      - name: Research-only v8.6 setup x entry-mode tournament (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'entry_tournament_v86'
        shell: bash
        run: |
          set -euo pipefail
          test -d reports/v36_ohlcv_cache || {
            echo 'Missing reports/v36_ohlcv_cache; first restore the historic research cache.'
            exit 1
          }
          python -m unittest discover -s scripts -p 'test_entry_tournament_v86.py' -v
          python scripts/krx_entry_tournament_v86.py \
            --cache-dir reports/v36_ohlcv_cache \
            --outdir reports \
            --hold 5 \
            --cost-bps 35

      - name: Research-only v8.7 pre-ignition E1/E2/E3 (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preignition_v87'
        shell: bash
        run: |
          set -euo pipefail
          test -d reports/v36_ohlcv_cache || {
            echo 'Missing historical research bars at reports/v36_ohlcv_cache'
            exit 1
          }
          python -m unittest discover -s scripts -p 'test_preignition_v87.py' -v
          python scripts/krx_preignition_v87.py \
            --cache-dir reports/v36_ohlcv_cache \
            --outdir reports \
            --score-min 70 \
            --hold 5 \
            --cost-bps 35

      - name: Research-only v8.8 pre-ignition signal purity and money-flow proxy audit (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preignition_quality_v88'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/v87_preignition_signals.csv || { echo 'Run preignition_v87 first'; exit 1; }
          test -s reports/v87_entry_trades.csv || { echo 'Run preignition_v87 first'; exit 1; }
          test -d reports/v36_ohlcv_cache
          python -m unittest discover -s scripts -p 'test_preignition_quality_v88.py' -v
          python scripts/krx_preignition_quality_v88.py --report-dir reports --outdir reports

      - name: v9.0 PIT-gated pre-ignition research (manual only; no BUY approval)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preignition_integrated_v90'
        shell: bash
        run: |
          set -euo pipefail
          test -d reports/v36_ohlcv_cache || { echo 'Missing reports/v36_ohlcv_cache'; exit 1; }
          python -m unittest discover -s scripts -p 'test_preignition_integrated_v90.py' -v
          python scripts/krx_preignition_integrated_v90.py \
            --cache-dir reports/v36_ohlcv_cache \
            --sector-pit config/v90_sector_membership_pit.csv \
            --financial-pit config/v90_financial_pit.csv \
            --outdir reports \
            --score-min 70 \
            --cost-bps 35
          echo 'Strict integrated result is BLOCKED until verified dated inputs are supplied.'

      - name: Run C3 exploratory backtest
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backtest_c3'
        run: |
          python scripts/backtest_daily.py \
            --limit 50 \
            --days 730

      - name: Test historical candidate selection
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'pit_test_v10'
        run: |
          python scripts/backtest_pit_candidates_v10.py \
            --days 30 \
            --limit 30

      - name: Diagnose historical universe access
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose_universe'
        run: python scripts/diagnose_universe.py

      - name: Run C3 v2.0.1 walk-forward backtest
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'walkforward_v14'
        run: |
          python scripts/backtest_walkforward_v14.py \
            --limit 120 \
            --start-year 2023 \
            --end-year 2025 \
            --seed 42 \
            --hold 3 \
            --cost-bps 15 \
            --capital 300000

      - name: Compare C3 v3.0 holding periods 1 to 20 sessions
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'holding_v30'
        run: |
          python scripts/backtest_holding_v30.py \
            --limit 120 \
            --start-year 2023 \
            --end-year 2025 \
            --seed 42 \
            --max-hold 20 \
            --cost-bps 15 \
            --capital 300000

      - name: Compare C3 v3.1 paired holding horizons
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'paired_v31'
        run: |
          python scripts/backtest_paired_v31.py \
            --limit 120 \
            --start-year 2023 \
            --end-year 2025 \
            --seed 42 \
            --max-hold 20 \
            --cost-bps 15

      - name: Analyze C3 v3.2 entry quality and overheating
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'entry_v32'
        run: |
          python scripts/backtest_entry_quality_v32.py \
            --limit 120 \
            --start-year 2023 \
            --end-year 2025 \
            --seed 42 \
            --max-hold 20 \
            --cost-bps 15

      - name: Compare C3 v3.3 entry-rule combinations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rules_v33'
        run: |
          python scripts/backtest_entry_rules_v33.py \
            --bootstrap 500 \
            --seed 42

      - name: Compare C3 v3.4 one-position portfolio and capital sensitivity
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'portfolio_v34'
        run: |
          python scripts/backtest_portfolio_v34.py \
            --capitals 300000,500000,1000000,3000000,10000000 \
            --holds 5,10,15,20 \
            --cost-bps 15

      - name: Audit C3 v3.5 portfolio robustness
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'audit_v35'
        run: python scripts/backtest_audit_v35.py

      - name: Run C3 v3.6 daily-marked realistic portfolio research
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'realism_v36'
        run: |
          python scripts/backtest_realism_v36.py \
            --capitals 300000,500000,1000000,3000000,10000000 \
            --holds 5,10,15,20 \
            --stop-pct 0.07 \
            --take-pct 0.15 \
            --cost-bps 15 \
            --slip-bps 10

      - name: Compare C3 v3.7 split-entry research strategies
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'split_v37'
        run: |
          python scripts/backtest_realism_v36.py \
            --split-study \
            --capitals 300000,500000,1000000,3000000,10000000 \
            --holds 5,10,15,20 \
            --stop-pct 0.07 \
            --take-pct 0.15 \
            --cost-bps 15 \
            --slip-bps 10

      - name: Run C3 v3.8 dip-buy and cash-exposure control study
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dip_v38'
        run: |
          python scripts/backtest_realism_v36.py \
            --capitals 300000,500000,1000000,3000000,10000000 \
            --holds 5,10,15,20 \
            --stop-pct 0.07 \
            --take-pct 0.15 \
            --cost-bps 15 \
            --slip-bps 10 \
            --dip-study

      - name: Run C3 v4.0 chronological entry-quality research
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'entry_v40'
        run: |
          python scripts/backtest_entry_v40_full.py \
            --capitals 300000,500000,1000000,3000000,10000000 \
            --holds 5,10,15,20 \
            --stop-pct 0.07 \
            --take-pct 0.15 \
            --cost-bps 15 \
            --slip-bps 10 \
            --entry-study

      - name: Run C3 v4.1 regime and dip-entry research
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'regime_v41'
        run: |
          python scripts/backtest_regime_v41.py \
            --capital 1000000 \
            --holds 5,10

      - name: Run C3 v4.2 index-regime and dip-entry research
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'regime_v42'
        run: |
          python scripts/backtest_regime_v42.py \
            --capital 1000000 \
            --holds 5,10

      - name: Audit C3 v4.3 paired strategy robustness
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'audit_v43'
        run: python scripts/backtest_audit_v43.py

      - name: Run C3 v4.4 trade and daily-exposure audit
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'exposure_v44'
        run: |
          python scripts/backtest_exposure_v44.py \
            --capital 1000000 \
            --holds 5,10

      - name: Audit C3 v4.5 chronology and period boundaries
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validation_v45'
        run: python scripts/backtest_validation_v45.py

      - name: Audit C3 v4.6 PIT evidence and structural integrity
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'pit_audit_v46'
        run: python scripts/backtest_pit_audit_v46.py

      - name: Audit C3 v4.7 historical universe and tier ablation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'universe_audit_v47'
        run: python scripts/backtest_universe_audit_v47.py

      - name: Restore C3 v4.8 historical KRX universe snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'universe_restore_v48'
        run: |
          python -m pip install pykrx
          python scripts/backtest_universe_restore_v48.py \
            --start 2023-01-01 \
            --end 2025-12-31 \
            --static reports/walkforward_v20_universe.csv \
            --out reports

      - name: Analyze C3 v4.9 stock direction and entry geometry (research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'entry_geometry_v49'
        run: |
          python scripts/entry_geometry_v49.py \
            --input reports/candidates.csv \
            --outdir reports \
            --top 20

      - name: Analyze C3 v5.0 stock eligibility and entry selection (research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'entry_selection_v50'
        run: |
          python scripts/entry_selection_v50.py \
            --input reports/candidates.csv \
            --outdir reports \
            --top 20

      - name: Validate v5.1 market evidence and entry quality (research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'market_entry_v51'
        run: |
          python scripts/market_entry_engine_v51.py \
            --input reports/candidates.csv \
            --outdir reports

      - name: Collect and diagnose KRX v5.2.1 daily market data (research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'market_data_v52'
        run: |
          python -m pip install --upgrade pykrx finance-datareader
          python scripts/market_data_collect_v52.py --outdir reports

      - name: Merge v5.5 dated shards from prior GitHub artifacts (v5.6 research only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'market_data_v52' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/merge_market_shards_v56.py --outdir reports --max-runs 100

      - name: Backfill missing v5.5 shards (v5.7 research only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'market_data_v52' }}
        continue-on-error: true
        run: |
          python scripts/backfill_missing_shards_v57.py --outdir reports --max-shards 2

      - name: Merge prior and newly backfilled shards (v5.7 research only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'market_data_v52' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          shards=(reports/v57_shards/shard_*.zip)
          if (( ${#shards[@]} > 0 )); then
            python scripts/merge_market_shards_v56.py --outdir reports --max-runs 100 --offline-artifacts "${shards[@]}"
          else
            echo 'No new backfill ZIPs; preserving the first merge result.'
          fi

      - name: Retry missing 2026-10-08 OHLCV (v5.8 research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'retry_missing_v58'
        run: |
          python -m pip install --upgrade finance-datareader
          python scripts/retry_missing_ohlcv_v58.py --outdir reports --max-tickers 40

      - name: Screen existing dated OHLCV (v5.9 research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preliminary_v59'
        run: |
          test -s reports/market_data_v56_merge_audit.json
          test -s reports/market_data_v56_merged.csv
          python scripts/krx_v59_preliminary.py --outdir reports

      - name: Validate v6.0 C3 and K100 candidate histories (research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate_v60'
        run: |
          test -s reports/v59_preliminary_watchlist.csv
          python -m pip install finance-datareader pandas
          python scripts/krx_v60_validate.py \
            --input reports/v59_preliminary_watchlist.csv \
            --outdir reports \
            --limit 30

      - name: Calculate v6.1 historical entry geometry (research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'entry_v61'
        run: |
          test -s reports/v60_history_validation.csv || {
            echo 'Missing v6.0 history validation report; run validate_v60 first only if genuinely missing.'
            exit 1
          }
          python -m pip install finance-datareader pandas
          python scripts/krx_v61_entry_geometry.py \
            --input reports/v60_history_validation.csv \
            --outdir reports \
            --limit 30

      - name: Audit KRX sector mapping and one-session breadth (v6.3 research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v63'
        run: |
          test -s reports/market_data_v56_merged.csv || {
            echo 'Missing merged OHLCV snapshot; do not rerun historical collection automatically.'
            exit 1
          }
          python -m pip install finance-datareader pandas
          python scripts/krx_sector_stage_v63.py \
            --input reports/market_data_v56_merged.csv \
            --outdir reports

      - name: Audit Naver sector mapping (v6.4 research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v64'
        run: |
          test -s reports/market_data_v56_merged.csv || {
            echo 'Missing merged OHLCV snapshot; no repeated collection.'
            exit 1
          }
          python -m pip install pandas requests beautifulsoup4
          python scripts/krx_sector_stage_v64.py \
            --input reports/market_data_v56_merged.csv \
            --outdir reports

      - name: Audit KIND sector mapping (v6.5 research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v65'
