      - name: Evaluate investment-sector entry geometry (v7.2 historical research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v72'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/v68_investment_sector_members.csv
          test -s reports/v71_sector_strength.csv
          test -s reports/market_data_v56_merged.csv
          test -d reports/v36_ohlcv_cache
          python scripts/krx_investment_sector_v72.py \
            --members reports/v68_investment_sector_members.csv \
            --sectors reports/v71_sector_strength.csv \
            --market reports/market_data_v56_merged.csv \
