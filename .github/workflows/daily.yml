name: KRX daily candidate scan
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5' # 17:30 KST weekdays
permissions:
  contents: write
concurrency:
  group: krx-report-main
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect and screen
        id: collect
        continue-on-error: true
        run: python scripts/run.py
      - name: Save reports
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A reports/
          if git diff --cached --quiet; then
            echo 'No report changes'
            exit 0
          fi
          git commit -m 'Update KRX scan reports'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo 'Failed to push reports after retries'
          exit 1
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-scan-report
          path: reports/
          if-no-files-found: warn
      - name: Fail job if collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
