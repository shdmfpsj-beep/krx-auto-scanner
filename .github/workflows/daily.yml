
name: KRX daily candidate scan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select scan, rerank, backtest or diagnosis'
        required: true
        type: choice
        default: rerank_only
        options:
          - rerank_only
          - full_scan
          - backtest_c3
          - pit_test_v10
          - diagnose_universe
          - walkforward_v14

  schedule:
    - cron: '30 8 * * 1-5' # 17:30 KST weekdays

permissions:
  contents: write

concurrency:
  group: krx-report-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify saved candidate data for rerank
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rerank_only'
        shell: bash
        run: |
          test -s reports/candidates.csv || { echo 'Missing or empty reports/candidates.csv'; exit 1; }
          python - <<'PY'
          import csv
          from pathlib import Path

          with Path('reports/candidates.csv').open(encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              required = {'ticker', 'close', 'ma20', 'ma60', 'ma120', 'rvol20'}

              if not required.issubset(set(reader.fieldnames or [])):
                  raise SystemExit('Existing candidates.csv is missing required columns')

              if next(reader, None) is None:
                  raise SystemExit('Existing candidates.csv has no data rows')
          PY

      - name: Collect and screen
        id: collect
        if: github.event_name == 'schedule' || inputs.mode == 'full_scan'
        continue-on-error: true
        run: python scripts/run.py

      - name: Rank C3 and K100 candidates
        if: steps.collect.outcome != 'failure' && (github.event_name == 'schedule' || inputs.mode == 'full_scan' || inputs.mode == 'rerank_only')
        run: python scripts/rank_candidates.py

      - name: Run C3 exploratory backtest
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backtest_c3'
        run: python scripts/backtest_daily.py --limit 50 --days 730

      - name: Test historical candidate selection
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'pit_test_v10'
        run: python scripts/backtest_pit_candidates_v10.py --days 30 --limit 30

      - name: Diagnose historical universe access
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose_universe'
        run: python scripts/diagnose_universe.py

      - name: Run C3 v1.4 walk-forward backtest
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'walkforward_v14'
        run: |
          python scripts/backtest_walkforward_v14.py \
            --limit 30 \
            --start 2025-01-01 \
            --end 2025-12-31 \
            --hold 3 \
            --cost-bps 15

      - name: Save reports
        if: steps.collect.outcome != 'failure'
        shell: bash
        run: |
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A reports/

          if git diff --cached --quiet; then
            echo 'No report changes'
            exit 0
          fi

          git commit -m 'Update KRX scan and backtest reports'

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done

          echo 'Failed to push reports after retries'
          exit 1

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-scan-report
          path: reports/
          if-no-files-found: warn

      - name: Fail job if collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
