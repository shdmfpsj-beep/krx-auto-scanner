name: KRX daily candidate scan
on:
  workflow_dispatch:
  schedule:
    - cron: '25 17 * * 1-5'
      timezone: Asia/Seoul
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and screen
        run: python scripts/run.py
      - name: Save reports
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          git diff --cached --quiet || (git commit -m 'Update KRX scan reports' && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krx-scan-report
          path: reports/
          if-no-files-found: warn
