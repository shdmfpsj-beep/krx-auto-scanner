      - name: Audit v7.9 forward revisions and freshness (research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v79'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/v76_paper_trade_queue.csv
          test -s reports/v76_conditional_research_top3.csv
          test -d reports/v36_ohlcv_cache
          python -m pip install finance-datareader
          python scripts/krx_investment_sector_v79.py \
            --queue reports/v76_paper_trade_queue.csv \
            --anchor reports/v76_conditional_research_top3.csv \
            --cache reports/v36_ohlcv_cache \
            --forward-cache reports/v77_forward_cache \
            --outdir reports \
            --fetch \
            --max-entry-sessions 3 \
            --fee-bps 15 \
            --slip-bps 10

      - name: Save reports
        if: steps.collect.outcome != 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh auth setup-git

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A reports/

          if git diff --cached --quiet; then
            echo 'No report changes'
            exit 0
          fi

          git commit -m 'Update KRX scan and backtest reports'

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done

          echo 'Failed to push reports after retries'
          exit 1

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-scan-report
          path: reports/
          if-no-files-found: warn

      - name: Fail job if collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
