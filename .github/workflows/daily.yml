      - name: Validate bounded independent histories (v7.4 historical research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v74'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/v73_independent_research_queue.csv
          test -s reports/market_data_v56_merged.csv
          python -m pip install finance-datareader
          python scripts/krx_investment_sector_v74.py \
            --queue reports/v73_independent_research_queue.csv \
            --market reports/market_data_v56_merged.csv \
            --cache reports/v36_ohlcv_cache \
            --outdir reports \
            --limit 30 \
            --sleep 0.5

      - name: Compare independent and sector entry candidates (v7.5 historical research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v75'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/v73_independent_research_queue.csv
          test -s reports/v74_independent_history_validation.csv
          test -s reports/v72_historical_watchlist.csv
          test -s reports/market_data_v56_merged.csv
          test -d reports/v36_ohlcv_cache
          python scripts/krx_investment_sector_v75.py \
            --queue reports/v73_independent_research_queue.csv \
            --validation reports/v74_independent_history_validation.csv \
            --sector-watch reports/v72_historical_watchlist.csv \
            --market reports/market_data_v56_merged.csv \
            --cache reports/v36_ohlcv_cache \
            --outdir reports

      - name: Gate v7.6 historical entry eligibility and paper queue (research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v76'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/v75_common_technical_watchlist.csv || {
            echo 'Missing v7.5 watchlist; run sector_v75 first only if needed.'
            exit 1
          }
          python scripts/krx_investment_sector_v76.py \
            --input reports/v75_common_technical_watchlist.csv \
