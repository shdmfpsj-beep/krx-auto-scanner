      - name: Compare independent full-market observations with sector entry candidates (v7.3 research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v73'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/market_data_v56_merged.csv
          test -s reports/v72_historical_watchlist.csv
          test -s reports/v71_sector_strength.csv
          python scripts/krx_investment_sector_v73.py \
