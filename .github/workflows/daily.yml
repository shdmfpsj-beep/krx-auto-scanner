            exit 1
          }
          python -m pip install finance-datareader
          for batch in 0 1 2 3 4 5 6; do
            echo "Collecting v7.0 history batch ${batch}/6"
            python scripts/krx_investment_sector_v70.py \
              --members reports/v68_investment_sector_members.csv \
              --market reports/market_data_v56_merged.csv \
              --cache reports/v36_ohlcv_cache \
              --outdir reports \
              --batch-size 20 \
              --batch-index "$batch" \
              --sleep 0.6 \
              --source NAVER
          done

      - name: Analyze cached investment-sector 5d and 20d strength (v7.1 research only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sector_v71'
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/v68_investment_sector_members.csv || {
            echo 'Missing v6.8 investment-sector members; no new data collection.'
            exit 1
          }
          test -s reports/market_data_v56_merged.csv || {
            echo 'Missing dated market snapshot; no new data collection.'
            exit 1
          }
          test -d reports/v36_ohlcv_cache || {
            echo 'Missing OHLCV cache; run sector_v70 first.'
            exit 1
          }
          python scripts/krx_investment_sector_v71.py \
            --members reports/v68_investment_sector_members.csv \
            --market reports/market_data_v56_merged.csv \
            --cache reports/v36_ohlcv_cache \
