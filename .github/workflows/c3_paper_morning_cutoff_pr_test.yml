name: C3 paper morning cutoff isolated tests
on:
  push:
    branches: [fix/c3-paper-morning-cutoff-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-cutoff-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/c3_paper_price_capture_v1.py
            /scripts/c3_paper_forward_v1.py
            /scripts/test_c3_paper_capture_cutoff_v1.py
            /config/c3_paper_top2_plans.csv
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline morning cutoff tests without market API or orders
        run: python -m unittest discover -s scripts -p test_c3_paper_capture_cutoff_v1.py -v
      - name: Install pykrx for read-only live probe
        run: pip install 'pykrx>=1.2.9' 'pandas>=2.1,<3'
      - name: Probe registered tickers against live provider without changing ledger
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/c3_paper_price_capture_v1.py --plans config/c3_paper_top2_plans.csv --outdir /tmp/c3-live-probe
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/c3-live-probe/c3_paper_price_source_status.json')
          j=json.loads(p.read_text())
          print('PROBE',json.dumps({'captured_at_kst':j['captured_at_kst'],'cutoff':j['completed_bar_cutoff_day'],'states':j['ticker_states'],'certified':j['regular_only_ohlcv_certified']},ensure_ascii=False))
          assert j['orders_enabled'] is False
          assert j['regular_only_ohlcv_certified'] is False
          assert all(x['capture_status']=='OHLCV_OBSERVED_UNVERIFIED_SCOPE' for x in j['ticker_states'].values()),'LIVE_PROVIDER_CAPTURE_INCOMPLETE'
          PY
