name: HMA60 2026 v1.2 continuous data and Money Flow study

on:
  workflow_dispatch:
    inputs:
      asof:
        description: 'Korean last completed trading day (YYYY-MM-DD)'
        type: string
        required: true
        default: '2026-10-13'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test study logic (no live trades)
        run: python -m unittest discover -s scripts -p 'test_hma2026_v12.py' -v
      - name: Prepare present-day v36 universe and 2026 sector snapshot (NOT PIT)
        run: |
          set -euo pipefail
          test -d reports/v36_ohlcv_cache
          test -s config/v12_sector_snapshot_2026_10_08.csv
          python scripts/hma2026_v12.py prepare \
            --source reports/v36_ohlcv_cache \
            --mapping config/v12_sector_snapshot_2026_10_08.csv \
            --outdir work/v12
      - uses: actions/upload-artifact@v4
        with:
          name: hma-v12-manifest
          path: work/v12/
          retention-days: 21
          if-no-files-found: error

  fetch:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hma-v12-manifest
          path: work/v12
      - name: Install data collector
        run: python -m pip install --disable-pip-version-check 'yfinance>=0.2.40' pandas
      - name: Download dated full OHLCV from 2025 through 2026 (independent shards)
        env:
          ASOF: ${{ inputs.asof }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          END_EXCLUSIVE=$(python -c 'from datetime import date,timedelta; import os; print((date.fromisoformat(os.environ["ASOF"])+timedelta(days=1)).isoformat())')
          python scripts/hma2026_v12.py fetch \
            --manifest work/v12/manifest.csv \
            --outdir work/shard_out \
            --shard "${SHARD}" --shards 6 \
            --start 2025-01-01 --end-exclusive "${END_EXCLUSIVE}" --retries 2 --pause 0.7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hma-v12-shard-${{ matrix.shard }}
          path: work/shard_out/
          retention-days: 21
          if-no-files-found: warn

  study:
    needs: [prepare, fetch]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hma-v12-manifest
          path: work/v12
      - uses: actions/download-artifact@v4
        with:
          pattern: hma-v12-shard-*
          merge-multiple: true
          path: work/merged
      - name: Evaluate 2026 HMA60, pre-entry turnover and outcomes, censor incomplete
        env:
          ASOF: ${{ inputs.asof }}
        run: |
          python scripts/hma2026_v12.py study \
            --manifest work/v12/manifest.csv --prices work/merged/prices \
            --outdir reports/hma_v12 --asof "${ASOF}" \
            --max-hold 60 --cost-bps 35 --min-valid 50
      - name: Print auditable completion state
        if: always()
        run: |
          if [ -f reports/hma_v12/v12_audit.json ]; then
            python - <<'PY'
          import json
          a=json.load(open('reports/hma_v12/v12_audit.json'))
          for k in ('status','requested_tickers','full_asof_2026_history','coverage_ratio','turn_events_2026','entries_2026','nominated_cases_covered','sector_pit_verified'):
              print(k,':',a.get(k))
          PY
          fi
      - name: Upload final audit and cases, including partial-status logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hma-v12-report
          path: |
            reports/hma_v12/
            work/merged/fetch_shard_*.csv
            work/merged/fetch_shard_*.json
            work/v12/manifest.csv
            work/v12/prepare_audit.json
            work/v12/prepare_skipped.csv
          retention-days: 21
          if-no-files-found: warn
      - name: Report inadequate 2026 data explicitly
        run: |
          python - <<'PY'
          import json
          a=json.load(open('reports/hma_v12/v12_audit.json'))
          if a['status']=='DATA_PENDING':
              raise SystemExit('DATA_PENDING: fewer than 50 complete valid histories; review fetch shard error counts in artifact, do not trade on this research')
          print('RESEARCH_ONLY: full price cohort still subject to present-day universe and historical sector bias.')
          PY
