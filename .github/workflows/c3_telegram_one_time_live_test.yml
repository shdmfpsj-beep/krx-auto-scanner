name: C3 Telegram one-time live delivery validation
on:
  push:
    branches: [test/c3-telegram-live-delivery-20261110]
    paths: ['.github/workflows/c3_telegram_one_time_live_test.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: c3-top2-telegram-notify
  cancel-in-progress: false
jobs:
  one-time:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_telegram_notify.py
            scripts/c3_telegram_inputs.py
            scripts/c3_classic_theme.py
            scripts/c3_report_context.py
            scripts/c3_report_handoff.py
            scripts/krx_opendart_financial_v91.py
            config/c3_company_context_verified.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install photo-only delivery dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install pillow requests cryptography --disable-pip-version-check
      - name: Execute existing strict live gate and at-most-once Telegram delivery
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python scripts/c3_telegram_notify.py --mode live --outdir /tmp/c3-telegram-one-time
      - name: Preserve delivery status without exposing secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-telegram-one-time-delivery-evidence
          path: |
            /tmp/c3-telegram-one-time/delivery_status.json
            /tmp/c3-telegram-one-time/presentation.json
          if-no-files-found: warn
          retention-days: 30
