          def normalized_holdings(frame, sector, snapshot, collected, collected_at_basis="RESPONSE_OBSERVED"):
              """Cash is identified by its provider name, before stock weight validation.
          
              010010 is a cash identifier in these responses, but a six-character code
              alone never proves an instrument is cash. Keep excluded rows in diagnostics
              and preserve the complete provider frame separately.
              """
              if "비중" not in frame.columns:
                  raise EvidenceError("ETF_HOLDING_WEIGHT_COLUMN_CHANGED")
              name_column = "구성종목명" if "구성종목명" in frame.columns else "종목명"
              if name_column not in frame.columns:
                  raise EvidenceError("ETF_HOLDING_NAME_COLUMN_CHANGED")
              cash_names = {"원화현금", "외화현금", "현금", "원화예금", "외화예금", "CASH", "CASH(KRW)"}
              normalized, excluded = [], []
              for idx, row in frame.iterrows():
                  name = str(row[name_column]).strip()
                  issue = {"sector_id": sector["id"], "etf": sector["etf"],
                           "snapshot_date": snapshot.isoformat(), "source_code": str(idx),
                           "name": name, "source_weight_pct": str(row["비중"]), "reason": ""}
                  if re.sub(r"\s+", "", name).upper() in cash_names:
                      issue["reason"] = "PROVIDER_NAMED_CASH_EXCLUDED_FROM_STOCK_FEATURES"
                      excluded.append(issue)
                      continue
                  try:
                      ticker = ticker_code(idx)
                  except EvidenceError:
                      issue["reason"] = "NON_STOCK_IDENTIFIER_PRESERVED_IN_RAW_ONLY"
                      excluded.append(issue)
                      continue
                  weight = numeric(row["비중"])
                  if weight < 0 or weight > 100:
                      raise EvidenceError("INVALID_HOLDING_WEIGHT")
                  normalized.append({"sector_id": sector["id"], "etf": sector["etf"],
                                     "snapshot_date": snapshot.isoformat(), "ticker": ticker,
                                     "weight_pct": weight, "name": name, "collected_at": collected,
                                     "collected_at_basis": collected_at_basis,
                                     "source": "KRX_ETF_PDF_dated_request",
                                     "point_in_time_status": "PROVIDER_DATED_NOT_INDEPENDENT_VINTAGE_VERIFIED"})
              if not normalized:
                  raise EvidenceError("NO_STOCK_HOLDINGS_IN_ETF_RESPONSE")
              return normalized, excluded
          
          
          def validate_market_cache(root, config, requested_asof, price_start):
              """Only reuse compatible, checksummed raw market data for the same window."""
              root = Path(root)
              status = json.loads((root / "diagnostics/collection_status.json").read_text(encoding="utf-8-sig"))
              old = json.loads((root / "runtime_source/config/sector_evidence_v18.json").read_text(encoding="utf-8-sig"))
              candidate = completed_candidate(requested_asof)
              start = date.fromisoformat(price_start) if price_start else candidate - timedelta(days=420)
              if (not str(status.get("version", "")).startswith("18.0.")
                      or status.get("mode") != "backfill"
                      or status.get("asof") != candidate.isoformat()
                      or status.get("price_start") != start.isoformat()
                      or any(old.get(k) != config.get(k) for k in ("markets", "investors", "benchmark"))
                      or any(status.get("datasets", {}).get(k, {}).get("status") != "OK" for k in ("prices", "flows"))):
                  raise EvidenceError("PREVIOUS_MARKET_CACHE_WINDOW_OR_SCHEMA_MISMATCH")
              manifest = read_csv(root / "checksums.csv")
              verified = set()
              for item in manifest:
                  name = PurePosixPath(item["path"])
                  if name.is_absolute() or ".." in name.parts or "\\" in str(name) or ":" in str(name):
                      raise EvidenceError("PREVIOUS_MARKET_CACHE_UNSAFE_PATH")
                  if str(name) in verified:
                      raise EvidenceError("PREVIOUS_MARKET_CACHE_DUPLICATE_CHECKSUM")
                  path = root.joinpath(*name.parts)
                  if (not path.is_file() or path.stat().st_size != int(item["bytes"])
                          or digest(path) != item["sha256"]):
                      raise EvidenceError("PREVIOUS_MARKET_CACHE_CHECKSUM_MISMATCH")
                  verified.add(str(name))
              required = {"diagnostics/collection_status.json", "runtime_source/config/sector_evidence_v18.json",
                          "market/sessions.csv", "market/etf_prices/" + config["benchmark"] + ".csv"}
              if not required.issubset(verified):
                  raise EvidenceError("PREVIOUS_MARKET_CACHE_REQUIRED_FILES_UNVERIFIED")
              return status, verified
          
          
          def restore_previous_market(collector, args):
              repo = args.repo
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
                  raise EvidenceError("INVALID_GITHUB_REPOSITORY")
              # The named endpoint avoids scanning unrelated historical workflow artifacts.
              endpoint = f"repos/{repo}/actions/artifacts?name=sector-evidence-v18-backfill-report&per_page=30"
              artifacts = gh_json(endpoint).get("artifacts", [])
              artifacts = [a for a in artifacts if a.get("name") == "sector-evidence-v18-backfill-report"
                           and not a.get("expired", True)
                           and str(a.get("workflow_run", {}).get("id", "")) != os.environ.get("GITHUB_RUN_ID", "")]
              attempts = []
              stage = collector.out / "_previous_market_download"
              try:
                  for artifact in sorted(artifacts, key=lambda a: a["id"], reverse=True)[:3]:
                      shutil.rmtree(stage, ignore_errors=True)
                      stage.mkdir(parents=True)
                      archive = stage / "source.zip"
                      try:
                          if int(artifact.get("size_in_bytes", 0)) > 500_000_000:
                              raise EvidenceError("PREVIOUS_MARKET_CACHE_ARCHIVE_TOO_LARGE")
                          with archive.open("wb") as f:
                              result = subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{int(artifact['id'])}/zip"],
                                                      stdout=f, stderr=subprocess.PIPE, timeout=300)
                          if result.returncode:
                              raise EvidenceError("PREVIOUS_MARKET_CACHE_DOWNLOAD_FAILED")
                          unpacked = stage / "unpacked"
                          safe_extract(archive, unpacked)
                          prior, verified = validate_market_cache(unpacked, collector.config, args.asof, args.price_start)
                          copied = 0
                          prefixes = ("market/daily_prices/", "market/daily_flows/", "market/etf_prices/", "market/raw_holdings/")
                          for name in sorted(verified):
                              if name == "market/sessions.csv" or name.startswith(prefixes):
                                  source = unpacked / name
                                  target = collector.out / name
                                  if target.exists():
                                      raise EvidenceError("PREVIOUS_MARKET_CACHE_DESTINATION_NOT_CLEAN")
                                  target.parent.mkdir(parents=True, exist_ok=True)
                                  shutil.copyfile(source, target)
                                  copied += 1
                          metadata = {"artifact_id": artifact["id"], "source_run_id": artifact.get("workflow_run", {}).get("id"),
                                      "archive_sha256": digest(archive), "source_version": prior["version"],
                                      "source_collected_at": prior["collected_at"], "verified_files": len(verified),
                                      "source_completed_at": prior.get("completed_at", ""),
                                      "copied_raw_market_files": copied, "asof": prior["asof"],
                                      "price_start": prior["price_start"], "attempts": attempts,
                                      "rule": "RAW_ONLY_RENORMALIZED_NO_FEATURES_OR_TRADES_REUSED"}
                          json_write(collector.out / "diagnostics/previous_market_cache.json", metadata)
                          collector.status["previous_market_cache"] = metadata
                          collector.mark("previous_market_cache", "RESTORED", copied_raw_market_files=copied,
                                         source_run_id=metadata["source_run_id"])
                          return metadata
                      except (EvidenceError, KeyError, TypeError, ValueError, OSError, zipfile.BadZipFile) as e:
                          code = str(e) if isinstance(e, EvidenceError) else "PREVIOUS_MARKET_CACHE_INVALID_OR_UNAVAILABLE"
                          attempts.append({"artifact_id": artifact["id"], "error_code": code})
                  json_write(collector.out / "diagnostics/previous_market_cache.json", {"status": "NOT_RESTORED", "attempts": attempts})
                  collector.mark("previous_market_cache", "NOT_RESTORED", attempts=attempts,
                                 next_action="Collect fresh market data; no incomplete cache is trusted.")
                  return None
              finally:
                  shutil.rmtree(stage, ignore_errors=True)
          
          
          class Collector:
              def __init__(self, out, config):
                  self.out, self.config = Path(out), config
                  self.out.mkdir(parents=True, exist_ok=True)
                  self.status = {"version": VERSION, "collected_at": stamp(), "datasets": {}, "requests": []}
          
              def mark(self, name, state, **details):
                  self.status["datasets"][name] = {"status": state, **details}
                  self.save()
                  print(f"{name}: {state}", flush=True)
          
              def save(self):
                  json_write(self.out / "diagnostics/collection_status.json", self.status)
          
              def log_request(self, dataset, d, scope, state, rows=0, origin="LIVE_KRX"):
                  self.status["requests"].append({"dataset": dataset, "date": str(d), "scope": scope,
                                                 "status": state, "rows": rows, "collected_at": stamp(), "origin": origin})
                  self.save()
          
              def cached(self, relative):
                  path = self.out / relative
                  return path if self.status.get("previous_market_cache") and path.is_file() else None
          
              def cached_prices(self, relative, dated=None):
                  path = self.cached(relative)
                  if not path:
                      return None
                  rows = read_csv(path)
                  if not rows or any(not set(PRICE_FIELDS).issubset(r) for r in rows):
                      raise EvidenceError("CACHED_PRICE_SCHEMA_INVALID")
                  if dated:
                      if (len(rows) < 100 or any(r["Date"] != dated.isoformat() for r in rows)
                              or len({ticker_code(r["ticker"]) for r in rows}) != len(rows)):
                          raise EvidenceError("CACHED_DATED_PRICE_SCHEMA_INVALID")
                  else:
                      _, issues = price_quality(rows)
                      if issues:
                          raise EvidenceError("CACHED_ETF_PRICE_QUALITY_INVALID")
                  return rows
          
              def market(self, args):
                  krx = Krx(self.config)
                  candidate = completed_candidate(args.asof)
                  start = date.fromisoformat(args.price_start) if args.price_start else candidate - timedelta(days=420)
                  if start > month_shift(candidate, -2) - timedelta(days=180):
                      raise EvidenceError("INSUFFICIENT_PRICE_WARMUP_USE_AT_LEAST_180_CALENDAR_DAYS_BEFORE_WINDOW")
                  bench_rows = self.cached_prices("market/etf_prices/" + self.config["benchmark"] + ".csv")
                  if bench_rows is None:
                      benchmark = krx.call("get_etf_ohlcv_by_date", start.strftime("%Y%m%d"),
                                           candidate.strftime("%Y%m%d"), self.config["benchmark"])
                      bench_rows = krx_prices(benchmark)
                  bench_bars, issues = price_quality(bench_rows)
                  if issues:
                      raise EvidenceError("BENCHMARK_PRICE_QUALITY_FAILED")
                  sessions = sorted({date.fromisoformat(r["Date"]) for r in bench_rows if r["Date"] <= candidate.isoformat()})
                  if len(sessions) < 170:
                      raise EvidenceError("BENCHMARK_LESS_THAN_170_SESSIONS")
                  effective = max(sessions)
                  window = month_shift(effective, -2)
                  flow_start = window - timedelta(days=45)
                  self.status.update({"requested_asof": args.asof or "AUTO", "asof": effective.isoformat(),
                                      "price_start": start.isoformat(), "analysis_window_start": window.isoformat(),
                                      "flow_start": flow_start.isoformat(), "calendar_source": "KRX_069500_returned_sessions",
                                      "universe_scope": "dated_KOSPI_KOSDAQ_price_rows; KONEX excluded; instrument_type_unverified",
                                      "historical_vintage": "downloaded_now_not_independent_intraday_PIT_archive"})
                  csv_write(self.out / "market/etf_prices" / (self.config["benchmark"] + ".csv"), bench_rows, PRICE_FIELDS)
                  csv_write(self.out / "market/sessions.csv", ({"date": d.isoformat()} for d in sessions), ["date"])
                  # Stop early if KRX login / provider access / schemas are unavailable.
                  preflight = {m: krx.call("get_market_ohlcv", effective.strftime("%Y%m%d"), market=m)
                               for m in self.config["markets"]}
                  for m, frame in preflight.items():
                      if len(krx_prices(frame, effective)) < 100:
                          raise EvidenceError("MARKET_PREFLIGHT_UNEXPECTED_COVERAGE")
                  self.mark("krx_preflight", "OK", pykrx=importlib.metadata.version("pykrx"),
                            asof=effective.isoformat())
                  limit = int(self.config["circuit_breaker_failures"])
                  failures, total = 0, 0
                  for d in sessions:
                      for m in self.config["markets"]:
                          if failures >= limit:
                              break
                          try:
                              rows = self.cached_prices(f"market/daily_prices/{m}/{d.isoformat()}.csv", d)
                              origin = "CHECKSUM_VERIFIED_PREVIOUS_ARTIFACT" if rows is not None else "LIVE_KRX"
                              if rows is None:
                                  frame = preflight[m] if d == effective else krx.call("get_market_ohlcv", d.strftime("%Y%m%d"), market=m)
                                  rows = krx_prices(frame, d)
                              if len(rows) < 100:
                                  raise EvidenceError("MARKET_PRICE_COVERAGE_UNEXPECTEDLY_SMALL")
                              csv_write(self.out / f"market/daily_prices/{m}/{d.isoformat()}.csv", rows, ["ticker", *PRICE_FIELDS])
                              total += len(rows)
                              self.log_request("prices", d, m, "OK", len(rows), origin)
                              failures = 0
                          except EvidenceError as e:
                              failures += 1
                              self.log_request("prices", d, m, e.args[0])
                      if failures >= limit:
                          break
                  price_requests = [r for r in self.status["requests"] if r["dataset"] == "prices"]
                  expected = len(sessions) * len(self.config["markets"])
                  price_ok = sum(r["status"] == "OK" for r in price_requests)
                  self.mark("prices", "OK" if price_ok == expected else "DATA_PENDING", rows=total,
                            expected_requests=expected, successful_requests=price_ok)
                  # Request success is distinct from a coherent completed trading bar.
                  # From 2026-09-14 KRX also runs an after-market until 20:00 KST.
                  # Mixed-session OHLC is a hypothesis, not a proven correction.
                  latest_rows = []
                  for market in self.config["markets"]:
                      latest_rows.extend(read_csv(
                          self.out / "market/daily_prices" / market /
                          (effective.isoformat() + ".csv")))
                  q = audit_daily_ohlc_session(latest_rows)
                  valid = q["checked"] >= 100 and q["invalid_pct"] <= 1.0
                  self.mark("price_ohlc_integrity", "OK" if valid else "DATA_PENDING",
                            **q, source_basis="RAW_PYKRX_DATE_ONLY_SESSION_UNVERIFIED",
                            issue="SESSION_MIX_OR_PROVIDER_INCONSISTENCY_UNRESOLVED"
                            if not valid else "NONE",
                            price_requests_ok=(price_ok == expected),
                            no_auto_price_repair=True)

                  failures, flow_rows = 0, 0
                  flow_dates = [d for d in sessions if d >= flow_start]
                  for d in flow_dates:
                      for m in self.config["markets"]:
                          for investor in self.config["investors"]:
                              if failures >= limit:
                                  break
                              try:
                                  inv = {"외국인": "foreign", "기관합계": "institution", "개인": "individual"}[investor]
                                  cached = self.cached(f"market/daily_flows/{m}/{d.isoformat()}_{inv}.csv")
                                  origin = "CHECKSUM_VERIFIED_PREVIOUS_ARTIFACT" if cached else "LIVE_KRX"
                                  if cached:
                                      rows = read_csv(cached)
                                      if (not rows or any(not set(FLOW_FIELDS).issubset(r)
                                              or r["date"] != d.isoformat() or r["market"] != m
                                              or r["investor"] != investor or r["unit"] != "KRW" for r in rows)
                                              or len({ticker_code(r["ticker"]) for r in rows}) != len(rows)):
                                          raise EvidenceError("CACHED_FLOW_SCHEMA_INVALID")
                                      for r in rows:
                                          buy, sell, net = (numeric(r[k]) for k in ("buy_krw", "sell_krw", "net_buy_krw"))
                                          if min(buy, sell) < 0 or abs(buy - sell - net) > .5:
                                              raise EvidenceError("KRX_NET_BUY_IDENTITY_FAILED")
                                  else:
                                      frame = krx.call("get_market_net_purchases_of_equities", d.strftime("%Y%m%d"),
                                                       d.strftime("%Y%m%d"), m, investor)
                                      rows = krx_flows(frame, d, m, investor, stamp())
                                  csv_write(self.out / f"market/daily_flows/{m}/{d.isoformat()}_{inv}.csv", rows, FLOW_FIELDS)
                                  flow_rows += len(rows)
                                  self.log_request("flows", d, m + "/" + inv, "OK", len(rows), origin)
                                  failures = 0
                              except EvidenceError as e:
                                  failures += 1
                                  self.log_request("flows", d, m + "/" + investor, e.args[0])
                          if failures >= limit:
                              break
                      if failures >= limit:
                          break
                  expected_flows = len(flow_dates) * len(self.config["markets"]) * len(self.config["investors"])
                  flow_ok = sum(r["status"] == "OK" for r in self.status["requests"] if r["dataset"] == "flows")
                  self.mark("flows", "OK" if flow_ok == expected_flows else "DATA_PENDING", rows=flow_rows,
                            expected_requests=expected_flows, successful_requests=flow_ok, unit="KRW",
                            note="Ticker absent from a response is UNKNOWN, never zero; institution subdivisions are not added again.")
                  self.etfs_and_holdings(krx, sessions, flow_start, start, effective)
          
              def etfs_and_holdings(self, krx, sessions, mapping_start, start, effective):
                  hold_rows, excluded_rows, good_holdings, etf_good = [], [], 0, 0
                  snapshots = weekly_snapshots(sessions, mapping_start)
                  for s in self.config["sectors"]:
                      # A bad security or snapshot must not suppress subsequent sectors.
                      # Provider call failures are bounded separately within each ETF.
                      provider_failures = 0
                      try:
                          rows = self.cached_prices(f"market/etf_prices/{s['etf']}.csv")
                          origin = "CHECKSUM_VERIFIED_PREVIOUS_ARTIFACT" if rows is not None else "LIVE_KRX"
                          if rows is None:
                              frame = krx.call("get_etf_ohlcv_by_date", start.strftime("%Y%m%d"), effective.strftime("%Y%m%d"), s["etf"])
                              rows = krx_prices(frame)
                          _, issues = price_quality(rows)
                          if issues:
                              raise EvidenceError("ETF_PRICE_QUALITY_FAILED")
                          csv_write(self.out / f"market/etf_prices/{s['etf']}.csv", rows, PRICE_FIELDS)
                          etf_good += 1
                          self.log_request("etf_prices", effective, s["id"], "OK", len(rows), origin)
                      except EvidenceError as e:
                          self.log_request("etf_prices", effective, s["id"], e.args[0])
                      for d in snapshots:
                          if provider_failures >= int(self.config["circuit_breaker_failures"]):
                              self.log_request("holdings", d, s["id"], "SKIPPED_THIS_ETF_AFTER_PROVIDER_FAILURES")
                              continue
                          try:
                              rawpath = self.out / f"market/raw_holdings/{s['etf']}/{d.isoformat()}.csv"
                              cached = self.cached(str(rawpath.relative_to(self.out)))
                              origin = "CHECKSUM_VERIFIED_PREVIOUS_ARTIFACT" if cached else "LIVE_KRX"
                              if cached:
                                  frame = pd.read_csv(cached, index_col=0, dtype=str, keep_default_na=False)
                              else:
                                  frame = krx.call("get_etf_portfolio_deposit_file", s["etf"], d.strftime("%Y%m%d"))
                                  rawpath.parent.mkdir(parents=True, exist_ok=True)
                                  frame.to_csv(rawpath, encoding="utf-8-sig", index=True)
                              if cached:
                                  completed = self.status.get("previous_market_cache", {}).get("source_completed_at")
                                  collected = completed or stamp()
                                  basis = "SOURCE_RUN_COMPLETION_UPPER_BOUND_NOT_EXACT_RECEIPT_TIME" if completed else "REPROCESSING_TIME_SOURCE_RECEIPT_TIME_UNKNOWN"
                              else:
                                  collected, basis = stamp(), "RESPONSE_OBSERVED"
                              normalized, excluded = normalized_holdings(frame, s, d, collected, basis)
                              hold_rows.extend(normalized)
                              excluded_rows.extend(excluded)
                              good_holdings += 1
                              provider_failures = 0
                              self.log_request("holdings", d, s["id"], "OK", len(normalized), origin)
                          except EvidenceError as e:
                              if str(e) == "KRX_CALL_FAILED_OR_EMPTY":
                                  provider_failures += 1
                              self.log_request("holdings", d, s["id"], e.args[0])
                  csv_write(self.out / "market/sector_membership_dated.csv", hold_rows, HOLD_FIELDS)
                  csv_write(self.out / "diagnostics/holdings_excluded_nonstock.csv", excluded_rows,
                            ["sector_id", "etf", "snapshot_date", "source_code", "name", "source_weight_pct", "reason"])
                  self.mark("etf_prices", "OK" if etf_good == len(self.config["sectors"]) else "DATA_PENDING",
                            successful_series=etf_good, requested_series=len(self.config["sectors"]))
                  expected = len(self.config["sectors"]) * len(snapshots)
                  self.mark("holdings", "OK" if good_holdings == expected else "DATA_PENDING",
                            successful_snapshots=good_holdings, expected_snapshots=expected,
                            excluded_nonstock_rows=len(excluded_rows),
                            point_in_time="PROVIDER_DATED_ONLY", scope="ETF_constituents_proxy_not_all_industry_members")
          
              def news(self, window, asof):
                  provider = self.config.get("news_provider", "rss")
                  if provider == "rss":
                      return self.news_rss(window, asof)
                  if provider != "naver_legacy":
                      raise EvidenceError("UNSUPPORTED_NEWS_PROVIDER")
                  cid, secret = os.environ.get("NAVER_CLIENT_ID"), os.environ.get("NAVER_CLIENT_SECRET")
                  if not cid or not secret:
                      self.mark("news", "MISSING_KEYS", historical_coverage="NOT_COLLECTED")
                      csv_write(self.out / "catalysts/news.csv", [], NEWS_FIELDS)
                      return
                  rows, coverage = {}, []
                  headers = {"X-Naver-Client-Id": cid, "X-Naver-Client-Secret": secret}
                  for sector in self.config["sectors"]:
                      oldest, pages, state = None, 0, "RECENT_SEARCH_ONLY"
                      try:
                          for page in range(int(self.config["max_news_pages_per_sector"])):
                              time.sleep(float(self.config["request_pause_seconds"]))
                              query = {"query": sector["query"], "display": 100, "start": 1 + 100 * page, "sort": "date"}
                              payload = http_json("https://openapi.naver.com/v1/search/news.json?" + urlencode(query), headers)
                              if "items" not in payload:
                                  raise EvidenceError("NAVER_RESPONSE_SCHEMA_CHANGED")
                              pages += 1
                              items = payload["items"]
                              for item in items:
                                  dt = parsedate_to_datetime(item["pubDate"]).astimezone(KST)
                                  oldest = min(oldest, dt.date()) if oldest else dt.date()
                                  if not window <= dt.date() <= asof:
                                      continue
                                  url = item.get("originallink") or item.get("link", "")
                                  key = (sector["id"], url)
                                  rows[key] = {"sector_id": sector["id"], "query": sector["query"],
                                               "title": html.unescape(re.sub(r"<[^>]*>", "", item.get("title", ""))),
                                               "url": url, "naver_url": item.get("link", ""),
                                               "publisher_host": urlparse(url).hostname or "",
                                               "published_at": dt.isoformat(), "timestamp_basis": "NAVER_pubDate_not_original_first_publish_verified",
                                               "collected_at": stamp(), "historical_coverage": "INCOMPLETE_SEARCH_ARCHIVE"}
                              if not items or len(items) < 100 or (oldest and oldest < window):
                                  break
                      except Exception:
                          state = "DATA_PENDING_REQUEST_FAILED"
                      coverage.append({"sector_id": sector["id"], "pages": pages, "oldest_returned_date": oldest.isoformat() if oldest else "",
                                       "status": state, "archive_complete": False})
                  csv_write(self.out / "catalysts/news.csv", rows.values(), NEWS_FIELDS)
                  json_write(self.out / "catalysts/news_coverage.json", coverage)
                  self.mark("news", "PARTIAL_SEARCH_ARCHIVE", rows=len(rows), historical_coverage="INCOMPLETE",
                            failed_sectors=sum(r["status"].startswith("DATA_PENDING") for r in coverage),
                            note="Naver search is capped at start=1000 and has no historical date-range parameter. Counts are observations, not complete historical mentions.")
          
              def news_rss(self, window, asof):
                  articles, feed_ids, coverage = {}, defaultdict(set), []
                  # A feed fetched today is not an as-of archive, even when its pubDate is
                  # inside an old backtest window. Keep it out of historical news.csv.
                  csv_write(self.out / "catalysts/news.csv", [], NEWS_FIELDS)
                  feeds = self.config.get("rss_feeds", [])
                  for feed in feeds:
                      diagnostic = {"feed_id": feed["id"], "url": feed["url"], "status": "DATA_PENDING",
                                    "returned_items": 0, "accepted_items": 0, "rejected_items": 0,
                                    "error_code": "", "archive_complete": False}
                      try:
                          time.sleep(float(self.config["request_pause_seconds"]))
                          payload = rss_payload(feed["url"])
                          collected_at = stamp()
                          items = rss_items(payload)
                          if not re.fullmatch(r"[A-Za-z0-9_]+", feed["id"]):
                              raise EvidenceError("RSS_INVALID_FEED_ID")
                          raw_path = self.out / "catalysts/raw_rss" / (feed["id"] + ".xml")
                          raw_path.parent.mkdir(parents=True, exist_ok=True)
                          raw_path.write_bytes(payload)
                          diagnostic.update(sha256=hashlib.sha256(payload).hexdigest(), bytes=len(payload),
                                            collected_at=collected_at, returned_items=len(items))
                          errors = Counter()
                          for item in items:
                              try:
                                  row = rss_article(item, collected_at)
                                  url = row["url"]
                                  if url not in articles:
                                      articles[url] = row
                                  feed_ids[url].add(feed["id"])
                                  diagnostic["accepted_items"] += 1
                              except EvidenceError as e:
                                  diagnostic["rejected_items"] += 1
                                  errors[str(e)] += 1
                          diagnostic.update(status="SNAPSHOT_RECEIVED" if diagnostic["accepted_items"] else "ALL_ITEMS_REJECTED" if items else "EMPTY_FEED",
                                            rejected_reasons=dict(errors))
                      except Exception as e:
                          diagnostic["error_code"] = (str(e) if isinstance(e, EvidenceError)
                                                       and re.fullmatch(r"[A-Z0-9_]+", str(e)) else "RSS_REQUEST_OR_SCHEMA_FAILURE")
                      coverage.append(diagnostic)
                  tagged = []
                  for url, row in articles.items():
                      row["source_feed_ids"] = "|".join(sorted(feed_ids[url]))
                      for tag in rss_sector_tags(row["title"], self.config["sectors"]):
                          tagged.append({**row, **tag})
                  csv_write(self.out / "catalysts/rss_snapshot.csv", articles.values(), RSS_FIELDS)
                  csv_write(self.out / "catalysts/rss_sector_observations.csv", tagged, RSS_SECTOR_FIELDS)
                  successful = sum(r["status"] in ("SNAPSHOT_RECEIVED", "EMPTY_FEED") for r in coverage)
                  details = {"provider": "publisher_rss", "api_keys_required": False,
                             "requested_window_start": window.isoformat(), "requested_asof": asof.isoformat(),
                             "historical_archive_complete": False, "historical_feature_use_allowed": False,
                             "historical_rows": 0, "snapshot_rows": len(articles), "sector_tag_rows": len(tagged),
                             "feeds_requested": len(feeds), "feeds_successful": successful, "feeds": coverage,
                             "note": "Public recent-feed metadata only. No historical zero-mention inference, complete market coverage, first-publication verification or trading authorization."}
                  json_write(self.out / "catalysts/news_coverage.json", details)
                  self.mark("news", "RSS_SNAPSHOT_ONLY" if successful else "DATA_PENDING", provider="publisher_rss",
                            keys_required=False, rows=0, snapshot_rows=len(articles),
                            feeds_successful=successful, feeds_requested=len(feeds),
                            historical_coverage="NOT_COLLECTED_BY_RSS", historical_feature_use_allowed=False,
                            error_code="" if successful else "RSS_ALL_FEEDS_UNAVAILABLE_OR_UNCONFIGURED")
          
              def dart(self, window, asof):
                  raw_key = os.environ.get("DART_API_KEY", "")
                  key = raw_key.strip()
                  rows = {}
                  row_issues = []
                  diagnostic_path = "diagnostics/dart_diagnostics.json"
                  diagnostics = {"version": VERSION, "key_present": bool(key), "key_length": len(key),
                                 "key_whitespace_removed": key != raw_key,
                                 "window_start": window.isoformat(), "asof": asof.isoformat(),
                                 "successful_api_response_received": False, "requests": [],
                                 "markets": {market: {"status": "NOT_STARTED"} for market in ("Y", "K")}}
          
                  def persist():
                      unmapped = sum(r["ticker_mapping_status"] != "MAPPED" for r in rows.values())
                      diagnostics.update(rows=len(rows), mapped_rows=len(rows) - unmapped, unmapped_rows=unmapped,
                                         ticker_mapping_counts=dict(Counter(r["ticker_mapping_status"] for r in rows.values())),
                                         completed_at=stamp())
                      json_write(self.out / diagnostic_path, diagnostics)
                      csv_write(self.out / "diagnostics/dart_requests.csv", diagnostics["requests"], DART_REQUEST_FIELDS)
                      csv_write(self.out / "catalysts/disclosures.csv", rows.values(), DART_FIELDS)
                      csv_write(self.out / "diagnostics/dart_unmapped.csv",
                                (r for r in row_issues if not r["error_code"]), DART_ROW_ISSUE_FIELDS)
                      csv_write(self.out / "diagnostics/dart_rejected_rows.csv",
                                (r for r in row_issues if r["error_code"]), DART_ROW_ISSUE_FIELDS)
          
                  persist()
                  if not key:
                      self.mark("dart", "MISSING_KEY", error_code="MISSING_DART_API_KEY", diagnostics_file=diagnostic_path,
                                exact_publication_time="UNAVAILABLE")
                      return
                  complete = True
                  global_failure = False
                  for market in ("Y", "K"):
                      if global_failure:
                          diagnostics["markets"][market] = {"status": "SKIPPED_AFTER_GLOBAL_FAILURE"}
                          continue
                      market_state = {"status": "COLLECTING", "pages_completed": 0, "unmapped_rows": 0, "rejected_rows": 0}
                      diagnostics["markets"][market] = market_state
                      page, pages = 1, 1
                      market_complete = True
                      while page <= pages:
                          request = {"market": market, "page": page, "window_start": window.isoformat(),
                                     "asof": asof.isoformat(), "attempts": 0, "http_status": "", "api_status": "",
                                     "api_reason": "", "result": "DATA_PENDING", "error_code": "",
                                     "returned_rows": 0, "accepted_rows": 0, "unmapped_rows": 0, "rejected_rows": 0, "collected_at": stamp()}
                          stop_market = False
                          try:
                              if page > 500:
                                  raise EvidenceError("DART_PAGINATION_LIMIT")
                              time.sleep(float(self.config["request_pause_seconds"]))
                              params = {"crtfc_key": key, "bgn_de": window.strftime("%Y%m%d"), "end_de": asof.strftime("%Y%m%d"),
                                        "corp_cls": market, "last_reprt_at": "N", "page_count": 100,
                                        "page_no": page, "sort": "date", "sort_mth": "asc"}
                              payload = http_json("https://opendart.fss.or.kr/api/list.json?" + urlencode(params),
                                                  retries=int(self.config["request_retries"]), diagnostics=request)
                              if not isinstance(payload, dict) or not isinstance(payload.get("status"), str) or not re.fullmatch(r"[0-9]{3}", payload["status"]):
                                  raise EvidenceError("DART_RESPONSE_SCHEMA_ERROR")
                              api_status = request["api_status"] = payload["status"]
                              request["api_reason"] = DART_STATUS_REASONS.get(api_status, "UNKNOWN_API_STATUS")
                              if api_status not in ("000", "013"):
                                  global_failure = api_status in ("010", "011", "012", "020", "800", "901")
                                  raise EvidenceError(f"DART_API_{api_status}_{request['api_reason']}")
                              diagnostics["successful_api_response_received"] = True
                              if api_status == "013":
                                  if page != 1:
                                      raise EvidenceError("DART_INCOMPLETE_PAGINATION")
                                  request["result"] = "NO_DATA"
                                  stop_market = True
                              else:
                                  try:
                                      returned_pages = int(payload["total_page"])
                                      items = payload["list"]
                                      if returned_pages < page or not isinstance(items, list):
                                          raise ValueError
                                      if "page_no" in payload and int(payload["page_no"]) != page:
                                          raise ValueError
                                  except (KeyError, TypeError, ValueError):
                                      raise EvidenceError("DART_RESPONSE_SCHEMA_ERROR") from None
                                  if page > 1 and returned_pages != pages:
                                      raise EvidenceError("DART_PAGINATION_CHANGED")
                                  pages = returned_pages
                                  if not items:
                                      raise EvidenceError("DART_EMPTY_SUCCESS_PAGE")
                                  request["returned_rows"] = len(items)
                                  row_errors = Counter()
                                  for row_number, r in enumerate(items, start=1):
                                      try:
                                          parsed = dart_disclosure(r, window, asof, key)
                                          rows[parsed["receipt_no"]] = parsed
                                          request["accepted_rows"] += 1
                                          if parsed["ticker_mapping_status"] != "MAPPED":
                                              request["unmapped_rows"] += 1
                                              row_issues.append(dart_row_issue(r, market, page, row_number, key))
                                      except (KeyError, TypeError, ValueError, EvidenceError) as e:
                                          code = str(e) if isinstance(e, EvidenceError) else "DART_ROW_SCHEMA_ERROR"
                                          row_errors[code] += 1
                                          row_issues.append(dart_row_issue(r, market, page, row_number, key, code))
                                  request["rejected_rows"] = sum(row_errors.values())
                                  request["row_error_counts"] = dict(row_errors)
                                  if row_errors:
                                      market_complete = complete = False
                                      request["error_code"] = "DART_INVALID_ROWS"
                                  else:
                                      request["result"] = "OK_WITH_UNMAPPED" if request["unmapped_rows"] else "OK"
                              market_state["pages_completed"] += 1
                              market_state["unmapped_rows"] += request["unmapped_rows"]
                              market_state["rejected_rows"] += request["rejected_rows"]
                          except Exception as e:
                              request["error_code"] = str(e) if isinstance(e, EvidenceError) and re.fullmatch(r"[A-Z0-9_]+", str(e)) else "UNEXPECTED_DART_FAILURE"
                              global_failure = global_failure or request["http_status"] in (401, 403)
                              market_complete = complete = False
                              stop_market = True
                          diagnostics["requests"].append(request)
                          persist()
                          if request["error_code"] or page == 1:
                              print("DART_DIAGNOSTIC=" + json.dumps({k: request[k] for k in DART_REQUEST_FIELDS}, ensure_ascii=False), flush=True)
                          if stop_market:
                              break
                          page += 1
                      market_state["status"] = "COMPLETE_WITH_UNMAPPED" if market_complete and market_state["unmapped_rows"] else "COMPLETE" if market_complete else "DATA_PENDING"
                      persist()
                  diagnostics["api_pagination_complete"] = complete
                  diagnostics["ticker_mapping_complete"] = complete and not any(r["ticker_mapping_status"] != "MAPPED" for r in rows.values())
                  persist()
                  failed = [r for r in diagnostics["requests"] if r["error_code"]]
                  last = failed[-1] if failed else diagnostics["requests"][-1] if diagnostics["requests"] else {}
                  state = "DATE_ONLY_COMPLETE_WITH_UNMAPPED" if complete and diagnostics["unmapped_rows"] else "DATE_ONLY_COMPLETE" if complete else "DATA_PENDING"
                  print("DART_COVERAGE=" + json.dumps({"status": state, "rows": len(rows), "mapped_rows": diagnostics["mapped_rows"],
                        "unmapped_rows": diagnostics["unmapped_rows"], "api_pagination_complete": complete,
                        "ticker_mapping_complete": diagnostics["ticker_mapping_complete"]}), flush=True)
                  self.mark("dart", state, rows=len(rows), mapped_rows=diagnostics["mapped_rows"], unmapped_rows=diagnostics["unmapped_rows"],
                            api_pagination_complete=complete, ticker_mapping_complete=diagnostics["ticker_mapping_complete"],
                            rejected_rows=sum(r["rejected_rows"] for r in diagnostics["requests"]),
                            diagnostics_file=diagnostic_path, error_code=last.get("error_code", ""),
                            http_status=last.get("http_status", ""), api_status=last.get("api_status", ""),
                            successful_api_response_received=diagnostics["successful_api_response_received"],
                            exact_publication_time="UNAVAILABLE", amendments="original_and_amended_reports_retained",
                            intraday_use="same_date_disclosures_are_ineligible_without_exact_timestamp")
          
          
          def complete_flow_sum(flow, tk, dates, investor):
              values = [flow.get((tk, d, investor)) for d in dates]
              if not values or any(v is None for v in values):
                  return None
              return sum(values)
          
          
          def snapshot_before(holdings, sector_id, decision_date, max_age):
              eligible = [d for sid, d in holdings if sid == sector_id and d < decision_date]
              if not eligible:
                  return None, []
              newest = max(eligible)
              if (date.fromisoformat(decision_date) - date.fromisoformat(newest)).days > max_age:
                  return None, []
              return newest, holdings[(sector_id, newest)]
          
          
          def assemble_market(collector):
              out = collector.out
              price_map, flow_map = defaultdict(dict), {}
              quality, universe, duplicates = [], [], []
              for p in sorted((out / "market/daily_prices").glob("*/*.csv")):
                  market = p.parent.name
                  for r in read_csv(p):
                      tk, d = ticker_code(r["ticker"]), r["Date"]
                      if d in price_map[tk]:
                          duplicates.append({"ticker": tk, "Date": d, "code": "MULTIPLE_MARKETS_SAME_TICKER_DATE"})
                          price_map[tk].pop(d, None)
                          continue
                      price_map[tk][d] = r
                      universe.append({"date": d, "ticker": tk, "market": market,
                                       "instrument_type": "UNVERIFIED", "source": "KRX_dated_market_price_response"})
              csv_write(out / "market/universe_dated.csv", universe, ["date", "ticker", "market", "instrument_type", "source"])
              series = {}
              for tk, by_date in price_map.items():
                  rows = [r for _, r in sorted(by_date.items())]
                  bars, issues = price_quality(rows)
                  for issue in issues:
                      quality.append({"ticker": tk, **issue})
                  if not issues:
                      series[tk] = {b["date"]: b for b in bars}
                  # Raw source is preserved in daily_prices; normalized files retain source prices, no repair.
                  csv_write(out / f"market/prices/{tk}.csv", rows, PRICE_FIELDS)
              csv_write(out / "diagnostics/price_quality.csv", quality + duplicates, ["ticker", "Date", "code", "row"])
              flow_conflicts = set()
              for p in sorted((out / "market/daily_flows").glob("*/*.csv")):
                  for r in read_csv(p):
                      k = (r["ticker"], r["date"], r["investor"])
                      if k in flow_map:
                          flow_conflicts.add(k)
                          continue
                      flow_map[k] = numeric(r["net_buy_krw"])
              for k in flow_conflicts:
                  flow_map.pop(k, None)
              csv_write(out / "diagnostics/flow_conflicts.csv", ({"ticker": k[0], "date": k[1], "investor": k[2]} for k in sorted(flow_conflicts)),
                        ["ticker", "date", "investor"])
              counts = {"tickers": len(price_map), "quality_issue_rows": len(quality),
                        "duplicate_price_rows": len(duplicates), "flow_conflicts": len(flow_conflicts),
                        "usable_for_features": len(series), "price_rows": len(universe), "flow_rows": len(flow_map)}
              json_write(out / "diagnostics/market_coverage.json", counts)
              normalization_ok = bool(series and flow_map) and not duplicates and not flow_conflicts
              error_code = "NO_USABLE_MARKET_PRICES_OR_FLOWS" if not series or not flow_map else "CONFLICTING_MARKET_ROWS" if not normalization_ok else ""
              collector.mark("normalization", "OK" if normalization_ok else "DATA_PENDING", error_code=error_code, **counts)
              crosscheck = []
              for p in sorted((out / "baseline/prices").glob("*.csv")):
                  fresh = price_map.get(p.stem, {})
                  for r in read_csv(p):
                      d = r.get("Date", "")
                      if d not in fresh:
                          continue
                      try:
                          diffs = {k: numeric(fresh[d][k]) - numeric(r[k]) for k in PRICE_FIELDS[1:6]}
                          close_pct = (numeric(fresh[d]["Close"]) / numeric(r["Close"]) - 1) * 100
                          crosscheck.append({"ticker": p.stem, "Date": d,
                                             "baseline_close": r["Close"], "krx_close": fresh[d]["Close"],
                                             "close_difference_pct": round(close_pct, 6),
                                             "ohlcv_exact_match": all(abs(v) < 1e-6 for v in diffs.values()),
                                             "action": "NO_REPAIR_KEEP_SOURCES_SEPARATE"})
                      except (KeyError, ValueError, EvidenceError):
                          continue
              csv_write(out / "diagnostics/baseline_vs_krx_prices.csv", crosscheck,
                        ["ticker", "Date", "baseline_close", "krx_close", "close_difference_pct", "ohlcv_exact_match", "action"])
              return price_map, series, flow_map
          
          
          def build_features(collector, price_map, series, flow_map):
              out = collector.out
              sessions = [r["date"] for r in read_csv(out / "market/sessions.csv")]
              window = collector.status["analysis_window_start"]
              holdings = defaultdict(list)
              seen_holdings = set()
              for r in read_csv(out / "market/sector_membership_dated.csv"):
                  key = (r["sector_id"], r["snapshot_date"], r["ticker"])
                  if key in seen_holdings:
                      raise EvidenceError("DUPLICATE_MEMBERSHIP_ROW")
                  seen_holdings.add(key)
                  holdings[key[:2]].append(r)
              etfs = {}
              for p in (out / "market/etf_prices").glob("*.csv"):
                  bars, issues = price_quality(read_csv(p))
                  if not issues:
                      etfs[p.stem] = {b["date"]: b for b in bars}
              benchmark = etfs.get(collector.config["benchmark"], {})
              news_path, dart_path = out / "catalysts/news.csv", out / "catalysts/disclosures.csv"
              news = read_csv(news_path) if news_path.exists() else []
              dart = read_csv(dart_path) if dart_path.exists() else []
              news_state = collector.status["datasets"].get("news", {}).get("status", "NOT_COLLECTED")
              dart_state = collector.status["datasets"].get("dart", {}).get("status", "NOT_COLLECTED")
              features = []
              for i, d in enumerate(sessions):
                  if d < window or i < 20:
                      continue
                  dates5, dates20 = sessions[i - 4:i + 1], sessions[i - 19:i + 1]
                  for sector in collector.config["sectors"]:
                      sid, tk = sector["id"], sector["etf"]
                      snapshot, members = snapshot_before(holdings, sid, d, int(collector.config["maximum_membership_age_days"]))
                      codes = [m["ticker"] for m in members]
                      row = {"date": d, "sector_id": sid, "sector_name": sector["name"], "etf": tk,
                             "snapshot_date": snapshot or "", "stock_members": len(codes),
                             "membership_status": "PROVIDER_DATED_PROXY_NOT_STRICT_PIT" if snapshot else "UNMAPPED",
                             "money_scope": "ETF_stock_constituents_unweighted_net_buy_not_entire_industry",
                             "news_status": news_state, "dart_status": dart_state,
                             "full_sector_score": "", "live_selection_authorized": False,
                             "availability_assumption": d + "T18:10:00+09:00_not_historical_vintage_verified"}
                      ep = etfs.get(tk, {})
                      for n in (5, 20):
                          prev = sessions[i - n]
                          if d in ep and prev in ep and d in benchmark and prev in benchmark:
                              er = (ep[d]["close"] / ep[prev]["close"] - 1) * 100
                              br = (benchmark[d]["close"] / benchmark[prev]["close"] - 1) * 100
                              row[f"etf_return_{n}d_pct"] = round(er, 6)
                              row[f"benchmark_return_{n}d_pct"] = round(br, 6)
                              row[f"rs_{n}d_pp"] = round(er - br, 6)
                      broad = []
                      turnover = []
                      for member in codes:
                          sp = series.get(member, {})
                          if d in sp and sessions[i - 5] in sp and sp[d]["row_status"] == "OK":
                              broad.append(sp[d]["close"] > sp[sessions[i - 5]]["close"])
                          r = price_map.get(member, {}).get(d)
                          if r and r.get("TurnoverKRW", "") != "":
                              turnover.append(numeric(r["TurnoverKRW"]))
                      row["breadth_coverage"] = round(len(broad) / len(codes), 4) if codes else ""
                      sufficient = len(codes) >= 5 and len(broad) / len(codes) >= collector.config["minimum_member_coverage"]
                      row["breadth_up_5d_pct"] = round(100 * sum(broad) / len(broad), 4) if sufficient else ""
                      row["turnover_coverage"] = round(len(turnover) / len(codes), 4) if codes else ""
                      if codes and len(turnover) == len(codes):
                          row["member_turnover_krw"] = sum(turnover)
                          row["top3_turnover_share_pct"] = round(100 * sum(sorted(turnover, reverse=True)[:3]) / sum(turnover), 4) if sum(turnover) else ""
                      for investor, slug in (("외국인", "foreign"), ("기관합계", "institution"), ("개인", "individual")):
                          for n, dates in ((5, dates5), (20, dates20)):
                              sums = [complete_flow_sum(flow_map, member, dates, investor) for member in codes]
                              present = [v for v in sums if v is not None]
                              coverage = len(present) / len(codes) if codes else 0
                              row[f"{slug}_{n}d_coverage"] = round(coverage, 4) if codes else ""
                              row[f"{slug}_net_buy_{n}d_krw"] = sum(present) if codes and coverage == 1 else ""
                              row[f"{slug}_positive_members_{n}d_pct"] = round(100 * sum(v > 0 for v in present) / len(present), 4) if coverage == 1 and present else ""
                      row["price_flow_proxy_ready"] = bool(sufficient and row.get("rs_20d_pp") is not None
                          and row.get("foreign_20d_coverage") == 1 and row.get("institution_20d_coverage") == 1)
                      if news_state == "PARTIAL_SEARCH_ARCHIVE":
                          row["observed_news_mentions_5d"] = sum(r["sector_id"] == sid and dates5[0] <= r["published_at"][:10] <= d for r in news)
                      row["dart_unmapped_rows"] = collector.status["datasets"].get("dart", {}).get("unmapped_rows", 0)
                      row["dart_ticker_mapping_complete"] = dart_state == "DATE_ONLY_COMPLETE"
                      if dart_state in ("DATE_ONLY_COMPLETE", "DATE_ONLY_COMPLETE_WITH_UNMAPPED"):
                          # Same-date disclosures excluded: no publication minute is known.
                          # Counts include only mapped, observed receipts. Unmapped entities
                          # remain separate and cannot authorize a complete catalyst score.
                          row["observed_disclosures_prior_5d"] = sum(r["ticker"] in codes and dates5[0] <= r["receipt_date"] < d for r in dart)
                      features.append(row)
              fields = ["date", "sector_id", "sector_name", "etf", "snapshot_date", "stock_members",
                        "membership_status", "money_scope", "etf_return_5d_pct", "etf_return_20d_pct",
                        "benchmark_return_5d_pct", "benchmark_return_20d_pct", "rs_5d_pp", "rs_20d_pp",
                        "breadth_coverage", "breadth_up_5d_pct", "turnover_coverage", "member_turnover_krw",
                        "top3_turnover_share_pct"]
              for slug in ("foreign", "institution", "individual"):
                  for n in (5, 20):
                      fields += [f"{slug}_{n}d_coverage", f"{slug}_net_buy_{n}d_krw", f"{slug}_positive_members_{n}d_pct"]
              fields += ["news_status", "observed_news_mentions_5d", "dart_status", "observed_disclosures_prior_5d",
                         "dart_unmapped_rows", "dart_ticker_mapping_complete",
                         "price_flow_proxy_ready", "full_sector_score", "live_selection_authorized", "availability_assumption"]
              csv_write(out / "research/sector_evidence_daily.csv", features, fields)
              latest = [r for r in features if r["date"] == collector.status["asof"]]
              csv_write(out / "research/sector_evidence_latest.csv", latest, fields)
              collector.mark("sector_features", "EXPLORATORY", rows=len(features),
                            latest_price_flow_proxy_ready=sum(r["price_flow_proxy_ready"] for r in latest),
                            full_score="WITHHELD_UNKNOWN_CATALYST_ARCHIVE_AND_STRICT_PIT",
                            next_step="Compare winners/losers and same-period outperformers, then test entry/stop/two-pullback hypotheses out of sample.")
          
          
          def finalize(collector, mode):
              out, data = collector.out, collector.status["datasets"]
              base_ok = data.get("v14_replication", {}).get("status") == "VERIFIED"
              core_ok = all(data.get(k, {}).get("status") == "OK" for k in ("prices", "price_ohlc_integrity", "flows", "etf_prices", "holdings", "normalization"))
              features_ok = data.get("sector_features", {}).get("status") == "EXPLORATORY"
              ready = base_ok if mode == "baseline_only" else base_ok and core_ok and features_ok
              state = "BASELINE_VERIFIED" if mode == "baseline_only" and ready else "EVIDENCE_PARTIAL_CATALYST_PIT_PENDING" if ready else "DATA_PENDING"
              collector.status.update({"mode": mode, "overall_status": state, "completed_at": stamp(),
                                       "full_backtest_ready": False, "orders_enabled": False,
                                       "production_strategy_changed": False})
              collector.save()
              rows = [f"| {name} | {v['status']} | {v.get('error_code', '')} |" for name, v in data.items()]
              notes = [
                  "# v18 자료 수집 결과", "", f"상태: **{state}**", "",
