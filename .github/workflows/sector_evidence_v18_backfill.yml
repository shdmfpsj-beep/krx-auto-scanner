                              if page > 500:
                                  raise EvidenceError("DART_PAGINATION_LIMIT")
                              time.sleep(float(self.config["request_pause_seconds"]))
                              params = {"crtfc_key": key, "bgn_de": window.strftime("%Y%m%d"), "end_de": asof.strftime("%Y%m%d"),
                                        "corp_cls": market, "last_reprt_at": "N", "page_count": 100,
                                        "page_no": page, "sort": "date", "sort_mth": "asc"}
                              payload = http_json("https://opendart.fss.or.kr/api/list.json?" + urlencode(params),
                                                  retries=int(self.config["request_retries"]), diagnostics=request)
                              if not isinstance(payload, dict) or not isinstance(payload.get("status"), str) or not re.fullmatch(r"[0-9]{3}", payload["status"]):
                                  raise EvidenceError("DART_RESPONSE_SCHEMA_ERROR")
                              api_status = request["api_status"] = payload["status"]
                              request["api_reason"] = DART_STATUS_REASONS.get(api_status, "UNKNOWN_API_STATUS")
                              if api_status not in ("000", "013"):
                                  global_failure = api_status in ("010", "011", "012", "020", "800", "901")
                                  raise EvidenceError(f"DART_API_{api_status}_{request['api_reason']}")
                              diagnostics["successful_api_response_received"] = True
                              if api_status == "013":
                                  if page != 1:
                                      raise EvidenceError("DART_INCOMPLETE_PAGINATION")
                                  request["result"] = "NO_DATA"
                                  stop_market = True
                              else:
                                  try:
                                      returned_pages = int(payload["total_page"])
                                      items = payload["list"]
                                      if returned_pages < page or not isinstance(items, list):
                                          raise ValueError
                                      if "page_no" in payload and int(payload["page_no"]) != page:
                                          raise ValueError
                                  except (KeyError, TypeError, ValueError):
                                      raise EvidenceError("DART_RESPONSE_SCHEMA_ERROR") from None
                                  if page > 1 and returned_pages != pages:
                                      raise EvidenceError("DART_PAGINATION_CHANGED")
                                  pages = returned_pages
                                  if not items:
                                      raise EvidenceError("DART_EMPTY_SUCCESS_PAGE")
                                  request["returned_rows"] = len(items)
                                  row_errors = Counter()
                                  for row_number, r in enumerate(items, start=1):
                                      try:
                                          parsed = dart_disclosure(r, window, asof, key)
                                          rows[parsed["receipt_no"]] = parsed
                                          request["accepted_rows"] += 1
                                          if parsed["ticker_mapping_status"] != "MAPPED":
                                              request["unmapped_rows"] += 1
                                              row_issues.append(dart_row_issue(r, market, page, row_number, key))
                                      except (KeyError, TypeError, ValueError, EvidenceError) as e:
                                          code = str(e) if isinstance(e, EvidenceError) else "DART_ROW_SCHEMA_ERROR"
                                          row_errors[code] += 1
                                          row_issues.append(dart_row_issue(r, market, page, row_number, key, code))
                                  request["rejected_rows"] = sum(row_errors.values())
                                  request["row_error_counts"] = dict(row_errors)
                                  if row_errors:
                                      market_complete = complete = False
                                      request["error_code"] = "DART_INVALID_ROWS"
                                  else:
                                      request["result"] = "OK_WITH_UNMAPPED" if request["unmapped_rows"] else "OK"
                              market_state["pages_completed"] += 1
                              market_state["unmapped_rows"] += request["unmapped_rows"]
                              market_state["rejected_rows"] += request["rejected_rows"]
                          except Exception as e:
                              request["error_code"] = str(e) if isinstance(e, EvidenceError) and re.fullmatch(r"[A-Z0-9_]+", str(e)) else "UNEXPECTED_DART_FAILURE"
                              global_failure = global_failure or request["http_status"] in (401, 403)
                              market_complete = complete = False
                              stop_market = True
                          diagnostics["requests"].append(request)
                          persist()
                          if request["error_code"] or page == 1:
                              print("DART_DIAGNOSTIC=" + json.dumps({k: request[k] for k in DART_REQUEST_FIELDS}, ensure_ascii=False), flush=True)
                          if stop_market:
                              break
                          page += 1
                      market_state["status"] = "COMPLETE_WITH_UNMAPPED" if market_complete and market_state["unmapped_rows"] else "COMPLETE" if market_complete else "DATA_PENDING"
                      persist()
                  diagnostics["api_pagination_complete"] = complete
                  diagnostics["ticker_mapping_complete"] = complete and not any(r["ticker_mapping_status"] != "MAPPED" for r in rows.values())
                  persist()
                  failed = [r for r in diagnostics["requests"] if r["error_code"]]
                  last = failed[-1] if failed else diagnostics["requests"][-1] if diagnostics["requests"] else {}
                  state = "DATE_ONLY_COMPLETE_WITH_UNMAPPED" if complete and diagnostics["unmapped_rows"] else "DATE_ONLY_COMPLETE" if complete else "DATA_PENDING"
                  print("DART_COVERAGE=" + json.dumps({"status": state, "rows": len(rows), "mapped_rows": diagnostics["mapped_rows"],
                        "unmapped_rows": diagnostics["unmapped_rows"], "api_pagination_complete": complete,
                        "ticker_mapping_complete": diagnostics["ticker_mapping_complete"]}), flush=True)
                  self.mark("dart", state, rows=len(rows), mapped_rows=diagnostics["mapped_rows"], unmapped_rows=diagnostics["unmapped_rows"],
                            api_pagination_complete=complete, ticker_mapping_complete=diagnostics["ticker_mapping_complete"],
                            rejected_rows=sum(r["rejected_rows"] for r in diagnostics["requests"]),
                            diagnostics_file=diagnostic_path, error_code=last.get("error_code", ""),
                            http_status=last.get("http_status", ""), api_status=last.get("api_status", ""),
                            successful_api_response_received=diagnostics["successful_api_response_received"],
                            exact_publication_time="UNAVAILABLE", amendments="original_and_amended_reports_retained",
                            intraday_use="same_date_disclosures_are_ineligible_without_exact_timestamp")
          
          
          def complete_flow_sum(flow, tk, dates, investor):
              values = [flow.get((tk, d, investor)) for d in dates]
              if not values or any(v is None for v in values):
                  return None
              return sum(values)
          
          
          def snapshot_before(holdings, sector_id, decision_date, max_age):
              eligible = [d for sid, d in holdings if sid == sector_id and d < decision_date]
              if not eligible:
                  return None, []
              newest = max(eligible)
              if (date.fromisoformat(decision_date) - date.fromisoformat(newest)).days > max_age:
                  return None, []
              return newest, holdings[(sector_id, newest)]
          
          
          def assemble_market(collector):
              out = collector.out
              price_map, flow_map = defaultdict(dict), {}
              quality, universe, duplicates = [], [], []
              for p in sorted((out / "market/daily_prices").glob("*/*.csv")):
                  market = p.parent.name
                  for r in read_csv(p):
                      tk, d = ticker_code(r["ticker"]), r["Date"]
                      if d in price_map[tk]:
                          duplicates.append({"ticker": tk, "Date": d, "code": "MULTIPLE_MARKETS_SAME_TICKER_DATE"})
                          price_map[tk].pop(d, None)
                          continue
                      price_map[tk][d] = r
                      universe.append({"date": d, "ticker": tk, "market": market,
                                       "instrument_type": "UNVERIFIED", "source": "KRX_dated_market_price_response"})
              csv_write(out / "market/universe_dated.csv", universe, ["date", "ticker", "market", "instrument_type", "source"])
              series = {}
              for tk, by_date in price_map.items():
                  rows = [r for _, r in sorted(by_date.items())]
                  bars, issues = price_quality(rows)
                  for issue in issues:
                      quality.append({"ticker": tk, **issue})
                  if not issues:
                      series[tk] = {b["date"]: b for b in bars}
                  # Raw source is preserved in daily_prices; normalized files retain source prices, no repair.
                  csv_write(out / f"market/prices/{tk}.csv", rows, PRICE_FIELDS)
              csv_write(out / "diagnostics/price_quality.csv", quality + duplicates, ["ticker", "Date", "code", "row"])
              flow_conflicts = set()
              for p in sorted((out / "market/daily_flows").glob("*/*.csv")):
                  for r in read_csv(p):
                      k = (r["ticker"], r["date"], r["investor"])
                      if k in flow_map:
                          flow_conflicts.add(k)
                          continue
                      flow_map[k] = numeric(r["net_buy_krw"])
              for k in flow_conflicts:
                  flow_map.pop(k, None)
              csv_write(out / "diagnostics/flow_conflicts.csv", ({"ticker": k[0], "date": k[1], "investor": k[2]} for k in sorted(flow_conflicts)),
                        ["ticker", "date", "investor"])
              counts = {"tickers": len(price_map), "quality_issue_rows": len(quality),
                        "duplicate_price_rows": len(duplicates), "flow_conflicts": len(flow_conflicts),
                        "usable_for_features": len(series), "price_rows": len(universe), "flow_rows": len(flow_map)}
              json_write(out / "diagnostics/market_coverage.json", counts)
              normalization_ok = bool(series and flow_map) and not duplicates and not flow_conflicts
              error_code = "NO_USABLE_MARKET_PRICES_OR_FLOWS" if not series or not flow_map else "CONFLICTING_MARKET_ROWS" if not normalization_ok else ""
              collector.mark("normalization", "OK" if normalization_ok else "DATA_PENDING", error_code=error_code, **counts)
              crosscheck = []
              for p in sorted((out / "baseline/prices").glob("*.csv")):
                  fresh = price_map.get(p.stem, {})
                  for r in read_csv(p):
                      d = r.get("Date", "")
                      if d not in fresh:
                          continue
                      try:
                          diffs = {k: numeric(fresh[d][k]) - numeric(r[k]) for k in PRICE_FIELDS[1:6]}
                          close_pct = (numeric(fresh[d]["Close"]) / numeric(r["Close"]) - 1) * 100
                          crosscheck.append({"ticker": p.stem, "Date": d,
                                             "baseline_close": r["Close"], "krx_close": fresh[d]["Close"],
                                             "close_difference_pct": round(close_pct, 6),
                                             "ohlcv_exact_match": all(abs(v) < 1e-6 for v in diffs.values()),
                                             "action": "NO_REPAIR_KEEP_SOURCES_SEPARATE"})
                      except (KeyError, ValueError, EvidenceError):
                          continue
              csv_write(out / "diagnostics/baseline_vs_krx_prices.csv", crosscheck,
                        ["ticker", "Date", "baseline_close", "krx_close", "close_difference_pct", "ohlcv_exact_match", "action"])
              return price_map, series, flow_map
          
          
          def build_features(collector, price_map, series, flow_map):
              out = collector.out
              sessions = [r["date"] for r in read_csv(out / "market/sessions.csv")]
              window = collector.status["analysis_window_start"]
              holdings = defaultdict(list)
              seen_holdings = set()
              for r in read_csv(out / "market/sector_membership_dated.csv"):
                  key = (r["sector_id"], r["snapshot_date"], r["ticker"])
                  if key in seen_holdings:
                      raise EvidenceError("DUPLICATE_MEMBERSHIP_ROW")
                  seen_holdings.add(key)
                  holdings[key[:2]].append(r)
              etfs = {}
              for p in (out / "market/etf_prices").glob("*.csv"):
                  bars, issues = price_quality(read_csv(p))
                  if not issues:
                      etfs[p.stem] = {b["date"]: b for b in bars}
              benchmark = etfs.get(collector.config["benchmark"], {})
              news_path, dart_path = out / "catalysts/news.csv", out / "catalysts/disclosures.csv"
              news = read_csv(news_path) if news_path.exists() else []
              dart = read_csv(dart_path) if dart_path.exists() else []
              news_state = collector.status["datasets"].get("news", {}).get("status", "NOT_COLLECTED")
              dart_state = collector.status["datasets"].get("dart", {}).get("status", "NOT_COLLECTED")
              features = []
              for i, d in enumerate(sessions):
                  if d < window or i < 20:
                      continue
                  dates5, dates20 = sessions[i - 4:i + 1], sessions[i - 19:i + 1]
                  for sector in collector.config["sectors"]:
                      sid, tk = sector["id"], sector["etf"]
                      snapshot, members = snapshot_before(holdings, sid, d, int(collector.config["maximum_membership_age_days"]))
                      codes = [m["ticker"] for m in members]
                      row = {"date": d, "sector_id": sid, "sector_name": sector["name"], "etf": tk,
                             "snapshot_date": snapshot or "", "stock_members": len(codes),
                             "membership_status": "PROVIDER_DATED_PROXY_NOT_STRICT_PIT" if snapshot else "UNMAPPED",
                             "money_scope": "ETF_stock_constituents_unweighted_net_buy_not_entire_industry",
                             "news_status": news_state, "dart_status": dart_state,
                             "full_sector_score": "", "live_selection_authorized": False,
                             "availability_assumption": d + "T18:10:00+09:00_not_historical_vintage_verified"}
                      ep = etfs.get(tk, {})
                      for n in (5, 20):
                          prev = sessions[i - n]
                          if d in ep and prev in ep and d in benchmark and prev in benchmark:
                              er = (ep[d]["close"] / ep[prev]["close"] - 1) * 100
                              br = (benchmark[d]["close"] / benchmark[prev]["close"] - 1) * 100
                              row[f"etf_return_{n}d_pct"] = round(er, 6)
                              row[f"benchmark_return_{n}d_pct"] = round(br, 6)
                              row[f"rs_{n}d_pp"] = round(er - br, 6)
                      broad = []
                      turnover = []
                      for member in codes:
                          sp = series.get(member, {})
                          if d in sp and sessions[i - 5] in sp and sp[d]["row_status"] == "OK":
                              broad.append(sp[d]["close"] > sp[sessions[i - 5]]["close"])
                          r = price_map.get(member, {}).get(d)
                          if r and r.get("TurnoverKRW", "") != "":
                              turnover.append(numeric(r["TurnoverKRW"]))
                      row["breadth_coverage"] = round(len(broad) / len(codes), 4) if codes else ""
                      sufficient = len(codes) >= 5 and len(broad) / len(codes) >= collector.config["minimum_member_coverage"]
                      row["breadth_up_5d_pct"] = round(100 * sum(broad) / len(broad), 4) if sufficient else ""
                      row["turnover_coverage"] = round(len(turnover) / len(codes), 4) if codes else ""
                      if codes and len(turnover) == len(codes):
                          row["member_turnover_krw"] = sum(turnover)
                          row["top3_turnover_share_pct"] = round(100 * sum(sorted(turnover, reverse=True)[:3]) / sum(turnover), 4) if sum(turnover) else ""
                      for investor, slug in (("외국인", "foreign"), ("기관합계", "institution"), ("개인", "individual")):
                          for n, dates in ((5, dates5), (20, dates20)):
                              sums = [complete_flow_sum(flow_map, member, dates, investor) for member in codes]
                              present = [v for v in sums if v is not None]
                              coverage = len(present) / len(codes) if codes else 0
                              row[f"{slug}_{n}d_coverage"] = round(coverage, 4) if codes else ""
                              row[f"{slug}_net_buy_{n}d_krw"] = sum(present) if codes and coverage == 1 else ""
                              row[f"{slug}_positive_members_{n}d_pct"] = round(100 * sum(v > 0 for v in present) / len(present), 4) if coverage == 1 and present else ""
                      row["price_flow_proxy_ready"] = bool(sufficient and row.get("rs_20d_pp") is not None
                          and row.get("foreign_20d_coverage") == 1 and row.get("institution_20d_coverage") == 1)
                      if news_state == "PARTIAL_SEARCH_ARCHIVE":
                          row["observed_news_mentions_5d"] = sum(r["sector_id"] == sid and dates5[0] <= r["published_at"][:10] <= d for r in news)
                      row["dart_unmapped_rows"] = collector.status["datasets"].get("dart", {}).get("unmapped_rows", 0)
                      row["dart_ticker_mapping_complete"] = dart_state == "DATE_ONLY_COMPLETE"
                      if dart_state in ("DATE_ONLY_COMPLETE", "DATE_ONLY_COMPLETE_WITH_UNMAPPED"):
                          # Same-date disclosures excluded: no publication minute is known.
                          # Counts include only mapped, observed receipts. Unmapped entities
                          # remain separate and cannot authorize a complete catalyst score.
                          row["observed_disclosures_prior_5d"] = sum(r["ticker"] in codes and dates5[0] <= r["receipt_date"] < d for r in dart)
                      features.append(row)
              fields = ["date", "sector_id", "sector_name", "etf", "snapshot_date", "stock_members",
                        "membership_status", "money_scope", "etf_return_5d_pct", "etf_return_20d_pct",
                        "benchmark_return_5d_pct", "benchmark_return_20d_pct", "rs_5d_pp", "rs_20d_pp",
                        "breadth_coverage", "breadth_up_5d_pct", "turnover_coverage", "member_turnover_krw",
                        "top3_turnover_share_pct"]
              for slug in ("foreign", "institution", "individual"):
                  for n in (5, 20):
                      fields += [f"{slug}_{n}d_coverage", f"{slug}_net_buy_{n}d_krw", f"{slug}_positive_members_{n}d_pct"]
              fields += ["news_status", "observed_news_mentions_5d", "dart_status", "observed_disclosures_prior_5d",
                         "dart_unmapped_rows", "dart_ticker_mapping_complete",
                         "price_flow_proxy_ready", "full_sector_score", "live_selection_authorized", "availability_assumption"]
              csv_write(out / "research/sector_evidence_daily.csv", features, fields)
              latest = [r for r in features if r["date"] == collector.status["asof"]]
              csv_write(out / "research/sector_evidence_latest.csv", latest, fields)
              collector.mark("sector_features", "EXPLORATORY", rows=len(features),
                            latest_price_flow_proxy_ready=sum(r["price_flow_proxy_ready"] for r in latest),
                            full_score="WITHHELD_UNKNOWN_CATALYST_ARCHIVE_AND_STRICT_PIT",
                            next_step="Compare winners/losers and same-period outperformers, then test entry/stop/two-pullback hypotheses out of sample.")
          
          
          def finalize(collector, mode):
              out, data = collector.out, collector.status["datasets"]
              base_ok = data.get("v14_replication", {}).get("status") == "VERIFIED"
              core_ok = all(data.get(k, {}).get("status") == "OK" for k in ("prices", "flows", "etf_prices", "holdings", "normalization"))
              features_ok = data.get("sector_features", {}).get("status") == "EXPLORATORY"
              ready = base_ok if mode == "baseline_only" else base_ok and core_ok and features_ok
              state = "BASELINE_VERIFIED" if mode == "baseline_only" and ready else "EVIDENCE_PARTIAL_CATALYST_PIT_PENDING" if ready else "DATA_PENDING"
              collector.status.update({"mode": mode, "overall_status": state, "completed_at": stamp(),
                                       "full_backtest_ready": False, "orders_enabled": False,
                                       "production_strategy_changed": False})
              collector.save()
              rows = [f"| {name} | {v['status']} | {v.get('error_code', '')} |" for name, v in data.items()]
              notes = [
                  "# v18 자료 수집 결과", "", f"상태: **{state}**", "",
