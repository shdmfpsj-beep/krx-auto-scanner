                  "- `diagnostics/dart_unmapped.csv`: 공시는 보존했지만 주식 종목코드가 없거나 형식이 맞지 않아 종목별 분석에 연결하지 않은 자료.",
                  "- `diagnostics/dart_rejected_rows.csv`: 접수번호·법인번호·날짜 등 필수 정보 검증에서 제외한 행의 원인과 허용된 공개 식별자.",
                  "- `diagnostics/v14_recent_two_months_replication.csv`: 같은 v14 실행의 가격으로 익절·손절 결과 재현 여부.",
                  "- `baseline/source_meta.json`: 원본 Actions 실행 번호·아티팩트 번호·해시.",
