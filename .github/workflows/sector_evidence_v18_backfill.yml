              def test_market_cache_rejects_changed_date_config_and_tampered_bytes(self):
                  with tempfile.TemporaryDirectory() as t:
                      root = Path(t)
                      v.json_write(root / "diagnostics/collection_status.json", {
                          "version": "18.0.3", "mode": "backfill", "asof": "2026-10-14", "price_start": "2025-08-20",
                          "datasets": {"prices": {"status": "OK"}, "flows": {"status": "OK"}}})
                      v.json_write(root / "runtime_source/config/sector_evidence_v18.json", CONFIG)
                      v.csv_write(root / "market/sessions.csv", [{"date": "2026-10-14"}], ["date"])
                      v.csv_write(root / "market/etf_prices/069500.csv", [], v.PRICE_FIELDS)
                      paths = sorted(p for p in root.rglob("*") if p.is_file())
                      v.csv_write(root / "checksums.csv", [{"path": p.relative_to(root).as_posix(), "bytes": p.stat().st_size,
                                                          "sha256": v.digest(p)} for p in paths], ["path", "bytes", "sha256"])
                      _, verified = v.validate_market_cache(root, CONFIG, "2026-10-14", "")
                      self.assertEqual(len(verified), 4)
                      with self.assertRaisesRegex(v.EvidenceError, "WINDOW_OR_SCHEMA_MISMATCH"):
                          v.validate_market_cache(root, CONFIG, "2026-10-13", "")
                      with self.assertRaisesRegex(v.EvidenceError, "WINDOW_OR_SCHEMA_MISMATCH"):
                          v.validate_market_cache(root, {**CONFIG, "investors": ["외국인"]}, "2026-10-14", "")
                      (root / "market/sessions.csv").write_text("tampered")
                      with self.assertRaisesRegex(v.EvidenceError, "CHECKSUM_MISMATCH"):
                          v.validate_market_cache(root, CONFIG, "2026-10-14", "")
          
              def test_baseline_full_cli_with_fake_github_artifacts(self):
                  with tempfile.TemporaryDirectory() as t:
                      root = Path(t)
                      blobs = root / "blobs"
                      blobs.mkdir()
                      price = "Date,Open,High,Low,Close,Volume\n2026-10-01,100,112,98,105,1000\n"
                      trades = []
                      bars = [bar(h=112, c=105, vol=1000)]
                      for mode in v.VARIANTS:
                          result = v.legacy_exit(bars, 0, 100, 95, mode)
                          trades.append({"ticker": "005930", "model": "HMA60_PULLBACK", "variant": mode,
                                         "signal_date": "2026-09-30", "entry_date": "2026-10-01", "entry_price": 100,
                                         "stop": 95, "status": result["status"], "exit_date": result.get("exit_date", ""),
                                         "exit_reason": result.get("exit_reason", ""), "days_held": result.get("days_held", ""),
                                         "net_return_pct": result.get("net_return_pct", "")})
                      buff = io.StringIO()
                      writer = csv.DictWriter(buff, fieldnames=list(trades[0]))
                      writer.writeheader()
                      writer.writerows(trades)
                      artifacts = []
                      for i, name in enumerate(v.REQUIRED_ARTIFACTS, start=1):
                          artifacts.append(artifact(name, 100, i))
                          with zipfile.ZipFile(blobs / f"{i}.zip", "w") as z:
                              if name == v.REPORT_NAME:
                                  z.writestr("reports/hma_v14/v14_audit.json", json.dumps({"asof": "2026-10-01", "hold_days": 60, "cost_bps": 35}))
                                  z.writestr("reports/hma_v14/v14_trades.csv", buff.getvalue())
                                  z.writestr("reports/hma_v14/v14_entries.csv", "ticker\n005930\n")
                                  z.writestr("reports/hma_v14/v14_daily_rolling_sectors.csv", "date\n2026-10-01\n")
                              elif name == "v14-manifest":
                                  z.writestr("manifest.csv", "ticker\n005930\n")
                              elif name == "v14-sector-prices":
                                  z.writestr("prices/069500.csv", price)
                              elif name == "v14-stock-shard-0":
                                  z.writestr("prices/005930.csv", price)
                              else:
                                  z.writestr("fetch_status.csv", "ticker,status\n")
                      (root / "artifacts.json").write_text(json.dumps({"artifacts": artifacts}))
                      fake = root / "gh"
                      fake.write_text("#!/usr/bin/env python3\nimport sys,os,pathlib\nr=pathlib.Path(os.environ['FAKE_GH_ROOT'])\ne=sys.argv[2]\nif e.endswith('/zip'):\n i=e.split('/')[-2];sys.stdout.buffer.write((r/'blobs'/f'{i}.zip').read_bytes())\nelse:sys.stdout.write((r/'artifacts.json').read_text())\n")
                      fake.chmod(0o755)
                      env = {**os.environ, "PATH": str(root) + os.pathsep + os.environ.get("PATH", ""), "FAKE_GH_ROOT": str(root)}
                      env.pop("GITHUB_STEP_SUMMARY", None)
                      offline_config = root / "offline_config.json"
                      offline_config.write_text(json.dumps({**CONFIG, "rss_feeds": []}), encoding="utf-8")
                      target = root / "output"
                      run = subprocess.run([sys.executable, str(ROOT / "scripts/collect_sector_evidence_v18.py"),
                                            "--mode", "baseline_only", "--repo", "fixture/repo", "--v14-run-id", "100",
                                            "--config", str(offline_config), "--outdir", str(target)], env=env, capture_output=True, text=True)
                      self.assertEqual(run.returncode, 0, run.stdout + run.stderr)
                      result = json.loads((target / "diagnostics/collection_status.json").read_text())
                      self.assertEqual(result["overall_status"], "BASELINE_VERIFIED")
                      self.assertFalse(result["orders_enabled"])
                      self.assertEqual(v.read_csv(target / "diagnostics/v14_replication.csv")[0]["replication"], "MATCH")
                      self.assertTrue((target / "checksums.csv").exists())
                      # The same recovered baseline must remain available after a blocked
                      # backfill; missing credentials must not trigger external API calls.
                      for name in ("KRX_ID", "KRX_PW", "DART_API_KEY", "OPENDART_API_KEY", "NAVER_CLIENT_ID", "NAVER_CLIENT_SECRET"):
                          env.pop(name, None)
                      backfill_target = root / "backfill_output"
                      blocked = subprocess.run([sys.executable, str(ROOT / "scripts/collect_sector_evidence_v18.py"),
                                                "--mode", "backfill", "--repo", "fixture/repo", "--v14-run-id", "100",
                                                "--asof", "2000-01-03", "--config", str(offline_config),
                                                "--outdir", str(backfill_target)], env=env, capture_output=True, text=True)
                      self.assertEqual(blocked.returncode, 2, blocked.stdout + blocked.stderr)
                      result = json.loads((backfill_target / "diagnostics/collection_status.json").read_text())
                      self.assertEqual(result["datasets"]["v14_replication"]["status"], "VERIFIED")
                      self.assertEqual(result["datasets"]["krx_preflight_or_collection"]["error_code"], "MISSING_KRX_ID_OR_KRX_PW")
                      self.assertEqual(result["datasets"]["normalization"]["status"], "DATA_PENDING")
                      self.assertFalse(result["orders_enabled"])
                      self.assertTrue((backfill_target / "diagnostics/dart_diagnostics.json").exists())
                      self.assertTrue((backfill_target / "README_RESULT_KO.md").exists())
                      self.assertEqual((target / "baseline/prices/005930.csv").read_text(), price)
          
          
