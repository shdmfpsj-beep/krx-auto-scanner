                  "자료가 DATA_PENDING이면 collection_status.json의 누락 원인을 먼저 확인합니다. 예전 v14 아티팩트가 만료됐다면 v14를 다시 실행해 새 원시 자료와 보고서를 함께 생성해야 합니다.", ""]
