      - name: Install pinned offline-test dependencies
        run: python -m pip install --disable-pip-version-check 'pandas==2.2.3' 'numpy==2.2.6'
      - name: Test provenance, dates, real flows and original exit behavior (offline fixtures)
        run: python -m unittest discover -s scripts -p 'test_sector_evidence_v18.py' -v
      - name: Check required KRX secrets before starting backfill
        shell: bash
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python - <<'PY_KRX_CHECK'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from collect_sector_evidence_v18 import credential_precheck
          config = json.loads(Path('config/sector_evidence_v18.json').read_text(encoding='utf-8'))
          raise SystemExit(0 if credential_precheck(config, 'reports/sector_evidence_v18') else 2)
          PY_KRX_CHECK
      - name: Install KRX collector dependencies for backfill
        run: python -m pip install --disable-pip-version-check -r requirements-v18.txt
      - name: Recover v14, collect KRX evidence and public RSS snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASOF: ${{ inputs.asof }}
          V14_RUN_ID: ${{ inputs.v14_run_id }}
          PRICE_START: ${{ inputs.price_start }}
          REUSE_PREVIOUS_MARKET: ${{ inputs.reuse_previous_market }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY_BACKFILL_START'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          configured = {
              'KRX_LOGIN': bool(os.environ.get('KRX_ID') and os.environ.get('KRX_PW')),
              'DART': bool(os.environ.get('DART_API_KEY', '').strip()),
          }
          version = json.loads(Path('config/sector_evidence_v18.json').read_text(encoding='utf-8'))['version']
          status = {
              'collector_version': version,
              'mode': 'backfill',
              'news_provider': 'publisher_rss',
              'news_api_keys_required': False,
              'started_at': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'requested_asof': os.environ.get('ASOF') or 'AUTO',
              'v14_run_id': os.environ.get('V14_RUN_ID'),
              'secrets_configured': configured,
              'authentication_success_verified': False,
              'note': 'Secret presence only; values are never written. Provider login is checked by collection.',
          }
          dest = Path('reports/sector_evidence_v18/diagnostics/backfill_start.json')
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')
          print('COLLECTOR_VERSION=' + version, flush=True)
          print('COLLECTION_MODE=backfill', flush=True)
          print('NEWS_PROVIDER=publisher_rss; API_KEYS_REQUIRED=False', flush=True)
          print('SECRET_PRESENCE=' + json.dumps(configured), flush=True)
          PY_BACKFILL_START
          python scripts/collect_sector_evidence_v18.py \
            --mode backfill --repo "$GITHUB_REPOSITORY" \
            --v14-run-id "$V14_RUN_ID" --asof "$ASOF" --price-start "$PRICE_START" \
            --reuse-previous-market "$REUSE_PREVIOUS_MARKET" \
            --config config/sector_evidence_v18.json \
            --outdir reports/sector_evidence_v18
      - name: Preserve complete raw evidence and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-evidence-v18-backfill-report
          path: reports/sector_evidence_v18/
          retention-days: 90
          if-no-files-found: warn
