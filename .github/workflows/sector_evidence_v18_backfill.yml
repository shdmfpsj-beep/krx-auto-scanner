            ],
            "sectors": [
              {"id":"SEMICON","etf":"091160","name":"반도체","query":"반도체 투자 수주","rss_terms":["반도체","HBM","DRAM","낸드","웨이퍼"]},
              {"id":"AUTO","etf":"091180","name":"자동차","query":"자동차 생산 수출","rss_terms":["자동차","완성차","전기차"]},
              {"id":"BANK","etf":"091170","name":"은행","query":"은행 금융 실적","rss_terms":["은행","금융지주"]},
              {"id":"SECURITIES","etf":"102970","name":"증권","query":"증권 거래대금 실적","rss_terms":["증권사","증권업","브로커리지"]},
              {"id":"HEALTH","etf":"266420","name":"헬스케어","query":"바이오 제약 임상","rss_terms":["바이오","제약","임상","의약품"]},
              {"id":"INSURANCE","etf":"140700","name":"보험","query":"보험 실적","rss_terms":["보험","손보","생보"]},
