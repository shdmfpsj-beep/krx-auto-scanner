              {"id":"ENERGY_CHEM","etf":"117460","name":"에너지화학","query":"에너지 화학 실적","rss_terms":["석유화학","정유","국제유가","원유"]},
              {"id":"STEEL","etf":"117680","name":"철강","query":"철강 수요 수출","rss_terms":["철강","제철","후판"]},
              {"id":"RENEWABLE","etf":"385510","name":"신재생에너지","query":"신재생에너지 수주","rss_terms":["신재생","태양광","풍력","수소"]},
              {"id":"SHIP","etf":"445150","name":"조선해운","query":"조선 해운 수주","rss_terms":["조선업","조선사","조선소","선박","해운"]},
              {"id":"ROBOT","etf":"445290","name":"로봇","query":"로봇 투자 수주","rss_terms":["로봇","휴머노이드"]},
              {"id":"BATTERY","etf":"305720","name":"2차전지","query":"2차전지 배터리 수주","rss_terms":["2차전지","이차전지","배터리","양극재","음극재"]},
              {"id":"POWER","etf":"487240","name":"전력설비","query":"전력설비 변압기 수주","rss_terms":["전력기기","전력설비","변압기","송전","배전"]},
              {"id":"DEFENSE","etf":"449450","name":"방산","query":"방산 수출 수주","rss_terms":["방산","방위산업","미사일","전투기"]}
            ]
          }
          V18_FILE_1_EOF
          cat > scripts/collect_sector_evidence_v18.py <<'V18_FILE_2_EOF'
          #!/usr/bin/env python3
          """Read-only evidence collection. No trading, live strategy edits, or fabricated data."""
          from __future__ import annotations
          
          import argparse
          import calendar
          import contextlib
          import csv
          import hashlib
          import html
          import importlib.metadata
          import io
          import json
          import math
          import os
          import re
          import shutil
          import stat
          import subprocess
          import sys
          import time
          import zipfile
          import xml.etree.ElementTree as ET
          from collections import Counter, defaultdict
          from datetime import date, datetime, timedelta, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlencode, urlparse
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo
          
          import pandas as pd
          
          VERSION = "18.0.4"
          KST = ZoneInfo("Asia/Seoul")
          PRICE_FIELDS = ["Date", "Open", "High", "Low", "Close", "Volume", "TurnoverKRW"]
          REPORT_NAME = "hma-v14-rolling-entry-report"
          RAW_NAMES = tuple(f"v14-stock-shard-{i}" for i in range(6))
          REQUIRED_ARTIFACTS = (REPORT_NAME, "v14-manifest", "v14-sector-prices", *RAW_NAMES)
          VARIANTS = ("A_10_ALL", "B_10_HALF_20_TRAIL", "C_TRAIL_ONLY")
          FLOW_FIELDS = ["date", "market", "ticker", "name", "investor", "buy_krw", "sell_krw",
                         "net_buy_krw", "unit", "source", "collected_at", "availability_assumption"]
          HOLD_FIELDS = ["sector_id", "etf", "snapshot_date", "ticker", "weight_pct", "name",
                         "collected_at", "source", "point_in_time_status", "collected_at_basis"]
          NEWS_FIELDS = ["sector_id", "query", "title", "url", "naver_url", "publisher_host",
                         "published_at", "timestamp_basis", "collected_at", "historical_coverage"]
          RSS_FIELDS = ["title", "url", "publisher_host", "published_at", "timestamp_basis",
                        "collected_at", "source_feed_ids", "historical_coverage",
                        "first_publish_verified", "historical_feature_use_allowed", "source_pubdate"]
          RSS_SECTOR_FIELDS = ["sector_id", "matched_terms", "tag_basis", *RSS_FIELDS]
          DART_FIELDS = ["ticker", "source_stock_code", "ticker_mapping_status", "corp_code", "corp_name",
                         "report_name", "receipt_no", "receipt_date", "url", "published_precision", "collected_at", "source"]
          DART_STATUS_REASONS = {
              "000": "SUCCESS", "010": "UNREGISTERED_KEY", "011": "DISABLED_KEY",
              "012": "IP_NOT_ALLOWED", "013": "NO_DATA", "014": "FILE_NOT_FOUND",
              "020": "REQUEST_LIMIT_EXCEEDED", "021": "COMPANY_LIMIT_EXCEEDED",
              "100": "INVALID_FIELD", "101": "INVALID_ACCESS", "800": "SERVICE_MAINTENANCE",
              "900": "UNDEFINED_API_ERROR", "901": "EXPIRED_PERSONAL_INFORMATION_RETENTION",
          }
          DART_REQUEST_FIELDS = ["market", "page", "window_start", "asof", "attempts", "http_status",
                                 "api_status", "api_reason", "result", "error_code", "returned_rows",
                                 "accepted_rows", "unmapped_rows", "rejected_rows", "collected_at"]
          DART_ROW_ISSUE_FIELDS = ["market", "page", "row_number", "corp_code", "receipt_no",
                                   "source_stock_code", "ticker_mapping_status", "error_code"]
          
          
          class EvidenceError(Exception):
              """Only fixed, credential-free codes may be printed or written to reports."""
          
          
          def rss_payload(url):
              """Public publisher feeds only; no login, article crawling or credential headers."""
              parsed = urlparse(url)
              if (parsed.scheme != "https" or parsed.hostname not in ("www.hankyung.com", "www.mk.co.kr")
                      or parsed.username or parsed.password):
                  raise EvidenceError("RSS_FEED_URL_NOT_ALLOWED")
              request = Request(url, headers={"User-Agent": "SectorEvidence/" + VERSION,
                                             "Accept": "application/rss+xml, application/xml, text/xml"})
              for attempt in range(2):
                  try:
                      with urlopen(request, timeout=15) as response:
                          payload = response.read(2_000_001)
                      if len(payload) > 2_000_000:
                          raise EvidenceError("RSS_RESPONSE_TOO_LARGE")
                      return payload
                  except HTTPError as e:
                      code = "RSS_HTTP_" + str(e.code)
                      if e.code not in (429, 500, 502, 503, 504) or attempt:
                          raise EvidenceError(code) from None
                  except (URLError, TimeoutError, OSError):
                      if attempt:
                          raise EvidenceError("RSS_NETWORK_OR_TIMEOUT") from None
                  time.sleep(1)
          
          
          def rss_items(payload):
              # Reject entity declarations rather than expanding untrusted XML entities.
              if re.search(br"<!\s*(?:DOCTYPE|ENTITY)\b", payload, flags=re.I):
                  raise EvidenceError("RSS_XML_DECLARATION_REJECTED")
              try:
                  root = ET.fromstring(payload)
              except (ET.ParseError, ValueError):
                  raise EvidenceError("RSS_INVALID_XML") from None
              if root.tag != "rss" or root.find("channel") is None:
                  raise EvidenceError("RSS_SCHEMA_UNSUPPORTED")
              return root.findall("./channel/item")
          
          
          def rss_article(item, collected_at):
              title = html.unescape(re.sub(r"<[^>]*>", "", item.findtext("title") or "")).strip()
              url = (item.findtext("link") or "").strip()
              parsed = urlparse(url)
              if not title or parsed.scheme not in ("http", "https") or not parsed.hostname or parsed.username or parsed.password:
                  raise EvidenceError("RSS_INVALID_TITLE_OR_LINK")
              raw_date = (item.findtext("pubDate") or "").strip()
              try:
                  # MK reports an explicit +09:00 offset. email.utils expects +0900;
                  # removing this colon preserves the supplied instant and invents no zone.
                  normalized_date = re.sub(r"([+-][0-9]{2}):([0-9]{2})$", r"\1\2", raw_date)
                  dt = parsedate_to_datetime(normalized_date)
                  if dt.tzinfo is None:
                      raise ValueError
                  dt = dt.astimezone(KST)
                  observed = datetime.fromisoformat(collected_at)
                  if dt > observed:
                      raise EvidenceError("RSS_FUTURE_PUBLICATION_TIME")
              except (TypeError, ValueError, OverflowError):
                  raise EvidenceError("RSS_INVALID_PUBLICATION_TIME") from None
              return {"title": title, "url": url, "publisher_host": parsed.hostname,
                      "published_at": dt.isoformat(), "timestamp_basis": "RSS_reported_pubDate_not_first_publish_verified",
                      "source_pubdate": raw_date,
                      "collected_at": collected_at, "source_feed_ids": "",
                      "historical_coverage": "CURRENT_FEED_SNAPSHOT_NOT_HISTORICAL_ARCHIVE",
                      "first_publish_verified": False, "historical_feature_use_allowed": False}
          
          
          def rss_sector_tags(title, sectors):
              tags = []
              for sector in sectors:
                  matches = []
                  for term in sector.get("rss_terms", []):
                      if not isinstance(term, str) or not term:
                          continue
                      pattern = (r"(?<![A-Za-z0-9])" + re.escape(term) + r"(?![A-Za-z0-9])"
                                 if re.fullmatch(r"[A-Za-z0-9 ]+", term) else re.escape(term))
                      if re.search(pattern, title, flags=re.I):
                          matches.append(term)
                  if matches:
                      tags.append({"sector_id": sector["id"], "matched_terms": "|".join(matches),
                                   "tag_basis": "TITLE_KEYWORDS_EXPLORATORY_MULTIPLE_SECTORS_ALLOWED"})
              return tags
          
          
          def stamp():
              return datetime.now(timezone.utc).isoformat(timespec="seconds")
          
          
          def digest(path):
              h = hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          
          
          def json_write(path, value):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              tmp = p.with_suffix(p.suffix + ".tmp")
              tmp.write_text(json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False), encoding="utf-8")
              tmp.replace(p)
          
          
          def csv_write(path, rows, fields):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              with p.open("w", encoding="utf-8-sig", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  w.writeheader()
                  w.writerows(rows)
          
          
          def read_csv(path):
              with Path(path).open(encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))
          
          
          def numeric(v):
              x = float(str(v).replace(",", ""))
              if not math.isfinite(x):
                  raise EvidenceError("NONFINITE_NUMBER")
              return x
          
          
          def ticker_code(v):
              s = str(v).strip().upper()
              if re.fullmatch(r"[0-9]{1,6}", s):
                  return s.zfill(6)
              # KRX codes are strings: new ordinary shares and preferred shares can
              # contain letters (e.g. 0013V0, 00088K). Never cast or truncate them.
              if re.fullmatch(r"[0-9A-Z]{6}", s) and re.search(r"[0-9]", s):
                  return s
              raise EvidenceError("INVALID_TICKER_CODE")
          
          
          def dart_stock_code(value, key):
              source = "" if value is None else str(value).strip()
              if key and key in source:
                  return "[REDACTED_SECRET]", "", "INVALID_SOURCE_STOCK_CODE"
              if not source:
                  return "", "", "MISSING_STOCK_CODE"
              try:
                  return source, ticker_code(source), "MAPPED"
              except EvidenceError:
                  # Keep bounded public code values for diagnosis, never arbitrary text
                  # that could be a URL, credential or reflected error response.
                  safe_source = source if re.fullmatch(r"[A-Za-z0-9_. -]{1,20}", source) else "[INVALID_VALUE]"
                  return safe_source, "", "INVALID_SOURCE_STOCK_CODE"
          
          
          def dart_disclosure(row, window, asof, key):
              if not isinstance(row, dict):
                  raise EvidenceError("DART_ROW_SCHEMA_ERROR")
              receipt, corp = row.get("rcept_no"), row.get("corp_code")
              if not isinstance(receipt, str) or not re.fullmatch(r"[0-9]{14}", receipt):
                  raise EvidenceError("DART_INVALID_RECEIPT")
              if not isinstance(corp, str) or not re.fullmatch(r"[0-9]{8}", corp):
                  raise EvidenceError("DART_INVALID_CORP_CODE")
              try:
                  raw_date = row["rcept_dt"]
                  if not isinstance(raw_date, str) or not re.fullmatch(r"[0-9]{8}", raw_date):
                      raise ValueError
                  receipt_date = datetime.strptime(raw_date, "%Y%m%d").date()
              except (KeyError, TypeError, ValueError):
                  raise EvidenceError("DART_INVALID_RECEIPT_DATE") from None
              if not window <= receipt_date <= asof:
                  raise EvidenceError("DART_RECEIPT_OUTSIDE_WINDOW")
              if not all(isinstance(row.get(k), str) and row[k].strip() for k in ("corp_name", "report_nm")):
                  raise EvidenceError("DART_ROW_SCHEMA_ERROR")
              source_code, ticker, mapping = dart_stock_code(row.get("stock_code"), key)
              public_name = row["corp_name"].replace(key, "[REDACTED_SECRET]") if key else row["corp_name"]
              public_title = row["report_nm"].replace(key, "[REDACTED_SECRET]") if key else row["report_nm"]
              return {"ticker": ticker, "source_stock_code": source_code, "ticker_mapping_status": mapping,
                      "corp_code": corp, "corp_name": public_name, "report_name": public_title,
                      "receipt_no": receipt, "receipt_date": receipt_date.isoformat(),
                      "url": "https://dart.fss.or.kr/dsaf001/main.do?rcpNo=" + receipt,
                      "published_precision": "DAY_ONLY_no_intraday_time", "collected_at": stamp(), "source": "OPENDART_list"}
          
          
          def dart_row_issue(row, market, page, row_number, key, error_code=""):
              row = row if isinstance(row, dict) else {}
              source, _, mapping = dart_stock_code(row.get("stock_code"), key)
              def public_id(field, length):
                  value = row.get(field, "")
                  return value if isinstance(value, str) and re.fullmatch(r"[0-9]{" + str(length) + r"}", value) else ""
              return {"market": market, "page": page, "row_number": row_number,
                      "corp_code": public_id("corp_code", 8), "receipt_no": public_id("rcept_no", 14),
                      "source_stock_code": source, "ticker_mapping_status": mapping, "error_code": error_code}
          
          
          def month_shift(d, months):
              k = d.year * 12 + d.month - 1 + months
              y, m0 = divmod(k, 12)
              return date(y, m0 + 1, min(d.day, calendar.monthrange(y, m0 + 1)[1]))
          
          
          def completed_candidate(requested="", now=None):
              now = now or datetime.now(KST)
              if now.tzinfo is None:
                  raise EvidenceError("TIMEZONE_REQUIRED")
              now = now.astimezone(KST)
              cutoff = now.date() if (now.hour, now.minute) >= (18, 10) else now.date() - timedelta(days=1)
              candidate = date.fromisoformat(requested) if requested else cutoff
              if candidate > cutoff:
                  raise EvidenceError("ASOF_NOT_FINAL_AFTER_1810_KST")
              return candidate  # Holidays are resolved by returned benchmark sessions, never by weekdays alone.
          
          
          def weekly_snapshots(sessions, start):
              chosen = {}
              for d in sessions:
                  if d < start:
                      continue
                  chosen.setdefault(d.isocalendar()[:2], d)
              return sorted(chosen.values())
          
          
          def safe_extract(zip_path, destination):
              root = Path(destination).resolve()
              root.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(zip_path) as z:
                  if sum(i.file_size for i in z.infolist()) > 2_000_000_000:
                      raise EvidenceError("ZIP_UNCOMPRESSED_SIZE_LIMIT")
                  seen = set()
                  for i in z.infolist():
                      name = PurePosixPath(i.filename)
                      if (name.is_absolute() or ".." in name.parts or "\\" in i.filename
                              or ":" in i.filename or stat.S_ISLNK(i.external_attr >> 16)):
                          raise EvidenceError("UNSAFE_ARCHIVE_PATH")
                      if i.filename in seen:
                          raise EvidenceError("DUPLICATE_ARCHIVE_PATH")
                      seen.add(i.filename)
                      target = root.joinpath(*name.parts)
                      if not target.resolve().is_relative_to(root):
                          raise EvidenceError("UNSAFE_ARCHIVE_PATH")
                      if i.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(i) as src, target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)
          
          
          def active_by_name(artifacts):
              result = {}
              for a in artifacts:
                  if a.get("expired", True):
                      continue
                  old = result.get(a["name"])
                  if old is None or a["id"] > old["id"]:
                      result[a["name"]] = a
              return result
          
          
          def select_source_run(artifacts, explicit=""):
              groups = defaultdict(list)
              for a in artifacts:
                  run_id = str(a.get("workflow_run", {}).get("id", ""))
                  if run_id and not a.get("expired", True):
                      groups[run_id].append(a)
              if explicit:
                  if not explicit.isdigit():
                      raise EvidenceError("INVALID_V14_RUN_ID")
                  group = groups.get(explicit, [])
                  if not set(REQUIRED_ARTIFACTS).issubset(active_by_name(group)):
                      raise EvidenceError("SAME_RUN_V14_ARTIFACTS_MISSING_OR_EXPIRED")
                  return explicit, active_by_name(group)
              eligible = [(rid, active_by_name(group)) for rid, group in groups.items()
                          if set(REQUIRED_ARTIFACTS).issubset(active_by_name(group))]
              if not eligible:
                  raise EvidenceError("COMPLETE_V14_RUN_NOT_FOUND_RERUN_V14")
              return max(eligible, key=lambda p: (p[1][REPORT_NAME].get("created_at", ""),
                                                p[1][REPORT_NAME]["id"]))
          
          
          def gh_json(endpoint):
              r = subprocess.run(["gh", "api", endpoint], capture_output=True, timeout=90)
              if r.returncode:
                  raise EvidenceError("GITHUB_ARTIFACT_API_FAILED")
              return json.loads(r.stdout)
          
          
          def artifact_list(repo, explicit=""):
              endpoint = f"repos/{repo}/actions/" + (f"runs/{explicit}/artifacts" if explicit else "artifacts")
              items = []
              for page in range(1, 101):
                  chunk = gh_json(endpoint + f"?per_page=100&page={page}").get("artifacts", [])
                  # Run-specific endpoint may omit workflow_run. Explicit input supplies its verified run context.
                  if explicit:
                      for a in chunk:
                          a.setdefault("workflow_run", {})["id"] = int(explicit)
                  items.extend(chunk)
                  if len(chunk) < 100:
                      return items
              raise EvidenceError("ARTIFACT_PAGE_LIMIT_USE_EXPLICIT_RUN_ID")
          
          
          def merge_raw_prices(roots, destination):
              destination = Path(destination)
              destination.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for root in roots:
                  for p in sorted(Path(root).rglob("*.csv")):
                      if "prices" not in p.parts or not re.fullmatch(r"[0-9]{6}", p.stem):
                          continue
                      sha = digest(p)
                      dst = destination / p.name
                      if p.stem in hashes and hashes[p.stem] != sha:
                          raise EvidenceError("CONFLICTING_SAME_RUN_PRICE_BYTES")
                      if dst.exists() and digest(dst) != sha:
                          raise EvidenceError("STALE_BASELINE_DESTINATION")
                      hashes[p.stem] = sha
                      shutil.copyfile(p, dst)
              if not hashes:
                  raise EvidenceError("EMPTY_BASELINE_PRICES")
              return hashes
          
          
          def recover_baseline(repo, explicit, out):
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
                  raise EvidenceError("INVALID_GITHUB_REPOSITORY")
              if explicit and not explicit.isdigit():
                  raise EvidenceError("INVALID_V14_RUN_ID")
              run_id, artifacts = select_source_run(artifact_list(repo, explicit), explicit)
              stage = out / "_v14_downloads"
              stage.mkdir(parents=True, exist_ok=True)
              records = []
              try:
                  for name in REQUIRED_ARTIFACTS:
                      a = artifacts[name]
                      target = stage / name
                      archive = stage / (name + ".zip")
                      with archive.open("wb") as f:
                          r = subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{a['id']}/zip"],
                                             stdout=f, stderr=subprocess.PIPE, timeout=300)
                      if r.returncode:
                          raise EvidenceError("GITHUB_ARTIFACT_DOWNLOAD_FAILED")
                      records.append({"name": name, "id": a["id"], "archive_sha256": digest(archive),
                                      "created_at": a.get("created_at"), "source_run_id": run_id})
                      safe_extract(archive, target)
                      archive.unlink()
                  baseline = out / "baseline"
                  shutil.copytree(stage / REPORT_NAME, baseline / "report", dirs_exist_ok=True)
                  shutil.copytree(stage / "v14-manifest", baseline / "manifest", dirs_exist_ok=True)
                  stocks = merge_raw_prices([stage / n for n in RAW_NAMES], baseline / "prices")
                  etfs = merge_raw_prices([stage / "v14-sector-prices"], baseline / "etf_prices")
                  audits = list((baseline / "report").rglob("v14_audit.json"))
                  if len(audits) != 1:
                      raise EvidenceError("V14_AUDIT_MISSING_OR_AMBIGUOUS")
                  report_dir = audits[0].parent
                  required = ("v14_entries.csv", "v14_trades.csv", "v14_daily_rolling_sectors.csv")
                  if any(not (report_dir / n).is_file() for n in required):
                      raise EvidenceError("INCOMPLETE_V14_REPORT")
                  audit = json.loads(audits[0].read_text(encoding="utf-8-sig"))
                  meta = {"repo": repo, "source_run_id": run_id,
                          "head_sha": artifacts[REPORT_NAME].get("workflow_run", {}).get("head_sha"),
                          "source_asof": audit["asof"], "collected_at": stamp(),
                          "raw_prices_same_run": True, "raw_stock_count": len(stocks),
                          "raw_etf_count": len(etfs), "price_sha256": stocks, "etf_sha256": etfs,
                          "report_audit_sha256": digest(audits[0]), "artifacts": records}
                  json_write(baseline / "source_meta.json", meta)
                  return meta, report_dir
              finally:
                  shutil.rmtree(stage, ignore_errors=True)
          
          
          def audit_daily_ohlc_session(rows):
              """Source diagnostics: outside-range closes may be mixed trading sessions.
              Do NOT infer a normal-session close, modify prices or certify its cause.
              """
              counts = {"checked": 0, "invalid": 0, "below_low": 0,
                        "above_high": 0, "other": 0, "nontrading": 0}
              for r in rows:
                  t = str(r.get("ticker", ""))
                  if not re.fullmatch(r"[0-9]{6}", t):
                      continue
                  try:
                      op, hi, lo, cl, vol = (numeric(r[k]) for k in
                                                ("Open","High","Low","Close","Volume"))
                  except (KeyError, TypeError, ValueError, EvidenceError):
                      continue
                  if op == hi == lo == 0 and cl > 0:
                      counts["nontrading"] += 1
                      continue
                  if cl <= 0:
                      continue
                  counts["checked"] += 1
                  if not (0 < lo <= min(op,cl) <= max(op,cl) <= hi and vol >= 0):
                      counts["invalid"] += 1
                      reason=("below_low" if cl < lo else
                              "above_high" if cl > hi else "other")
                      counts[reason] += 1
              counts["invalid_pct"] = round(100 * counts["invalid"] /
                                            max(counts["checked"],1),2)
              return counts

          def price_quality(rows):
              result, issues = [], []
              prev_date = ""
              prev_close = None
              for i, r in enumerate(rows):
                  try:
                      dt = str(r["Date"])
                      date.fromisoformat(dt)
                      o, h, l, c, v = (numeric(r[k]) for k in PRICE_FIELDS[1:6])
                      if dt <= prev_date:
                          raise EvidenceError("DUPLICATE_OR_UNSORTED_PRICE_DATE")
                      state = "OK"
                      if o == h == l == v == 0 and c > 0:
                          state = "NONTRADING"
                      elif min(o, h, l, c) <= 0 or v < 0 or h < max(o, c) or l > min(o, c) or h < l:
                          raise EvidenceError("INVALID_OHLCV")
                      if prev_close and abs(c / prev_close - 1) > .41:
                          issues.append({"Date": dt, "code": "CORPORATE_ACTION_REVIEW_REQUIRED"})
                      result.append({"date": dt, "open": o, "high": h, "low": l, "close": c,
                                     "volume": v, "row_status": state})
                      prev_date, prev_close = dt, c
                  except (KeyError, TypeError, ValueError, EvidenceError):
                      issues.append({"Date": r.get("Date", ""), "code": "INVALID_PRICE_ROW", "row": i + 1})
              return result, issues
          
          
          def legacy_exit(b, j, entry, stop, mode, max_hold=60, cost_bps=35):
              """Reproduce the project's existing v14 exit rules; do not optimize them here."""
              if mode not in VARIANTS:
                  raise EvidenceError("UNKNOWN_LEGACY_VARIANT")
              first, trades, trail = None, [], stop
              tp10, tp20 = entry * 1.10, entry * 1.20
              for k in range(j, min(j + max_hold, len(b))):
                  q = b[k]
                  o, h, l, c = (q[t] for t in ("open", "high", "low", "close"))
                  if mode == "C_TRAIL_ONLY" and k > j + 1:
                      trail = max(trail, min(x["low"] for x in b[max(j, k - 10):k]) * .99)
                  if mode == "B_10_HALF_20_TRAIL" and first is not None and k > j:
                      trail = max(trail, min(x["low"] for x in b[max(j, k - 5):k]) * .99)
                  exit_stop = stop if mode == "A_10_ALL" else trail
                  if (k > j and o <= exit_stop) or l <= exit_stop:
                      xp = min(o, exit_stop) if k > j else exit_stop
                      trades.append((1. if first is None else .5, xp,
                                     "STOP" if first is None else "TRAIL_STOP"))
                      break
                  if mode == "A_10_ALL" and h >= tp10:
                      trades.append((1., tp10, "TP10"))
                      break
                  if mode == "B_10_HALF_20_TRAIL":
                      if first is None and h >= tp10:
                          first = k
                          trades.append((.5, tp10, "TP10_HALF"))
                      if first is not None and h >= tp20:
                          trades.append((.5, tp20, "TP20"))
                          break
                  if k == j + max_hold - 1:
                      trades.append((.5 if first is not None else 1., c, "TIME_60"))
              if not trades:
                  return {"status": "CENSORED_NO_60_BARS"}
              if abs(sum(t[0] for t in trades) - 1) > 1e-8:
                  return {"status": "CENSORED_REMAINDER_OPEN"}
              gross = sum(w * (p / entry - 1) for w, p, _ in trades) * 100
              return {"status": "COMPLETE", "exit_date": q["date"],
                      "exit_reason": "+".join(t[2] for t in trades), "days_held": k - j + 1,
                      "gross_return_pct": round(gross, 4), "net_return_pct": round(gross - cost_bps / 100, 4)}
          
          
          def replay_baseline(out, report_dir, source_meta):
              audit = json.loads((report_dir / "v14_audit.json").read_text(encoding="utf-8-sig"))
              raw = {}
              for p in (out / "baseline/prices").glob("*.csv"):
                  rows = [r for r in read_csv(p) if r.get("Date", "") <= source_meta["source_asof"]]
                  bars, issues = price_quality(rows)
                  raw[p.stem] = (bars, issues)
              comparisons = []
              for original in read_csv(report_dir / "v14_trades.csv"):
                  tk = ticker_code(original["ticker"])
                  row = {"ticker": tk, "model": original["model"], "variant": original["variant"],
                         "signal_date": original["signal_date"], "entry_date": original["entry_date"],
                         "original_status": original["status"], "original_exit_date": original["exit_date"],
                         "original_exit_reason": original["exit_reason"],
                         "original_net_return_pct": original["net_return_pct"], "replication": "DATA_PENDING"}
                  bars, issues = raw.get(tk, ([], []))
                  idx = {b["date"]: i for i, b in enumerate(bars)}
                  j = idx.get(original["entry_date"])
                  if issues or any(b["row_status"] != "OK" for b in bars):
                      row["reason"] = "RAW_PRICE_QUALITY_REVIEW"
                  elif j is None:
                      row["reason"] = "ENTRY_DATE_NOT_FOUND"
                  elif abs(bars[j]["open"] - numeric(original["entry_price"])) > 1e-6:
                      row["reason"] = "ORIGINAL_ENTRY_OPEN_MISMATCH"
                  else:
                      reproduced = legacy_exit(bars, j, numeric(original["entry_price"]),
                                               numeric(original["stop"]), original["variant"],
                                               int(audit.get("hold_days", 60)), float(audit.get("cost_bps", 35)))
                      row.update({"replayed_" + k: v for k, v in reproduced.items()})
                      matches = reproduced["status"] == original["status"]
                      if reproduced["status"] == "COMPLETE":
                          matches = matches and all(str(reproduced[k]) == original[k]
                                                    for k in ("exit_date", "exit_reason", "days_held"))
                          matches = matches and abs(reproduced["net_return_pct"] - numeric(original["net_return_pct"])) <= .00011
                      row["replication"] = "MATCH" if matches else "MISMATCH"
                      row["reason"] = "" if matches else "ORIGINAL_RESULT_NOT_REPRODUCED"
                  comparisons.append(row)
              fields = ["ticker", "model", "variant", "signal_date", "entry_date", "replication", "reason",
                        "original_status", "replayed_status", "original_exit_date", "replayed_exit_date",
                        "original_exit_reason", "replayed_exit_reason", "original_net_return_pct",
                        "replayed_net_return_pct", "replayed_days_held", "replayed_gross_return_pct"]
              csv_write(out / "diagnostics/v14_replication.csv", comparisons, fields)
              cutoff = month_shift(date.fromisoformat(source_meta["source_asof"]), -2).isoformat()
              csv_write(out / "diagnostics/v14_recent_two_months_replication.csv",
                        [r for r in comparisons if r["entry_date"] >= cutoff], fields)
              counts = dict(Counter(r["replication"] for r in comparisons))
              result = {"rows": len(comparisons), "counts": counts, "recent_window_start": cutoff,
                        "status": "VERIFIED" if comparisons and counts.get("MATCH") == len(comparisons) else "DATA_PENDING"}
              json_write(out / "diagnostics/v14_replication_audit.json", result)
              return result
          
          
          def http_json(url, headers=None, retries=2, diagnostics=None):
              # Only status codes and fixed error labels may escape this function. Exception
              # text, request URLs, headers and response bodies can contain credentials.
              diagnostics = diagnostics if diagnostics is not None else {}
              for attempt in range(retries + 1):
                  diagnostics.update(attempts=attempt + 1, http_status="", error_code="")
                  try:
                      req = Request(url, headers={"User-Agent": "sector-evidence-v18", **(headers or {})})
                      with urlopen(req, timeout=40) as r:
                          diagnostics["http_status"] = int(r.getcode())
                          payload = r.read(20_000_001)
                      if len(payload) > 20_000_000:
                          raise EvidenceError("HTTP_RESPONSE_SIZE_LIMIT")
                      return json.loads(payload)
                  except EvidenceError as e:
                      diagnostics["error_code"] = str(e)
                      raise
                  except HTTPError as e:
                      code = int(e.code)
                      diagnostics.update(http_status=code, error_code=f"HTTP_{code}")
                      if code != 429 and code < 500:
                          raise EvidenceError(diagnostics["error_code"]) from None
                  except (json.JSONDecodeError, UnicodeDecodeError):
                      diagnostics["error_code"] = "HTTP_RESPONSE_NOT_JSON"
                      raise EvidenceError(diagnostics["error_code"]) from None
                  except (TimeoutError, URLError) as e:
                      diagnostics["error_code"] = "HTTP_TIMEOUT" if isinstance(e, TimeoutError) or isinstance(getattr(e, "reason", None), TimeoutError) else "HTTP_NETWORK_FAILED"
                  except Exception:
                      diagnostics["error_code"] = "HTTP_REQUEST_FAILED"
                  if attempt == retries:
                      raise EvidenceError(diagnostics["error_code"]) from None
                  time.sleep(1 + attempt)
          
          
          class Krx:
              def __init__(self, config):
                  if not os.environ.get("KRX_ID") or not os.environ.get("KRX_PW"):
                      raise EvidenceError("MISSING_KRX_ID_OR_KRX_PW")
                  import requests
                  from pykrx import stock
                  self.stock = stock
                  self.pause = float(config["request_pause_seconds"])
                  self.retries = int(config["request_retries"])
                  # The library does not expose a timeout on all public methods.
                  original = requests.sessions.Session.request
                  def bounded(session, *args, **kwargs):
                      kwargs.setdefault("timeout", (10, 35))
                      return original(session, *args, **kwargs)
                  requests.sessions.Session.request = bounded
                  for name in ("get_market_ohlcv", "get_market_net_purchases_of_equities",
                               "get_etf_ohlcv_by_date", "get_etf_portfolio_deposit_file"):
                      if not callable(getattr(stock, name, None)):
                          raise EvidenceError("PYKRX_API_SCHEMA_CHANGED")
          
              def call(self, name, *args, **kwargs):
                  for attempt in range(self.retries + 1):
                      time.sleep(self.pause)
                      try:
                          # Never emit dependency exception strings or API URL query strings.
                          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                              frame = getattr(self.stock, name)(*args, **kwargs)
                          if frame is None or frame.empty:
                              raise EvidenceError("KRX_EMPTY_RESPONSE")
                          return frame
                      except Exception:
                          if attempt == self.retries:
                              raise EvidenceError("KRX_CALL_FAILED_OR_EMPTY") from None
          
          
          def krx_prices(frame, dated=None):
              required = {"시가": "Open", "고가": "High", "저가": "Low", "종가": "Close", "거래량": "Volume"}
              if not set(required).issubset(frame.columns):
                  raise EvidenceError("KRX_PRICE_COLUMNS_CHANGED")
              result = []
              for idx, r in frame.iterrows():
                  row = {english: numeric(r[korean]) for korean, english in required.items()}
                  row["Date"] = dated.isoformat() if dated else pd.Timestamp(idx).date().isoformat()
                  # Missing provider turnover stays blank. Close*volume is NOT actual trading value.
                  row["TurnoverKRW"] = numeric(r["거래대금"]) if "거래대금" in frame.columns else ""
                  if dated:
                      row["ticker"] = ticker_code(idx)
                  result.append(row)
              return result
          
          
          def krx_flows(frame, d, market, investor, collected):
              needed = {"매수거래대금", "매도거래대금", "순매수거래대금"}
              if not needed.issubset(frame.columns):
