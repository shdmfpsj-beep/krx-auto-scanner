          def stage(collector, name, function):
              try:
                  return function()
              except Exception as e:
                  code = str(e) if isinstance(e, EvidenceError) and re.fullmatch(r"[A-Z0-9_]+", str(e)) else "UNEXPECTED_STAGE_FAILURE"
                  collector.mark(name, "DATA_PENDING", error_code=code)
                  return None
          
          
          def credential_precheck(config, outdir):
              present = {name: bool(os.environ.get(name, "").strip()) for name in ("KRX_ID", "KRX_PW")}
              missing = [name for name, configured in present.items() if not configured]
              diagnostic = {"version": VERSION, "provider": "KRX", "credential_presence": present,
                            "missing_secret_names": missing, "authentication_success_verified": False,
                            "news_provider": config.get("news_provider", "rss"), "news_api_keys_required": config.get("news_provider", "rss") != "rss",
                            "checked_at": stamp(), "status": "MISSING_REQUIRED_SECRETS" if missing else "PRESENCE_ONLY_NOT_LOGIN_VERIFIED"}
              json_write(Path(outdir) / "diagnostics/required_credentials.json", diagnostic)
              print("KRX_SECRET_PRESENCE=" + json.dumps(present), flush=True)
              print("NEWS_PROVIDER=" + str(config.get("news_provider", "rss")), flush=True)
              if missing:
                  c = Collector(outdir, config)
                  c.mark("krx_credentials", "DATA_PENDING", error_code="MISSING_KRX_ID_OR_KRX_PW",
                         missing_secret_names=missing,
                         next_action="Repository Settings > Secrets and variables > Actions > New repository secret")
                  finalize(c, "backfill")
                  print("ACTION_REQUIRED: add Repository secrets " + ", ".join(missing) + ". Naver and BigKinds API keys are not required.", flush=True)
              return not missing
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--mode", choices=["baseline_only", "backfill"], default="baseline_only")
              parser.add_argument("--repo", default=os.environ.get("GITHUB_REPOSITORY", "shdmfpsj-beep/krx-auto-scanner"))
              parser.add_argument("--v14-run-id", default="")
              parser.add_argument("--asof", default="")
              parser.add_argument("--price-start", default="")
              parser.add_argument("--reuse-previous-market", choices=("true", "false"), default="false")
              parser.add_argument("--config", default="config/sector_evidence_v18.json")
              parser.add_argument("--outdir", default="reports/sector_evidence_v18")
              args = parser.parse_args()
              config = json.loads(Path(args.config).read_text(encoding="utf-8"))
              c = Collector(args.outdir, config)
              source = stage(c, "v14_recovery", lambda: recover_baseline(args.repo, args.v14_run_id, c.out))
              if source:
                  meta, report_dir = source
                  c.status.update({"v14_source_run_id": meta["source_run_id"], "v14_source_asof": meta["source_asof"]})
                  c.mark("v14_recovery", "OK", source_run_id=meta["source_run_id"], raw_stock_count=meta["raw_stock_count"])
                  replay = stage(c, "v14_replication", lambda: replay_baseline(c.out, report_dir, meta))
                  if replay:
                      c.mark("v14_replication", replay.pop("status"), **replay)
              if args.mode == "backfill":
                  if args.reuse_previous_market == "true":
                      stage(c, "previous_market_cache", lambda: restore_previous_market(c, args))
                  stage(c, "krx_preflight_or_collection", lambda: c.market(args))
                  # Independent public metadata collection continues even when one primary source is blocked.
                  def catalyst_dates():
                      asof = date.fromisoformat(c.status["asof"]) if c.status.get("asof") else completed_candidate(args.asof)
                      return month_shift(asof, -2), asof
                  dates = stage(c, "catalyst_date_validation", catalyst_dates)
                  if dates:
                      stage(c, "news", lambda: c.news(*dates))
                      stage(c, "dart", lambda: c.dart(*dates))
                  assembled = stage(c, "normalization", lambda: assemble_market(c))
                  if assembled and c.status.get("analysis_window_start") and (c.out / "market/sector_membership_dated.csv").exists():
                      stage(c, "sector_features", lambda: build_features(c, *assembled))
              else:
                  for name in ("prices", "flows", "etf_prices", "holdings", "news", "dart"):
                      c.mark(name, "NOT_REQUESTED_BASELINE_ONLY")
              ready = finalize(c, args.mode)
              print(f"Result: {c.status['overall_status']}; orders_enabled=False", flush=True)
              return 0 if ready else 2
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          
