name: KRX Nov16 direct API proof (research only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Query KRX official KOSPI and KOSDAQ dated API
        run: |
          python scripts/c3_official_recheck_v19.py --date 2026-11-16 --outdir output/krx_nov16_direct
      - name: Validate authenticated responses and create explicit receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/krx_nov16_direct/c3_official_dated_recheck_v19.json')
          d=json.loads(p.read_text())
          ok=(d.get('requested_asof')=='2026-11-16'
              and d.get('official_target_authenticated') is True
              and d.get('official_target_rows',0)>=2000
              and set(d.get('raw_response_sha256',{}))=={'KOSPI','KOSDAQ'})
          receipt={'asof':'2026-11-16','status':'DIRECT_KRX_EOD_CAPTURED' if ok else 'HOLD_DIRECT_KRX_NOT_VERIFIED',
                   'source':'KRX_OPEN_API_DIRECT','official_market_rows':d.get('official_target_rows',0),
                   'response_sha256':d.get('raw_response_sha256',{}),
                   'official_target_status':d.get('official_target_status'),
                   'regular_session_1530_certified':False,'buy_approved':False,
                   'orders_enabled':False,'telegram_requests':0,'current_action':'CASH'}
          Path('output/krx_nov16_direct/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          if not ok: raise SystemExit('DIRECT_KRX_EOD_NOT_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krx-nov16-direct-proof
          path: output/krx_nov16_direct/*.json
          retention-days: 30
