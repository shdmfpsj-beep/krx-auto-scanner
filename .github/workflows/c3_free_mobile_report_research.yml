name: C3 free mobile report research (read-only)
on:
  workflow_dispatch:
  push:
    branches: [research/c3-intraday-watch-20261102]
    paths:
      - '.github/workflows/c3_free_mobile_report_research.yml'
      - 'scripts/c3_free_source_diagnostic_v1.py'
      - 'scripts/c3_free_mobile_report_v1.py'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/c3-intraday-watch-20261102
          sparse-checkout: |
            /scripts/c3_free_source_diagnostic_v1.py
            /scripts/c3_free_mobile_report_v1.py
          sparse-checkout-cone-mode: false
      - name: Read existing main paper ledger without modifying it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input output
          curl -fsSL --retry 2 --max-time 30 \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/reports/c3_paper/paper_ledger.json" \
            -o input/paper_ledger.json
          python scripts/c3_free_source_diagnostic_v1.py \
            --ledger input/paper_ledger.json --out output/source_diagnostic.json
          python scripts/c3_free_mobile_report_v1.py \
            --diagnostic output/source_diagnostic.json --out output/mobile_report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-free-mobile-report-research
          path: output/
          if-no-files-found: warn
          retention-days: 14
