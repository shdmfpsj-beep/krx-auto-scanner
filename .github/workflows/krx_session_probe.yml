name: KRX 15:45 vs 20:25 session price provenance (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/krx_session_probe.py'
      - 'scripts/test_krx_session_probe.py'
      - '.github/workflows/krx_session_probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/krx_session_probe.py'
      - 'scripts/test_krx_session_probe.py'
      - '.github/workflows/krx_session_probe.yml'
  workflow_dispatch:
    inputs:
      phase:
        required: true
        type: choice
        options: [regular, after]
  schedule:
    # 15:45 and 20:25 KST weekdays; actual capture times may be delayed.
    - cron: '45 6 * * 1-5'
    - cron: '25 11 * * 1-5'

permissions:
  actions: read
  contents: read

jobs:
  offline-regression:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/krx_session_probe.py
            /scripts/test_krx_session_probe.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check source and price consistency gates
        run: |
          python -m py_compile scripts/krx_session_probe.py scripts/test_krx_session_probe.py
          python -m unittest discover -s scripts -p test_krx_session_probe.py -v

  regular:
    if: (github.event_name == 'schedule' && github.event.schedule == '45 6 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.phase == 'regular')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/krx_session_probe.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public read-only market query dependency
        run: python -m pip install --disable-pip-version-check pykrx==1.2.9
      - name: Record actual capture timestamp and raw price snapshot
        run: |
          python scripts/krx_session_probe.py --mode capture --phase regular --out output/snapshot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krx-session-regular
          path: output/snapshot.json
          retention-days: 7

  after:
    if: (github.event_name == 'schedule' && github.event.schedule == '25 11 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.phase == 'after')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/krx_session_probe.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public read-only market query dependency
        run: python -m pip install --disable-pip-version-check pykrx==1.2.9
      - name: Fetch prior successful regular-phase artifact when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prior
          gh api "repos/$GH_REPO/actions/workflows/krx_session_probe.yml/runs?per_page=40" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .id' |
          while read -r id; do
            [[ "$id" == "$GITHUB_RUN_ID" ]] && continue
            if gh run download "$id" -R "$GH_REPO" -n krx-session-regular -D prior 2>/dev/null; then
              echo "FOUND_PREVIOUS_REGULAR_SNAPSHOT $id"
              break
            fi
          done
          [[ -f prior/snapshot.json ]] || echo "MISSING_REGULAR_SNAPSHOT"
      - name: Capture after-market data, compare only matching timestamps
        shell: bash
        run: |
          python scripts/krx_session_probe.py --mode capture --phase after --out output/after.json
          python scripts/krx_session_probe.py --mode compare \
            --regular prior/snapshot.json --after output/after.json \
            --out output/session_comparison.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/session_comparison.json").read_text())
          print("SESSION_DIAGNOSTIC",r["status"],r["blockers"])
          print("PAIRED_CHANGES",r["changed_close_count"],
                "UNCHANGED_HIGH_LOW",r["changed_close_unchanged_highlow_count"])
          assert r["decision"]=="CASH" and not r["price_correction_permitted"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krx-session-after-comparison
          path: |
            output/after.json
            output/session_comparison.json
          retention-days: 7
