name: C3 prospective research TOP2 and paper ledger
on:
  push:
    branches: [research/c3-ledger-integrity-audit-20261104]
    paths:
      - 'scripts/c3_*_v8.py'
      - 'scripts/c3_runtime_v9.py'
      - 'scripts/c3_runtime_v10.py'
      - 'scripts/c3_bootstrap_cache_v13.py'
      - 'scripts/c3_archive_keys_v13.py'
      - 'scripts/test_supply_private_archive_v11.py'
      - 'scripts/test_c3_runtime_v10.py'
      - 'scripts/test_c3_runtime_v9.py'
      - 'scripts/c3_eod_source_v9.py'
      - 'scripts/c3_supply_runtime_v12.py'
      - 'scripts/test_c3_supply_runtime_v12.py'
      - 'scripts/test_c3_eod_source_v9.py'
      - 'scripts/c3_free_provider_triangulation_v1.py'
      - 'scripts/test_c3_free_provider_triangulation_v1.py'
      - 'scripts/test_c3_forward_ledger_v8.py'
      - 'config/c3_forward_v8_*.json'
      - 'config/c3_runtime_v9_protocol.json'
      - 'reports/c3_work8_20261105/inputs.json'
      - '.github/workflows/c3_daily_research_v8.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      upstream_run_id:
        required: false
        type: string
        default: ''
      engine_ref:
        required: true
        type: string
      caller_mode:
        required: true
        type: string
    secrets:
      KRX_AUTH_KEY:
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-research-v8-prospective-only
  cancel-in-progress: false
jobs:
  validate-and-run:
    if: github.repository == 'shdmfpsj-beep/krx-auto-scanner' && (github.ref == 'refs/heads/research/c3-ledger-integrity-audit-20261104' || (github.ref == 'refs/heads/main' && inputs.caller_mode == 'approved_daily'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      state_sha: ${{ steps.context.outputs.state_sha }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: scripts
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.engine_ref || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate caller and load only the current research ledger
        id: context
        env:
          CALLER_MODE: ${{ inputs.caller_mode || 'research_direct' }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from c3_runtime_v9 import invocation,BRANCH
          root=Path('/tmp/c3-forward8/result');root.mkdir(parents=True,exist_ok=True)
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text());upstream=event.get('workflow_run');u=None
          if upstream:u={k:upstream.get(k) for k in ('id','name','head_branch','conclusion')};u['repository']=upstream.get('head_repository',{}).get('full_name')
          engine=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          audit=invocation(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_REF'],os.environ['GITHUB_EVENT_NAME'],os.environ['CALLER_MODE'],engine,u)
          subprocess.run(['git','fetch','origin',BRANCH],check=True)
          state=subprocess.check_output(['git','rev-parse','FETCH_HEAD'],text=True).strip()
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',state,'--','reports/c3_forward_v8'],text=True).splitlines()
          if paths:subprocess.run(['git','restore','--source='+state,'--worktree','--',*paths],check=True)
          audit['state_sha']=state;audit['caller_commit']=os.environ['GITHUB_SHA']
          (root/'invocation.json').write_text(json.dumps(audit,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('state_sha='+state+'\n')
          PY
      - name: Install the existing research dependencies
        run: pip install pandas==2.2.3 pykrx==1.2.9 'matplotlib>=3.8,<4' 'cryptography>=43,<47'
      - name: Preserve baseline regressions and validate source recovery and private receipts
        run: |
          mkdir -p /tmp/c3-forward8/result/validation
          python - <<'PY'
          import json,sys,unittest
          from pathlib import Path
          sys.path.insert(0,'scripts');loader=unittest.TestLoader()
          suites=[loader.discover('scripts',pattern=p) for p in ('test_c3_*.py','test_krx_official_eod_v65.py','test_hma60_first_pullback_v11.py','test_supply_private_archive_v11.py')]
          counts=[s.countTestCases() for s in suites]
          result=unittest.TextTestRunner(verbosity=1).run(unittest.TestSuite(suites))
          Path('/tmp/c3-forward8/result/validation/tests.json').write_text(json.dumps(dict(counts=counts,total=result.testsRun,failures=len(result.failures),errors=len(result.errors),skipped=len(result.skipped),new_integration_fixtures_are_synthetic=True)))
          assert counts[0]>=643 and counts[1:3]==[14,21] and counts[3]>=2 and result.testsRun>=680, 'PRESERVED_BASELINE_TESTS_MISSING'
          if not result.wasSuccessful():raise SystemExit(1)
          PY
      - name: Restore hash-pinned bootstrap from encrypted git or the original artifact
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          python - <<'PY'
          from c3_bootstrap_cache_v13 import restore,verify_storage
          from c3_supply_v11 import write
          restore('reports/c3_work8_20261105/inputs.json','/tmp/c3-forward8/inputs','reports/c3_forward_v8','/tmp/c3-forward8/result/validation/bootstrap.json')
          write('/tmp/c3-forward8/result/validation/private_storage.json',verify_storage('reports/c3_forward_v8',full='${{ inputs.caller_mode }}'!='approved_daily'))
          PY
      - name: Validate the actual upstream collection and quarantine adjusted close receipts
        env:
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id || github.event.workflow_run.id || '' }}
        run: |
          python scripts/c3_runtime_v10.py --upstream-run-id "$UPSTREAM_RUN_ID" --outdir /tmp/c3-forward8/result/source_ops --ledger reports/c3_forward_v8
          python - <<'PYCODE'
          import json,os
          from pathlib import Path
          root=Path('/tmp/c3-forward8/result');up=json.loads((root/'source_ops/upstream_validation.json').read_text())
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if os.environ['GITHUB_EVENT_NAME']=='workflow_run':assert str(event['workflow_run']['id'])==up['run_id'],'UPSTREAM_EVENT_AND_VALIDATION_MISMATCH'
          PYCODE
      - name: Read completed indices and recover whole sessions through qualified supply paths
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          python - <<'PY'
          import csv,json,os,shutil,subprocess,sys
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from c3_daily_research_v8 import collect_indices
          from c3_supply_runtime_v12 import collect_session,preserve,alternative_ready,LANE
          from c3_supply_v11 import completed_day,write
          from c3_forward_ledger_v8 import read_record
          from c3_runtime_v9 import collection_plan,already_current
          from c3_selection_scope_v5 import digest
          root=Path('/tmp/c3-forward8/result');today=datetime.now(ZoneInfo('Asia/Seoul')).date().isoformat();indices=root/'indices'
          try:collect_indices(indices,completed_day())
          except Exception as exc:
              shutil.copytree('reports/c3_work7_20261105/sources',indices,dirs_exist_ok=True)
              (indices/'collection_error.json').write_text(json.dumps(dict(status='INDEX_COLLECTION_FAILED_DATED_CACHE_ONLY',error_type=type(exc).__name__)))
          with (indices/'KOSPI_index.csv').open() as f:dates=[r['date'] for r in csv.DictReader(f)]
          existing={read_record(p)['asof'] for p in (Path('reports/c3_forward_v8')/LANE/'markets').glob('*.json.gz')}
          plan=collection_plan(datetime.now(ZoneInfo('Asia/Seoul')),dates,existing);target=plan['expected_completed_session']
          (root/'collection_plan.json').write_text(json.dumps(plan,indent=2)+'\n')
          old=Path('reports/c3_forward_v8/latest.json');previous=json.loads(old.read_text()) if old.exists() else None
          skip=already_current(previous,target,digest('scripts/c3_daily_research_v8.py'))
          audit=json.loads((root/'invocation.json').read_text());audit.update(expected_completed_session=target,duplicate_current_session_skipped=skip)
          (root/'invocation.json').write_text(json.dumps(audit,indent=2)+'\n')
          alternative_ready(target,root/'validation/cache_readiness.json')
          if not skip:
              for day in plan['requested_dates']:
                  prior=[d for d in dates if d<day]
                  if not prior:raise ValueError('PREVIOUS_OBSERVED_SESSION_REQUIRED')
                  folder=Path('/tmp/c3-forward8/private/fresh')/day
                  collect_session(day,'/tmp/c3-forward8/inputs/latest/requested-date-probe/2026-11-04',folder,prior[-1])
                  write(root/'supply'/(day+'.json'),preserve('reports/c3_forward_v8',folder,os.environ['GITHUB_RUN_ID']))
          (root/'skip_current.txt').write_text('1' if skip else '0')
          (root/'target_session.txt').write_text(target)
          (root/'runtime_day.txt').write_text(today)
          (root/'validated_commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
      - name: Connect current selection to immutable registration and post-entry observations
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          day=$(cat /tmp/c3-forward8/result/target_session.txt)
          if [ "$(cat /tmp/c3-forward8/result/skip_current.txt)" = 1 ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          from c3_runtime_v9 import checked_report
          from c3_forward_ledger_v8 import read_record
          root=Path('/tmp/c3-forward8/result');out=root/'current';out.mkdir(exist_ok=True)
          data=json.loads(Path('reports/c3_forward_v8/latest.json').read_text());context=json.loads((root/'invocation.json').read_text());context['run_id']=os.environ['GITHUB_RUN_ID']
          record=Path('reports/c3_forward_v8')/data.get('ledger_lane','')/'decisions'/(data['preview_price_asof']+'.json')
          frozen=read_record(record) if record.exists() else None
          data=checked_report(data,context,datetime.now(timezone.utc).isoformat(),frozen.get('decision_date') if frozen else None)
          if frozen:data['research_top2']=frozen['models']['B']  # Original dated bars for a fresh report, no decision mutation.
          (out/'latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          else
            python scripts/c3_daily_research_v8.py --panel /tmp/c3-forward8/inputs/panel/official_panel.csv.gz --audit /tmp/c3-forward8/inputs/panel/quality_audit.json --baseline /tmp/c3-forward8/inputs/latest/requested-date-probe/2026-11-04 --basic /tmp/c3-forward8/inputs/issuer/basic --scope reports/c3_work5_20261105/sources --indices /tmp/c3-forward8/result/indices --fresh "/tmp/c3-forward8/private/fresh/$day" --ledger reports/c3_forward_v8 --outdir /tmp/c3-forward8/result/current --run-id '${{ github.run_id }}' --invocation /tmp/c3-forward8/result/invocation.json
          fi
          python - <<'PYCODE'
          import json
          from pathlib import Path
          root=Path('/tmp/c3-forward8/result');p=root/'current/latest.json';j=json.loads(p.read_text())
          j['upstream_validation']=json.loads((root/'source_ops/upstream_validation.json').read_text());j['provisional_source']=json.loads((root/'source_ops/provisional_status.json').read_text())
          j['alternative_cache_readiness']=json.loads((root/'validation/cache_readiness.json').read_text())
          j['private_storage_audit']=json.loads((root/'validation/private_storage.json').read_text())
          j['bootstrap_input_sources']=json.loads((root/'validation/bootstrap.json').read_text())
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PYCODE
          python scripts/c3_forward_report_v8.py --latest /tmp/c3-forward8/result/current/latest.json --outdir /tmp/c3-forward8/result/mobile
          python - <<'PY'
          from pathlib import Path
          import shutil,json
          root=Path('/tmp/c3-forward8/result')
          j=json.loads((root/'current/latest.json').read_text())
          for r in j['research_top2']:r.pop('chart_bars',None)
          (root/'current/latest.json').write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          assert not j['orders_enabled'] and j['current_action']=='CASH'
          from c3_runtime_v9 import handoff
          summary=json.loads((root/'mobile/summary.json').read_text());audit=handoff(summary,(root/'mobile/mobile_report.md').read_text())
          (root/'report_handoff_audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          PY
      - name: Preserve immutable local evidence even when collection or registration fails
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source=Path('reports/c3_forward_v8');dest=Path('/tmp/c3-forward8/result/ledger')
          if source.exists():shutil.copytree(source,dest,dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-forward-v8-prospective-evidence
          path: /tmp/c3-forward8/result/
          retention-days: 90
          if-no-files-found: error
  preserve-research-only:
    needs: validate-and-run
    if: github.repository == 'shdmfpsj-beep/krx-auto-scanner' && (github.ref == 'refs/heads/research/c3-ledger-integrity-audit-20261104' || (github.ref == 'refs/heads/main' && inputs.caller_mode == 'approved_daily'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/c3-ledger-integrity-audit-20261104
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: c3-forward-v8-prospective-evidence
          path: /tmp/c3-forward8-validated
      - name: Preserve source records and derived report on the research branch only
        env:
          EXPECTED_HEAD: ${{ needs.validate-and-run.outputs.state_sha }}
        run: |
          python - <<'PY'
          import os,shutil,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_HEAD'],'RESEARCH_HEAD_CHANGED_RETRY_NO_FORCE'
          incoming=Path('/tmp/c3-forward8-validated');root=Path('reports/c3_forward_v8')
          for folder in ('markets','decisions','observations','corrections','provisional','lanes','bootstrap','key_envelopes'):
              for src in (incoming/'ledger'/folder).rglob('*'):
                  if not src.is_file():continue
                  dest=root/folder/src.relative_to(incoming/'ledger'/folder)
                  if dest.exists():assert dest.read_bytes()==src.read_bytes(),'IMMUTABLE_RECORD_WOULD_CHANGE'
                  else:dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dest)
          root.mkdir(parents=True,exist_ok=True);shutil.copyfile(incoming/'current/latest.json',root/'latest.json')
          shutil.copytree(incoming/'mobile',root/'mobile',dirs_exist_ok=True)
          shutil.copyfile(incoming/'collection_plan.json',root/'collection_plan.json')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/c3_forward_v8
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: preserve prospective C3 decision and paper status (NO ORDERS)'
          git push origin HEAD:refs/heads/research/c3-ledger-integrity-audit-20261104
