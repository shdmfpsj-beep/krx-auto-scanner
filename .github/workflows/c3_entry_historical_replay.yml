name: C3 TOP5 entry historical replay (research only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
    steps:
      - name: Historical 5 10 20 day comparison
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,datetime,urllib.request,urllib.parse,collections,statistics,math,time,random
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root=Path('output/c3_entry_replay');root.mkdir(parents=True,exist_ok=True)
          receipt={'schema':'C3_ENTRY_REPLAY_V1','status':'INCOMPLETE','research_only':True,'telegram_sent':False,'orders_enabled':False,'caveats':['KRX unadjusted daily prices; corporate actions not certified','Same-day OHLC fill order unknown: ambiguous stop/target counted stop first','Prior high R1 is an exploratory target, not independently validated resistance','Historical selection is technical-only; no PIT financial filter']}
          def num(x):
           try:
            v=float(str(x).replace(',',''))
            return v if math.isfinite(v) else None
           except:return None
          def fetch(day,ep):
           url='https://data-dbg.krx.co.kr/svc/apis/sto/'+ep+'?'+urllib.parse.urlencode({'basDd':day})
           req=urllib.request.Request(url,headers={'AUTH_KEY':os.environ['KRX_AUTH_KEY'],'Accept':'application/json'})
           with urllib.request.urlopen(req,timeout=30) as r:z=json.load(r)
           rows=z.get('OutBlock_1')
           if not isinstance(rows,list):raise ValueError('KRX_INVALID_'+day)
           return rows
          def geometry(a,mode):
           c=[v[0] for v in a];ma20=statistics.mean(c[-20:]);last=c[-1]
           tr=[max(a[j][1]-a[j][2],abs(a[j][1]-a[j-1][0]),abs(a[j][2]-a[j-1][0])) for j in range(1,60)]
           atr=statistics.mean(tr[-14:]);high=max(v[1] for v in a[-20:])
           if mode=='LEGACY_MA20':
            lo=round(ma20*.99);hi=round(ma20*1.02);stop=round(min(v[2] for v in a[-10:])*.995)
           else:
            piv=[a[j][2] for j in range(35,58) if all(a[j][2]<a[k][2] for k in (j-2,j-1,j+1,j+2))]
            near=[p for p in piv if ma20-1.5*atr<=p<=ma20+.5*atr]
            support=max(near) if near else None
            lo=round(max(support,ma20-.5*atr)) if support is not None else None
            hi=round(min(ma20+.25*atr,lo+.6*atr)) if lo is not None else None
            stop=round(support-.5*atr) if support is not None else None
           if lo is None or hi is None or stop is None or lo>=hi or stop>=lo:return None
           r1=round(high) if high>hi else None
           risk=(hi-stop)/hi;rr=(r1-hi)/(hi-stop) if r1 is not None else None
           if mode=='PIVOT_ATR' and not (.015<=risk<=.05 and rr is not None and rr>=2 and hi>=last-1.5*atr and lo<=last+.5*atr):return None
           if mode=='LEGACY_MA20' and not (risk>0 and r1 is not None):return None
           return {'lo':lo,'hi':hi,'stop':stop,'r1':r1,'risk_pct':round(risk*100,3),'rr':round(rr,3)}
          def evaluate(g,future,h):
           # Limit-order range; conservative fill at top of range when low touches it.
           f=future[:h];hit=next((i for i,v in enumerate(f) if v[2]<=g['hi'] and v[1]>=g['lo']),None)
           if hit is None:return {'filled':False}
           bars=f[hit:];entry=g['hi'];stop=g['stop'];r1=g['r1']
           mfe=max((v[1]-entry)/entry*100 for v in bars)
           mae=min((v[2]-entry)/entry*100 for v in bars)
           outcome='OPEN'
           for v in bars:
            if v[2]<=stop:outcome='STOP_FIRST';break
            if v[1]>=r1:outcome='R1_FIRST';break
           return {'filled':True,'mfe_pct':round(mfe,3),'mae_pct':round(mae,3),'outcome':outcome}
          try:
           if not os.environ.get('KRX_AUTH_KEY'):raise ValueError('KRX_AUTH_KEY_MISSING')
           now=datetime.datetime.now(ZoneInfo('Asia/Seoul'))
           target=now.date()-datetime.timedelta(days=1)
           while target.weekday()>4:target-=datetime.timedelta(days=1)
           days=[];raw=collections.defaultdict(dict)
           for offset in range(230):
            d=target-datetime.timedelta(days=offset)
            if d.weekday()>4:continue
            ds=d.strftime('%Y%m%d')
            ka=fetch(ds,'stk_bydd_trd');kb=fetch(ds,'ksq_bydd_trd')
            if not ka and not kb:continue
            if not ka or not kb:raise ValueError('PARTIAL_MARKET_'+ds)
            days.append(ds)
            for market,rows in [('KOSPI',ka),('KOSDAQ',kb)]:
             for r in rows:
              code=str(r.get('ISU_CD','')).strip()
              vals=[num(r.get(k)) for k in ('TDD_CLSPRC','TDD_HGPRC','TDD_LWPRC','ACC_TRDVOL','ACC_TRDVAL','TDD_OPNPRC')]
              if not code or any(v is None for v in vals) or min(vals[0],vals[1],vals[2],vals[5])<=0 or vals[3]<=0 or vals[4]<=0:continue
              raw[(market,code)][ds]=vals
            if len(days)>=125:break
            time.sleep(.1)
           days.sort()
           if len(days)<100:raise ValueError('INSUFFICIENT_HISTORY_'+str(len(days)))
           series={k:[v[d] if d in v else None for d in days] for k,v in raw.items()}
           records=[];cohorts=0
           for t in range(60,len(days)-20):
            eligible={}
            for k,a in series.items():
             hist=a[t-59:t+1]
             if None in hist:continue
             c=[v[0] for v in hist]
             eligible[k]=(hist,c[-1]/c[-21]-1)
            med={m:statistics.median([r for (market,_),(a,r) in eligible.items() if market==m]) for m in ('KOSPI','KOSDAQ') if sum(1 for market,_ in eligible if market==m)>=100}
            if len(med)<2:continue
            pool=[]
            for k,(a,r20) in eligible.items():
             c=[v[0] for v in a];last=c[-1]
             ma5=statistics.mean(c[-5:]);ma20=statistics.mean(c[-20:]);ma60=statistics.mean(c)
             rs=r20-med[k[0]];dist=last/ma20-1
             avgval=statistics.mean(v[4] for v in a[-20:])
             avgvol=statistics.mean(v[3] for v in a[-21:-1])
             if avgvol<=0:continue
             rvol=a[-1][3]/avgvol;low=min(v[2] for v in a[-10:]);risk=1-low/last
             high=max(v[1] for v in a[-20:]);rr=((high-last)/last)/risk if risk>0 else 0
             if not(avgval>=1e9 and ma5>=ma20>=ma60 and last>=ma20 and .02<=r20<=.35 and rs>0):continue
             if not(-.01<=dist<=.08 and .01<=risk<=.08 and .4<=rvol<=4 and rr>=1.5):continue
             score=round(40+min(rs*100,15)+min(r20*50,12)+max(0,12-abs(dist-.025)*150)+max(0,10-(risk-.02)*100)+min(max(rvol-.4,0)*3,6),2)
             pool.append((score,k,a))
            pool.sort(key=lambda z:(-z[0],z[1]))
            # Use the same top-five research cohort for both methods to avoid selection bias.
            for score,k,a in pool[:5]:
             future=series[k][t+1:t+21]
             if len(future)<20 or None in future:continue
             cohorts+=1
             for mode in ('LEGACY_MA20','PIVOT_ATR'):
              g=geometry(a,mode)
              for horizon in (5,10,20):
               result=evaluate(g,future,horizon) if g else {'filled':False}
               records.append({'date':days[t],'market':k[0],'code':k[1],'score':score,'mode':mode,'horizon':horizon,'qualified':g is not None,'geometry':g,'result':result})
           summaries=[]
           for mode in ('LEGACY_MA20','PIVOT_ATR'):
            for horizon in (5,10,20):
             rows=[r for r in records if r['mode']==mode and r['horizon']==horizon]
             valid=[r for r in rows if r['qualified']];filled=[r for r in valid if r['result']['filled']]
             summaries.append({'mode':mode,'horizon':horizon,'cohorts':len(rows),'qualified':len(valid),'filled':len(filled),
              'fill_rate_qualified_pct':round(100*len(filled)/len(valid),2) if valid else None,
              'fill_rate_all_pct':round(100*len(filled)/len(rows),2) if rows else None,
              'mean_mfe_pct':round(statistics.mean(r['result']['mfe_pct'] for r in filled),3) if filled else None,
              'mean_mae_pct':round(statistics.mean(r['result']['mae_pct'] for r in filled),3) if filled else None,
              'stop_first_pct':round(100*sum(r['result']['outcome']=='STOP_FIRST' for r in filled)/len(filled),2) if filled else None,
              'r1_first_pct':round(100*sum(r['result']['outcome']=='R1_FIRST' for r in filled)/len(filled),2) if filled else None})
           receipt.update({'status':'RESEARCH_COMPLETE','sessions':len(days),'start':days[0],'end':days[-1],'cohort_count':cohorts,'summary':summaries,'minimum_sample_warning':cohorts<30})
           (root/'replay_rows.json').write_text(json.dumps(records,ensure_ascii=False))
           print('C3_REPLAY_SUMMARY',json.dumps({'sessions':len(days),'cohorts':cohorts,'summary':summaries},ensure_ascii=False))
          except Exception as e:
           receipt['status']='RESEARCH_FAILED';receipt['error']=repr(e)
           print('C3_REPLAY_ERROR',repr(e))
           raise
          finally:
           (root/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-entry-replay-research
          path: output/c3_entry_replay/
          retention-days: 30
