name: C3 Nov11 amended CASH image after entry re-selection (EXPLICIT CORRECTION)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c3_nov11_corrected_cash_delivery_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: c3-nov11-one-time-corrected-cash-delivery
  cancel-in-progress: false
jobs:
  revised-photo-only:
    if: github.repository == 'shdmfpsj-beep/krx-auto-scanner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            /scripts/c3_nov11_corrected_cash_delivery_v1.py
            /scripts/c3_telegram_inputs.py
            /scripts/c3_telegram_notify.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install --disable-pip-version-check pillow requests
      - name: Validate completed exact Nov11 whole-market scan and official daily comparison
        run: |
          set -euo pipefail
          [[ "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/43121137444 --jq '.conclusion')" == "success" ]]
          [[ "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/43119600667 --jq '.conclusion')" == "success" ]]
          python -m py_compile scripts/c3_nov11_corrected_cash_delivery_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: c3-nov11-wholemarket-reselected-top2-research
          repository: shdmfpsj-beep/krx-auto-scanner
          run-id: 43121137444
          github-token: ${{ github.token }}
          path: scan_result
      - name: Send exactly one image-only user-requested amended CASH report
        run: |
          python scripts/c3_nov11_corrected_cash_delivery_v1.py \
            --summary scan_result/reselection_summary.json \
            --outdir correction_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-nov11-corrected-cash-delivery-receipt
          path: |
            correction_out/C3_20261111_CORRECTION_CASH.png
            correction_out/correction_delivery_status.json
          retention-days: 30
          if-no-files-found: warn
