name: C3 operating incident verification and approved manual dispatch
on:
  pull_request:
    paths:
      - 'scripts/c3_delivery_authorization.py'
      - 'scripts/c3_operating_recovery.py'
      - 'scripts/test_c3_operating_recovery.py'
      - 'scripts/c3_required_financial_validation.py'
      - 'scripts/c3_dart_note_reconciliation.py'
      - 'scripts/test_c3_dart_note_reconciliation.py'
      - '.github/workflows/c3_top5_daily_telegram.yml'
      - '.github/workflows/c3_operating_recovery.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/c3_delivery_authorization.py'
      - 'scripts/c3_operating_recovery.py'
      - 'scripts/test_c3_operating_recovery.py'
      - '.github/workflows/c3_operating_recovery.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-operating-incident-20261125
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            /scripts/*.py
            /.github/workflows/c3_top5_daily_telegram.yml
            /.github/workflows/c3_operating_recovery.yml
            /.github/workflows/c3_top5_dart_bridge_tests.yml
            /receipts/c3_top5_daily/
            /reports/c3_paper/paper_ledger.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the complete operating workflow with verified official actionlint
        run: |
          set -o pipefail
          mkdir -p output/c3_operating_recovery
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/c3-actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/c3-actionlint.tar.gz' | sha256sum -c -
          tar -xzf /tmp/c3-actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint --version > output/c3_operating_recovery/actionlint_version.txt
          /tmp/actionlint -shellcheck= -pyflakes= .github/workflows/c3_top5_daily_telegram.yml .github/workflows/c3_operating_recovery.yml .github/workflows/c3_top5_dart_bridge_tests.yml 2>&1 | tee output/c3_operating_recovery/actionlint.log
      - name: Read actual workflow state, schedule history, permissions and reservations
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python scripts/c3_operating_recovery.py
      - name: Install existing chart and calendar runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install pillow pandas==2.2.3 exchange-calendars==4.13.2 --disable-pip-version-check
      - name: Run all existing regressions and recovery authorization tests without sends
        run: |
          set -o pipefail
          PYTHONPATH=scripts python -m unittest -v test_c3_technical_preflight test_c3_operating_recovery test_c3_watch5_delivery test_c3_release_connection_check test_c3_approval_scope test_c3_dart_normalization test_c3_dart_note_reconciliation test_c3_operational_integration test_c3_balanced_financials test_c3_dart_document_evidence test_c3_top5_dart_bridge test_c3_top5_financial_selection test_c3_top5_pipeline test_dart_financial_screen test_dart_interim_periods test_c3_top5_session_policy test_c3_top5_eligibility_audit test_c3_top5_independent_price_evidence 2>&1 | tee output/c3_operating_recovery/regression.log
      - name: Requery actual required financial evidence using verified November 24 source
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY || secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import hashlib, os, urllib.request, urllib.error, zipfile
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          request=urllib.request.Request('https://api.github.com/repos/shdmfpsj-beep/krx-auto-scanner/actions/artifacts/14982160548/zip',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.build_opener(NoRedirect).open(request,timeout=30) as response:binary=response.read()
          except urllib.error.HTTPError as error:
              if error.code!=302:raise RuntimeError('SOURCE_ARTIFACT_HTTP_'+str(error.code)) from None
              location=error.headers['Location']
              if not location.startswith('https://'):raise ValueError('UNSAFE_ARTIFACT_REDIRECT')
              with urllib.request.urlopen(location,timeout=60) as response:binary=response.read()
          if hashlib.sha256(binary).hexdigest()!='fde8b82f94eb962abf9688dac666ad6ba7e906cc23c743af31995d39cad1c8df':
              raise ValueError('SOURCE_ARTIFACT_SHA_MISMATCH')
          archive=Path('/tmp/c3-required-source.zip');archive.write_bytes(binary)
          destination=Path('/tmp/c3-required-source')
          with zipfile.ZipFile(archive) as z:
              if any(Path(n).is_absolute() or '..' in Path(n).parts for n in z.namelist()):raise ValueError('UNSAFE_ARCHIVE_PATH')
              z.extractall(destination)
          print('VERIFIED_REAL_SOURCE_ARTIFACT',14982160548,hashlib.sha256(binary).hexdigest())
          PY
          PYTHONPATH=scripts python scripts/c3_required_financial_validation.py --live \
            --source /tmp/c3-required-source --out output/c3_operating_recovery/required_financial_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-operating-recovery-verification
          path: output/c3_operating_recovery/
          retention-days: 30
  dispatch:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'C3 approved operational recovery 20261125')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/c3_operating_recovery.py
            /scripts/c3_delivery_authorization.py
            /scripts/c3_top5_session_policy.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Enable only if disabled and dispatch the approved real main workflow once
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python scripts/c3_operating_recovery.py --dispatch --out output/c3_operating_dispatch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-operating-manual-dispatch
          path: output/c3_operating_dispatch/
          retention-days: 30
