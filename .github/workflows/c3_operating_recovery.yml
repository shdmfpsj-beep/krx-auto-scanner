name: C3 operating incident verification and approved manual dispatch
on:
  pull_request:
    paths:
      - 'scripts/c3_delivery_authorization.py'
      - 'scripts/c3_operating_recovery.py'
      - 'scripts/c3_balanced_financials.py'
      - 'scripts/test_c3_balanced_financials.py'
      - 'scripts/c3_schedule_guard.py'
      - 'scripts/test_c3_schedule_guard.py'
      - 'scripts/test_c3_operating_recovery.py'
      - 'scripts/c3_required_financial_validation.py'
      - 'scripts/c3_dart_note_reconciliation.py'
      - 'scripts/test_c3_dart_note_reconciliation.py'
      - '.github/workflows/c3_top5_daily_telegram.yml'
      - '.github/workflows/c3_operating_recovery.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/c3_delivery_authorization.py'
      - 'scripts/c3_operating_recovery.py'
      - 'scripts/c3_balanced_financials.py'
      - 'scripts/test_c3_balanced_financials.py'
      - 'scripts/c3_schedule_guard.py'
      - 'scripts/test_c3_schedule_guard.py'
      - 'scripts/test_c3_operating_recovery.py'
      - '.github/workflows/c3_operating_recovery.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-operating-incident-20261125
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            /scripts/*.py
            /.github/workflows/c3_top5_daily_telegram.yml
            /.github/workflows/c3_operating_recovery.yml
            /.github/workflows/c3_top5_dart_bridge_tests.yml
            /.github/workflows/c3_financial_policy_review.yml
            /receipts/c3_top5_daily/
            /reports/c3_paper/paper_ledger.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the complete operating workflow with verified official actionlint
        run: |
          set -o pipefail
          mkdir -p output/c3_operating_recovery
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/c3-actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/c3-actionlint.tar.gz' | sha256sum -c -
          tar -xzf /tmp/c3-actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint --version > output/c3_operating_recovery/actionlint_version.txt
          /tmp/actionlint -shellcheck= -pyflakes= .github/workflows/c3_top5_daily_telegram.yml .github/workflows/c3_operating_recovery.yml .github/workflows/c3_top5_dart_bridge_tests.yml 2>&1 | tee output/c3_operating_recovery/actionlint.log
      - name: Read actual workflow state, schedule history, permissions and reservations
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python scripts/c3_operating_recovery.py
      - name: Install existing chart and calendar runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install pillow pandas==2.2.3 exchange-calendars==4.13.2 --disable-pip-version-check
      - name: Inspect guarded recovery against real current-day records without dispatch or sends
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PYCODE'
          import json,os
          from pathlib import Path
          from c3_operating_recovery import GitHub
          from c3_schedule_guard import assess
          # Evaluate a hypothetical recovery check; this calls GET only.
          context=dict(os.environ,GITHUB_EVENT_NAME='schedule')
          result=assess(GitHub(os.environ['GH_TOKEN']),context,recover=True)
          evidence=dict(mode='READ_ONLY_RECOVERY_COMPARISON',actual_event=os.environ['GITHUB_EVENT_NAME'],
              dispatches=0,telegram_sends=0,result=result)
          Path('output/c3_operating_recovery/schedule_guard_readonly.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          print('C3_READ_ONLY_RECOVERY_EVIDENCE',json.dumps(evidence,ensure_ascii=False))
          PYCODE
      - name: Run all existing regressions and recovery authorization tests without sends
        run: |
          set -o pipefail
          PYTHONPATH=scripts python -m unittest -v test_c3_schedule_guard test_c3_independent_operation test_c3_financial_policy_comparison test_c3_official_attachment_review test_c3_technical_preflight test_c3_operating_recovery test_c3_watch5_delivery test_c3_release_connection_check test_c3_approval_scope test_c3_dart_normalization test_c3_dart_note_reconciliation test_c3_operational_integration test_c3_balanced_financials test_c3_dart_document_evidence test_c3_top5_dart_bridge test_c3_top5_financial_selection test_c3_top5_pipeline test_dart_financial_screen test_dart_interim_periods test_c3_top5_session_policy test_c3_top5_eligibility_audit test_c3_top5_independent_price_evidence 2>&1 | tee output/c3_operating_recovery/regression.log
      - name: Verify existing actual source and replay production without financial recollection or sends
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/14994912183/zip > /tmp/c3-release-source.zip
          python - <<'PYCODE'
          import hashlib,zipfile
          from pathlib import Path
          path=Path('/tmp/c3-release-source.zip')
          if hashlib.sha256(path.read_bytes()).hexdigest()!='1720ea8890e8cce336ece09c7be8c44501e4a3bcb5379e3f9ab888ca8ea34c89':
              raise ValueError('SOURCE_ARCHIVE_SHA_MISMATCH')
          with zipfile.ZipFile(path) as source:
              if any(Path(n).is_absolute() or '..' in Path(n).parts for n in source.namelist()):raise ValueError('SOURCE_ARCHIVE_PATH')
              source.extractall('/tmp/c3-release-source')
          PYCODE
          PYTHONPATH=scripts python scripts/c3_independent_release_validation.py \
            --source /tmp/c3-release-source --out output/c3_operating_recovery/production_replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-operating-recovery-verification
          path: output/c3_operating_recovery/
          retention-days: 30
  dispatch:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'C3 approved operational recovery 20261125') || startsWith(github.event.head_commit.message, 'C3 approved independent financial release 20261125') || startsWith(github.event.head_commit.message, 'C3 approved morning recovery 20261126'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/c3_operating_recovery.py
            /scripts/c3_delivery_authorization.py
            /scripts/c3_top5_session_policy.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing reference calendar for the current-session gate
        run: python -m pip install pandas==2.2.3 exchange-calendars==4.13.2 --disable-pip-version-check
      - name: Enable only if disabled and dispatch the approved real main workflow once
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python scripts/c3_operating_recovery.py --dispatch --out output/c3_operating_dispatch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-operating-manual-dispatch
          path: output/c3_operating_dispatch/
          retention-days: 30
