name: C3 Balanced Quality isolated validation (NO SEND)
on:
  pull_request:
    paths:
      - 'scripts/c3_balanced_*.py'
      - 'scripts/c3_entry_geometry.py'
      - 'scripts/c3_candidate_decisions.py'
      - 'scripts/test_c3_operational_integration.py'
      - 'scripts/test_c3_approval_scope.py'
      - 'scripts/test_c3_dart_normalization.py'
      - '.github/workflows/c3_top5_daily_telegram.yml'
      - 'scripts/test_c3_balanced_financials.py'
      - 'scripts/c3_top5_financial_selection.py'
      - 'scripts/c3_top5_dart_bridge.py'
      - 'scripts/dart_financial_screen.py'
      - 'scripts/c3_all_candidate_report.py'
      - 'scripts/c3_dart_document_evidence.py'
      - 'scripts/c3_dart_normalization.py'
      - 'scripts/test_c3_dart_document_evidence.py'
      - '.github/workflows/c3_balanced_quality_validation.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-balanced-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /scripts/*.py
            /.github/workflows/c3_top5_daily_telegram.yml
            /receipts/c3_top5_daily/
            /reports/c3_paper/paper_ledger.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 2
      - name: Detect executable changes and avoid repeating APIs for documentation
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os,subprocess
          before=os.environ.get('BEFORE_SHA','')
          execute=True;archive_only=False
          if before and subprocess.run(['git','cat-file','-e',before+'^{commit}'],capture_output=True).returncode!=0:
              # A shallow head checkout need not contain the PR base. Fetch the
              # exact public base before deciding whether collection changed.
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=True,capture_output=True)
          if before and subprocess.run(['git','cat-file','-e',before+'^{commit}'],capture_output=True).returncode==0:
              paths=subprocess.check_output(['git','diff','--name-only',before,'HEAD']).decode().splitlines()
              # WATCH delivery changes have their own full regression/artifact
              # execution workflow. Reuse the existing actual KRX evidence when
              # every financial/technical engine and existing workflow step is unchanged.
              import re
              delivery={'scripts/c3_watch5_delivery.py','scripts/c3_watch5_validation.py',
                        'scripts/test_c3_watch5_delivery.py','.github/workflows/c3_watch5_validation.yml'}
              def normalized(path,body):
                  if path.endswith('c3_top5_daily_telegram.yml'):
                      body=re.sub(r'^            scripts/c3_watch5_delivery.py\n','',body,flags=re.M)
                      body=re.sub(r'^      - name: Deliver separate WATCH5 observation images\n.*?(?=^      - name: |\Z)','',body,flags=re.M|re.S)
                  elif path.endswith('c3_balanced_quality_validation.yml'):
                      body=re.sub(r'^      - name: Detect executable changes and avoid repeating APIs for documentation\n.*?(?=^      - uses: actions/setup-python)','',body,flags=re.M|re.S)
                  return body
              # Connection-only changes reuse the pinned actual November 24 archive
              # in the mandatory independent-operation workflow. Financial metrics,
              # source collection and geometry remain byte-identical to main.
              connection={'scripts/c3_balanced_financials.py','scripts/test_c3_balanced_financials.py',
                  'scripts/c3_top5_financial_selection.py','scripts/c3_top5_dart_bridge.py',
                  'scripts/c3_candidate_decisions.py','scripts/c3_watch5_delivery.py',
                  'scripts/c3_review_delivery.py','scripts/c3_delivery_outcome.py',
                  'scripts/c3_delivery_authorization.py','scripts/c3_operating_recovery.py',
                  'scripts/c3_release_connection_check.py','scripts/c3_independent_release_validation.py',
                  'scripts/test_c3_independent_operation.py','scripts/c3_official_attachment_review.py',
                  'scripts/c3_financial_policy_comparison.py','scripts/test_c3_official_attachment_review.py',
                  'scripts/test_c3_financial_policy_comparison.py','.github/workflows/c3_financial_policy_review.yml',
                  '.github/workflows/c3_operating_recovery.yml','.github/workflows/c3_top5_daily_telegram.yml',
                  '.github/workflows/c3_balanced_quality_validation.yml'}
              archive_only=all(path in connection or path.startswith('docs/') for path in paths)
              if archive_only and 'scripts/c3_balanced_financials.py' in paths:
                  import ast
                  old_model=subprocess.check_output(['git','show',before+':scripts/c3_balanced_financials.py']).decode()
                  new_model=open('scripts/c3_balanced_financials.py').read()
                  def financial_math(body):
                      tree=ast.parse(body)
                      tree.body=[n for n in tree.body if not (isinstance(n,ast.ClassDef) and n.name=='UnsupportedReportingCurrency')]
                      for node in tree.body:
                          if isinstance(node,ast.FunctionDef) and node.name=='validate_payload':node.body=[ast.Pass()]
                          if isinstance(node,ast.FunctionDef) and node.name=='collect_balanced':
                              for part in ast.walk(node):
                                  if isinstance(part,ast.Try):
                                      part.handlers=[h for h in part.handlers if not (isinstance(h.type,ast.Name) and h.type.id=='UnsupportedReportingCurrency')]
                      return ast.dump(tree,include_attributes=False)
                  archive_only=financial_math(old_model)==financial_math(new_model)
              if archive_only:
                  # A collector change must still run the live-source CI path.
                  old=subprocess.check_output(['git','show',before+':.github/workflows/c3_top5_daily_telegram.yml']).decode()
                  # Compare the collection/calculation block up to financial screening.
                  current=open('.github/workflows/c3_top5_daily_telegram.yml').read()
                  # The actual original block is extracted by its executable name.
                  step=next((line.strip()[8:] for line in current.splitlines() if line.strip().startswith('- name: ') and 'Collect' in line and 'KRX' in line),None)
                  def block(text):
                      begin=text.index('      - name: '+step)
                      finish=text.find('\n      - name: ',begin+1)
                      return text[begin:finish if finish>=0 else len(text)]
                  archive_only=bool(step) and block(old)==block(current)
              execute=False
              for path in paths:
                  if path.startswith('docs/') or path in delivery:continue
                  if path in ('.github/workflows/c3_top5_daily_telegram.yml','.github/workflows/c3_balanced_quality_validation.yml'):
                      old=subprocess.run(['git','show',before+':'+path],capture_output=True,text=True)
                      current=subprocess.run(['git','show','HEAD:'+path],capture_output=True,text=True)
                      if old.returncode==current.returncode==0 and normalized(path,old.stdout)==normalized(path,current.stdout):continue
                  execute=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('execute='+str(execute).lower()+'\narchive_only='+str(archive_only).lower()+'\n')
          print('C3_EXECUTABLE_VALIDATION_REQUIRED',execute)
          PY
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.execute == 'true'
        with:
          python-version: '3.12'
      - name: Install existing chart runtime
        if: steps.changes.outputs.execute == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install pillow pandas==2.2.3 exchange-calendars==4.13.2 --disable-pip-version-check
      - name: Offline finance, technical regression and delivery boundary tests
        if: steps.changes.outputs.execute == 'true'
        run: |
          PYTHONPATH=scripts python -m unittest -v test_c3_approval_scope test_c3_dart_normalization test_c3_operational_integration test_c3_balanced_financials test_c3_dart_document_evidence test_c3_top5_dart_bridge test_c3_top5_financial_selection test_c3_top5_pipeline test_dart_financial_screen test_dart_interim_periods test_c3_top5_session_policy test_c3_top5_eligibility_audit test_c3_top5_independent_price_evidence
      - name: Retain synthetic Balanced TOP5 image and Telegram DRY_RUN proof
        if: steps.changes.outputs.execute == 'true'
        run: |
          PYTHONPATH=scripts python scripts/test_c3_operational_integration.py --write-positive-fixture output/c3_positive_fixture
      - name: Restore receipt-keyed financial snapshots
        if: steps.changes.outputs.execute == 'true' && steps.changes.outputs.archive_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/c3_balanced_cache
          key: c3-balanced-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            c3-balanced-pr-${{ github.event.pull_request.number }}-
      - name: Reuse verified KRX source artifact without another full-market collection
        if: steps.changes.outputs.execute == 'true' && steps.changes.outputs.archive_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/c3_prior_validation
          if gh api repos/${{ github.repository }}/actions/artifacts/14874774941/zip > output/c3_prior_validation.zip; then
            echo 'PREVIOUS_ARTIFACT_DOWNLOAD_COMPLETE'
          else
            rm -f output/c3_prior_validation.zip
            echo 'PREVIOUS_ARTIFACT_UNAVAILABLE_FRESH_SOURCE_REQUIRED'
          fi
          python - <<'PY'
          import hashlib,zipfile,shutil
          from pathlib import Path
          archive=Path('output/c3_prior_validation.zip')
          if not archive.is_file():
              raise SystemExit(0)
          expected='692d1732a7395989842f5b330167b6610921293df35096889bf7ecf18bac35a7'
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=expected:
              raise ValueError('PREVIOUS_SOURCE_ARTIFACT_HASH_MISMATCH')
          with zipfile.ZipFile(archive) as source:
              source.extractall('output/c3_prior_validation')
          print('VERIFIED_PRICE_ARTIFACT_REUSED',expected)
          PY
          gh api repos/${{ github.repository }}/actions/artifacts/14880042291/zip > output/recovery_seed_0.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14879546970/zip > output/recovery_seed_1.zip
          python - <<'PY'
          import hashlib,zipfile
          for i,expected in enumerate(('11edf8cd46d178d5c8700d386c772a74aa828e69f053d8fee7b5f0ef2bcf917b',
                                      '4526dd174f34c6746c9f5217795932495027afb0e590016c2543460f3a738f65')):
              path='output/recovery_seed_'+str(i)+'.zip'
              if hashlib.sha256(open(path,'rb').read()).hexdigest()!=expected:
                  raise ValueError('RECOVERY_SEED_ARTIFACT_HASH_MISMATCH')
              with zipfile.ZipFile(path) as z:
                  z.extractall('output/recovery_seed_'+str(i))
          PY
      - name: Recollect fixed 20261123 KRX full market and validate live OpenDART without send
        if: steps.changes.outputs.execute == 'true' && steps.changes.outputs.archive_only != 'true'
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY || secrets.DART_API_KEY }}
          C3_SOURCE_ARTIFACT_SHA256: '692d1732a7395989842f5b330167b6610921293df35096889bf7ecf18bac35a7'
          C3_SOURCE_RUN_ID: '45294238532'
        run: |
          PYTHONPATH=scripts python scripts/c3_balanced_validation.py --live --asof 20261123 --out output/c3_balanced_validation --cache output/c3_balanced_cache --operational-exit-codes
      - name: Investigate financial evidence only for executable pending candidates
        if: ${{ always() && steps.changes.outputs.execute == 'true' && steps.changes.outputs.archive_only != 'true' && hashFiles('output/c3_balanced_validation/financial_pool_gate.json') != '' }}
        env:
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY || secrets.DART_API_KEY }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,os
          from pathlib import Path
          from c3_balanced_source_probe import capture
          from c3_balanced_financials import SnapshotCache
          root=Path('output/c3_balanced_validation')
          financial=json.loads((root/'financial_pool_gate.json').read_text())
          selected=json.loads((root/'financial_selection_research.json').read_text())
          pending=set(selected.get('approval_required_codes',[])) & {
              code for code,status in selected.get('financial_verdicts',{}).items() if status in ('REVIEW_REQUIRED','ERROR')}
          if pending:
              partial={**financial,'researched':[r for r in financial.get('researched',[]) if r['ticker'] in pending],
                  'excluded':[r for r in financial.get('excluded',[]) if r['ticker'] in pending]}
              capture(partial,SnapshotCache('output/c3_balanced_cache'),root/'source_recovery',os.environ['DART_API_KEY'])
          else:
              print('NO_EXECUTABLE_PENDING_FINANCE_ADDITIONAL_PROBE_SKIPPED')
          PY
      - name: Preserve verified snapshots when financial review remains incomplete
        if: ${{ always() && steps.changes.outputs.execute == 'true' && steps.changes.outputs.archive_only != 'true' && hashFiles('output/c3_balanced_cache/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: output/c3_balanced_cache
          key: c3-balanced-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve evidence even on incomplete finance or API failure
        if: ${{ always() && steps.changes.outputs.execute == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: c3-balanced-quality-validation
          path: |
            output/c3_balanced_validation/
            output/c3_balanced_cache/
            output/c3_positive_fixture/
          if-no-files-found: warn
          retention-days: 30
