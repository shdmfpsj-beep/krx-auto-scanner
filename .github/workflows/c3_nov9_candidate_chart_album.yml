name: C3 November 9 candidate TOP2 chart album one-time
on:
  push:
    branches: [main]
    paths: ['.github/workflows/c3_nov9_candidate_chart_album.yml']
permissions:
  contents: write
concurrency:
  group: c3-nov9-candidate-chart-album
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_telegram_notify.py
            scripts/c3_telegram_inputs.py
            scripts/c3_classic_theme.py
            scripts/c3_report_context.py
            config/c3_company_context_verified.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install pillow requests pandas finance-datareader --disable-pip-version-check
      - name: Draw dated candidate chart cards from checked 11/9 report and verified historical bars; deliver at most once
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,os,math
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          from c3_telegram_inputs import GitHub
          from c3_telegram_notify import ReceiptStore,Telegram,validate_photos
          from c3_classic_theme import create_cards
          from c3_report_context import attach_context
          import FinanceDataReader as fdr
          gh=GitHub(os.environ['GH_TOKEN'])
          d=json.loads(gh.file('reports/c3_forward_v8/latest.json','research/c3-ledger-integrity-audit-20261104'))
          assert d['source_price_asof']=='2026-11-09' and d['data_quality_state']=='OFFICIAL_VERIFIED'
          assert d['source_quality_gate']['status']=='QUALITY_GATE_PASSED' and d['source_provider']=='KRX_OFFICIAL_EOD'
          assert d['research_top2_registered_for_source_session'] is False and d['new_registered_signals']==0
          assert d['current_action']=='CASH' and d['orders_enabled'] is False
          assert [(r['ticker'],r['name']) for r in d['research_top2']]==[('028050','삼성E&A'),('180640','한진칼')]
          bot=Telegram(os.environ['TELEGRAM_BOT_TOKEN'],os.environ['TELEGRAM_CHAT_ID'])
          store=ReceiptStore(gh);store.initialize()
          key='candidate-integrated-whitegold-20261109/2026-11-09-'+bot.fingerprint
          if store.exists(key):
              print('CANDIDATE_CHART_RESULT '+json.dumps({'status':'DUPLICATE_BLOCKED','send_attempts':0}));raise SystemExit(0)
          out=Path('/tmp/c3-nov9-candidate-charts');out.mkdir(exist_ok=True)
          fontpath='/usr/share/fonts/truetype/nanum/NanumGothic.ttf';boldpath='/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf'
          F=lambda n,b=False:ImageFont.truetype(boldpath if b else fontpath,n)
          for idx,r in enumerate(d['research_top2'],1):
              ticker=r['ticker']
              # FinanceDataReader supplies trading dates only; its prices are NOT chart inputs.
              import csv,io,time,requests,pandas as pd
              from concurrent.futures import ThreadPoolExecutor
              calendar=fdr.DataReader(ticker,'2026-07-01','2026-11-11')
              calendar=calendar.loc[calendar.index.strftime('%Y-%m-%d')<='2026-11-09'].copy()
              assert len(calendar)>=60, 'HISTORICAL_CALENDAR_INSUFFICIENT'
              days=list(calendar.index.strftime('%Y-%m-%d'))[-85:]
              def verified_daily_cache(day):
                  url='https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/master/data/listing/krx/'+day+'.csv'
                  for attempt in range(3):
                      try:
                          response=requests.get(url,timeout=20)
                          response.raise_for_status()
                          rows=list(csv.DictReader(io.StringIO(response.content.decode('utf-8-sig'))))
                          matches=[x for x in rows if x.get('Code')==ticker]
                          if len(matches)!=1:raise ValueError('CACHE_TICKER_NOT_UNIQUE_'+day)
                          row=matches[0]
                          if row.get('MarketId') not in ('STK','KSQ'):raise ValueError('CACHE_MARKET_INVALID_'+day)
                          vals={k:float(row[v]) for k,v in [('Open','Open'),('High','High'),('Low','Low'),('Close','Close'),('Volume','Volume'),('turnover_krw','Amount')]}
                          if not (0<vals['Low']<=min(vals['Open'],vals['Close'])<=max(vals['Open'],vals['Close'])<=vals['High'] and vals['Volume']>0):
                              return day,None
                          return day,vals
                      except (requests.RequestException,UnicodeError) as e:
                          if attempt==2:raise
                          time.sleep(attempt+1)
              with ThreadPoolExecutor(max_workers=8) as pool:
                  verified=list(pool.map(verified_daily_cache,days))
              invalid_days=[day for day,bar in verified if bar is None]
              print('CHART_EXCLUDED_INVALID_SESSIONS '+json.dumps({'ticker':ticker,'dates':invalid_days,'count':len(invalid_days)}),flush=True)
              assert len(invalid_days)<=3,'TOO_MANY_INVALID_KRX_MIRROR_SESSIONS'
              verified=[(day,bar) for day,bar in verified if bar is not None]
              df=pd.DataFrame([bar for _,bar in verified],index=pd.to_datetime([day for day,_ in verified])).tail(70)
              print('CHART_SOURCE_DIAGNOSTIC '+json.dumps({'ticker':ticker,'source':'FinanceData/fdr_krx_data_cache per-session KRX mirror CSV','rows':len(df),'first_date':str(df.index[0].date()),'last_date':str(df.index[-1].date()),'reference_close':r.get('reference_close'),'returned_close':float(df['Close'].iloc[-1])},ensure_ascii=False),flush=True)
              assert len(df)>=60, 'VERIFIED_KRX_MIRROR_BARS_INSUFFICIENT'
              assert str(df.index[-1].date())=='2026-11-09', 'KRX_MIRROR_LAST_DATE_MISMATCH'
              close=float(df['Close'].iloc[-1]);reference=float(r.get('reference_close',r['close']))
              assert close==reference,'KRX_MIRROR_REPORT_CLOSE_MISMATCH'
              assert (df['Low']<=df[['Open','Close']].min(axis=1)).all()
              assert (df['High']>=df[['Open','Close']].max(axis=1)).all()
              r['chart_bars']=[dict(date=day,open=float(row['Open']),high=float(row['High']),low=float(row['Low']),close=float(row['Close']),volume=int(row['Volume']),turnover_krw=float(row['turnover_krw']),price_basis='KRX_UNADJUSTED_AS_TRADED') for day,row in df.iterrows() for day in [day.strftime('%Y-%m-%d')]]
              r['chart_price_basis']='KRX_UNADJUSTED_AS_TRADED'
              r['chart_excluded_invalid_sessions']=invalid_days
          # Use the pre-existing, approved white/gold full report renderer.
          # Only as-of-safe curated context; no hindsight DART queries.
          d=attach_context(d,out,client=None)
          paths=create_cards(d,out)
          assert len(paths)==2 and all(p.name.endswith('_integrated.png') for p in paths)
          diagnostics=json.loads((out/'render_diagnostics.json').read_text())
          print('INTEGRATED_REPORT_DIAGNOSTICS '+json.dumps({'report_type':'CLASSIC_WHITE_GOLD','cards':len(paths),'render_audit':diagnostics.get('cards',diagnostics) if isinstance(diagnostics,dict) else diagnostics},ensure_ascii=False,default=str)[:2800],flush=True)
          hashes=validate_photos(paths);bot.verify_group()
          claim={'schema':'C3_CANDIDATE_INTEGRATED_WHITEGOLD_V1','source_date':'2026-11-09','status':'CLAIMED_BEFORE_SEND','card_sha256':hashes,'sender_run_id':os.environ.get('GITHUB_RUN_ID'),'orders_enabled':False,'automatic_resend_allowed':False}
          if not store.reserve(key,claim):
              print('CANDIDATE_CHART_RESULT '+json.dumps({'status':'DUPLICATE_BLOCKED','send_attempts':0}));raise SystemExit(0)
          try:result=dict(status='DELIVERED',**bot.send_album(paths))
          except Exception as e:result=dict(status='REVIEW_REQUIRED_NO_AUTOMATIC_RESEND',error_type=type(e).__name__)
          result.update(source_date='2026-11-09',send_attempts=1,sender_run_id=os.environ.get('GITHUB_RUN_ID'))
          try:store.finish(key,result)
          except Exception:result['receipt_write_status']='FAILED_CLAIM_REMAINS_NO_RESEND'
          print('CANDIDATE_CHART_RESULT '+json.dumps(result,ensure_ascii=False))
          if result['status']!='DELIVERED' or 'receipt_write_status' in result:raise SystemExit(1)
          PY
