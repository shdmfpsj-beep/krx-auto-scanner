name: Free v6.4 daily date-locked source audit and forward quarantine
on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * 1-5'
  push:
    branches: [main]
    paths: ['.github/workflows/source_provenance_v64_daily.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-v64-source-and-forward
  cancel-in-progress: false
jobs:
  date-paired-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/
          sparse-checkout-cone-mode: false
      - name: Resolve inventory, exact source day and archive hashes before reconciliation
        run: python scripts/c3_artifact_audit_v18.py --outdir /tmp/c3-v64-audit
      - name: Preserve explicit availability and exact resolved inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-v64-date-locked-audit-v18
          path: /tmp/c3-v64-audit/
          retention-days: 90
          if-no-files-found: error
