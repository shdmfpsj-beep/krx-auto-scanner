name: C3 November 2026 single monthly analysis
on:
  push:
    branches: [analysis/c3-monthly-202611-single-run]
    paths:
      - .github/workflows/c3_monthly_202611.yml
      - scripts/c3_monthly_202611.py
      - scripts/c3_monthly_xbrl.py
      - scripts/test_c3_monthly_202611.py
      - analysis/c3_monthly_202611_manifest.json
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-monthly-202611-single-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/c3_top5_daily_telegram.yml
            /scripts/c3_top5_financial_selection.py
            /scripts/c3_top5_dart_bridge.py
            /scripts/dart_financial_screen.py
            /scripts/dart_interim_periods.py
            /scripts/c3_top5_session_policy.py
            /scripts/c3_monthly_202611.py
            /scripts/c3_monthly_xbrl.py
            /scripts/test_c3_monthly_202611.py
            /analysis/c3_monthly_202611_manifest.json
            /analysis/c3_monthly_202611_actual_issued.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing free data dependencies
        run: python -m pip install pandas==2.2.3 exchange-calendars==4.13.2
      - name: Verify only monthly analysis input and execution assumptions
        env:
          PYTHONPATH: scripts
        run: python -m unittest scripts/test_c3_monthly_202611.py -v
      - name: Reuse original cohort sources without collecting a second market dataset
        uses: actions/download-artifact@v4
        with:
          name: c3-monthly-202611-single-analysis
          run-id: 44902323758
          github-token: ${{ github.token }}
          path: output/c3_monthly_202611
      - name: Run fixed 15-session analysis without orders or Telegram
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY || secrets.DART_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: python -u scripts/c3_monthly_202611.py --out output/c3_monthly_202611
      - name: Preserve source evidence and monthly CSV and Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-monthly-202611-single-analysis
          path: output/c3_monthly_202611
          retention-days: 30
          if-no-files-found: warn
