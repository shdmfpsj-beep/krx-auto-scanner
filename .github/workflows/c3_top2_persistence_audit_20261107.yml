name: C3 historical Nov5-Nov6 ranking persistence audit (NO SEND / NO REGISTER)
on:
  push:
    branches:
      - research/c3-top2-rank-persistence-20261107
    paths:
      - 'scripts/c3_top2_persistence_audit_20261107.py'
      - '.github/workflows/c3_top2_persistence_audit_20261107.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-two-day-rank-audit-20261107
  cancel-in-progress: false
jobs:
  research-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Pin existing C3 research engine and original prior classification
        uses: actions/checkout@v4
        with:
          ref: 077113ac2f5e93fecc4c47850b36e5eda2173e3d
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /config/
            /reports/c3_work8_20261105/inputs.json
            /reports/c3_work5_20261105/sources/
            /reports/c3_work7_20261105/sources/
          sparse-checkout-cone-mode: false
      - name: Check out the separate read-only audit code
        uses: actions/checkout@v4
        with:
          ref: research/c3-top2-rank-persistence-20261107
          path: audit
          persist-credentials: false
          sparse-checkout: |
            /scripts/c3_top2_persistence_audit_20261107.py
          sparse-checkout-cone-mode: false
      - name: Check out only the encrypted immutable research inputs
        uses: actions/checkout@v4
        with:
          ref: research/c3-ledger-integrity-audit-20261104
          path: state
          persist-credentials: false
          sparse-checkout: |
            /reports/c3_forward_v8/bootstrap/
            /reports/c3_forward_v8/lanes/krx_unadjusted_v12/markets/
            /reports/c3_forward_v8/lanes/krx_unadjusted_v12/decisions/
            /reports/c3_forward_v8/key_envelopes/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical research-only dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 'cryptography>=43,<47' requests pyyaml
      - name: Rebuild 11/5 and 11/6 top-10 from pinned encrypted source, compare to frozen B decisions and practical entries
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python audit/scripts/c3_top2_persistence_audit_20261107.py
      - name: Preserve only derived ranking comparison, no original licensed market panel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-historical-top2-persistence-1105-1106
          path: |
            /tmp/c3-rank-audit/c3_1105_1106_persistence_audit.json
          retention-days: 30
          if-no-files-found: warn
