name: HMA v1.4 Daily Rolling Sector and Entry Tournament

'on':
  workflow_dispatch:
    inputs:
      asof:
        description: 'Last FINISHED Korean trading day YYYY-MM-DD'
        required: true
        type: string
        default: '2026-10-13'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Work around unrelated malformed file paths in full repository checkout.
          sparse-checkout: |
            /scripts/bottom_upturn_v10.py
            /scripts/hma60_first_pullback_v11.py
            /scripts/hma_rotation_v13.py
            /scripts/hma_entry_tournament_v14.py
            /scripts/test_hma_entry_tournament_v14.py
            /config/v13_research_universe_2026_snapshot.csv
            /config/v13_sector_etfs.csv
            /config/v13_membership_pit.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test four technical entry hypotheses
        run: python -m unittest discover -s scripts -p 'test_hma_entry_tournament_v14.py' -v
      - name: Prepare stock cohort (2026 snapshot; NOT historical complete KRX)
        run: |
          python scripts/hma_rotation_v13.py prepare \
            --universe config/v13_research_universe_2026_snapshot.csv \
            --outdir work/v14
      - uses: actions/upload-artifact@v4
        with:
          name: v14-manifest
          path: work/v14/
          retention-days: 21
          if-no-files-found: error

  fetch_stocks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/bottom_upturn_v10.py
            /scripts/hma60_first_pullback_v11.py
            /scripts/hma_rotation_v13.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: v14-manifest
          path: work/v14
      - run: python -m pip install --disable-pip-version-check pandas 'yfinance>=0.2.40'
      - name: Download continuous historical stock OHLCV (6 shards)
        env:
          ASOF: ${{ inputs.asof }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          END=$(python -c 'from datetime import date,timedelta;import os;print((date.fromisoformat(os.environ["ASOF"])+timedelta(days=1)).isoformat())')
          python scripts/hma_rotation_v13.py fetch \
            --manifest work/v14/manifest.csv \
            --outdir work/stock-shard \
            --shard "$SHARD" --shards 6 \
            --start 2022-08-01 --end-exclusive "$END" --retries 2 --pause 0.7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-stock-shard-${{ matrix.shard }}
          path: work/stock-shard/
          retention-days: 21
          if-no-files-found: warn

  fetch_sectors:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/bottom_upturn_v10.py
            /scripts/hma60_first_pullback_v11.py
            /scripts/hma_rotation_v13.py
            /config/v13_sector_etfs.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas 'yfinance>=0.2.40'
      - name: Download sector ETF and benchmark histories
        env:
          ASOF: ${{ inputs.asof }}
        run: |
          set -euo pipefail
          END=$(python -c 'from datetime import date,timedelta;import os;print((date.fromisoformat(os.environ["ASOF"])+timedelta(days=1)).isoformat())')
          python scripts/hma_rotation_v13.py fetch-etfs \
            --sectors config/v13_sector_etfs.csv --outdir work/etf \
            --start 2022-08-01 --end-exclusive "$END" --retries 2 --pause 0.7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-sector-prices
          path: work/etf/
          retention-days: 21
          if-no-files-found: warn

  study:
    needs: [prepare, fetch_stocks, fetch_sectors]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/bottom_upturn_v10.py
            /scripts/hma60_first_pullback_v11.py
            /scripts/hma_rotation_v13.py
            /scripts/hma_entry_tournament_v14.py
            /config/v13_sector_etfs.csv
            /config/v13_membership_pit.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: v14-manifest
          path: work/v14
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: v14-stock-shard-*
          merge-multiple: true
          path: work/stocks
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: v14-sector-prices
          path: work/etf
      - name: Compare 4 first-pullback methods and DAILY sector rotation
        env:
          ASOF: ${{ inputs.asof }}
        run: |
          python scripts/hma_entry_tournament_v14.py \
            --manifest work/v14/manifest.csv \
            --prices work/stocks/prices \
            --etf-prices work/etf/prices \
            --sectors config/v13_sector_etfs.csv \
            --membership config/v13_membership_pit.csv \
            --asof "$ASOF" --max-hold 60 --cost-bps 35 \
            --outdir reports/hma_v14
      - name: Print coverage and data limitations
        if: always()
        run: |
          if [ -f reports/hma_v14/v14_audit.json ]; then
            python -c 'import json;print(json.dumps(json.load(open("reports/hma_v14/v14_audit.json")),ensure_ascii=False,indent=2))'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hma-v14-rolling-entry-report
          path: |
            reports/hma_v14/
            work/v14/manifest.csv
            work/v14/prepare_audit.json
            work/stocks/fetch_shard_*.csv
            work/etf/etf_fetch_status.csv
          retention-days: 21
          if-no-files-found: warn
      - name: Mark missing coverage honestly
        run: |
          python - <<'PY'
          import json
          a=json.load(open('reports/hma_v14/v14_audit.json'))
          if a['usable_tickers']<50 or a['sector_etfs_usable']<6:
              raise SystemExit('DATA_PENDING: insufficient stock or sector ETF coverage; inspect report artifact')
          print('Research only: 2026-selected sample, sector PIT mapping not verified, no confirmed net flows.')
          PY
