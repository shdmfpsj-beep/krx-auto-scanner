name: Official KRX 120-day historical research batch (CASH)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/official_krx_120d_replay.py'
      - 'scripts/test_official_krx_120d_replay.py'
      - '.github/workflows/official_krx_120d_replay.yml'
permissions:
  contents: read
jobs:
  history-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/official_krx_120d_replay.py
            /scripts/test_official_krx_120d_replay.py
            /scripts/krx_official_eod_v65.py
            /scripts/c3_three_entry_replay.py
            /scripts/forward_ledger_v63.py
            /scripts/source_consensus_v64.py
            /scripts/free_structural_v52.py
            /scripts/first_pullback_v55.py
            /scripts/entry_strategy_v58.py
            /scripts/shadow_five_day_v59.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Regression tests before source collection
        run: |
          python -m unittest discover -s scripts -p test_official_krx_120d_replay.py -v
          python -m unittest discover -s scripts -p test_c3_three_entry_replay.py -v
      - name: Request a capped batch of official historical dates
        run: |
          python - <<'PY'
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          import subprocess,sys
          d=datetime.now(ZoneInfo("Asia/Seoul")).date()-timedelta(days=1)
          while d.weekday()>=5:d-=timedelta(days=1)
          subprocess.run([sys.executable,"scripts/official_krx_120d_replay.py",
            "--end",d.isoformat(),"--sessions","160","--max-requests","12",
            "--collect","--root","output/official_history","--out","output/replay"],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-krx-120d-batch-research-only
          path: output/
          retention-days: 30
          if-no-files-found: warn
