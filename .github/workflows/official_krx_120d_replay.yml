name: Official KRX 120-day historical research batch (CASH)
on:
  workflow_dispatch:
  schedule:
    - cron: '10 1 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/official_krx_120d_replay.py'
      - 'scripts/test_official_krx_120d_replay.py'
      - 'scripts/c3_stored_history_diagnostics.py'
      - 'scripts/c3_entry_expiry_diagnostics.py'
      - 'scripts/test_c3_entry_expiry_diagnostics.py'
      - 'scripts/c3_selection_shadow_outcomes.py'
      - 'scripts/test_c3_selection_shadow_outcomes.py'
      - '.github/workflows/official_krx_120d_replay.yml'
permissions:
  contents: read
  actions: read
jobs:
  history-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      PYTHONPATH: scripts
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/official_krx_120d_replay.py
            /scripts/official_history_independent_audit.py
            /scripts/krx_holiday_reference_check.py
            /scripts/test_official_history_independent_audit.py
            /scripts/test_official_krx_120d_replay.py
            /scripts/test_c3_three_entry_replay.py
            /scripts/krx_official_eod_v65.py
            /scripts/c3_three_entry_replay.py
            /scripts/c3_stored_history_diagnostics.py
            /scripts/c3_entry_expiry_diagnostics.py
            /scripts/test_c3_entry_expiry_diagnostics.py
            /scripts/c3_selection_first_research.py
            /scripts/c3_selection_shadow_outcomes.py
            /scripts/test_c3_selection_shadow_outcomes.py
            /scripts/forward_ledger_v63.py
            /scripts/source_consensus_v64.py
            /scripts/free_structural_v52.py
            /scripts/first_pullback_v55.py
            /scripts/entry_strategy_v58.py
            /scripts/shadow_five_day_v59.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Regression tests before source collection
        run: |
          python -m unittest discover -s scripts -p test_official_krx_120d_replay.py -v
          python -m unittest discover -s scripts -p test_official_history_independent_audit.py -v
          python -m unittest discover -s scripts -p test_c3_three_entry_replay.py -v
          python -m unittest discover -s scripts -p test_c3_entry_expiry_diagnostics.py -v
          python -m unittest discover -s scripts -p test_c3_selection_shadow_outcomes.py -v
      - name: Restore last successful official historical artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/official_history
          runs="$(gh api "repos/$GH_REPO/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.path == ".github/workflows/official_krx_120d_replay.yml" and .conclusion == "success") | .id] | .[:12] | .[]')"
          for id in $runs; do
            [[ "$id" == "$GITHUB_RUN_ID" ]] && continue
            mkdir -p restore
            if gh run download "$id" -R "$GH_REPO" -n official-krx-120d-batch-research-only -D restore 2>/dev/null; then
              if [[ -d restore/official_history ]]; then
                cp -a restore/official_history/. output/official_history/
                echo "RESTORED_HISTORY_FROM_RUN $id"
                break
              fi
            fi
            rm -rf restore
          done
      - name: Request a capped batch of official historical dates
        run: |
          python - <<'PY'
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          import subprocess,sys
          d=datetime.now(ZoneInfo("Asia/Seoul")).date()-timedelta(days=1)
          while d.weekday()>=5:d-=timedelta(days=1)
          subprocess.run([sys.executable,"scripts/official_krx_120d_replay.py",
            "--end",d.isoformat(),"--sessions","160","--max-requests","12",
            "--collect","--root","output/official_history","--out","output/replay"],check=True)
          PY
      - name: Diagnose stored-history signals and overlapping models (no returns)
        run: |
          python - <<'PY'
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          import subprocess,sys
          d=datetime.now(ZoneInfo('Asia/Seoul')).date()-timedelta(days=1)
          while d.weekday()>=5:d-=timedelta(days=1)
          subprocess.run([sys.executable,'scripts/c3_stored_history_diagnostics.py','--root','output/official_history','--end',d.isoformat(),'--out','output/replay/c3_signal_diagnostics.json'],check=True)
          PY
      - name: Compare 1 2 3 session entry windows on stored history (research only)
        run: |
          python - <<'PY'
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          import subprocess,sys
          d=datetime.now(ZoneInfo('Asia/Seoul')).date()-timedelta(days=1)
          while d.weekday()>=5:d-=timedelta(days=1)
          subprocess.run([sys.executable,'scripts/c3_entry_expiry_diagnostics.py','--root','output/official_history','--end',d.isoformat(),'--out','output/replay/c3_entry_expiry_diagnostics.json'],check=True)
          PY
      - name: Measure technical-only selection shadow outcomes without financial PIT claims
        run: |
          python - <<'PY'
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          import subprocess,sys
          d=datetime.now(ZoneInfo('Asia/Seoul')).date()-timedelta(days=1)
          while d.weekday()>=5:d-=timedelta(days=1)
          subprocess.run([sys.executable,'scripts/c3_selection_shadow_outcomes.py','--root','output/official_history','--end',d.isoformat(),'--out','output/replay/c3_selection_shadow_outcomes.json'],check=True)
          PY
      - name: Independently audit restored official history and provenance blockers
        if: always()
        run: |
          if [[ -d output/official_history ]]; then
            python scripts/official_history_independent_audit.py --root output/official_history --out output/replay/independent_history_audit.json
          fi
      - name: Holiday reference crosscheck (not certification)
        if: always()
        run: |
          if [[ -f output/replay/official_120d_replay_status.json ]]; then
            python scripts/krx_holiday_reference_check.py --status output/replay/official_120d_replay_status.json --out output/replay/holiday_reference_check.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-krx-120d-batch-research-only
          path: output/
          retention-days: 30
          if-no-files-found: warn
