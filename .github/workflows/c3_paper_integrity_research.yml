name: C3 paper ledger integrity research tests
on:
  push:
    branches:
      - research/c3-ledger-integrity-audit-20261104
    paths:
      - 'scripts/c3_paper_integrity_audit_v1.py'
      - 'scripts/test_c3_paper_integrity_audit_v1.py'
      - 'scripts/c3_price_concordance_v1.py'
      - 'scripts/test_c3_price_concordance_v1.py'
      - '.github/workflows/c3_paper_integrity_research.yml'
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic regression tests
        run: python -m unittest discover -s scripts -p 'test_c3_paper_integrity_audit_v1.py' -v
      - name: Run synthetic independent-price regression tests
        run: python -m unittest discover -s scripts -p 'test_c3_price_concordance_v1.py' -v
      - name: Audit committed read-only paper ledger
        run: python scripts/c3_paper_integrity_audit_v1.py --plans config/c3_paper_top2_plans.csv --ledger reports/c3_paper/paper_ledger.json
