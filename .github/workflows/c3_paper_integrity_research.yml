      - 'scripts/c3_top2_provisional_report_v1.py'
      - 'scripts/c3_top2_mobile_summary_v1.py'
      - 'scripts/test_c3_top2_mobile_summary_v1.py'
      - 'scripts/test_c3_top2_provisional_report_v1.py'
      - 'scripts/test_c3_top2_export_integrity_v1.py'
      - 'scripts/test_c3_top2_pykrx_export_v1.py'
      - 'scripts/test_c3_session_coverage_gate_v1.py'
      - 'scripts/test_c3_top2_research_readiness_v1.py'
      - 'scripts/test_c3_price_provenance_gate_v1.py'
      - 'scripts/test_c3_forward_horizon_observation_v1.py'
      - 'scripts/test_c3_entry_style_comparison_v1.py'
      - 'scripts/test_c3_no_fill_opportunity_v1.py'
      - 'scripts/test_c3_entry_geometry_research_v1.py'
      - 'scripts/test_c3_price_concordance_v1.py'
      - '.github/workflows/c3_paper_integrity_research.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/c3_paper_integrity_audit_v1.py'
      - 'scripts/test_c3_paper_integrity_audit_v1.py'
      - 'scripts/c3_price_concordance_v1.py'
      - 'scripts/c3_entry_geometry_research_v1.py'
      - 'scripts/c3_no_fill_opportunity_v1.py'
      - 'scripts/c3_entry_style_comparison_v1.py'
      - 'scripts/c3_forward_horizon_observation_v1.py'
      - 'scripts/c3_price_provenance_gate_v1.py'
      - 'scripts/c3_top2_research_readiness_v1.py'
      - 'scripts/c3_session_coverage_gate_v1.py'
      - 'scripts/c3_top2_pykrx_export_v1.py'
      - 'scripts/c3_top2_provisional_report_v1.py'
      - 'scripts/c3_top2_mobile_summary_v1.py'
      - 'scripts/test_c3_top2_mobile_summary_v1.py'
      - 'scripts/test_c3_top2_provisional_report_v1.py'
      - 'scripts/test_c3_top2_export_integrity_v1.py'
      - 'scripts/test_c3_top2_pykrx_export_v1.py'
      - 'scripts/test_c3_session_coverage_gate_v1.py'
      - 'scripts/test_c3_top2_research_readiness_v1.py'
      - 'scripts/test_c3_price_provenance_gate_v1.py'
      - 'scripts/test_c3_forward_horizon_observation_v1.py'
      - 'scripts/test_c3_entry_style_comparison_v1.py'
      - 'scripts/test_c3_no_fill_opportunity_v1.py'
      - 'scripts/test_c3_entry_geometry_research_v1.py'
      - 'scripts/test_c3_price_concordance_v1.py'
      - '.github/workflows/c3_paper_integrity_research.yml'
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/c3_paper_integrity_audit_v1.py
            scripts/test_c3_paper_integrity_audit_v1.py
            scripts/c3_price_concordance_v1.py
            scripts/c3_entry_geometry_research_v1.py
            scripts/c3_no_fill_opportunity_v1.py
            scripts/c3_entry_style_comparison_v1.py
            scripts/c3_forward_horizon_observation_v1.py
            scripts/c3_price_provenance_gate_v1.py
            scripts/c3_top2_research_readiness_v1.py
            scripts/c3_session_coverage_gate_v1.py
            scripts/c3_top2_pykrx_export_v1.py
            scripts/c3_top2_provisional_report_v1.py
            scripts/c3_top2_mobile_summary_v1.py
            scripts/test_c3_top2_mobile_summary_v1.py
            scripts/test_c3_top2_provisional_report_v1.py
            scripts/test_c3_top2_export_integrity_v1.py
            scripts/test_c3_top2_pykrx_export_v1.py
            scripts/test_c3_session_coverage_gate_v1.py
            scripts/test_c3_top2_research_readiness_v1.py
            scripts/test_c3_price_provenance_gate_v1.py
            scripts/test_c3_forward_horizon_observation_v1.py
            scripts/test_c3_entry_style_comparison_v1.py
            scripts/test_c3_no_fill_opportunity_v1.py
            scripts/test_c3_entry_geometry_research_v1.py
            scripts/test_c3_price_concordance_v1.py
            config/c3_paper_top2_plans.csv
            reports/c3_paper/paper_ledger.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research scripts before tests
        run: python -m py_compile scripts/c3_paper_integrity_audit_v1.py scripts/test_c3_paper_integrity_audit_v1.py scripts/c3_price_concordance_v1.py scripts/test_c3_price_concordance_v1.py scripts/c3_entry_geometry_research_v1.py scripts/test_c3_entry_geometry_research_v1.py scripts/c3_no_fill_opportunity_v1.py scripts/test_c3_no_fill_opportunity_v1.py scripts/c3_entry_style_comparison_v1.py scripts/test_c3_entry_style_comparison_v1.py scripts/c3_forward_horizon_observation_v1.py scripts/test_c3_forward_horizon_observation_v1.py scripts/c3_price_provenance_gate_v1.py scripts/test_c3_price_provenance_gate_v1.py scripts/c3_top2_research_readiness_v1.py scripts/test_c3_top2_research_readiness_v1.py scripts/c3_session_coverage_gate_v1.py scripts/test_c3_session_coverage_gate_v1.py scripts/c3_top2_pykrx_export_v1.py scripts/test_c3_top2_pykrx_export_v1.py scripts/c3_top2_provisional_report_v1.py scripts/test_c3_top2_provisional_report_v1.py scripts/test_c3_top2_export_integrity_v1.py scripts/c3_top2_mobile_summary_v1.py scripts/test_c3_top2_mobile_summary_v1.py
      - name: Run synthetic regression tests
        run: python -m unittest discover -s scripts -p 'test_c3_paper_integrity_audit_v1.py' -v
      - name: Run synthetic independent-price regression tests
        run: python -m unittest discover -s scripts -p 'test_c3_price_concordance_v1.py' -v
      - name: Run entry geometry research tests
        run: python -m unittest discover -s scripts -p 'test_c3_entry_geometry_research_v1.py' -v
      - name: Run no-fill opportunity research tests
        run: python -m unittest discover -s scripts -p 'test_c3_no_fill_opportunity_v1.py' -v
      - name: Run entry-style comparison research tests
        run: python -m unittest discover -s scripts -p 'test_c3_entry_style_comparison_v1.py' -v
      - name: Run 5-10-20 session horizon research tests
        run: python -m unittest discover -s scripts -p 'test_c3_forward_horizon_observation_v1.py' -v
      - name: Run source provenance gate research tests
        run: python -m unittest discover -s scripts -p 'test_c3_price_provenance_gate_v1.py' -v
      - name: Run integrated TOP2 readiness research tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_research_readiness_v1.py' -v
      - name: Run session calendar coverage tests
        run: python -m unittest discover -s scripts -p 'test_c3_session_coverage_gate_v1.py' -v
      - name: Run TOP2 pykrx export adapter tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_pykrx_export_v1.py' -v
      - name: Run provisional TOP2 report tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_provisional_report_v1.py' -v
      - name: Run mobile TOP2 report tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_mobile_summary_v1.py' -v
      - name: Run TOP2 export integrity tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_export_integrity_v1.py' -v
      - name: Audit committed read-only paper ledger
        run: python scripts/c3_paper_integrity_audit_v1.py --plans config/c3_paper_top2_plans.csv --ledger reports/c3_paper/paper_ledger.json
