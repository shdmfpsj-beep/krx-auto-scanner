      - 'scripts/test_c3_top2_pykrx_export_v1.py'
      - 'scripts/test_c3_session_coverage_gate_v1.py'
      - 'scripts/test_c3_top2_research_readiness_v1.py'
      - 'scripts/test_c3_price_provenance_gate_v1.py'
      - 'scripts/test_c3_forward_horizon_observation_v1.py'
      - 'scripts/test_c3_entry_style_comparison_v1.py'
      - 'scripts/test_c3_no_fill_opportunity_v1.py'
      - 'scripts/test_c3_entry_geometry_research_v1.py'
      - 'scripts/test_c3_price_concordance_v1.py'
      - '.github/workflows/c3_paper_integrity_research.yml'
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/c3_paper_integrity_audit_v1.py
            scripts/test_c3_paper_integrity_audit_v1.py
            scripts/c3_price_concordance_v1.py
            scripts/c3_yahoo_reference_experiment_v1.py
            scripts/c3_provider_difference_diagnostic_v1.py
            scripts/test_c3_yahoo_reference_experiment_v1.py
            scripts/c3_entry_geometry_research_v1.py
            scripts/c3_no_fill_opportunity_v1.py
            scripts/c3_entry_style_comparison_v1.py
            scripts/c3_forward_horizon_observation_v1.py
            scripts/c3_price_provenance_gate_v1.py
            scripts/c3_top2_research_readiness_v1.py
            scripts/c3_session_coverage_gate_v1.py
            scripts/c3_xkrx_calendar_crosscheck_v1.py
            scripts/test_c3_xkrx_calendar_crosscheck_v1.py
            scripts/c3_top2_pykrx_export_v1.py
            scripts/c3_top2_provisional_report_v1.py
            scripts/c3_top2_mobile_summary_v1.py
            scripts/test_c3_top2_mobile_summary_v1.py
            scripts/test_c3_top2_provisional_report_v1.py
            scripts/test_c3_top2_export_integrity_v1.py
            scripts/c3_top2_cross_ticker_gap_v1.py
            scripts/test_c3_top2_cross_ticker_gap_v1.py
            scripts/test_c3_top2_pykrx_export_v1.py
            scripts/test_c3_session_coverage_gate_v1.py
            scripts/test_c3_top2_research_readiness_v1.py
            scripts/test_c3_price_provenance_gate_v1.py
            scripts/test_c3_forward_horizon_observation_v1.py
            scripts/test_c3_entry_style_comparison_v1.py
            scripts/test_c3_no_fill_opportunity_v1.py
            scripts/test_c3_entry_geometry_research_v1.py
            scripts/test_c3_price_concordance_v1.py
            config/c3_paper_top2_plans.csv
            reports/c3_paper/paper_ledger.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research scripts before tests
        run: python -m py_compile scripts/c3_paper_integrity_audit_v1.py scripts/test_c3_paper_integrity_audit_v1.py scripts/c3_price_concordance_v1.py scripts/test_c3_price_concordance_v1.py scripts/c3_entry_geometry_research_v1.py scripts/test_c3_entry_geometry_research_v1.py scripts/c3_no_fill_opportunity_v1.py scripts/test_c3_no_fill_opportunity_v1.py scripts/c3_entry_style_comparison_v1.py scripts/test_c3_entry_style_comparison_v1.py scripts/c3_forward_horizon_observation_v1.py scripts/test_c3_forward_horizon_observation_v1.py scripts/c3_price_provenance_gate_v1.py scripts/test_c3_price_provenance_gate_v1.py scripts/c3_top2_research_readiness_v1.py scripts/test_c3_top2_research_readiness_v1.py scripts/c3_session_coverage_gate_v1.py scripts/test_c3_session_coverage_gate_v1.py scripts/c3_top2_pykrx_export_v1.py scripts/test_c3_top2_pykrx_export_v1.py scripts/c3_top2_provisional_report_v1.py scripts/test_c3_top2_provisional_report_v1.py scripts/test_c3_top2_export_integrity_v1.py scripts/c3_top2_cross_ticker_gap_v1.py scripts/test_c3_top2_cross_ticker_gap_v1.py scripts/c3_top2_mobile_summary_v1.py scripts/test_c3_top2_mobile_summary_v1.py
      - name: Run synthetic regression tests
        run: python -m unittest discover -s scripts -p 'test_c3_paper_integrity_audit_v1.py' -v
      - name: Test provider discrepancy diagnostic
        run: python -m unittest discover -s scripts -p 'test_c3_provider_difference_diagnostic_v1.py' -v
      - name: Run experimental Yahoo reference normalization tests
        run: python -m unittest discover -s scripts -p 'test_c3_yahoo_reference_experiment_v1.py' -v
      - name: Run synthetic independent-price regression tests
        run: python -m unittest discover -s scripts -p 'test_c3_price_concordance_v1.py' -v
      - name: Run entry geometry research tests
        run: python -m unittest discover -s scripts -p 'test_c3_entry_geometry_research_v1.py' -v
      - name: Run no-fill opportunity research tests
        run: python -m unittest discover -s scripts -p 'test_c3_no_fill_opportunity_v1.py' -v
      - name: Run entry-style comparison research tests
        run: python -m unittest discover -s scripts -p 'test_c3_entry_style_comparison_v1.py' -v
      - name: Run 5-10-20 session horizon research tests
        run: python -m unittest discover -s scripts -p 'test_c3_forward_horizon_observation_v1.py' -v
      - name: Run source provenance gate research tests
        run: python -m unittest discover -s scripts -p 'test_c3_price_provenance_gate_v1.py' -v
      - name: Run integrated TOP2 readiness research tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_research_readiness_v1.py' -v
      - name: Run session calendar coverage tests
        run: python -m unittest discover -s scripts -p 'test_c3_session_coverage_gate_v1.py' -v
      - name: Run third-party XKRX calendar comparison tests
        run: python -m unittest discover -s scripts -p 'test_c3_xkrx_calendar_crosscheck_v1.py' -v
      - name: Run TOP2 pykrx export adapter tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_pykrx_export_v1.py' -v
      - name: Run provisional TOP2 report tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_provisional_report_v1.py' -v
      - name: Run mobile TOP2 report tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_mobile_summary_v1.py' -v
      - name: Run TOP2 export integrity tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_export_integrity_v1.py' -v
      - name: Run cross-ticker date-gap tests
        run: python -m unittest discover -s scripts -p 'test_c3_top2_cross_ticker_gap_v1.py' -v
      - name: Audit committed read-only paper ledger
        run: python scripts/c3_paper_integrity_audit_v1.py --plans config/c3_paper_top2_plans.csv --ledger reports/c3_paper/paper_ledger.json

  provisional_prices:
    # PR checks are the observable research-branch path; do not skip provisional data collection.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Full checkout fails on an unrelated overlong tracked path.
          sparse-checkout: |
            scripts/c3_yahoo_reference_experiment_v1.py
            config/c3_top2_yahoo_symbols_experimental.csv
            scripts/c3_top2_pykrx_export_v1.py
            scripts/c3_top2_cross_ticker_gap_v1.py
            scripts/c3_top2_provisional_report_v1.py
            scripts/c3_top2_mobile_summary_v1.py
            scripts/c3_price_concordance_v1.py
            scripts/c3_session_coverage_gate_v1.py
            scripts/c3_xkrx_calendar_crosscheck_v1.py
            scripts/c3_price_provenance_gate_v1.py
            scripts/c3_top2_research_readiness_v1.py
            scripts/c3_entry_geometry_research_v1.py
            scripts/c3_no_fill_opportunity_v1.py
            scripts/c3_entry_style_comparison_v1.py
            scripts/c3_forward_horizon_observation_v1.py
            config/c3_paper_top2_plans.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research-only provider
        run: pip install pykrx==1.2.9 pandas==2.2.3 exchange-calendars==4.13.1 yfinance==0.2.66
      - name: Collect previous completed KST date
        run: |
          END_DATE="$(TZ=Asia/Seoul date -d yesterday +%F)"
          echo "Research only: $END_DATE"
          python scripts/c3_top2_pykrx_export_v1.py --plans config/c3_paper_top2_plans.csv --end "$END_DATE" --outdir /tmp/c3-top2
      - name: Detect cross-ticker date gaps
        if: success()
        run: python scripts/c3_top2_cross_ticker_gap_v1.py --plans config/c3_paper_top2_plans.csv --prices /tmp/c3-top2/top2_provisional_ohlcv.csv --output /tmp/c3-top2/cross_ticker_date_gaps.json --fail-on-gap
      - name: Cross-check observed dates against third-party XKRX calendar
        if: success()
        shell: bash
        run: |
          START_DATE="$(python -c 'import json; print(json.load(open("/tmp/c3-top2/manifest.json"))["start"])')"
          END_DATE="$(python -c 'import json; print(json.load(open("/tmp/c3-top2/manifest.json"))["end"])')"
          python scripts/c3_xkrx_calendar_crosscheck_v1.py --plans config/c3_paper_top2_plans.csv --prices /tmp/c3-top2/top2_provisional_ohlcv.csv --start "$START_DATE" --end "$END_DATE" --output /tmp/c3-top2/xkrx_third_party_calendar_check.json
      - name: Build provisional TOP2 analysis
        if: success()
        run: |
          python scripts/c3_top2_provisional_report_v1.py --plans config/c3_paper_top2_plans.csv --prices /tmp/c3-top2/top2_provisional_ohlcv.csv --manifest /tmp/c3-top2/manifest.json --output /tmp/c3-top2/top2_provisional_research.json
          python scripts/c3_top2_mobile_summary_v1.py --input /tmp/c3-top2/top2_provisional_research.json --calendar-check /tmp/c3-top2/xkrx_third_party_calendar_check.json --output /tmp/c3-top2/TOP2_mobile_summary.md
      - name: Experiment with separate Yahoo reference feed (non-certifying)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f /tmp/c3-top2/manifest.json ]; then
            START_DATE="$(python -c 'import json; print(json.load(open("/tmp/c3-top2/manifest.json"))["start"])')"
            END_DATE="$(python -c 'import json; print(json.load(open("/tmp/c3-top2/manifest.json"))["end"])')"
            python scripts/c3_yahoo_reference_experiment_v1.py --plans config/c3_paper_top2_plans.csv --symbols config/c3_top2_yahoo_symbols_experimental.csv --start "$START_DATE" --end "$END_DATE" --output /tmp/c3-top2/yahoo_reference_experimental.csv --status /tmp/c3-top2/yahoo_reference_status.json
          fi
      - name: Compare Yahoo and pykrx prices (experimental only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -s /tmp/c3-top2/yahoo_reference_experimental.csv ] && [ -s /tmp/c3-top2/top2_provisional_ohlcv.csv ]; then
            python scripts/c3_price_concordance_v1.py --primary /tmp/c3-top2/top2_provisional_ohlcv.csv --reference /tmp/c3-top2/yahoo_reference_experimental.csv --primary-provider pykrx --reference-provider YahooFinance --output /tmp/c3-top2/yahoo_pykrx_concordance_experimental.json
          fi
      - name: Diagnose Yahoo versus pykrx mismatch fields
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -s /tmp/c3-top2/yahoo_pykrx_concordance_experimental.json ]; then
            python scripts/c3_provider_difference_diagnostic_v1.py --input /tmp/c3-top2/yahoo_pykrx_concordance_experimental.json --output /tmp/c3-top2/yahoo_pykrx_field_diagnostics.json
            echo '### 실험용 가격 비교 진단 (거래 인증 아님)' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
            import json
            data=json.load(open("/tmp/c3-top2/yahoo_pykrx_field_diagnostics.json"))
            for ticker, record in data["tickers"].items():
                print(f'- {ticker}: 비교 {record["rows"]}행, 일치 {record["matches"]}행, 불일치 {record["mismatches"]}행, 필드별 {record["field_mismatches"]}')
            PY
          fi
      - name: Publish mobile research summary in Actions
        if: always()
        shell: bash
        run: |
          {
            echo '## C3 TOP2 잠정 연구 결과'
            echo ''
            if [ -s /tmp/c3-top2/TOP2_mobile_summary.md ]; then
              cat /tmp/c3-top2/TOP2_mobile_summary.md
            else
              echo '**CASH / 신규 매수 판단 보류**'
              echo ''
              echo '보고서가 생성되지 않았습니다. 앞선 수집·무결성 단계의 오류를 확인하세요.'
            fi
            echo ''
            echo '> 잠정 pykrx 데이터입니다. 공식 거래일·독립 가격 검증 미완료, 주문 비활성.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive provisional data and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-top2-provisional-observation
          path: /tmp/c3-top2/
          if-no-files-found: warn
          retention-days: 14
