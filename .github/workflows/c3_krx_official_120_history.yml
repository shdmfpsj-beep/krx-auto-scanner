name: C3 official KRX 120-session history (research only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
    steps:
      - name: Collect 120 matched official KRX sessions without checkout
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,hashlib,urllib.request,urllib.parse,urllib.error,datetime,time,csv,gzip,io
          from pathlib import Path
          root=Path('output/krx_120');root.mkdir(parents=True,exist_ok=True)
          key=os.environ.get('KRX_AUTH_KEY','')
          end=datetime.date(2026,11,16)
          result={'schema':'C3_KRX_OFFICIAL_120_RESEARCH_V1','end_date':end.isoformat(),
            'source':'KRX_OPEN_API_DIRECT','target_sessions':120,'matched_sessions':0,
            'rows':0,'dates':[],'errors':[],'source_sha256':{},'session_scope_1530_certified':False,
            'historical_adjustment_certified':False,'financial_pit_certified':False,
            'buy_approved':False,'orders_enabled':False,'telegram_requests':0,'decision':'CASH'}
          columns=['session','market','ISU_CD','ISU_NM','MKT_NM','SECT_TP_NM','TDD_CLSPRC',
            'FLUC_TP_CD','CMPPREVDD_PRC','FLUC_RT','TDD_OPNPRC','TDD_HGPRC',
            'TDD_LWPRC','ACC_TRDVOL','ACC_TRDVAL','MKTCAP','LIST_SHRS']
          records=[]
          def request(day,market,endpoint):
            url='https://data-dbg.krx.co.kr/svc/apis/sto/'+endpoint+'?'+urllib.parse.urlencode({'basDd':day})
            req=urllib.request.Request(url,headers={'AUTH_KEY':key,'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as resp: body=resp.read(12*1024*1024+1)
            if len(body)>12*1024*1024:raise ValueError('RESPONSE_TOO_LARGE')
            payload=json.loads(body)
            rows=payload.get('OutBlock_1') if isinstance(payload,dict) else None
            if not isinstance(rows,list):raise ValueError('OUTBLOCK_NOT_LIST')
            if any(not isinstance(r,dict) or str(r.get('BAS_DD',day)).replace('-','')!=day for r in rows):
              raise ValueError('DATE_MISMATCH')
            return rows,hashlib.sha256(body).hexdigest()
          try:
            if not key:raise RuntimeError('KRX_AUTH_KEY_MISSING')
            day=end
            # Max 210 calendar days; skip weekends, reject partial market sessions.
            while result['matched_sessions']<120 and day>=end-datetime.timedelta(days=210):
              if day.weekday()<5:
                d=day.strftime('%Y%m%d')
                try:
                  kospi,h1=request(d,'KOSPI','stk_bydd_trd')
                  kosdaq,h2=request(d,'KOSDAQ','ksq_bydd_trd')
                  if bool(kospi)!=bool(kosdaq):raise ValueError('PARTIAL_MARKET_SESSION')
                  if kospi and kosdaq:
                    for market,rows in [('KOSPI',kospi),('KOSDAQ',kosdaq)]:
                      for r in rows:
                        records.append([d,market]+[str(r.get(k,'')) for k in columns[2:]])
                    result['dates'].append({'date':d,'KOSPI':len(kospi),'KOSDAQ':len(kosdaq),
                      'sha256':{'KOSPI':h1,'KOSDAQ':h2}})
                    result['matched_sessions']+=1
                    result['rows']+=len(kospi)+len(kosdaq)
                    print('ACCEPTED',d,len(kospi),len(kosdaq),flush=True)
                except urllib.error.HTTPError as exc:
                  result['errors'].append({'date':d,'error':'HTTP_'+str(exc.code)})
                  if exc.code in (401,403,429):break
                except Exception as exc:
                  result['errors'].append({'date':d,'error':type(exc).__name__+': '+str(exc)[:120]})
                  if len(result['errors'])>=10:break
                time.sleep(0.25)
              day-=datetime.timedelta(days=1)
            result['status']='COMPLETE_120_OFFICIAL_SESSIONS' if result['matched_sessions']==120 else 'HOLD_INCOMPLETE_120_SESSIONS'
            # Store date-tagged official raw fields for research, not a regular-only or adjusted price claim.
            if records:
              with gzip.open(root/'official_120_sessions.csv.gz','wt',encoding='utf-8',newline='') as f:
                w=csv.writer(f);w.writerow(columns);w.writerows(records)
              result['csv_gz_sha256']=hashlib.sha256((root/'official_120_sessions.csv.gz').read_bytes()).hexdigest()
          except Exception as exc:
            result['status']='HOLD_COLLECTOR_EXCEPTION'
            result['errors'].append({'error':type(exc).__name__+': '+str(exc)[:150]})
          finally:
            (root/'manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
            print('FINAL_RECEIPT',json.dumps({k:result[k] for k in ['status','matched_sessions','rows','errors','decision']},ensure_ascii=False),flush=True)
          if result['status']!='COMPLETE_120_OFFICIAL_SESSIONS':raise SystemExit(1)
          PY
      - name: Upload official historical dataset and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-krx-official-120-session-history
          path: output/krx_120/
          retention-days: 30
          if-no-files-found: warn
