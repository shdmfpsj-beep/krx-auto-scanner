name: Verify API credential configuration (presence only, no secret values)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify_secret_presence.yml'

permissions:
  contents: read

jobs:
  check-configuration-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KRX_OPEN_API_PRESENT: ${{ secrets.KRX_AUTH_KEY != '' }}
      KRX_LOGIN_ID_PRESENT: ${{ secrets.KRX_ID != '' }}
      KRX_LOGIN_PASSWORD_PRESENT: ${{ secrets.KRX_PW != '' }}
      OPENDART_PRESENT: ${{ secrets.OPENDART_API_KEY != '' }}
      OPENDART_ALIAS_1_PRESENT: ${{ secrets.OPEN_DART_API_KEY != '' }}
      OPENDART_ALIAS_2_PRESENT: ${{ secrets.DART_API_KEY != '' }}
      KIS_APP_KEY_PRESENT: ${{ secrets.KIS_APP_KEY != '' }}
      KIS_APP_SECRET_PRESENT: ${{ secrets.KIS_APP_SECRET != '' }}
    steps:
      - name: Report only boolean presence without reading or printing credentials
        shell: python
        run: |
          import os
          fields = (
              ("KRX official OPEN API", "KRX_OPEN_API_PRESENT"),
              ("KRX legacy login ID", "KRX_LOGIN_ID_PRESENT"),
              ("KRX legacy login password", "KRX_LOGIN_PASSWORD_PRESENT"),
              ("OpenDART primary", "OPENDART_PRESENT"),
              ("OpenDART alias 1", "OPENDART_ALIAS_1_PRESENT"),
              ("OpenDART alias 2", "OPENDART_ALIAS_2_PRESENT"),
              ("KIS app key", "KIS_APP_KEY_PRESENT"),
              ("KIS app secret", "KIS_APP_SECRET_PRESENT"),
          )
          print("API_SECRET_PRESENCE_DIAGNOSTIC_START")
          for label, variable in fields:
              val = os.environ.get(variable, "")
              assert val in {"true","false"}, "NON_BOOLEAN_ENVIRONMENT_FLAG"
              print(f"{label}: {'CONFIGURED' if val == 'true' else 'NOT_CONFIGURED'}")
          print("API_SECRET_PRESENCE_DIAGNOSTIC_END")
          print("Only booleans assessed. No secret content, partial value, hash, or verification attempt.")
