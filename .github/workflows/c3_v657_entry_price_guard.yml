name: C3 v6.57 D-only price grid and support guard (research only)
on:
  workflow_dispatch:
  push:
    branches: [research/v615-usable-entry-frontier-20261025]
    paths:
      - 'research/c3_v657/**'
      - '.github/workflows/c3_v657_entry_price_guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/c3_v657/**'
      - '.github/workflows/c3_v657_entry_price_guard.yml'
permissions:
  contents: read
jobs:
  entry_price_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: research/c3_v657
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run non-broker price and asof checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/c3_v657/entry_price_grid_guard.py
          python -m unittest discover -s research/c3_v657 -p 'test_entry_price_grid_guard.py' -v
