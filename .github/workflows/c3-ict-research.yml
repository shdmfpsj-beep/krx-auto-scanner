name: C3 ICT research checks
on:
  push:
    branches:
      - research/c3-ledger-integrity-audit-20261104
  pull_request:
    paths:
      - 'scripts/c3_ict_*.py'
      - 'scripts/test_c3_ict_*.py'
      - 'scripts/c3_price_concordance_v1.py'
      - 'scripts/c3_watch_touch_forward_outcomes_v1.py'
      - 'scripts/test_c3_watch_touch_forward_outcomes_v1.py'
      - '.github/workflows/c3-ict-research.yml'
  workflow_dispatch:
jobs:
  ict-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research modules
        run: python -m py_compile scripts/c3_ict_observable_features_v1.py scripts/c3_ict_sequence_research_v1.py scripts/c3_ict_cohort_compare_v1.py scripts/c3_price_concordance_v1.py scripts/c3_watch_touch_forward_outcomes_v1.py
      - name: ICT unit tests
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_c3_ict_*.py' -v
      - name: Watch-touch dependency regression tests
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_c3_watch_touch_forward_outcomes_v1.py' -v
