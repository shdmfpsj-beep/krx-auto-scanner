name: C3 common-share industry coverage and selection diagnosis
on:
  push:
    branches: [research/c3-ledger-integrity-audit-20261104]
    paths:
      - 'scripts/c3_selection*_v5.py'
      - 'scripts/c3_classification_collect_v5.py'
      - 'scripts/test_c3_selection*_v5.py'
      - 'reports/c3_work5_20261105/inputs.json'
      - 'reports/c3_work5_20261105/sources/**'
      - '.github/workflows/c3_selection_scope_v5_research.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  selection-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing research dependencies
        run: pip install pandas==2.2.3 pykrx==1.2.9 'matplotlib>=3.8,<4'
      - name: Preserve all 532 regressions plus new source and attribution tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p /tmp/c3-selection/validation
          python - <<'PY'
          import json,sys,unittest
          from pathlib import Path
          sys.path.insert(0,'scripts');loader=unittest.TestLoader()
          suites=[loader.discover('scripts',pattern=p) for p in ('test_c3_*.py','test_krx_official_eod_v65.py','test_hma60_first_pullback_v11.py')]
          counts=[s.countTestCases() for s in suites]
          result=unittest.TextTestRunner(verbosity=1).run(unittest.TestSuite(suites))
          Path('/tmp/c3-selection/validation/tests.json').write_text(json.dumps(dict(counts=counts,total=result.testsRun,failures=len(result.failures),errors=len(result.errors))))
          assert counts==[523,14,21], 'PRESERVED_TEST_COUNT_CHANGED'
          if not result.wasSuccessful():raise SystemExit(1)
          PY
      - name: Reuse pinned raw data and completed v4 ledger without rerunning strategies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,zipfile
          from pathlib import Path
          m=json.loads(Path('reports/c3_work5_20261105/inputs.json').read_text())
          root=Path('/tmp/c3-selection/inputs');root.mkdir(parents=True,exist_ok=True)
          for key,item in m['artifacts'].items():
              p=root/(key+'.zip')
              with p.open('wb') as f:subprocess.run(['gh','api','repos/shdmfpsj-beep/krx-auto-scanner/actions/artifacts/'+str(item['id'])+'/zip'],stdout=f,check=True)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256'],'PINNED_SOURCE_HASH_MISMATCH'
              dest=root/key;dest.mkdir(exist_ok=True)
              with zipfile.ZipFile(p) as z:
                  assert all(not Path(n).is_absolute() and '..' not in Path(n).parts for n in z.namelist())
                  z.extractall(dest)
          PY
      - name: Reproduce whole-market classification from the frozen public source snapshot
        run: |
          known_at=$(python -c "import json; print(json.load(open('reports/c3_work5_20261105/inputs.json'))['known_at'])")
          python scripts/c3_selection_scope_v5.py --panel /tmp/c3-selection/inputs/panel/official_panel.csv.gz --audit /tmp/c3-selection/inputs/panel/quality_audit.json --latest /tmp/c3-selection/inputs/latest/requested-date-probe/2026-11-04 --basic /tmp/c3-selection/inputs/issuer/basic --scope reports/c3_work5_20261105/sources --known-at "$known_at" --outdir /tmp/c3-selection/scope
          cmp reports/c3_work5_20261105/scope_summary.json /tmp/c3-selection/scope/scope_summary.json
      - name: Separate selection returns from archived order outcomes without retuning
        run: |
          python scripts/c3_selection_diagnostic_v5.py --panel /tmp/c3-selection/inputs/panel/official_panel.csv.gz --audit /tmp/c3-selection/inputs/panel/quality_audit.json --archived-ledger /tmp/c3-selection/inputs/v4/study/daily_ledger.json.gz --outdir /tmp/c3-selection/diagnostic
          cmp reports/c3_work5_20261105/selection_comparison.csv /tmp/c3-selection/diagnostic/selection_comparison.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-selection-scope-v5
          path: |
            /tmp/c3-selection/scope/
            /tmp/c3-selection/diagnostic/
            /tmp/c3-selection/validation/
          retention-days: 90
          if-no-files-found: error
