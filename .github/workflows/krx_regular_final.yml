name: KRX regular-only 18:00 safe final report
on:
  workflow_dispatch:
  schedule:
    # 18:00 KST weekday, ahead of 18:30 ChatGPT notification.
    - cron: '0 9 * * 1-5'
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/krx_regular_daily_report.py
            /scripts/krx_regular_after_layers.py
            /scripts/krx_session_probe.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Get independently archived *regular* observation (no aftermarket artifact)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input output
          TARGET_DAY="$(PYTHONPATH=scripts python -c 'from krx_regular_daily_report import nominal_regular_day; from datetime import datetime; from zoneinfo import ZoneInfo; print(nominal_regular_day(datetime.now(ZoneInfo("Asia/Seoul"))))')"
          echo "TARGET_DAY=$TARGET_DAY" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/actions/workflows/krx_session_layers.yml/runs?per_page=50" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .id' |
          while read -r id; do
            [[ "$id" == "$GITHUB_RUN_ID" ]] && continue
            rm -f input/regular_observation.json
            if gh run download "$id" -R "$GH_REPO" -n krx-regular-observation -D input 2>/dev/null &&
              TARGET_DAY="$TARGET_DAY" python - <<'PY'
import json,os
from pathlib import Path
try:
    p=json.loads(Path("input/regular_observation.json").read_text())
    assert p.get("asof")==os.environ["TARGET_DAY"]
    assert p.get("phase")=="regular"
except (OSError,ValueError,AssertionError):
    raise SystemExit(1)
PY
            then
              echo "DOWNLOADED_DATE_MATCHED_REGULAR_OBSERVATION run=$id day=$TARGET_DAY"
              break
            fi
            rm -f input/regular_observation.json
          done
          [[ -f input/regular_observation.json ]] || echo "DATE_MATCHED_REGULAR_OBSERVATION_UNAVAILABLE"
      - name: Optionally load audited KRX minute prices from official source probe
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/workflows/kis_regular_minute_audit.yml/runs?per_page=30" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .id' |
          while read -r id; do
            [[ "$id" == "$GITHUB_RUN_ID" ]] && continue
            rm -f input/kis_regular_minute_audit.json
            if gh run download "$id" -R "$GH_REPO" -n kis-krx-regular-minute-audit -D input 2>/dev/null &&
              python - <<'PY'
import json,os
from pathlib import Path
try:
    p=json.loads(Path("input/kis_regular_minute_audit.json").read_text())
    assert p.get("date")==os.environ["TARGET_DAY"].replace("-","")
except (OSError,ValueError,AssertionError):
    raise SystemExit(1)
PY
            then
              echo "FOUND_DATE_MATCHED_MINUTE_PROBE_RUN $id"
              break
            fi
            rm -f input/kis_regular_minute_audit.json
          done
          [[ -f input/kis_regular_minute_audit.json ]] || echo "DATE_MATCHED_MINUTE_PROBE_UNAVAILABLE"

      - name: Publish report only from date-matched regular archive
        shell: bash
        run: |
          python scripts/krx_regular_daily_report.py \
            --regular input/regular_observation.json --date "$TARGET_DAY" \
            --kis-audit input/kis_regular_minute_audit.json --out output
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('output/regular_only_final_status.json').read_text())
          assert s['after_market_excluded'] is True
          assert s['approved_buy_count']==0 and s['decision']=='CASH'
          assert s['mode']=='KRX_REGULAR_ONLY_0900_1530'
          assert s['kis_krx_minute_price_probe']['market_wide_validated'] is False
          assert s['kis_krx_minute_price_probe']['investor_flow_validated'] is False
          print('REGULAR_ONLY_SOURCE_RESULT',s['market_source_status'],s['blockers'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krx-regular-only-18h-final
          path: |
            output/regular_only_final_status.json
            output/regular_only_final_mobile.md
          retention-days: 14
