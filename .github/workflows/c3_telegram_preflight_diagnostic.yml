name: C3 Telegram recipient preflight and source diagnosis (NO SEND)
on:
  push:
    branches: [test/c3-telegram-preflight-20261110]
    paths: ['.github/workflows/c3_telegram_preflight_diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_telegram_notify.py
            scripts/c3_telegram_inputs.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests --disable-pip-version-check
      - name: Check actual Telegram group with getChat and report eligibility without sending
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: scripts
        run: |
          mkdir -p /tmp/c3-preflight
          python - <<'PY'
          import json,os
          from pathlib import Path
          from c3_telegram_inputs import GitHub,report_pair
          from c3_telegram_notify import Telegram,report_error,now_kst
          result={'schema':'C3_TELEGRAM_PREFLIGHT_V1','send_attempts':0,'orders_enabled':False}
          try:
              bot=Telegram(os.environ.get('TELEGRAM_BOT_TOKEN','').strip(),os.environ.get('TELEGRAM_CHAT_ID','').strip())
              bot.verify_group()
              result['recipient_preflight']='VERIFIED'
          except Exception as exc:
              result['recipient_preflight']='FAILED'
              result['recipient_error_type']=type(exc).__name__
              result['recipient_error_code']=str(exc) if isinstance(exc,ValueError) else 'TRANSPORT_ERROR'
          try:
              report,summary,ref=report_pair(GitHub(os.environ['GH_TOKEN']))
              result['source_asof']=report.get('source_price_asof')
              result['attempted_asof']=report.get('attempted_price_asof')
              result['data_quality_state']=report.get('data_quality_state')
              result['source_provider']=report.get('source_provider')
              result['research_top2_registered']=report.get('research_top2_registered_for_source_session')
              result['report_gate']=report_error(report,summary,now_kst()) or 'ELIGIBLE'
          except Exception as exc:
              result['report_gate']='DIAGNOSIS_FAILED'
              result['report_error_type']=type(exc).__name__
          Path('/tmp/c3-preflight/status.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('PREFLIGHT',json.dumps(result,ensure_ascii=False))
          assert result['recipient_preflight']=='VERIFIED','TELEGRAM_RECIPIENT_NOT_VERIFIED'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-telegram-preflight-diagnostic
          path: /tmp/c3-preflight/status.json
          retention-days: 30
          if-no-files-found: warn
