name: C3 v4 stock-first selection and entries (NO ORDERS)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/c3_stock_first_v3.py'
      - 'scripts/c3_stock_first_v4.py'
      - 'scripts/c3_stock_first_v5.py'
      - 'scripts/c3_light_fundamental_catalyst_v6.py'
      - 'scripts/c3_full_history_leader_radar_v7.py'
      - 'scripts/test_c3_full_history_leader_radar_v7.py'
      - 'scripts/test_c3_light_fundamental_catalyst_v6.py'
      - 'scripts/c3_top2_candle_chart_v1.py'
      - 'scripts/c3_top2_large_portrait_v2.py'
      - 'scripts/c3_regular_price_reconciliation_v1.py'
      - 'scripts/test_c3_regular_price_reconciliation_v1.py'
      - 'scripts/test_c3_top2_large_portrait_v2.py'
      - 'scripts/c3_confirmed_target_ladder_v2.py'
      - 'scripts/test_c3_confirmed_target_ladder_v2.py'
      - 'scripts/c3_top2_action_sheet_v1.py'
      - 'scripts/test_c3_top2_action_sheet_v1.py'
      - 'scripts/test_c3_top2_candle_chart_v1.py'
      - 'scripts/test_c3_stock_first_v5.py'
      - 'scripts/test_c3_stock_first_v4.py'
      - 'scripts/test_c3_stock_first_v3.py'
      - '.github/workflows/c3_stock_first_v3.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      GH_TOKEN: ${{ github.token }}
      C3_STOCK_FIRST_SOURCE_ZIP: ${{ runner.temp }}/c3-frozen-oct30.zip
      C3_ARTIFACT_ROOT: ${{ runner.temp }}/raw-study
      C3_REPORT_ROOT: ${{ runner.temp }}/stock-first-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric runtime
        run: python -m pip install --disable-pip-version-check numpy pandas matplotlib
      - name: Download original completed 2026-10-30 full market scan
        run: |
          mkdir -p "$C3_ARTIFACT_ROOT"
          gh run download "41051723762" --repo "$GITHUB_REPOSITORY" --name krx-scan-report --dir "$C3_ARTIFACT_ROOT"
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          source=Path(os.environ["C3_ARTIFACT_ROOT"])
          needed=['status.json','c3_premove_observations_v1.csv',
            'c3_premove_history_v1.csv.gz','kind_sector_master.csv',
            'v65_sector_stock_map.csv','c3_candidate_evidence_v1.csv',
            'v68_investment_sector_members.csv','v71_sector_strength.csv',
            'v91_financial_pit_provisional.csv','v95_event_quality_audit.csv']
          assert all((source/p).is_file() for p in needed)
          with zipfile.ZipFile(os.environ['C3_STOCK_FIRST_SOURCE_ZIP'],'w') as out:
              for p in needed:out.write(source/p,p)
          PY
      - name: Stock-first candidate and practical structural-entry selection
        run: |
          python scripts/c3_stock_first_v3.py \
            --input "$C3_STOCK_FIRST_SOURCE_ZIP" \
            --output "$C3_REPORT_ROOT"
      - name: Minimal non-PnL source and algorithm unit tests
        run: |
          python -m unittest discover -s scripts -p 'test_c3_stock_first_v3.py' -v
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ['C3_REPORT_ROOT'])/'c3_stock_first_v3_summary.json'
          x=json.loads(f.read_text())
          assert x['trade_approved'] is False
          assert x['orders_enabled'] is False
          assert x['no_performance_backtest'] is True
          PY
      - name: New v4 stock-quality and price-first selection
        run: |
          python scripts/c3_stock_first_v4.py --input "$C3_STOCK_FIRST_SOURCE_ZIP" --output "$C3_REPORT_ROOT"
          python -m unittest discover -s scripts -p 'test_c3_stock_first_v4.py' -v
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['C3_REPORT_ROOT'])/'c3_stock_first_v4_status.json'
          x=json.loads(p.read_text())
          assert (x['price_stage_total'],x['researched'])==(457,96)
          assert [r['ticker'] for r in x['top2']]==['026960','271560']
          assert x['trade_approved'] is False and x['orders_enabled'] is False
          assert x['no_backtest_requested'] is True
          PY
      - name: C3 v5 opportunity-ranked, non-chasing TWO research watches
        run: |
          python scripts/c3_stock_first_v5.py --input "$C3_STOCK_FIRST_SOURCE_ZIP" --output "$C3_REPORT_ROOT/v5"
          python -m unittest discover -s scripts -p 'test_c3_stock_first_v5.py' -v
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["C3_REPORT_ROOT"])/"v5"
          z=json.loads((root/"c3_stock_first_v5_status.json").read_text())
          assert (z['scanned'],z['price_stage_cases'],z['structured_candidates'])==(2625,457,96)
          assert [x['ticker'] for x in z['top2']]==['271560','026960']
          assert z['category_counts']['PRIORITY_PULLBACK']==1
          assert z['top2'][1]['pullback_state']=='PIVOT_HEAVY_SUPPLY_WAIT'
          assert z['top2_approved_buy_count']==0
          assert z['trade_approved'] is False and z['orders_enabled'] is False
          assert z['no_profitability_backtests'] is True
          PY
      - name: Render TOP2 OHLCV candlesticks, volume, MA5/20, entry watch band, stop and first obstacle
        env:
          C3_V5_RANKED_CSV: ${{ runner.temp }}/stock-first-v3/v5/c3_stock_first_v5_ranked.csv
        run: |
          python scripts/c3_top2_candle_chart_v1.py \
            --source "$C3_STOCK_FIRST_SOURCE_ZIP" \
            --ranked "$C3_V5_RANKED_CSV" \
            --output "$C3_REPORT_ROOT/v5/charts" \
            --bars 45
          python -m unittest discover -s scripts -p 'test_c3_top2_candle_chart_v1.py' -v
          python -m unittest discover -s scripts -p 'test_c3_confirmed_target_ladder_v2.py' -v
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['C3_REPORT_ROOT'])/'v5/charts'
          data=json.loads((root/'c3_top2_chart_v1_manifest.json').read_text())
          assert [x['ticker'] for x in data['charts']]==['271560','026960']
          assert [x['last_close'] for x in data['charts']]==[114200,28400]
          assert [x['second_historical_resistance'] for x in data['charts']]==[141700,30550]
          assert [x['second_target']['pivot_date'] for x in data['strategy_prices']]==['2026-08-11','2026-02-23']
          assert all((root/x['chart_file']).stat().st_size>5000 for x in data['charts'])
          assert data['trade_approved'] is False and data['orders_enabled'] is False
          PY
      - name: Audit declared regular close vs scanner price (NO automatic reprice)
        env:
          C3_V5_RANKED_CSV: ${{ runner.temp }}/stock-first-v3/v5/c3_stock_first_v5_ranked.csv
        run: |
          python -m unittest discover -s scripts -p 'test_c3_regular_price_reconciliation_v1.py' -v
          python scripts/c3_regular_price_reconciliation_v1.py \
            --ranked "$C3_V5_RANKED_CSV" \
            --output "$C3_REPORT_ROOT/v5/regular-price"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['C3_REPORT_ROOT'])/'v5/regular-price'
          status=json.loads((root/'c3_regular_price_reconciliation_status.json').read_text())
          assert status['candidate_count']==96
          assert status['missing_reference_count']==96
          assert status['regular_session_price_authoritatively_certified'] is False
          assert status['trade_approved'] is False
          assert status['orders_enabled'] is False
          PY
      - name: Render TWO smartphone-sized 1751x2618 TOP2 strategy charts
        env:
          C3_V5_RANKED_CSV: ${{ runner.temp }}/stock-first-v3/v5/c3_stock_first_v5_ranked.csv
        run: |
          python -m unittest discover -s scripts -p 'test_c3_top2_large_portrait_v2.py' -v
          python scripts/c3_top2_large_portrait_v2.py \
            --source "$C3_STOCK_FIRST_SOURCE_ZIP" \
            --ranked "$C3_V5_RANKED_CSV" \
            --output "$C3_REPORT_ROOT/v5/large-charts" \
            --bars 35
          python - <<'PY'
          import json,os,pathlib,struct
          root=pathlib.Path(os.environ['C3_REPORT_ROOT'])/'v5/large-charts'
          manifest=json.loads((root/'c3_large_portrait_manifest.json').read_text())
          assert manifest['asof']=='2026-10-30'
          assert manifest['scanned']==2625
          assert [x['ticker'] for x in manifest['candidates']]==['271560','026960']
          assert [x['t1'] for x in manifest['candidates']]==[131500,29550]
          assert [x['t2'] for x in manifest['candidates']]==[141700,30550]
          for candidate in manifest['candidates']:
              path=root/candidate['file']
              with path.open('rb') as f:header=f.read(24)
              assert header[:8]==bytes([137,80,78,71,13,10,26,10])
              assert struct.unpack('>II',header[16:24])==(1751,2618)
              assert candidate['trade_approved'] is False
          assert manifest['buy_approved'] is False
          assert manifest['orders_enabled'] is False
          print('C3_BIG_MOBILE_TOP2_SUCCESS',manifest['asof'])
          PY
      - name: Export TOP2 mobile decision table from dated ranked prices
        env:
          C3_V5_RANKED_CSV: ${{ runner.temp }}/stock-first-v3/v5/c3_stock_first_v5_ranked.csv
        run: |
          python scripts/c3_top2_action_sheet_v1.py \
            --ranked "$C3_V5_RANKED_CSV" \
            --output "$C3_REPORT_ROOT/v5/charts"
          python -m unittest discover -s scripts -p 'test_c3_top2_action_sheet_v1.py' -v
          python - <<'PY'
          import json,os,pathlib
          f=pathlib.Path(os.environ["C3_REPORT_ROOT"])/"v5/charts/c3_top2_action_sheet_v1.json"
          x=json.loads(f.read_text())
          assert x["trade_approved"] is False
          assert x["orders_enabled"] is False
          assert [z["ticker"] for z in x["top2"]]==["271560","026960"]
          assert [z['second_target_krw'] for z in x['top2']]==[141700,30550]
          PY
      - name: C3 v6 financial and catalyst LIGHT annotation without disqualifying no-news leaders
        env:
          C3_V5_RANKED_CSV: ${{ runner.temp }}/stock-first-v3/v5/c3_stock_first_v5_ranked.csv
        run: |
          python scripts/c3_light_fundamental_catalyst_v6.py \
            --input "$C3_STOCK_FIRST_SOURCE_ZIP" \
            --ranked "$C3_V5_RANKED_CSV" \
            --output "$C3_REPORT_ROOT/v6"
          python -m unittest discover -s scripts -p 'test_c3_light_fundamental_catalyst_v6.py' -v
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['C3_REPORT_ROOT'])/'v6/c3_v6_light_context_status.json'
          x=json.loads(p.read_text())
          assert x['candidate_count']==96
          assert [z['ticker'] for z in x['top2']]==['271560','026960']
          assert [z['combined_research_score'] for z in x['top2']]==[64.58,63.05]
          assert x['news_absence_not_a_hard_gate'] is True
          assert x['fundamental_absence_not_a_hard_gate'] is True
          assert x['trade_approved'] is False and x['orders_enabled'] is False
          PY
      - name: C3 v7 full-history target recovery and realistic challenger radar
        env:
          C3_V5_RANKED_CSV: ${{ runner.temp }}/stock-first-v3/v5/c3_stock_first_v5_ranked.csv
        run: |
          python scripts/c3_full_history_leader_radar_v7.py \
            --input "$C3_STOCK_FIRST_SOURCE_ZIP" \
            --ranked "$C3_V5_RANKED_CSV" \
            --output "$C3_REPORT_ROOT/v7"
          python -m unittest discover -s scripts -p 'test_c3_full_history_leader_radar_v7.py' -v
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['C3_REPORT_ROOT'])/'v7/c3_v7_full_history_leader_radar_status.json'
          x=json.loads(p.read_text())
          assert x['researched']==96 and x['resistance_newly_recovered_count']==18
          assert [v['ticker'] for v in x['top2_preserved_until_new_completed_date']]==['271560','026960']
          nice=x['recovered_early_leader_challengers']
          assert len(nice)==1 and nice[0]['ticker']=='030190'
          assert (nice[0]['watch_low'],nice[0]['watch_high'])==(16780,17070)
          assert (nice[0]['first_historical_target_krw'],nice[0]['second_historical_target_krw'])==(18000,18140)
          assert x['trade_approved'] is False and x['orders_enabled'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c3-stock-first-v4-oct30-research-no-orders
          path: ${{ runner.temp }}/stock-first-v3/
          retention-days: 30
