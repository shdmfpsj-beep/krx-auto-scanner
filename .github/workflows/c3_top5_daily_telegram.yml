name: C3 TOP5 classic per-stock Telegram (user trades)
on:
  workflow_dispatch:
    inputs:
      asof:
        description: 'Optional KRX as-of date YYYYMMDD (manual preview only)'
        required: false
        type: string
  schedule:
    # KST 07:00 Tuesday-Saturday (previous KRX trading day); GitHub scheduling can be delayed.
    # 22:00 UTC Monday-Friday = 07:00 KST next calendar day.
    - cron: '0 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: c3-top5-daily-classic-per-stock
  cancel-in-progress: false
jobs:
  top5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install image renderer and Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python3 -m pip install pillow --disable-pip-version-check
      - name: Syntax check embedded Python before KRX calls
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import urllib.request,os,json,base64
          # Checkout is intentionally skipped because the repository contains
          # a filename that prevents a full checkout on the runner.
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.github/workflows/c3_top5_daily_telegram.yml?ref='+os.environ['GITHUB_SHA']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r:obj=json.load(r)
          workflow=base64.b64decode(obj['content']).decode()
          # Split lines rather than searching for literal escaped newline sequences.
          lines=workflow.splitlines()
          idx=next(i for i,line in enumerate(lines)
            if line.strip()=='- name: Collect KRX sessions and render one classic image per stock')
          start=next(i for i in range(idx+1,len(lines)) if lines[i].strip() in ("python3 - <<'PY'","python - <<'PY'"))+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          ast.parse(code,filename='c3_top5_embedded.py')
          print('EMBEDDED_PYTHON_SYNTAX_OK')
          PY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Collect KRX sessions and render one classic image per stock
        shell: bash
        env:
          C3_MANUAL_ASOF: ${{ inputs.asof }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os,json,csv,io,datetime,urllib.request,urllib.parse,urllib.error,collections,statistics,math,time,hashlib
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from PIL import Image,ImageDraw,ImageFont
          root=Path('output/c3_top5');root.mkdir(parents=True,exist_ok=True)
          receipt={'schema':'C3_TOP5_DAILY_V1','status':'HOLD','decision':'CASH','orders_enabled':False,
            'user_executes_trades':True,'telegram_photos_sent':0,'candidates':[],
            'limitations':['Official KRX daily bars are not independently 15:30 regular-only certified',
            'Corporate-action adjustments and PIT financial quality not verified',
            'Entry references are not orders or investment recommendations',
            'A reserved send date is never retried automatically after an uncertain Telegram outcome']}
          def fetch(day,endpoint):
            u='https://data-dbg.krx.co.kr/svc/apis/sto/'+endpoint+'?'+urllib.parse.urlencode({'basDd':day})
            req=urllib.request.Request(u,headers={'AUTH_KEY':os.environ['KRX_AUTH_KEY'],'Accept':'application/json'})
            # Retry only transient transport failures; never retry invalid or incomplete data.
            for attempt in range(3):
              try:
                with urllib.request.urlopen(req,timeout=25) as res:raw=res.read(12*1024*1024+1)
                break
              except (urllib.error.URLError,TimeoutError,ConnectionError) as ex:
                if attempt==2:raise
                print('C3_KRX_TRANSIENT_RETRY',day,endpoint,'attempt',attempt+1,type(ex).__name__)
                time.sleep(2*(attempt+1))
            if len(raw)>12*1024*1024:raise ValueError('RESPONSE_TOO_LARGE')
            z=json.loads(raw)
            a=z.get('OutBlock_1')
            if not isinstance(a,list):raise ValueError('MISSING_OUTBLOCK')
            return a
          def num(v):
            try:
              x=float(str(v).replace(',','').strip())
              return x if math.isfinite(x) else None
            except:return None
          try:
            if not os.environ.get('KRX_AUTH_KEY'):raise ValueError('KRX_KEY_MISSING')
            now=datetime.datetime.now(ZoneInfo('Asia/Seoul'))
            target=now.date()
            # A delayed scheduled run can start the next morning. Always use the
            # last completed weekday, not the wall-clock calendar date.
            # KRX availability is checked below; holidays fail closed as incomplete.
            if now.hour<21:
              target-=datetime.timedelta(days=1)
            while target.weekday()>4:
              target-=datetime.timedelta(days=1)
            if os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch':
              receipt['preview_source_policy']='NO_SEND_MANUAL_PREVIEW'
              manual_asof=os.environ.get('C3_MANUAL_ASOF','').strip()
              if manual_asof:
                if len(manual_asof)!=8 or not manual_asof.isdigit():raise ValueError('INVALID_MANUAL_ASOF')
                target=datetime.datetime.strptime(manual_asof,'%Y%m%d').date()
                if target>now.date() or target.weekday()>4:raise ValueError('INVALID_MANUAL_ASOF_DATE')
            days=[];data=collections.defaultdict(dict);names={}
            session_coverage=[];rejected_rows=collections.Counter()
            for offset in range(105):
              d=target-datetime.timedelta(days=offset)
              if d.weekday()>4:continue
              ds=d.strftime('%Y%m%d')
              a=fetch(ds,'stk_bydd_trd');b=fetch(ds,'ksq_bydd_trd')
              if not a and not b:continue
              if not a or not b:raise ValueError('PARTIAL_MARKET_'+ds)
              days.append(ds)
              session_coverage.append({'date':ds,'kospi_rows':len(a),'kosdaq_rows':len(b)})
              for market,rows in (('KOSPI',a),('KOSDAQ',b)):
                for r in rows:
                  code=str(r.get('ISU_CD','')).strip()
                  o,h,l,c=[num(r.get(k)) for k in ('TDD_OPNPRC','TDD_HGPRC','TDD_LWPRC','TDD_CLSPRC')]
                  vol=num(r.get('ACC_TRDVOL'));val=num(r.get('ACC_TRDVAL'))
                  if not code or None in (o,h,l,c,vol,val) or min(o,h,l,c)<=0 or vol<=0 or val<=0 or l>min(o,c) or h<max(o,c):
                    rejected_rows[market]+=1
                    continue
                  key=(market,code)
                  data[key][ds]=(c,h,l,vol,val,o)
                  names[key]=str(r.get('ISU_NM',''))
              if len(days)==60:break
              time.sleep(.12)
            if len(days)!=60 or days[0]!=target.strftime('%Y%m%d'):
              raise ValueError('TODAY_60_SESSION_SOURCE_INCOMPLETE')
            days.sort()
            session_coverage.sort(key=lambda x:x['date'])
            for coverage in session_coverage:
              if coverage['kospi_rows']<500 or coverage['kosdaq_rows']<800:
                raise ValueError('MARKET_COVERAGE_TOO_SMALL_'+coverage['date'])
            receipt['source_integrity']={'schema':'C3_KRX_SOURCE_PREFLIGHT_V1',
              'session_count':len(days),'first_session':days[0],'last_session':days[-1],
              'market_rows_latest':session_coverage[-1],
              'market_rows_min':{'KOSPI':min(x['kospi_rows'] for x in session_coverage),
                'KOSDAQ':min(x['kosdaq_rows'] for x in session_coverage)},
              'invalid_ohlcv_rows':dict(rejected_rows),
              'coverage_floor_policy':'KOSPI>=500,KOSDAQ>=800 per session; not official completeness certification',
              'regular_session_price_certified':False,'corporate_actions_certified':False}
            print('C3_SOURCE_PREFLIGHT',json.dumps(receipt['source_integrity'],ensure_ascii=False))
            bench=collections.defaultdict(list);eligible={}
            for key,s in data.items():
              if not all(d in s for d in days):continue
              a=[s[d] for d in days];c=[v[0] for v in a]
              eligible[key]=a
              bench[key[0]].append(c[-1]/c[-21]-1)
            med={k:statistics.median(v) for k,v in bench.items() if len(v)>=100}
            if len(med)!=2:raise ValueError('MARKET_BENCHMARK_MISSING')
            pool=[]
            for key,a in eligible.items():
              c=[x[0] for x in a];last=c[-1]
              ma5=statistics.mean(c[-5:]);ma20=statistics.mean(c[-20:]);ma60=statistics.mean(c)
              r20=last/c[-21]-1;rs=r20-med[key[0]]
              val=statistics.mean(x[4] for x in a[-20:])
              rvol=a[-1][3]/statistics.mean(x[3] for x in a[-21:-1])
              dist=last/ma20-1
              low=min(x[2] for x in a[-10:]);risk=1-low/last
              high=max(x[1] for x in a[-20:]);rr=((high-last)/last)/risk if risk>0 else 0
              if not (val>=1e9 and ma5>=ma20>=ma60 and last>=ma20 and .02<=r20<=.35 and rs>0):continue
              if not (-.01<=dist<=.08 and .01<=risk<=.08 and .4<=rvol<=4):continue
              score=round(40+min(rs*100,15)+min(r20*50,12)+max(0,12-abs(dist-.025)*150)+max(0,10-(risk-.02)*100)+min(max(rvol-.4,0)*3,6),2)
              # Confirmed swing-pivot and ATR14 risk-first reference; no fixed 0.5% stop.
              tr=[max(a[j][1]-a[j][2],abs(a[j][1]-a[j-1][0]),abs(a[j][2]-a[j-1][0])) for j in range(1,len(a))]
              atr14=statistics.mean(tr[-14:])
              # Use only confirmed pivot supports near the current MA20.
              # A distant historical low is not a useful entry support.
              piv=[a[j][2] for j in range(max(2,len(a)-25),len(a)-2)
                if all(a[j][2]<a[k][2] for k in (j-2,j-1,j+1,j+2))]
              nearby=[p for p in piv if ma20-1.5*atr14<=p<=ma20+.5*atr14]
              support=max(nearby) if nearby else None
              # Entry is a narrow ATR zone around tested support, not MA20 +/- 1-2%.
              # No valid support -> no invented entry/stop.
              # Exchange tick ladder for ordinary KOSPI/KOSDAQ shares.
              # Rounding is directional: do not raise entry ceiling or lower stop.
              def tick(p):
                return (1 if p<2000 else 5 if p<5000 else 10 if p<20000
                  else 50 if p<50000 else 100 if p<200000 else 500 if p<500000 else 1000)
              def executable(p,direction):
                if p is None:return None
                import decimal
                v=decimal.Decimal(str(p))
                # Iterate to respect tick changes at price-band boundaries.
                unit=tick(float(v))
                mode=decimal.ROUND_CEILING if direction=='up' else decimal.ROUND_FLOOR
                q=int((v/decimal.Decimal(unit)).to_integral_value(rounding=mode))*unit
                while tick(q)!=unit:
                  unit=tick(q)
                  q=int((v/decimal.Decimal(unit)).to_integral_value(rounding=mode))*unit
                return q
              raw_lo=max(support,ma20-.5*atr14) if support is not None else None
              raw_hi=min(ma20+.25*atr14,raw_lo+.6*atr14) if raw_lo is not None else None
              raw_stop=support-.5*atr14 if support is not None else None
              entry_lo=executable(raw_lo,'up')
              entry_hi=executable(raw_hi,'down')
              stop=executable(raw_stop,'up')
              high=max(x[1] for x in a[-20:])
              # Prior resistance must be above entry; use only completed sessions.
              r1=executable(high,'down') if entry_hi is not None and high>entry_hi else None
              r2=executable(max(x[1] for x in a[-60:]),'down')
              if r2<=max(high,entry_hi or high):r2=None
              rr_entry=(r1-entry_hi)/(entry_hi-stop) if r1 and stop is not None and entry_hi>stop else None
              risk_at_entry=(entry_hi-stop)/entry_hi if stop is not None and entry_hi else None
              # Distance to the actual executable observation zone, not to MA20.
              # A distant pullback may be technically valid but is not actionable now.
              entry_gap_pct=(max(entry_lo-last,0,last-entry_hi)/last*100
                if entry_lo is not None and entry_hi is not None else None)
              entry_status=('ENTRY_READY' if entry_lo is not None and entry_hi is not None and entry_lo<=last<=entry_hi
                else 'NEAR_ENTRY' if entry_gap_pct is not None and entry_gap_pct<=2.0 else 'WATCH')
              entry_ready=entry_status=='ENTRY_READY'
              # Ranking is forward-looking opportunity priority, not a backtested return estimate.
              opportunity_score=round(score-max(0,entry_gap_pct or 0)*2,2)
              # Guard against non-executable watch bands and stale resistance levels.
              # Latest close must be above stop, entry zone must lie within today's
              # 60-bar range and contain no inverted prices.
              geometry_ok=(entry_lo is not None and entry_hi is not None and entry_lo<entry_hi
                and stop is not None and stop<entry_lo and stop<last
                and risk_at_entry is not None and .015<=risk_at_entry<=.05
                and entry_hi>=last-1.5*atr14 and entry_lo<=last+.5*atr14
                and entry_hi<=last+atr14
                and r1 is not None and r1>max(entry_hi,last))
              # All risk, proximity, RR and selection decisions above use executable prices.
              # Independent rejection reasons; preserve raw metrics for audits.
              reasons=[]
              if support is None:reasons.append('NO_NEARBY_CONFIRMED_SUPPORT')
              if entry_lo is None or entry_hi is None or entry_lo>=entry_hi:reasons.append('INVALID_ENTRY_ZONE')
              if stop is None or entry_lo is None or stop>=entry_lo:reasons.append('INVALID_STOP_STRUCTURE')
              if risk_at_entry is None:reasons.append('RISK_NOT_COMPUTABLE')
              elif risk_at_entry<.015:reasons.append('RISK_BELOW_1_5PCT')
              elif risk_at_entry>.05:reasons.append('RISK_ABOVE_5PCT')
              if r1 is None or (entry_hi is not None and r1<=max(entry_hi,last)):
                reasons.append('NO_VALID_R1_ABOVE_CLOSE_AND_ENTRY')
              if stop is not None and stop>=last:reasons.append('STOP_NOT_BELOW_CLOSE')
              if entry_hi is not None and entry_hi>last+atr14:reasons.append('ENTRY_TOO_HIGH_VS_CLOSE')
              if rr_entry is None:reasons.append('RR_NOT_COMPUTABLE')
              if entry_lo is not None and entry_hi is not None and not (
                entry_hi>=last-1.5*atr14 and entry_lo<=last+.5*atr14):
                reasons.append('ENTRY_TOO_FAR_FROM_CLOSE')
              if not geometry_ok and not reasons:reasons.append('OTHER_GEOMETRY_FAILURE')
              # Legacy MA20 range is audit-only; never used for orders/selection.
              legacy_lo=round(ma20*.99);legacy_hi=round(ma20*1.02)
              legacy_stop=round(min(x[2] for x in a[-10:])*.995)
              legacy_r1=round(high) if high>legacy_hi else None
              legacy_risk=(legacy_hi-legacy_stop)/legacy_hi if legacy_hi>legacy_stop else None
              legacy_rr=(legacy_r1-legacy_hi)/(legacy_hi-legacy_stop) if legacy_r1 is not None and legacy_risk is not None and legacy_risk>0 else None
              if not geometry_ok:
                stop=None
                rr_entry=None
              pool.append({'market':key[0],'code':key[1],'name':names[key],'score':score,
                'close':round(last),'ma20':round(ma20),'low10':round(low),'high20':round(high),
                'rvol':round(rvol,2),'rs20pp':round(rs*100,2),'stop_distance_pct':round(risk*100,2),
                'entry_watch_low':entry_lo,'entry_watch_high':entry_hi,
                'raw_entry_low':round(raw_lo) if raw_lo is not None else None,
                'raw_entry_high':round(raw_hi) if raw_hi is not None else None,
                'raw_structural_stop':round(raw_stop) if raw_stop is not None else None,
                'price_tick_policy':'KRX_EQUITY_DIRECTIONAL_V1',
                'entry_method':'CONFIRMED_PIVOT_ATR_ZONE_V1',
                'entry_gap_pct':round(entry_gap_pct,2) if entry_gap_pct is not None else None,
                'entry_ready':bool(entry_ready),'entry_status':entry_status,
                'opportunity_score':opportunity_score,
                'financial_quality_status':'UNVERIFIED_DART_NOT_CONNECTED',
                'entry_risk_pct':round(risk_at_entry*100,2) if risk_at_entry is not None else None,
                'structural_stop_ref':stop,'r1_ref':r1,'r2_ref':r2,
                'atr14':round(atr14,2),'pivot_support':round(support) if support is not None else None,
                'geometry_validated':bool(geometry_ok),
                'rejection_reasons':reasons,
                'raw_rr_entry':round((r1-entry_hi)/(entry_hi-(support-.5*atr14)),2) if r1 is not None and entry_hi is not None and support is not None and entry_hi>support-.5*atr14 else None,
                'legacy_ma20_audit':{'entry_low':legacy_lo,'entry_high':legacy_hi,
                  'stop':legacy_stop,'risk_pct':round(legacy_risk*100,2) if legacy_risk is not None else None,
                  'rr_r1':round(legacy_rr,2) if legacy_rr is not None else None},
                'rr_entry_ref':round(rr_entry,2) if rr_entry is not None else None,
                'turnover20_krw':round(val),'ma5':round(ma5),'ma60':round(ma60),
                'return20_pct':round(r20*100,2),'ma20_distance_pct':round(dist*100,2),
                'status':entry_status if geometry_ok else 'PASS_RISK_GEOMETRY'})
            pool.sort(key=lambda z:(-z['opportunity_score'],-z['score'],-z['rs20pp'],z['market'],z['code']))
            # Separate research candidates from actionable technical watch candidates.
            # Only validated risk geometry may enter TOP5 images / Telegram.
            research_top5=pool[:5]
            qualified=[x for x in pool if x['geometry_validated']]
            # Never promote a far-away limit order zone as an immediate opportunity.
            # The 2% gap is an operational proximity gate, not a profitability claim.
            ready_watch=[x for x in qualified if x['entry_status']=='ENTRY_READY']
            near_watch=[x for x in qualified if x['entry_status']=='NEAR_ENTRY']
            far_watch=[x for x in qualified if x['entry_status']=='WATCH']
            selected=(ready_watch+near_watch)[:5]
            # Diagnostic evidence even when zero candidates qualify.
            audit={'schema':'C3_ENTRY_GEOMETRY_AUDIT_V1','asof':days[-1],
              'technical_candidate_count':len(pool),'qualified_count':len(qualified),
              'entry_ready_count':len(ready_watch),'near_entry_count':len(near_watch),'far_entry_count':len(far_watch),
              'rules':{'risk_min_pct':1.5,'risk_max_pct':5,'rr_min':None,'rr_policy':'REFERENCE_ONLY',
                'nearby_support_atr_below_ma20':1.5,'nearby_support_atr_above_ma20':.5},
              'candidates':[{'code':x['code'],'name':x['name'],'market':x['market'],
                'score':x['score'],'opportunity_score':x['opportunity_score'],
                'entry_gap_pct':x['entry_gap_pct'],'entry_ready':x['entry_ready'],'entry_status':x['entry_status'],
                'financial_quality_status':x['financial_quality_status'],
                'status':x['status'],'rejection_reasons':x['rejection_reasons'],
                'entry_low':x['entry_watch_low'],'entry_high':x['entry_watch_high'],
                'pivot_support':x['pivot_support'],'atr14':x['atr14'],
                'stop_ref':x['structural_stop_ref'],'risk_pct':x['entry_risk_pct'],
                'rr_r1':x['raw_rr_entry'],'legacy_ma20_audit':x['legacy_ma20_audit']}
                for x in pool]}
            (root/'entry_geometry_audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
            print('C3_GEOMETRY_AUDIT',json.dumps({'asof':days[-1],
              'technical_candidates':len(pool),'qualified':len(qualified),
              'entry_ready':len(ready_watch),'near_entry':len(near_watch),'far_entry':len(far_watch),
              'rejections':[{'code':x['code'],'reasons':x['rejection_reasons']} for x in pool]},
              ensure_ascii=False))
            # Research-only full qualified pool for finance-first image preview.
            # This does not alter legacy selected images or Telegram delivery.
            research_pool=[]
            for x in pool[:10]:
              key=(x['market'],x['code'])
              research_pool.append({
                'code':x['code'],'name':x['name'],'market':x['market'],
                'score':x['score'],'opportunity_score':x['opportunity_score'],
                'geometry_validated':x['geometry_validated'],
                'rejection_reasons':x['rejection_reasons'],
                'entry_status':x['entry_status'] if x['geometry_validated'] else 'WATCH',
                'entry_low':x['entry_watch_low'] if x['geometry_validated'] else None,
                'entry_high':x['entry_watch_high'] if x['geometry_validated'] else None,
                'stop_ref':x['structural_stop_ref'] if x['geometry_validated'] else None,
                'r1_ref':x['r1_ref'] if x['geometry_validated'] else None,
                'r2_ref':x['r2_ref'] if x['geometry_validated'] else None,
                'risk_pct':x['entry_risk_pct'] if x['geometry_validated'] else None,
                'close':x['close'],'ma5':x['ma5'],'ma20':x['ma20'],'ma60':x['ma60'],
                'bars':[{'date':d,'close':data[key][d][0],
                         'high':data[key][d][1],'low':data[key][d][2],
                         'volume':data[key][d][3]} for d in days]})
            (root/'qualified_chart_pool.json').write_text(json.dumps({
              'schema':'C3_QUALIFIED_CHART_POOL_RESEARCH_V1',
              'asof':days[-1],'candidates':research_pool},ensure_ascii=False)+'\n')
            for x in selected:
              key=(x['market'],x['code'])
              x['chart_bars']=[{'date':d,'close':data[key][d][0],'high':data[key][d][1],
                'low':data[key][d][2],'volume':data[key][d][3],'open':data[key][d][5]} for d in days]
            receipt.update({'status':'TOP5_RENDER_READY','asof':days[-1],
              'valid_60_session_symbols':len(eligible),'passing_symbols':len(pool),
              'qualified_entry_watch_count':len(qualified),
              'entry_ready_count':len(ready_watch),'near_entry_count':len(near_watch),'far_entry_count':len(far_watch),
              'research_top5':[{'code':x['code'],'name':x['name'],'score':x['score'],
                'geometry_validated':x['geometry_validated'],
                'entry_gap_pct':x['entry_gap_pct'],'status':x['status']} for x in research_top5],
              'candidates':selected,'selection':'Risk-geometry qualified technical-only; RR reference-only; PIT financial gate unavailable'})
            fontpath='/usr/share/fonts/truetype/nanum/NanumGothic.ttf'
            boldpath='/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf'
            def font(size,bold=False):return ImageFont.truetype(boldpath if bold else fontpath,size)
            # One full-height classic C3 card per selected symbol, never a five-panel sheet.
            INK=(42,43,44);SUB=(108,112,115);GOLD=(172,136,72)
            GREEN=(41,119,86);BLUE=(54,124,175);RED=(184,75,72);PURPLE=(133,104,160)
            images=[]
            for rank,x in enumerate(selected,1):
              bars=x['chart_bars'];closes=[v['close'] for v in bars]
              im=Image.new('RGB',(1400,1710),(250,249,245));draw=ImageDraw.Draw(im)
              draw.rectangle((0,0,1400,98),fill=INK);draw.rectangle((0,94,1400,100),fill=GOLD)
              draw.text((50,22),'강현AI PRO | C3 TOP5',font=font(46,True),fill=(243,230,205))
              draw.text((1100,32),days[-1][:4]+'.'+days[-1][4:6]+'.'+days[-1][6:],font=font(29),fill=(238,234,226))
