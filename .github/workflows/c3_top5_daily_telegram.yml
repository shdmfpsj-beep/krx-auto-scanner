        run: |
          python scripts/c3_all_candidate_report.py \
            --pool output/c3_top5/qualified_chart_pool.json \
            --selection output/c3_top5/financial_selection_research.json \
            --financial output/c3_top5/financial_pool_gate.json \
            --out output/c3_top5/all_candidate_report
      - name: Build finance-first conditional signal delivery manifest
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('output/c3_top5')
          result={'schema':'C3_FINANCE_FIRST_MANIFEST_V1','status':'ERROR_MANIFEST','decision':'ERROR',
                  'selected':[],'images':[],'telegram_photos_sent':0,'trade_approved':False}
          try:
            selection=json.loads((root/'financial_selection_research.json').read_text())
            receipt=json.loads((root/'receipt.json').read_text())
            result['operational_status']=selection.get('operational_status')
            result['financial_decision_counts']=selection.get('financial_decision_counts',{})
            if selection.get('status')=='REVIEW_REQUIRED' and selection.get('operational_status') in ('HOLD_FINANCIAL_UNVERIFIED','HOLD_DATA_INCOMPLETE'):
              if selection.get('selected') or selection.get('signals') or selection.get('selected_count',0)!=0:
                raise ValueError('HOLD_WITH_BUY_SIGNALS_FORBIDDEN')
              result.update(status=selection['operational_status'],asof=receipt.get('asof'),decision='REVIEW_REQUIRED',
                            signals=[],financial_coverage_complete=False)
              raise StopIteration('FINANCIAL_REVIEW_REQUIRED_NO_SEND')
            if selection.get('status')=='ERROR_FINANCIAL_EVIDENCE':
              result.update(status='ERROR_FINANCIAL_EVIDENCE',asof=receipt.get('asof'),
                            financial_evidence_status=selection.get('financial_evidence_status'),
                            financial_coverage_complete=False)
              raise StopIteration('FINANCIAL_EVIDENCE_FAILED')
            preview=json.loads((root/'financial_preview'/'financial_preview_manifest.json').read_text())
            selected=selection.get('selected',[])
            images=preview.get('images',[])
            if not (selection.get('asof')==preview.get('asof')==receipt.get('asof')):
              raise ValueError('ASOF_MISMATCH')
            if selection.get('status')!='CONDITIONAL_SIGNALS' or not selection.get('coverage_complete'):
              raise ValueError('FINANCIAL_SELECTION_NOT_VALID')
            if len(selected)>5 or len(selected)!=len(images):
              raise ValueError('SELECTION_IMAGE_COUNT_MISMATCH')
            if len({x['code'] for x in selected})!=len(selected):
              raise ValueError('DUPLICATE_SYMBOL')
            for item,im in zip(selected,images):
              if item['code']!=im['code']:
                raise ValueError('IMAGE_SYMBOL_MISMATCH')
              filename=im['image']
              if Path(filename).name!=filename:
                raise ValueError('UNSAFE_IMAGE_NAME')
              p=root/'financial_preview'/filename
              if not p.is_file() or p.stat().st_size<10000:
                raise ValueError('IMAGE_MISSING')
            signals=selection.get('signals',[])
            if len(signals)!=len(selected):
              raise ValueError('SIGNAL_COUNT_MISMATCH')
            for item,signal in zip(selected,signals):
              if item['code']!=signal.get('code'):
                raise ValueError('SIGNAL_SYMBOL_MISMATCH')
              if signal.get('signal')!=('BUY_CONSIDER' if item.get('technical_status')=='ENTRY_READY' else 'WAIT_FOR_ENTRY'):
                raise ValueError('SIGNAL_STATUS_MISMATCH')
            result.update(asof=selection['asof'],selected=selected,images=images,
                          financial_coverage_complete=selection.get('coverage_complete',False),
                          decision=selection.get('decision','CASH'),
                          signals=selection.get('signals',[]),
                          point_in_time_certification_required=False,
                          independent_price_certification_required=False,
                          data_quality_validation_required=True)
            result['status']='FINANCE_FIRST_PREVIEW_READY_NO_SEND' if selected else 'CASH_NO_FINANCIAL_CANDIDATES'
          except StopIteration:
            pass
          except (OSError,KeyError,TypeError,ValueError,AttributeError) as e:
            result['status']='ERROR_FINANCE_FIRST_MANIFEST_INVALID'
            result['error']=type(e).__name__+': '+str(e)[:160]
          root.mkdir(parents=True,exist_ok=True)
          (root/'finance_first_delivery_manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('C3_FINANCE_FIRST_DELIVERY',json.dumps({'status':result['status'],
            'selected_count':len(result['selected']),'telegram_photos_sent':0},ensure_ascii=False))
          PY
      - name: Validate delivery on every run; send only on scheduled main
        env:
          GH_TOKEN: ${{ github.token }}
          C3_TEST_SEND_TELEGRAM: ${{ inputs.test_send_telegram }}
          C3_MANUAL_ASOF: ${{ inputs.asof }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,sys,urllib.request,urllib.error,uuid
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,'scripts')
          from c3_top5_financial_selection import valid_entry
          from c3_all_candidate_report import image_identity
          root=Path('output/c3_top5')
          root.mkdir(parents=True,exist_ok=True)
          delivery={'schema':'C3_DELIVERY_RESULT_V1','status':'RUNNING','stage':'FINAL_VALIDATION',
                    'run_id':os.environ.get('GITHUB_RUN_ID'),'photos':[],'telegram_photos_sent':0}
          def save_delivery(status=None,**fields):
            if status:delivery['status']=status
            delivery.update(fields)
            (root/'delivery_result.json').write_text(json.dumps(delivery,ensure_ascii=False,indent=2)+'\n')
          def record_failure(kind,error,tb):
            # HTTP exception strings may contain credential-bearing request URLs.
            safe=str(error)[:160] if kind is ValueError else kind.__name__
            save_delivery('ERROR',error=safe)
            sys.__excepthook__(kind,error,tb)
          sys.excepthook=record_failure
          save_delivery()
          manifest=json.loads((root/'finance_first_delivery_manifest.json').read_text())
          delivery['operational_status']=manifest.get('operational_status')
          if manifest.get('status')=='ERROR_FINANCIAL_EVIDENCE':
            delivery['stage']='FINANCIAL_VERIFICATION'
            raise ValueError('FINANCIAL_EVIDENCE_FAILED_'+str(manifest.get('financial_evidence_status')))
          receipt=json.loads((root/'receipt.json').read_text())
          source=receipt.get('source_integrity',{})
          report=json.loads((root/'all_candidate_report'/'manifest.json').read_text())
          delivery['asof']=report.get('asof')
          if report.get('asof')!=receipt.get('asof'):
            raise ValueError('ALL_CANDIDATE_DATE_MISMATCH')
          if source.get('session_count',0)<60 or source.get('last_session')!=report.get('asof'):
            raise ValueError('SOURCE_DATE_OR_SESSION_MISMATCH')
          if source.get('market_rows_min',{}).get('KOSPI',0)<500 or source.get('market_rows_min',{}).get('KOSDAQ',0)<800:
            raise ValueError('MARKET_COVERAGE_BELOW_FLOOR')
          if manifest.get('status') in ('HOLD_FINANCIAL_UNVERIFIED','HOLD_DATA_INCOMPLETE'):
            if (manifest.get('asof')!=report.get('asof') or manifest.get('decision')!='REVIEW_REQUIRED'
                or manifest.get('selected') or manifest.get('images') or manifest.get('signals')
                or any(row.get('top5') for row in report.get('candidates',[]))):
              raise ValueError('INVALID_HOLD_DELIVERY_MANIFEST')
            save_delivery('HOLD',stage='FINANCIAL_VERIFICATION',operational_status=manifest['status'])
            print('C3_FINANCIAL_HOLD_NO_SEND')
            raise SystemExit(0)
          if manifest.get('status') not in ('FINANCE_FIRST_PREVIEW_READY_NO_SEND','CASH_NO_FINANCIAL_CANDIDATES'):
            raise ValueError('FINANCE_FIRST_MANIFEST_NOT_VALID')
          if manifest.get('asof')!=report.get('asof') or not manifest.get('financial_coverage_complete'):
            raise ValueError('FINANCIAL_COVERAGE_OR_DATE_NOT_VALID')
          all_candidates=report.get('candidates',[])
          selected=[x for x in all_candidates if x.get('top5')]
          approved_codes=[x.get('code') for x in manifest.get('selected',[])]
          if [x['code'] for x in selected]!=approved_codes:
            raise ValueError('TOP5_MANIFEST_SYMBOL_MISMATCH')
          if report.get('selected_codes')!=approved_codes:
            raise ValueError('TOP5_REPORT_SELECTION_MISMATCH')
          if not selected:
            save_delivery('CASH',asof=report['asof'],stage='COMPLETE')
            print('C3_FINAL_DELIVERY CASH_NO_QUALIFIED_TOP5_NO_SEND')
            raise SystemExit(0)
          if len(selected)>5 or len({x['code'] for x in selected})!=len(selected):
            raise ValueError('INVALID_TOP5_SELECTION')
          validated=[]
          for i,item in enumerate(selected,1):
            delivery['stage']='ENTRY_VALIDATION'
            if (not item.get('top5') or item.get('rank')!=i or
                item.get('financial_eligibility')!='PASS' or
                item.get('composite_score') is None or
                item.get('status') not in ('ENTRY_READY','NEAR_ENTRY')):
              raise ValueError('INVALID_TOP5_RANKING')
            if not valid_entry({**item,'close':item.get('asof_close')}):
              raise ValueError('UNSAFE_ENTRY_STOP_GEOMETRY_'+item['code'])
            if item.get('status')!=manifest['selected'][i-1].get('technical_status'):
              raise ValueError('SELECTED_ENTRY_STATUS_MISMATCH_'+item['code'])
            if (not item.get('entry_valid_until') or
                item['entry_valid_until']!=report.get('entry_valid_until') or
                item['entry_valid_until']!=receipt.get('entry_valid_until')):
              raise ValueError('ENTRY_VALIDITY_MISMATCH_'+item['code'])
            if item.get('name')!=manifest['selected'][i-1].get('name'):
              raise ValueError('SELECTED_NAME_MISMATCH_'+item['code'])
            filename=item['image']
            delivery['stage']='IMAGE_VALIDATION'
            if Path(filename).name!=filename:
              raise ValueError('INVALID_IMAGE_PATH')
            p=root/'all_candidate_report'/filename
            if not p.is_file() or p.stat().st_size<10000:
              raise ValueError('MISSING_CANDIDATE_IMAGE')
            if hashlib.sha256(p.read_bytes()).hexdigest()!=item.get('image_sha256'):
              raise ValueError('IMAGE_HASH_MISMATCH_'+item['code'])
            with Image.open(p) as check:check.verify()
            with Image.open(p) as check:
              if check.format!='PNG' or check.size!=(1400,1710):
                raise ValueError('INVALID_CANDIDATE_IMAGE')
              if json.loads(check.info.get('c3_candidate','null'))!=image_identity(item,report['asof']):
                raise ValueError('IMAGE_CONTENT_MISMATCH_'+item['code'])
            validated.append(p)
          print('C3_FINAL_DELIVERY_PREFLIGHT_PASSED',report['asof'],len(validated))
          event=os.environ.get('GITHUB_EVENT_NAME')
          on_main=os.environ.get('GITHUB_REF_NAME')=='main'
          test_requested=os.environ.get('C3_TEST_SEND_TELEGRAM','').lower()=='true'
          is_test=(event=='workflow_dispatch' and test_requested and
            os.environ.get('GITHUB_REF_NAME')=='fix/c3-top5-confirmed-chart-20261120' and
            os.environ.get('C3_MANUAL_ASOF','').strip()=='20261119' and report['asof']=='20261119')
          is_production=(event=='schedule' and on_main)
          if test_requested and not is_test:
            raise ValueError('TEST_SEND_REQUIRES_CORRECTED_CHART_BRANCH_ASOF_20261119')
          if not (is_test or is_production):
            save_delivery('DRY_RUN',asof=report['asof'],stage='COMPLETE',selected_codes=approved_codes)
            print('C3_FINAL_DELIVERY_DRY_RUN_NO_TELEGRAM')
            raise SystemExit(0)
          if is_test:
            print('C3_TEST_SEND_EXPLICITLY_AUTHORIZED_20261119')
          token=os.environ.get('TELEGRAM_BOT_TOKEN','')
          chat=os.environ.get('TELEGRAM_CHAT_ID','')
          if not token or not chat:
            raise ValueError('TELEGRAM_CREDENTIALS_MISSING')
          # Create-only daily reservation BEFORE any external send. No automatic retry.
          delivery['stage']='SEND_RESERVATION'
          date=report['asof']
          marker_path=('receipts/c3_top5_classic_final_test_v2/'+date+'.json' if is_test else 'receipts/c3_top5_daily/'+date+'.json')
          marker={'schema':'C3_FINANCE_FIRST_SEND_RESERVATION_V1','asof':date,
                  'mode':'EXPLICIT_CLASSIC_FINAL_TEST_V2' if is_test else 'SCHEDULED_PRODUCTION',
                  'run_id':os.environ['GITHUB_RUN_ID'],'status':'RESERVED_BEFORE_SEND',
                  'selected_codes':[x['code'] for x in selected],
                  'image_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in validated},
                  'disclaimer':'CONDITIONAL_SIGNAL_NO_INDEPENDENT_CERTIFICATION_USER_TRADES'}
          payload=json.dumps({'message':'Reserve C3 finance-first research chart delivery '+date,
             'content':base64.b64encode(json.dumps(marker,ensure_ascii=False).encode()).decode(),
             'branch':('fix/c3-top5-confirmed-chart-20261120' if is_test else 'main')}).encode()
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'+marker_path,
             data=payload,method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
             'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
             'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as response:
            if response.status!=201:
              raise ValueError('SEND_RESERVATION_NOT_CREATED')
          print('C3_FINANCE_FIRST_RESERVED',date,len(validated),'corrected_chart_test' if is_test else 'production')
          for i,(item,p) in enumerate(zip(selected,validated),1):
            save_delivery(stage='TELEGRAM_SEND',attempting_code=item['code'])
            boundary='----C3'+uuid.uuid4().hex
            def part(name,value,filename=None,ctype='text/plain'):
              head='--'+boundary+'\r\nContent-Disposition: form-data; name="'+name+'"'
              if filename:head+='; filename="'+filename+'"'
              head+='\r\nContent-Type: '+ctype+'\r\n\r\n'
              return head.encode()+value+b'\r\n'
            # Image-only Telegram delivery: omit the caption multipart field entirely.
            body=part('chat_id',chat.encode())+part('photo',p.read_bytes(),p.name,'image/png')+('--'+boundary+'--\r\n').encode()
            request=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendPhoto',
              data=body,method='POST',headers={'Content-Type':'multipart/form-data; boundary='+boundary})
            with urllib.request.urlopen(request,timeout=30) as response:
              answer=json.load(response)
            if not answer.get('ok'):
              raise ValueError('TELEGRAM_SEND_FAILED_'+str(i))
            message_id=answer.get('result',{}).get('message_id')
            if not isinstance(message_id,int) or isinstance(message_id,bool) or message_id<=0:
              raise ValueError('TELEGRAM_MESSAGE_ID_MISSING_'+str(i))
            delivery['photos'].append({'code':item['code'],'image':p.name,
              'image_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'telegram_message_id':message_id})
            save_delivery(telegram_photos_sent=len(delivery['photos']))
            print('C3_FINANCE_FIRST_PHOTO_SENT',i,item['code'],'telegram_message_id',answer.get('result',{}).get('message_id'),'mode','TEST' if is_test else 'PRODUCTION')
          save_delivery('SENT',asof=date,stage='COMPLETE')
          print('C3_ALL_CANDIDATES_DELIVERED',date,len(validated),'mode','TEST' if is_test else 'PRODUCTION')
          PY
      - name: Publish operational outcome without sending
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('output/c3_top5');root.mkdir(parents=True,exist_ok=True)
          try:
            selection=json.loads((root/'financial_selection_research.json').read_text())
            delivery=json.loads((root/'delivery_result.json').read_text())
            state=selection.get('operational_status','ERROR')
            allowed={'TOP5_READY':{'SENT','DRY_RUN'},'CASH_NO_ELIGIBLE':{'CASH'},
              'HOLD_FINANCIAL_UNVERIFIED':{'HOLD'},'HOLD_DATA_INCOMPLETE':{'HOLD'}}
            if delivery.get('status') not in allowed.get(state,set()):state='ERROR'
            outcome={'asof':selection.get('asof'),'operational_status':state,
              'program_status':'ERROR' if state=='ERROR' else 'COMPLETED',
              'delivery_status':delivery.get('status'),'telegram_photos_sent':delivery.get('telegram_photos_sent',0),
              'selected_count':selection.get('selected_count',0),
              'financial_decision_counts':selection.get('financial_decision_counts',{}),
              'approval_required_count':selection.get('approval_required_count'),
              'nonblocking_financial_unverified_codes':selection.get('nonblocking_financial_unverified_codes',[])}
          except (OSError,ValueError,TypeError,AttributeError):
            outcome={'operational_status':'ERROR','program_status':'ERROR','error':'OPERATING_RESULT_UNAVAILABLE'}
          (root/'execution_outcome.json').write_text(json.dumps(outcome,ensure_ascii=False,indent=2)+'\n')
          print('C3_EXECUTION_OUTCOME',json.dumps(outcome,ensure_ascii=False))
          if os.environ.get('GITHUB_STEP_SUMMARY'):
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### C3 operational outcome\n\n'+json.dumps(outcome,ensure_ascii=False)+'\n')
          raise SystemExit(1 if outcome['operational_status']=='ERROR' else 0)
          PY
