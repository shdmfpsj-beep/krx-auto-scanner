              draw.text((54,1504),'RS20 '+format(x['rs20pp'],'+.2f')+'%p   RVOL '+str(x['rvol'])+'   MA20 이격 '+format(x['ma20_distance_pct'],'+.2f')+'%',font=font(27),fill=SUB)
              draw.line((48,1570,1352,1570),fill=(219,214,204),width=2)
