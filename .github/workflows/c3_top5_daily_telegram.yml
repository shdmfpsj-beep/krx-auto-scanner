            receipt['image_sha256']=[hashlib.sha256(p.read_bytes()).hexdigest() for p in images]
            receipt['image_files']=[p.name for p in images]
            receipt['image_count']=len(images)
            # Recheck executable prices, risk and chart integrity before send reservation.
            def tick_ok(v):
              return isinstance(v,int) and v>0 and v%tick(v)==0
            for x in selected:
              prices=[x['entry_watch_low'],x['entry_watch_high'],x['structural_stop_ref'],
                x['r1_ref']]+([x['r2_ref']] if x['r2_ref'] is not None else [])
              if not all(tick_ok(v) for v in prices):
                raise ValueError('NON_EXECUTABLE_PRICE_'+x['code'])
              if not (x['structural_stop_ref']<x['entry_watch_low']<=x['entry_watch_high']<x['r1_ref']):
                raise ValueError('INVALID_PRICE_ORDER_'+x['code'])
              actual_risk=(x['entry_watch_high']-x['structural_stop_ref'])/x['entry_watch_high']
              if not (.015<=actual_risk<=.05):
                raise ValueError('POST_ROUNDING_RISK_INVALID_'+x['code'])
              if len(x['chart_bars'])!=60 or x['chart_bars'][-1]['date']!=days[-1]:
                raise ValueError('CHART_SOURCE_MISMATCH_'+x['code'])
            receipt['price_integrity']='EXECUTABLE_TICKS_AND_RISK_VERIFIED'
