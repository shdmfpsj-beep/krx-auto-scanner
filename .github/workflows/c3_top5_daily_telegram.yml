            if not images:
              receipt['status']='CASH_NO_CANDIDATES_NO_SEND'
            # Never send preliminary technical-only candidates before financial review.
            receipt['status']='PRE_FINANCIAL_TECHNICAL_PREVIEW_NO_SEND'
