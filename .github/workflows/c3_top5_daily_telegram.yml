name: C3 TOP5 classic per-stock Telegram (user trades)
on:
  workflow_dispatch:
    inputs:
      asof:
        description: 'Optional KRX as-of date YYYYMMDD (manual preview only)'
        required: false
        type: string
  schedule:
    # KST 23:30 Monday-Friday; GitHub scheduling can be delayed.
    - cron: '30 14 * * 1-5'
permissions:
  contents: write
concurrency:
  group: c3-top5-daily-classic-per-stock
  cancel-in-progress: false
jobs:
  top5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install image renderer and Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python3 -m pip install pillow --disable-pip-version-check
      - name: Syntax check embedded Python before KRX calls
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import urllib.request,os,json,base64
          # Checkout is intentionally skipped because the repository contains
          # a filename that prevents a full checkout on the runner.
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.github/workflows/c3_top5_daily_telegram.yml?ref='+os.environ['GITHUB_SHA']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r:obj=json.load(r)
          workflow=base64.b64decode(obj['content']).decode()
          # Split lines rather than searching for literal escaped newline sequences.
          lines=workflow.splitlines()
          idx=next(i for i,line in enumerate(lines)
            if line.strip()=='- name: Collect KRX sessions and render one classic image per stock')
          start=next(i for i in range(idx+1,len(lines)) if lines[i].strip() in ("python3 - <<'PY'","python - <<'PY'"))+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          ast.parse(code,filename='c3_top5_embedded.py')
          print('EMBEDDED_PYTHON_SYNTAX_OK')
          PY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Collect KRX sessions and render one classic image per stock
        shell: bash
        env:
          C3_MANUAL_ASOF: ${{ inputs.asof }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os,json,csv,io,datetime,urllib.request,urllib.parse,urllib.error,collections,statistics,math,time,hashlib
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from PIL import Image,ImageDraw,ImageFont
          root=Path('output/c3_top5');root.mkdir(parents=True,exist_ok=True)
          receipt={'schema':'C3_TOP5_DAILY_V1','status':'HOLD','decision':'CASH','orders_enabled':False,
            'user_executes_trades':True,'telegram_photos_sent':0,'candidates':[],
            'limitations':['Official KRX daily bars are not independently 15:30 regular-only certified',
            'Corporate-action adjustments and PIT financial quality not verified',
            'Entry references are not orders or investment recommendations',
            'A reserved send date is never retried automatically after an uncertain Telegram outcome']}
          def fetch(day,endpoint):
            u='https://data-dbg.krx.co.kr/svc/apis/sto/'+endpoint+'?'+urllib.parse.urlencode({'basDd':day})
            req=urllib.request.Request(u,headers={'AUTH_KEY':os.environ['KRX_AUTH_KEY'],'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=25) as res:raw=res.read(12*1024*1024+1)
            if len(raw)>12*1024*1024:raise ValueError('RESPONSE_TOO_LARGE')
            z=json.loads(raw)
            a=z.get('OutBlock_1')
            if not isinstance(a,list):raise ValueError('MISSING_OUTBLOCK')
            return a
          def num(v):
            try:
              x=float(str(v).replace(',','').strip())
              return x if math.isfinite(x) else None
            except:return None
          try:
            if not os.environ.get('KRX_AUTH_KEY'):raise ValueError('KRX_KEY_MISSING')
            now=datetime.datetime.now(ZoneInfo('Asia/Seoul'))
            target=now.date()
            # A delayed scheduled run can start the next morning. Always use the
            # last completed weekday, not the wall-clock calendar date.
            # KRX availability is checked below; holidays fail closed as incomplete.
            if now.hour<21:
              target-=datetime.timedelta(days=1)
            while target.weekday()>4:
              target-=datetime.timedelta(days=1)
            if os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch':
              receipt['preview_source_policy']='NO_SEND_MANUAL_PREVIEW'
              manual_asof=os.environ.get('C3_MANUAL_ASOF','').strip()
              if manual_asof:
                if len(manual_asof)!=8 or not manual_asof.isdigit():raise ValueError('INVALID_MANUAL_ASOF')
                target=datetime.datetime.strptime(manual_asof,'%Y%m%d').date()
                if target>now.date() or target.weekday()>4:raise ValueError('INVALID_MANUAL_ASOF_DATE')
            days=[];data=collections.defaultdict(dict);names={}
            for offset in range(105):
              d=target-datetime.timedelta(days=offset)
              if d.weekday()>4:continue
              ds=d.strftime('%Y%m%d')
              a=fetch(ds,'stk_bydd_trd');b=fetch(ds,'ksq_bydd_trd')
              if not a and not b:continue
              if not a or not b:raise ValueError('PARTIAL_MARKET_'+ds)
              days.append(ds)
              for market,rows in (('KOSPI',a),('KOSDAQ',b)):
                for r in rows:
                  code=str(r.get('ISU_CD','')).strip()
                  o,h,l,c=[num(r.get(k)) for k in ('TDD_OPNPRC','TDD_HGPRC','TDD_LWPRC','TDD_CLSPRC')]
                  vol=num(r.get('ACC_TRDVOL'));val=num(r.get('ACC_TRDVAL'))
                  if not code or None in (o,h,l,c,vol,val) or min(o,h,l,c)<=0 or vol<=0 or val<=0 or l>min(o,c) or h<max(o,c):continue
                  key=(market,code)
                  data[key][ds]=(c,h,l,vol,val,o)
                  names[key]=str(r.get('ISU_NM',''))
              if len(days)==60:break
              time.sleep(.12)
            if len(days)!=60 or days[0]!=target.strftime('%Y%m%d'):
              raise ValueError('TODAY_60_SESSION_SOURCE_INCOMPLETE')
            days.sort()
            bench=collections.defaultdict(list);eligible={}
            for key,s in data.items():
              if not all(d in s for d in days):continue
              a=[s[d] for d in days];c=[v[0] for v in a]
              eligible[key]=a
              bench[key[0]].append(c[-1]/c[-21]-1)
            med={k:statistics.median(v) for k,v in bench.items() if len(v)>=100}
            if len(med)!=2:raise ValueError('MARKET_BENCHMARK_MISSING')
            pool=[]
            for key,a in eligible.items():
              c=[x[0] for x in a];last=c[-1]
              ma5=statistics.mean(c[-5:]);ma20=statistics.mean(c[-20:]);ma60=statistics.mean(c)
              r20=last/c[-21]-1;rs=r20-med[key[0]]
              val=statistics.mean(x[4] for x in a[-20:])
              rvol=a[-1][3]/statistics.mean(x[3] for x in a[-21:-1])
              dist=last/ma20-1
              low=min(x[2] for x in a[-10:]);risk=1-low/last
              high=max(x[1] for x in a[-20:]);rr=((high-last)/last)/risk if risk>0 else 0
              if not (val>=1e9 and ma5>=ma20>=ma60 and last>=ma20 and .02<=r20<=.35 and rs>0):continue
              if not (-.01<=dist<=.08 and .01<=risk<=.08 and .4<=rvol<=4):continue
              score=round(40+min(rs*100,15)+min(r20*50,12)+max(0,12-abs(dist-.025)*150)+max(0,10-(risk-.02)*100)+min(max(rvol-.4,0)*3,6),2)
              # Confirmed swing-pivot and ATR14 risk-first reference; no fixed 0.5% stop.
              tr=[max(a[j][1]-a[j][2],abs(a[j][1]-a[j-1][0]),abs(a[j][2]-a[j-1][0])) for j in range(1,len(a))]
              atr14=statistics.mean(tr[-14:])
              # Use only confirmed pivot supports near the current MA20.
              # A distant historical low is not a useful entry support.
              piv=[a[j][2] for j in range(max(2,len(a)-25),len(a)-2)
                if all(a[j][2]<a[k][2] for k in (j-2,j-1,j+1,j+2))]
              nearby=[p for p in piv if ma20-1.5*atr14<=p<=ma20+.5*atr14]
              support=max(nearby) if nearby else None
              # Entry is a narrow ATR zone around tested support, not MA20 +/- 1-2%.
              # No valid support -> no invented entry/stop.
              entry_lo=round(max(support,ma20-.5*atr14)) if support is not None else None
              entry_hi=round(min(ma20+.25*atr14,entry_lo+.6*atr14)) if entry_lo is not None else None
              stop=round(support-.5*atr14) if support is not None else None
              high=max(x[1] for x in a[-20:])
              # Prior resistance must be above entry; use only completed sessions.
              r1=round(high) if entry_hi is not None and high>entry_hi else None
              r2=round(max(x[1] for x in a[-60:]))
              if r2<=max(high,entry_hi or high):r2=None
              rr_entry=(r1-entry_hi)/(entry_hi-stop) if r1 and stop is not None and entry_hi>stop else None
              risk_at_entry=(entry_hi-stop)/entry_hi if stop is not None and entry_hi else None
              # Guard against non-executable watch bands and stale resistance levels.
              # Latest close must be above stop, entry zone must lie within today's
              # 60-bar range and contain no inverted prices.
              geometry_ok=(entry_lo is not None and entry_hi is not None and entry_lo<entry_hi
                and stop is not None and stop<entry_lo and stop<last
                and risk_at_entry is not None and .015<=risk_at_entry<=.05
                and entry_hi>=last-1.5*atr14 and entry_lo<=last+.5*atr14
                and entry_hi<=last+atr14
                and r1 is not None and r1>max(entry_hi,last))
              # Independent rejection reasons; preserve raw metrics for audits.
              reasons=[]
              if support is None:reasons.append('NO_NEARBY_CONFIRMED_SUPPORT')
              if entry_lo is None or entry_hi is None or entry_lo>=entry_hi:reasons.append('INVALID_ENTRY_ZONE')
              if stop is None or entry_lo is None or stop>=entry_lo:reasons.append('INVALID_STOP_STRUCTURE')
              if risk_at_entry is None:reasons.append('RISK_NOT_COMPUTABLE')
              elif risk_at_entry<.015:reasons.append('RISK_BELOW_1_5PCT')
              elif risk_at_entry>.05:reasons.append('RISK_ABOVE_5PCT')
              if r1 is None or (entry_hi is not None and r1<=max(entry_hi,last)):
                reasons.append('NO_VALID_R1_ABOVE_CLOSE_AND_ENTRY')
              if stop is not None and stop>=last:reasons.append('STOP_NOT_BELOW_CLOSE')
              if entry_hi is not None and entry_hi>last+atr14:reasons.append('ENTRY_TOO_HIGH_VS_CLOSE')
              if rr_entry is None:reasons.append('RR_NOT_COMPUTABLE')
              if entry_lo is not None and entry_hi is not None and not (
                entry_hi>=last-1.5*atr14 and entry_lo<=last+.5*atr14):
                reasons.append('ENTRY_TOO_FAR_FROM_CLOSE')
              if not geometry_ok and not reasons:reasons.append('OTHER_GEOMETRY_FAILURE')
              # Legacy MA20 range is audit-only; never used for orders/selection.
              legacy_lo=round(ma20*.99);legacy_hi=round(ma20*1.02)
              legacy_stop=round(min(x[2] for x in a[-10:])*.995)
              legacy_r1=round(high) if high>legacy_hi else None
              legacy_risk=(legacy_hi-legacy_stop)/legacy_hi if legacy_hi>legacy_stop else None
              legacy_rr=(legacy_r1-legacy_hi)/(legacy_hi-legacy_stop) if legacy_r1 is not None and legacy_risk is not None and legacy_risk>0 else None
              if not geometry_ok:
                stop=None
                rr_entry=None
              pool.append({'market':key[0],'code':key[1],'name':names[key],'score':score,
                'close':round(last),'ma20':round(ma20),'low10':round(low),'high20':round(high),
                'rvol':round(rvol,2),'rs20pp':round(rs*100,2),'stop_distance_pct':round(risk*100,2),
                'entry_watch_low':entry_lo,'entry_watch_high':entry_hi,
                'entry_method':'CONFIRMED_PIVOT_ATR_ZONE_V1',
                'entry_risk_pct':round(risk_at_entry*100,2) if risk_at_entry is not None else None,
                'structural_stop_ref':stop,'r1_ref':r1,'r2_ref':r2,
                'atr14':round(atr14,2),'pivot_support':round(support) if support is not None else None,
                'geometry_validated':bool(geometry_ok),
                'rejection_reasons':reasons,
                'raw_rr_entry':round((r1-entry_hi)/(entry_hi-(support-.5*atr14)),2) if r1 is not None and entry_hi is not None and support is not None and entry_hi>support-.5*atr14 else None,
                'legacy_ma20_audit':{'entry_low':legacy_lo,'entry_high':legacy_hi,
                  'stop':legacy_stop,'risk_pct':round(legacy_risk*100,2) if legacy_risk is not None else None,
                  'rr_r1':round(legacy_rr,2) if legacy_rr is not None else None},
                'rr_entry_ref':round(rr_entry,2) if rr_entry is not None else None,
                'turnover20_krw':round(val),'ma5':round(ma5),'ma60':round(ma60),
                'return20_pct':round(r20*100,2),'ma20_distance_pct':round(dist*100,2),
                'status':'ENTRY_WATCH' if geometry_ok else 'PASS_RISK_GEOMETRY'})
            pool.sort(key=lambda z:(-z['score'],-z['rs20pp'],z['market'],z['code']))
            # Separate research candidates from actionable technical watch candidates.
            # Only validated risk geometry may enter TOP5 images / Telegram.
            research_top5=pool[:5]
            qualified=[x for x in pool if x['geometry_validated']]
            selected=qualified[:5]
            # Diagnostic evidence even when zero candidates qualify.
            audit={'schema':'C3_ENTRY_GEOMETRY_AUDIT_V1','asof':days[-1],
              'technical_candidate_count':len(pool),'qualified_count':len(qualified),
              'rules':{'risk_min_pct':1.5,'risk_max_pct':5,'rr_min':None,'rr_policy':'REFERENCE_ONLY',
                'nearby_support_atr_below_ma20':1.5,'nearby_support_atr_above_ma20':.5},
              'candidates':[{'code':x['code'],'name':x['name'],'market':x['market'],
                'score':x['score'],'status':x['status'],'rejection_reasons':x['rejection_reasons'],
                'entry_low':x['entry_watch_low'],'entry_high':x['entry_watch_high'],
                'pivot_support':x['pivot_support'],'atr14':x['atr14'],
                'stop_ref':x['structural_stop_ref'],'risk_pct':x['entry_risk_pct'],
                'rr_r1':x['raw_rr_entry'],'legacy_ma20_audit':x['legacy_ma20_audit']}
                for x in pool]}
            (root/'entry_geometry_audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
            print('C3_GEOMETRY_AUDIT',json.dumps({'asof':days[-1],
              'technical_candidates':len(pool),'qualified':len(qualified),
              'rejections':[{'code':x['code'],'reasons':x['rejection_reasons']} for x in pool]},
              ensure_ascii=False))
            for x in selected:
              key=(x['market'],x['code'])
              x['chart_bars']=[{'date':d,'close':data[key][d][0],'high':data[key][d][1],
                'low':data[key][d][2],'volume':data[key][d][3],'open':data[key][d][5]} for d in days]
            receipt.update({'status':'TOP5_RENDER_READY','asof':days[-1],
              'valid_60_session_symbols':len(eligible),'passing_symbols':len(pool),
              'qualified_entry_watch_count':len(qualified),
              'research_top5':[{'code':x['code'],'name':x['name'],'score':x['score'],
                'geometry_validated':x['geometry_validated'],'status':x['status']} for x in research_top5],
              'candidates':selected,'selection':'Risk-geometry qualified technical-only; RR reference-only; PIT financial gate unavailable'})
            fontpath='/usr/share/fonts/truetype/nanum/NanumGothic.ttf'
            boldpath='/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf'
            def font(size,bold=False):return ImageFont.truetype(boldpath if bold else fontpath,size)
            # One full-height classic C3 card per selected symbol, never a five-panel sheet.
            INK=(42,43,44);SUB=(108,112,115);GOLD=(172,136,72)
            GREEN=(41,119,86);BLUE=(54,124,175);RED=(184,75,72);PURPLE=(133,104,160)
            images=[]
            for rank,x in enumerate(selected,1):
              bars=x['chart_bars'];closes=[v['close'] for v in bars]
              im=Image.new('RGB',(1400,2400),(250,249,245));draw=ImageDraw.Draw(im)
              draw.rectangle((0,0,1400,98),fill=INK);draw.rectangle((0,94,1400,100),fill=GOLD)
              draw.text((50,22),'강현AI PRO | C3 TOP5',font=font(46,True),fill=(243,230,205))
              draw.text((1100,32),days[-1][:4]+'.'+days[-1][4:6]+'.'+days[-1][6:],font=font(29),fill=(238,234,226))
              draw.text((54,128),x['name'],font=font(63,True),fill=INK)
              draw.text((54,207),x['code']+' · '+x['market']+' · WATCH TOP'+str(rank),font=font(30),fill=SUB)
              draw.text((1330,125),format(x['close'],',')+'원',font=font(59,True),fill=INK,anchor='ra')
              change=x['close']-bars[-2]['close'];pct=change/bars[-2]['close']*100
              draw.text((1330,205),f'{change:+,.0f}원 ({pct:+.2f}%)',font=font(30),fill=RED if change>0 else BLUE,anchor='ra')
              draw.rectangle((48,256,1352,302),fill=(240,235,221))
              draw.text((700,264),'별도 WATCH · 재무 미검증 · 신규 진입 승인 없음',font=font(26,True),fill=GOLD,anchor='ma')
              draw.rounded_rectangle((48,319,1352,1193),radius=13,fill='white',outline=(222,218,209),width=2)
              draw.text((75,339),'실제 일봉 60거래일 · 거래량',font=font(31,True),fill=INK)
              for i,(n,col) in enumerate(((5,(64,91,129)),(20,GOLD),(60,(115,139,128)))):
                xx=790+i*172;draw.line((xx,355,xx+28,355),fill=col,width=4)
                draw.text((xx+35,339),str(n)+'일선',font=font(22),fill=SUB)
              left,right,top,bottom=155,1100,395,1018
              vals=[v[k] for v in bars for k in ('high','low')]+[x['entry_watch_low'],x['entry_watch_high'],x['low10']]+([x['structural_stop_ref']] if x['structural_stop_ref'] is not None else [])
              for n in (5,20,60):vals.extend(statistics.mean(closes[j-n+1:j+1]) for j in range(n-1,60))
              low=min(vals)*.96;high=max(vals)*1.04
              py=lambda v:int(bottom-(v-low)/(high-low)*(bottom-top))
              px=lambda k:int(left+(right-left-28)*k/59)
              for j in range(6):
                value=low+(high-low)*j/5;yy=py(value)
                draw.line((left,yy,right,yy),fill=(231,229,223),width=1)
                draw.text((left-18,yy),format(value,',.0f'),font=font(23),fill=SUB,anchor='rm')
              # User requested a dashed-outline buy observation rectangle, not a filled band.
              zone_top=py(x['entry_watch_high']);zone_bottom=py(x['entry_watch_low'])
              for xx in range(left,right,20):
                draw.line((xx,zone_top,min(xx+11,right),zone_top),fill=GREEN,width=3)
                draw.line((xx,zone_bottom,min(xx+11,right),zone_bottom),fill=GREEN,width=3)
              for yy in range(zone_top,zone_bottom,20):
                draw.line((left,yy,left,min(yy+11,zone_bottom)),fill=GREEN,width=3)
                draw.line((right,yy,right,min(yy+11,zone_bottom)),fill=GREEN,width=3)
              for k,v in enumerate(bars):
                xx=px(k);color=RED if v['close']>=v['open'] else BLUE
                draw.line((xx,py(v['high']),xx,py(v['low'])),fill=color,width=3)
                a,b=sorted((py(v['open']),py(v['close'])))
                draw.rectangle((xx-5,a,xx+5,max(a+2,b)),fill=color)
              for n,col in ((5,(64,91,129)),(20,GOLD),(60,(115,139,128))):
                pts=[(px(j),py(statistics.mean(closes[j-n+1:j+1]))) for j in range(n-1,60)]
                if len(pts)>1:draw.line(pts,fill=col,width=4)
              # Dashed structural stop reference, clearly distinct from the entry rectangle.
              if x['structural_stop_ref'] is not None:
                stop_y=py(x['structural_stop_ref'])
                for xx in range(left,right,20):draw.line((xx,stop_y,min(xx+10,right),stop_y),fill=RED,width=2)
              draw.line((right,py(x['close']),right+20,py(x['close'])),fill=INK,width=2)
              draw.rounded_rectangle((right+20,py(x['close'])-23,1345,py(x['close'])+23),radius=4,fill=INK)
              draw.text((1330,py(x['close'])),'종가 '+format(x['close'],','),font=font(26,True),fill='white',anchor='rm')
              vmax=max(v['volume'] for v in bars)
              for k,v in enumerate(bars):
                xx=px(k);h=int(v['volume']/vmax*80);color=RED if v['close']>=v['open'] else BLUE
                draw.rectangle((xx-5,1130-h,xx+5,1130),fill=color)
                if k%12==0 or k==59:
                  draw.text((xx,1146),v['date'][4:6]+'/'+v['date'][6:],font=font(23),fill=SUB,anchor='ma')
              draw.text((155,1033),'거래량',font=font(24),fill=SUB)
              draw.text((1100,1033),'최대 '+format(vmax/1e6,'.2f')+'백만주',font=font(24),fill=SUB,anchor='ra')
              draw.text((53,1220),'연구용 관찰 가격 · '+('구조위험 PASS' if not x['geometry_validated'] else '구조손절 참고')+' · 주문 승인 아님',font=font(32,True),fill=INK)
              cells=[('매수 관찰 범위',format(x['entry_watch_low'],',')+'~'+format(x['entry_watch_high'],','),GREEN),
                ('2차 매수','미확정',BLUE),('손절 참고',format(x['structural_stop_ref'],',') if x['structural_stop_ref'] is not None else 'PASS',RED),
                ('1차 저항 R1',format(x['r1_ref'],',') if x['r1_ref'] else '미확정',GOLD),('2차 저항 R2',format(x['r2_ref'],',') if x['r2_ref'] else '미확정',PURPLE)]
              for j,(label,value,color) in enumerate(cells):
                xx=48+j*261;draw.rectangle((xx,1270,xx+252,1404),fill='white')
                draw.line((xx,1270,xx+252,1270),fill=color,width=4)
                draw.text((xx+126,1288),label,font=font(25,True),fill=color,anchor='ma')
                draw.text((xx+126,1340),value,font=font(23,True),fill=color,anchor='ma')
              draw.text((53,1430),'기존 정렬 순위 '+str(rank)+' · 임의 가중 점수 '+str(x['score'])+'점',font=font(31,True),fill=INK)
              draw.text((55,1490),'RS20 '+format(x['rs20pp'],'+.2f')+'%p · RVOL '+str(x['rvol'])+' · 20일 상승 '+format(x['return20_pct'],'+.2f')+'%',font=font(27),fill=INK)
              draw.text((55,1530),'20일 평균 거래대금 '+format(x['turnover20_krw']/1e8,',.1f')+'억원 · MA20 이격 '+format(x['ma20_distance_pct'],'+.2f')+'% · R1 손익비 '+(str(x['rr_entry_ref'])+'배' if x['rr_entry_ref'] is not None else '미확정'),font=font(25),fill=SUB)
              draw.text((53,1580),'선정 후 기업 자료 및 위험 검토',font=font(33,True),fill=INK)
              notes=[('정량·섹터','20일 상승 '+format(x['return20_pct'],'+.2f')+'%, RS20 '+format(x['rs20pp'],'+.2f')+'%p, RVOL '+str(x['rvol'])+'. 거래대금 '+format(x['turnover20_krw']/1e8,',.1f')+'억원. 업종 미검증.'),
                ('재무·실적','OpenDART PIT 실적 미연결. 매출, 영업이익, 현금흐름, 부채 건전성 판단 보류.'),
                ('주요 이슈·수급','MA5 '+format(x['ma5'],',')+'원 / MA20 '+format(x['ma20'],',')+'원 / MA60 '+format(x['ma60'],',')+'원. 뉴스·기관·외국인 수급 미검증.'),
                ('리스크·구조손절',('피벗지지 '+format(x['pivot_support'],',')+'원, ATR14 '+format(x['atr14'],',.1f')+'원, 손절 참고 '+format(x['structural_stop_ref'],',')+'원. 실전 미승인.' if x['geometry_validated'] else '지지구조·ATR·최대위험 5% 검증 실패: PASS. 손절 미확정.'))]
              for j,(label,value) in enumerate(notes):
                yy=1635+j*165;draw.rectangle((48,yy,1352,yy+155),fill='white')
                draw.line((48,yy,48,yy+155),fill=GOLD,width=5)
                draw.text((72,yy+28),f'{j+1:02}',font=font(23,True),fill=GOLD)
                draw.text((120,yy+25),label,font=font(27,True),fill=INK)
                # Width-aware two-line wrap; no text outside the note box.
                words=value.split();lines=[];line=''
                for word in words:
                  test=(line+' '+word).strip()
                  if draw.textlength(test,font=font(27))>920 and line:
                    lines.append(line);line=word
                  else:line=test
                if line:lines.append(line)
                if len(lines)>3:raise ValueError('CARD_NOTE_OVERFLOW_'+x['code'])
                for k,line in enumerate(lines):draw.text((365,yy+22+k*39),line,font=font(27),fill=INK)
              draw.text((700,2324),'KRX 공식 일봉 · 비수정 · 정규장 종가 및 기업행위 미인증',font=font(22),fill=SUB,anchor='ma')
              draw.text((700,2363),'점선 녹색=매수 관찰 범위 · 점선 적색=손절 참고 · 실전 승인 아님',font=font(23,True),fill=RED,anchor='ma')
              path=root/(str(rank).zfill(2)+'_'+x['code']+'_c3_classic.png')
              im.save(path,optimize=True);images.append(path)
            receipt['image_sha256']=[hashlib.sha256(p.read_bytes()).hexdigest() for p in images]
            receipt['image_files']=[p.name for p in images]
            receipt['image_count']=len(images)
            # Fail closed before any scheduled delivery if cards are missing,
            # unreadable, duplicated, or inconsistent with qualified candidates.
            if len(images)!=len(selected):raise ValueError('IMAGE_SELECTION_COUNT_MISMATCH')
            if len(set(p.name for p in images))!=len(images):
              raise ValueError('DUPLICATE_IMAGE_FILENAME')
            for idx,p in enumerate(images):
              if not p.is_file() or p.stat().st_size<10000:
                raise ValueError('IMAGE_MISSING_OR_TOO_SMALL_'+str(idx+1))
              with Image.open(p) as verify:
                verify.verify()
              with Image.open(p) as verify:
                if verify.size!=(1400,2400) or verify.format!='PNG':
                  raise ValueError('IMAGE_FORMAT_OR_SIZE_INVALID_'+str(idx+1))
            receipt['delivery_preflight']='PASSED' if images else 'NO_CANDIDATES'
            print('C3_DELIVERY_PREFLIGHT',json.dumps({
              'asof':days[-1],'selected':len(selected),'images':len(images),
              'status':receipt['delivery_preflight']},ensure_ascii=False))
            if not images:
              receipt['status']='CASH_NO_CANDIDATES_NO_SEND'
            # Never send stale same-day duplicates from reruns: workflow concurrency prevents overlap,
            # but manual reruns may duplicate. A separate persisted receipt gate is required.
            # Persisted date reservation is enforced for scheduled dispatch; manual runs remain preview-only.
            if not images:
              receipt['status']='CASH_NO_CANDIDATES_NO_SEND'
            elif os.environ.get('GITHUB_EVENT_NAME')!='schedule':
              receipt['status']='PREVIEW_ONLY_MANUAL_RUN'
            else:
              token=os.environ.get('TELEGRAM_BOT_TOKEN','');chat=os.environ.get('TELEGRAM_CHAT_ID','')
              if not token or not chat:raise ValueError('TELEGRAM_CREDENTIALS_MISSING')
              # Reserve the date BEFORE Telegram. A failed/uncertain send is not retried automatically.
              # GitHub Contents create-only PUT is atomic for a new path; reruns fail closed.
              import base64
              repo=os.environ['GITHUB_REPOSITORY']
              marker_path='receipts/c3_top5_daily/'+days[-1]+'.json'
              marker={'schema':'C3_TOP5_SEND_RESERVATION_V1','asof':days[-1],
                'run_id':os.environ['GITHUB_RUN_ID'],'image_sha256':receipt['image_sha256'],
                'status':'RESERVED_BEFORE_SEND','selected_count':len(selected)}
              api='https://api.github.com/repos/'+repo+'/contents/'+marker_path
              body=json.dumps({'message':'Reserve C3 TOP5 one-photo delivery '+days[-1],
                'content':base64.b64encode(json.dumps(marker,ensure_ascii=False).encode()).decode(),
                'branch':'main'}).encode()
              request=urllib.request.Request(api,data=body,method='PUT',headers={
                'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
                'Content-Type':'application/json'})
              try:
                with urllib.request.urlopen(request,timeout=20) as res:
                  if res.status!=201:raise ValueError('RESERVATION_NOT_CREATED')
              except urllib.error.HTTPError as ex:
                if ex.code in (409,422):
                  receipt['status']='DUPLICATE_OR_RESERVATION_CONFLICT_BLOCKED'
                  receipt['duplicate_guard']='PERSISTED_CREATE_ONLY'
                  print('TOP5_DUPLICATE_BLOCKED',days[-1],ex.code)
                raise ValueError('DELIVERY_RESERVATION_BLOCKED_'+str(ex.code))
              receipt['delivery_reservation']=marker_path
              import uuid
              boundary='----C3'+uuid.uuid4().hex
              def part(name,value,filename=None,ctype='text/plain'):
                head='--'+boundary+'\r\nContent-Disposition: form-data; name="'+name+'"'
                if filename:head+='; filename="'+filename+'"'
                head+='\r\nContent-Type: '+ctype+'\r\n\r\n'
                return head.encode()+value+b'\r\n'
              # One separate image per selected stock; no automatic retries.
              for idx,image in enumerate(images,1):
                payload=part('chat_id',chat.encode())+part('caption',('C3 TOP5 '+days[-1]+' | '+selected[idx-1]['name']+' | '+str(idx)+'/'+str(len(images))+' · WATCH').encode())+part('photo',image.read_bytes(),image.name,'image/png')+('--'+boundary+'--\\r\\n').encode()
                req=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendPhoto',data=payload,
                  headers={'Content-Type':'multipart/form-data; boundary='+boundary},method='POST')
                with urllib.request.urlopen(req,timeout=30) as resp:response=json.load(resp)
                if not response.get('ok'):raise ValueError('TELEGRAM_NOT_OK_AT_'+str(idx))
                receipt['telegram_photos_sent']=idx
              receipt['status']='DELIVERED'
            print('TOP5_RECEIPT',json.dumps({'status':receipt['status'],'asof':receipt['asof'],
              'passing_symbols':len(pool),'selected':selected,'photos_sent':receipt['telegram_photos_sent']},ensure_ascii=False))
          except Exception as e:
            receipt['status']='HOLD_ERROR'
            receipt['error']=type(e).__name__+': '+str(e)[:160]
            print('TOP5_ERROR',receipt['error'])
          finally:
            (root/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          if receipt['status']=='HOLD_ERROR':raise SystemExit(1)
          PY
      - name: Upload individual classic images and audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-top5-daily-classic-per-stock
          path: output/c3_top5/
          retention-days: 30
          if-no-files-found: warn
