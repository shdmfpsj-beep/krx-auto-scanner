            sessions=[b['date'] for b in pool['candidates'][0]['bars']] if pool.get('candidates') else []
            receipts=Path('receipts/c3_top5_daily')
            ledger=Path('reports/c3_paper/paper_ledger.json')
            if not receipts.is_dir() or not ledger.is_file():
              raise ValueError('BALANCED_SIGNAL_HISTORY_MISSING')
            blocked=recent_signals(geometry['asof'],sessions,receipts,ledger)
