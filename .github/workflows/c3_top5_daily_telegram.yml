            print('TOP5_RECEIPT',json.dumps({'status':receipt['status'],'asof':receipt['asof'],
              'passing_symbols':len(pool),'selected':selected,'photos_sent':receipt['telegram_photos_sent']},ensure_ascii=False))
          except Exception as e:
            receipt['status']='HOLD_ERROR'
            receipt['error']=type(e).__name__+': '+str(e)[:160]
            print('TOP5_ERROR',receipt['error'])
          finally:
            (root/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          if receipt['status']=='HOLD_ERROR':raise SystemExit(1)
          PY
      # Research-only enrichment. Runs AFTER legacy delivery logic, cannot authorize
      # a buy, alter the selection, or trigger another Telegram send.
      - name: Preserve KRX research outputs outside checkout workspace
        if: always()
        run: |
          if [ -d output/c3_top5 ]; then
            mkdir -p "$RUNNER_TEMP/c3_top5_preserved"
            cp -a output/c3_top5/. "$RUNNER_TEMP/c3_top5_preserved/"
            echo 'C3_OUTPUT_PRESERVED'
          else
            echo 'C3_OUTPUT_NOT_FOUND_BEFORE_CHECKOUT'
          fi
      - name: Checkout minimal OpenDART research adapter
        if: always()
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/c3_top5_dart_bridge.py
            scripts/c3_top5_eligibility_audit.py
            scripts/c3_top5_financial_selection.py
            scripts/c3_top5_financial_preview.py
            scripts/dart_financial_screen.py
            scripts/dart_interim_periods.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          # Preserve untracked output/c3_top5 generated before sparse checkout.
          clean: false
      - name: Restore KRX research outputs after checkout
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/c3_top5_preserved" ]; then
            mkdir -p output/c3_top5
            cp -a "$RUNNER_TEMP/c3_top5_preserved/." output/c3_top5/
            test -f output/c3_top5/receipt.json
            test -f output/c3_top5/entry_geometry_audit.json
            echo 'C3_OUTPUT_RESTORED'
          else
            echo 'C3_OUTPUT_NOT_PRESERVED'
          fi
      - name: Evaluate dated OpenDART evidence for selected TOP5 (research only)
        if: always()
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY || secrets.DART_API_KEY }}
        run: |
          mkdir -p output/c3_top5
          if [ -f output/c3_top5/receipt.json ]; then
            PYTHONPATH=scripts python scripts/c3_top5_dart_bridge.py \
              --receipt output/c3_top5/receipt.json \
              --out output/c3_top5/financial_research_gate.json
          else
            echo 'FINANCIAL_RESEARCH_SKIPPED_NO_RECEIPT'
          fi
      - name: Record non-authorizing TOP5 eligibility audit
        if: always()
        continue-on-error: true
        run: |
          if [ -f output/c3_top5/receipt.json ] && [ -f output/c3_top5/financial_research_gate.json ]; then
            PYTHONPATH=scripts python scripts/c3_top5_eligibility_audit.py \
              --receipt output/c3_top5/receipt.json \
              --financial output/c3_top5/financial_research_gate.json \
              --out output/c3_top5/eligibility_audit.json
          else
            echo 'ELIGIBILITY_AUDIT_SKIPPED_MISSING_EVIDENCE'
          fi
      - name: Research finance-first selection across technical pool
        if: always()
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY || secrets.DART_API_KEY }}
        run: |
          if [ -f output/c3_top5/entry_geometry_audit.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          root=Path('output/c3_top5')
          geometry=json.loads((root/'entry_geometry_audit.json').read_text())
          eligible=[{'code':c['code'],'name':c.get('name','')}
                    for c in geometry.get('candidates',[])
                    if c.get('status') in ('ENTRY_READY','NEAR_ENTRY')
                    and c.get('risk_pct') is not None and 0<c['risk_pct']<=5]
          (root/'financial_pool_input.json').write_text(json.dumps({
              'asof':geometry['asof'],'candidates':eligible},ensure_ascii=False))
          PY
            PYTHONPATH=scripts python scripts/c3_top5_dart_bridge.py \
              --receipt output/c3_top5/financial_pool_input.json \
              --out output/c3_top5/financial_pool_gate.json
            PYTHONPATH=scripts python scripts/c3_top5_financial_selection.py \
              --geometry output/c3_top5/entry_geometry_audit.json \
              --financial output/c3_top5/financial_pool_gate.json \
              --out output/c3_top5/financial_selection_research.json
            if [ -f output/c3_top5/qualified_chart_pool.json ]; then
              PYTHONPATH=scripts python scripts/c3_top5_financial_preview.py \
                --pool output/c3_top5/qualified_chart_pool.json \
                --selection output/c3_top5/financial_selection_research.json \
                --out output/c3_top5/financial_preview
