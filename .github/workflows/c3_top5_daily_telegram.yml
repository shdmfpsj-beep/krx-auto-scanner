        env:
          DART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY || secrets.DART_API_KEY }}
        run: |
          mkdir -p output/c3_top5
          if [ -f output/c3_top5/receipt.json ]; then
            PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          from c3_top5_financial_selection import requested_candidates, financial_review_candidates, REVIEW_SCOPE
          import os
          root=Path('output/c3_top5')
          geometry=json.loads((root/'entry_geometry_audit.json').read_text())
          if os.environ.get('C3_FINANCIAL_MODEL')=='balanced':
            from c3_balanced_validation import recent_signals
