name: C3 TOP5 daily one-photo Telegram (user trades)
on:
  workflow_dispatch:
  schedule:
    # KST 23:30 Monday-Friday; GitHub scheduling can be delayed.
    - cron: '30 14 * * 1-5'
permissions:
  contents: write
concurrency:
  group: c3-top5-daily-one-photo
  cancel-in-progress: false
jobs:
  top5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install image renderer and Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python3 -m pip install pillow --disable-pip-version-check
      - name: Collect current official KRX sessions, select up to five and send one image
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,csv,io,datetime,urllib.request,urllib.parse,urllib.error,collections,statistics,math,time,hashlib
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from PIL import Image,ImageDraw,ImageFont
          root=Path('output/c3_top5');root.mkdir(parents=True,exist_ok=True)
          receipt={'schema':'C3_TOP5_DAILY_V1','status':'HOLD','decision':'CASH','orders_enabled':False,
            'user_executes_trades':True,'telegram_photos_sent':0,'candidates':[],
            'limitations':['Official KRX daily bars are not independently 15:30 regular-only certified',
            'Corporate-action adjustments and PIT financial quality not verified',
            'Entry references are not orders or investment recommendations',
            'A reserved send date is never retried automatically after an uncertain Telegram outcome']}
          def fetch(day,endpoint):
            u='https://data-dbg.krx.co.kr/svc/apis/sto/'+endpoint+'?'+urllib.parse.urlencode({'basDd':day})
            req=urllib.request.Request(u,headers={'AUTH_KEY':os.environ['KRX_AUTH_KEY'],'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=25) as res:raw=res.read(12*1024*1024+1)
            if len(raw)>12*1024*1024:raise ValueError('RESPONSE_TOO_LARGE')
            z=json.loads(raw)
            a=z.get('OutBlock_1')
            if not isinstance(a,list):raise ValueError('MISSING_OUTBLOCK')
            return a
          def num(v):
            try:
              x=float(str(v).replace(',','').strip())
              return x if math.isfinite(x) else None
            except:return None
          try:
            if not os.environ.get('KRX_AUTH_KEY'):raise ValueError('KRX_KEY_MISSING')
            now=datetime.datetime.now(ZoneInfo('Asia/Seoul'))
            target=now.date()
            # On weekends manual execution targets last Friday; weekdays must use same-day data.
            while target.weekday()>4:target-=datetime.timedelta(days=1)
            if now.hour<21 and target==now.date():
              if os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch':
                # Manual preview before nightly cutoff uses prior completed trading day.
                target-=datetime.timedelta(days=1)
                while target.weekday()>4:target-=datetime.timedelta(days=1)
                receipt['preview_source_policy']='PRIOR_COMPLETED_WEEKDAY'
              else:
                raise ValueError('BEFORE_DAILY_DATA_WINDOW')
            days=[];data=collections.defaultdict(dict);names={}
            for offset in range(105):
              d=target-datetime.timedelta(days=offset)
              if d.weekday()>4:continue
              ds=d.strftime('%Y%m%d')
              a=fetch(ds,'stk_bydd_trd');b=fetch(ds,'ksq_bydd_trd')
              if not a and not b:continue
              if not a or not b:raise ValueError('PARTIAL_MARKET_'+ds)
              days.append(ds)
              for market,rows in (('KOSPI',a),('KOSDAQ',b)):
                for r in rows:
                  code=str(r.get('ISU_CD','')).strip()
                  o,h,l,c=[num(r.get(k)) for k in ('TDD_OPNPRC','TDD_HGPRC','TDD_LWPRC','TDD_CLSPRC')]
                  vol=num(r.get('ACC_TRDVOL'));val=num(r.get('ACC_TRDVAL'))
                  if not code or None in (o,h,l,c,vol,val) or min(o,h,l,c)<=0 or vol<=0 or val<=0 or l>min(o,c) or h<max(o,c):continue
                  key=(market,code)
                  data[key][ds]=(c,h,l,vol,val,o)
                  names[key]=str(r.get('ISU_NM',''))
              if len(days)==60:break
              time.sleep(.12)
            if len(days)!=60 or days[0]!=target.strftime('%Y%m%d'):
              raise ValueError('TODAY_60_SESSION_SOURCE_INCOMPLETE')
            days.sort()
            bench=collections.defaultdict(list);eligible={}
            for key,s in data.items():
              if not all(d in s for d in days):continue
              a=[s[d] for d in days];c=[v[0] for v in a]
              eligible[key]=a
              bench[key[0]].append(c[-1]/c[-21]-1)
            med={k:statistics.median(v) for k,v in bench.items() if len(v)>=100}
            if len(med)!=2:raise ValueError('MARKET_BENCHMARK_MISSING')
            pool=[]
            for key,a in eligible.items():
              c=[x[0] for x in a];last=c[-1]
              ma5=statistics.mean(c[-5:]);ma20=statistics.mean(c[-20:]);ma60=statistics.mean(c)
              r20=last/c[-21]-1;rs=r20-med[key[0]]
              val=statistics.mean(x[4] for x in a[-20:])
              rvol=a[-1][3]/statistics.mean(x[3] for x in a[-21:-1])
              dist=last/ma20-1
              low=min(x[2] for x in a[-10:]);risk=1-low/last
              high=max(x[1] for x in a[-20:]);rr=((high-last)/last)/risk if risk>0 else 0
              if not (val>=1e9 and ma5>=ma20>=ma60 and last>=ma20 and .02<=r20<=.35 and rs>0):continue
              if not (-.01<=dist<=.08 and .01<=risk<=.08 and .4<=rvol<=4 and rr>=1.5):continue
              score=round(40+min(rs*100,15)+min(r20*50,12)+max(0,12-abs(dist-.025)*150)+max(0,10-(risk-.02)*100)+min(max(rvol-.4,0)*3,6),2)
              pool.append({'market':key[0],'code':key[1],'name':names[key],'score':score,
                'close':round(last),'ma20':round(ma20),'low10':round(low),'high20':round(high),
                'rvol':round(rvol,2),'rs20pp':round(rs*100,2),'stop_distance_pct':round(risk*100,2),
                'entry_watch_low':round(ma20*.99),'entry_watch_high':round(ma20*1.02),
                'status':'WATCH_ONLY'})
            pool.sort(key=lambda z:(-z['score'],-z['rs20pp'],z['market'],z['code']))
            selected=pool[:5]
            for x in selected:
              key=(x['market'],x['code'])
              x['chart_bars']=[{'date':d,'close':data[key][d][0],'high':data[key][d][1],
                'low':data[key][d][2],'volume':data[key][d][3],'open':data[key][d][5]} for d in days]
            receipt.update({'status':'TOP5_RENDER_READY','asof':days[-1],
              'valid_60_session_symbols':len(eligible),'passing_symbols':len(pool),
              'candidates':selected,'selection':'Technical-only until PIT financial gate is available'})
            fontpath='/usr/share/fonts/truetype/nanum/NanumGothic.ttf'
            boldpath='/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf'
            def font(size,bold=False):return ImageFont.truetype(boldpath if bold else fontpath,size)
            # Compact five-panel classic white/gold report: actual OHLC candles, MA5/20/60,
            # volume, entry observation band and 10-day low reference.
            from PIL import Image
            INK=(42,43,44);SUB=(108,112,115);GOLD=(172,136,72)
            GREEN=(41,119,86);BLUE=(54,124,175);RED=(184,75,72)
            im=Image.new('RGB',(1400,2440),(250,249,245));draw=ImageDraw.Draw(im)
            draw.rectangle((0,0,1400,164),fill=(255,255,255))
            draw.rectangle((0,0,14,164),fill=GOLD)
            draw.text((58,28),'강현AI PRO  |  C3 TOP5',font=font(49,True),fill=INK)
            draw.text((60,103),'KRX '+days[-1]+'  ·  기술적 관심종목  ·  직접 매매 / 자동주문 없음',font=font(24),fill=SUB)
            draw.line((55,166,1345,166),fill=GOLD,width=3)
            for i in range(5):
              y=195+i*425
              draw.rounded_rectangle((42,y,1358,y+405),radius=18,fill=(255,255,255),outline=(223,216,202),width=2)
              if i>=len(selected):
                draw.text((82,y+155),str(i+1)+'  조건 충족 종목 없음',font=font(34,True),fill=SUB)
                continue
              x=selected[i];bars=x['chart_bars']
              draw.text((76,y+20),str(i+1)+'  '+x['name']+'  ('+x['code']+')',font=font(32,True),fill=INK)
              draw.text((76,y+68),x['market']+'  ·  '+str(x['score'])+'점  ·  RVOL '+str(x['rvol'])+
                '  ·  RS '+str(x['rs20pp'])+'%p',font=font(21),fill=SUB)
              px0,px1=83,849;py0,py1=y+123,y+301
              prices=[v['high'] for v in bars]+[v['low'] for v in bars]
              for n in (5,20,60):
                closes=[v['close'] for v in bars]
                prices.extend(statistics.mean(closes[k-n+1:k+1]) for k in range(n-1,len(closes)))
              prices.extend([x['entry_watch_low'],x['entry_watch_high'],x['low10']])
              pmin=min(prices)*.985;pmax=max(prices)*1.015
              def py(v):return int(py1-(v-pmin)/(pmax-pmin)*(py1-py0))
              def px(k):return int(px0+9+(px1-px0-18)*k/59)
              draw.rectangle((px0,py(x['entry_watch_high']),px1,py(x['entry_watch_low'])),
                fill=(237,245,240))
              for j in range(5):
                yy=py0+(py1-py0)*j//4
                draw.line((px0,yy,px1,yy),fill=(231,232,230),width=1)
              for k,v in enumerate(bars):
                xx=px(k);up=v['close']>=v['open'];color=RED if up else BLUE
                draw.line((xx,py(v['high']),xx,py(v['low'])),fill=color,width=2)
                top=min(py(v['open']),py(v['close']));bottom=max(py(v['open']),py(v['close']))
                draw.rectangle((xx-4,top,xx+4,max(top+2,bottom)),fill=color)
              closes=[v['close'] for v in bars]
              for n,color in ((5,(64,91,129)),(20,GOLD),(60,(115,139,128))):
                pts=[(px(k),py(statistics.mean(closes[k-n+1:k+1]))) for k in range(n-1,60)]
                if len(pts)>1:draw.line(pts,fill=color,width=3,joint='curve')
              draw.line((px0,py(x['low10']),px1,py(x['low10'])),fill=RED,width=2)
              vmax=max(v['volume'] for v in bars)
              for k,v in enumerate(bars):
                xx=px(k);base=y+366
                height=int(v['volume']/vmax*48)
                draw.rectangle((xx-4,base-height,xx+4,base),fill=(182,191,202))
              draw.text((92,y+372),'60거래일 봉  |  MA5 파랑 · MA20 금색 · MA60 녹색 · 거래량 회색',font=font(17),fill=SUB)
              tx=890
              draw.text((tx,y+125),'종가  '+format(x['close'],',')+'원',font=font(29,True),fill=INK)
              draw.text((tx,y+182),'관심구간',font=font(22),fill=SUB)
              draw.text((tx,y+214),format(x['entry_watch_low'],',')+'~'+format(x['entry_watch_high'],',')+'원',font=font(26,True),fill=GREEN)
              draw.text((tx,y+271),'10일 저가 참고',font=font(21),fill=SUB)
              draw.text((tx,y+303),format(x['low10'],',')+'원',font=font(26,True),fill=RED)
              draw.text((tx,y+353),'기술 후보 · 재무 미검증',font=font(18),fill=SUB)
            draw.line((58,2333,1340,2333),fill=GOLD,width=2)
            draw.text((61,2350),'자료: KRX Open API · 비수정 일봉 · 정규장 15:30 및 기업행위 미인증',font=font(22),fill=SUB)
            draw.text((61,2390),'관심구간은 MA20 기준 관찰 영역, 손절 참고선은 10일 저가입니다. 매수 지시가 아닙니다.',font=font(19),fill=SUB)
            image=root/'c3_top5_one_photo.png';im.save(image)
            receipt['image_sha256']=hashlib.sha256(image.read_bytes()).hexdigest()
            # Never send stale same-day duplicates from reruns: workflow concurrency prevents overlap,
            # but manual reruns may duplicate. A separate persisted receipt gate is required.
            # Until that gate exists, scheduled dispatch only; manual runs are preview-only.
            if os.environ.get('GITHUB_EVENT_NAME')!='schedule':
              receipt['status']='PREVIEW_ONLY_MANUAL_RUN'
            else:
              token=os.environ.get('TELEGRAM_BOT_TOKEN','');chat=os.environ.get('TELEGRAM_CHAT_ID','')
              if not token or not chat:raise ValueError('TELEGRAM_CREDENTIALS_MISSING')
              # Reserve the date BEFORE Telegram. A failed/uncertain send is not retried automatically.
              # GitHub Contents create-only PUT is atomic for a new path; reruns fail closed.
              import base64
              repo=os.environ['GITHUB_REPOSITORY']
              marker_path='receipts/c3_top5_daily/'+days[-1]+'.json'
              marker={'schema':'C3_TOP5_SEND_RESERVATION_V1','asof':days[-1],
                'run_id':os.environ['GITHUB_RUN_ID'],'image_sha256':receipt['image_sha256'],
                'status':'RESERVED_BEFORE_SEND','selected_count':len(selected)}
              api='https://api.github.com/repos/'+repo+'/contents/'+marker_path
              body=json.dumps({'message':'Reserve C3 TOP5 one-photo delivery '+days[-1],
                'content':base64.b64encode(json.dumps(marker,ensure_ascii=False).encode()).decode(),
                'branch':'main'}).encode()
              request=urllib.request.Request(api,data=body,method='PUT',headers={
                'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
                'Content-Type':'application/json'})
              try:
                with urllib.request.urlopen(request,timeout=20) as res:
                  if res.status!=201:raise ValueError('RESERVATION_NOT_CREATED')
              except urllib.error.HTTPError as ex:
                if ex.code in (409,422):
                  receipt['status']='DUPLICATE_OR_RESERVATION_CONFLICT_BLOCKED'
                  receipt['duplicate_guard']='PERSISTED_CREATE_ONLY'
                  print('TOP5_DUPLICATE_BLOCKED',days[-1],ex.code)
                raise ValueError('DELIVERY_RESERVATION_BLOCKED_'+str(ex.code))
              receipt['delivery_reservation']=marker_path
              import uuid
              boundary='----C3'+uuid.uuid4().hex
              def part(name,value,filename=None,ctype='text/plain'):
                head='--'+boundary+'\r\nContent-Disposition: form-data; name="'+name+'"'
                if filename:head+='; filename="'+filename+'"'
                head+='\r\nContent-Type: '+ctype+'\r\n\r\n'
                return head.encode()+value+b'\r\n'
              payload=part('chat_id',chat.encode())+part('caption',('C3 TOP5 '+days[-1]+' | 관심종목, 매매는 본인 판단').encode())+part('photo',image.read_bytes(),'c3_top5.png','image/png')+('--'+boundary+'--\r\n').encode()
              req=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendPhoto',data=payload,
                headers={'Content-Type':'multipart/form-data; boundary='+boundary},method='POST')
              with urllib.request.urlopen(req,timeout=30) as resp:response=json.load(resp)
              if not response.get('ok'):raise ValueError('TELEGRAM_NOT_OK')
              receipt['telegram_photos_sent']=1
              receipt['status']='DELIVERED'
            print('TOP5_RECEIPT',json.dumps({'status':receipt['status'],'asof':receipt['asof'],
              'passing_symbols':len(pool),'selected':selected,'photos_sent':receipt['telegram_photos_sent']},ensure_ascii=False))
          except Exception as e:
            receipt['status']='HOLD_ERROR'
            receipt['error']=type(e).__name__+': '+str(e)[:160]
            print('TOP5_ERROR',receipt['error'])
          finally:
            (root/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          if receipt['status']=='HOLD_ERROR':raise SystemExit(1)
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Upload single image and audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-top5-daily-one-photo
          path: output/c3_top5/
          retention-days: 30
          if-no-files-found: warn
