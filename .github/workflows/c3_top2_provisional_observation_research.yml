name: C3 TOP2 provisional price observation research
on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Completed date YYYY-MM-DD (never current unfinished session)"
        required: true
        type: string
jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/c3_top2_pykrx_export_v1.py
            scripts/c3_top2_provisional_report_v1.py
            scripts/c3_top2_research_readiness_v1.py
            scripts/c3_price_concordance_v1.py
            scripts/c3_price_provenance_gate_v1.py
            scripts/c3_entry_geometry_research_v1.py
            scripts/c3_entry_style_comparison_v1.py
            scripts/c3_no_fill_opportunity_v1.py
            scripts/c3_forward_horizon_observation_v1.py
            config/c3_paper_top2_plans.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collection dependency
        run: pip install pykrx==1.2.9 pandas==2.2.3
      - name: Collect provisional TOP2 OHLCV
        run: |
          python scripts/c3_top2_pykrx_export_v1.py --plans config/c3_paper_top2_plans.csv --end "${{ inputs.end_date }}" --outdir /tmp/c3-top2
      - name: Produce read-only provisional analysis
        run: |
          python scripts/c3_top2_provisional_report_v1.py --plans config/c3_paper_top2_plans.csv --prices /tmp/c3-top2/top2_provisional_ohlcv.csv --manifest /tmp/c3-top2/manifest.json --output /tmp/c3-top2/top2_provisional_research.json
      - name: Archive observations and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-top2-provisional-research
          path: /tmp/c3-top2/
          if-no-files-found: warn
          retention-days: 30
