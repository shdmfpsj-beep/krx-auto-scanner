name: C3 TOP2 Telegram notification
on:
  workflow_run:
    workflows: ['C3 approved research daily caller']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '45 13 * * 1-5' # KST weekdays 22:45, after existing research caller
    - cron: '0 0 * * 1-5'   # KST weekdays 09:00 fallback
  workflow_dispatch:
    inputs:
      mode:
        description: 'live: new registered TOP2; past_example: one approved historical album; preview: no delivery'
        type: choice
        default: live
        options: [live, past_example, preview]
  push:
    branches: [main]
    paths: ['config/c3_telegram_example_request.json']
  pull_request:
    paths:
      - '.github/workflows/c3_top2_telegram.yml'
      - 'scripts/c3_telegram_notify.py'
      - 'scripts/c3_telegram_inputs.py'
      - 'scripts/c3_classic_theme.py'
      - 'scripts/c3_final_delivery_gate_v1.py'
      - 'scripts/c3_final_historical_preview_v21.py'
      - 'scripts/c3_report_context.py'
      - 'scripts/c3_report_handoff.py'
      - 'scripts/test_c3_report_handoff.py'
      - 'scripts/test_c3_report_quality.py'
      - 'config/c3_company_context_verified.json'
      - 'scripts/test_c3_telegram_notify.py'
      - 'config/c3_telegram_example_request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-top2-telegram-notify
  cancel-in-progress: false
jobs:
  self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_telegram_notify.py
            scripts/c3_telegram_inputs.py
            scripts/c3_classic_theme.py
            scripts/c3_entry_geometry_gate.py
            scripts/c3_final_delivery_gate_v1.py
            scripts/c3_final_historical_preview_v21.py
            scripts/c3_report_context.py
            scripts/c3_report_handoff.py
            scripts/test_c3_report_handoff.py
            scripts/krx_opendart_financial_v91.py
            scripts/test_c3_report_quality.py
            scripts/test_c3_telegram_notify.py
            config/c3_company_context_verified.json
            config/c3_telegram_example_request.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: ab8439afc075b6e482887a8aad40f1a8d2d0fa1c
          path: engine
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_supply_v11.py
            scripts/c3_archive_keys_v13.py
            scripts/c3_eod_source_v9.py
            scripts/krx_official_eod_v65.py
            scripts/forward_ledger_v63.py
            scripts/source_consensus_v64.py
            scripts/entry_strategy_v58.py
            scripts/free_structural_v52.py
            scripts/first_pullback_v55.py
            scripts/shadow_five_day_v59.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report font and existing image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install pillow requests cryptography --disable-pip-version-check
      - name: Verify numerical charts, stale-data gates and at-most-once photo delivery
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_c3_telegram_notify.py' -v
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_c3_report_quality.py' -v
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_c3_report_handoff.py' -v
      - name: Replay exact 2026-11-10 frozen C3 decision as test-only CASH PNG
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          PYTHONPATH: scripts:engine/scripts
        run: python scripts/c3_final_historical_preview_v21.py --ignored-no-send
      - name: Rehearse current live input without any Telegram credentials
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          C3_FINAL_GATE_ENABLED: '1'
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python scripts/c3_telegram_notify.py --mode live --dry-run --outdir /tmp/c3-live-rehearsal
      - name: Diagnose actual failed receipt and same-key prior-session control
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          PYTHONPATH: scripts:engine/scripts
        run: |
          python - <<'PY'
          import json,os,tempfile
          from pathlib import Path
          from c3_telegram_inputs import GitHub,ROOT,canonical,digest,report_pair
          from c3_supply_v11 import open_sealed
          from c3_eod_source_v9 import collect_day
          gh=GitHub(os.environ['GH_TOKEN']);latest,summary,ref=report_pair(gh)
          out=Path('/tmp/c3-live-rehearsal');audit={'research_ref':ref,'source_run_id':latest.get('source_run_id'),'supply_attempts':[]}
          with tempfile.TemporaryDirectory() as tmp:
              day=latest.get('attempted_price_asof');rid=latest.get('source_run_id')
              if day and rid:
                  listing=gh.api('contents/'+ROOT+'/lanes/krx_unadjusted_v12/supply_receipts/'+day+'?ref='+ref)
                  match=[x for x in listing if x['name'].startswith(str(rid)+'-')]
                  if len(match)==1:
                      p=Path(tmp,'receipt.aesgcm');p.write_bytes(gh.file(match[0]['path'],ref))
                      r=json.loads(open_sealed(p,os.environ['KRX_AUTH_KEY']));payload=r['payload']
                      assert r['sha256']==digest(canonical(payload))
                      audit['supply_attempts']=payload['supply_attempts']
              # Exactly two read-only control requests. Raw market CSVs stay in tmp.
              m=collect_day('2026-11-05',Path(tmp,'control'),os.environ['KRX_AUTH_KEY'])
              audit['prior_session_control']={k:m[k] for k in ('asof','retrieval_utc','status','official_market_rows','response_diagnostics','quality')}
          (out/'supply_diagnostics.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'prior_control_rows':m['official_market_rows'],'prior_control_diagnostics':m['response_diagnostics'],'target_attempts':[{'provider':a['provider'],'status':a['status'],'rows':a.get('rows'),'response_diagnostics':a.get('response_diagnostics'),'error_code':a.get('error_code')} for a in audit['supply_attempts']]}))
          PY
      - name: Reuse public OpenDART corporation mapping
        uses: actions/cache@v4
        with:
          path: .cache/c3-dart/
          key: c3-dart-corp-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: c3-dart-corp-v1-${{ runner.os }}-
      - name: Render the two real historical cards without delivery secrets
        env:
          GH_TOKEN: ${{ github.token }}
          OPENDART_API_KEY: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.OPENDART_API_KEY || '' }}
        run: python scripts/c3_telegram_notify.py --mode preview --outdir /tmp/c3-integrated-preview
      - name: Verify real persisted duplicate protection without a Telegram token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import os,json,base64
          from pathlib import Path
          from c3_telegram_inputs import GitHub
          from c3_telegram_notify import ReceiptStore,RECEIPT_BRANCH,deliver
          gh=GitHub(os.environ['GH_TOKEN'])
          marker=json.loads(gh.file('receipts/STORE_V1.json',RECEIPT_BRANCH))
          blob=gh.api('git/blobs/'+marker['first_verified_outcome_blob_sha'])
          previous=json.loads(base64.b64decode(blob['content']))
          assert previous['status']=='DELIVERED' and previous['photos']==2
          class NeverSend:
              fingerprint=previous['key'].rsplit('-',1)[1]
              def verify_group(self):raise AssertionError('DUPLICATE_MUST_STOP_BEFORE_RECIPIENT_REQUEST')
              def send_album(self,paths):raise AssertionError('NO_SECOND_TELEGRAM_SEND_ALLOWED')
          root=Path('/tmp/c3-integrated-preview')
          result=deliver([root/'028050_integrated.png',root/'030530_integrated.png'],{'source_price_asof':'2026-11-05'},ReceiptStore(gh),NeverSend(),'past_example')
          assert result['status']=='DUPLICATE_BLOCKED' and result['send_attempts']==0
          (root/'real_duplicate_check.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Verify actual trusted-run financial collection, not just PNG creation
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/c3-integrated-preview')
          c=json.loads((root/'company_context.json').read_text())
          assert not c['errors'], 'ACTUAL_COMPANY_CONTEXT_COLLECTION_FAILED'
          assert c['selection_hash_before']==c['selection_hash_after']
          for ticker in ('028050','030530'):
              x=c['companies'][ticker]
              assert x['dart_status']=='COLLECTED', 'ACTUAL_DART_COLLECTION_NOT_COMPLETED'
              assert len(x['quarters'])==4 and len(x['dart']['periodic_statements'])>=4
          print(json.dumps({'actual_dart_companies':2,'quarters_each':4,'selection_unchanged':True}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-v21-20261110-historical-cash
          path: /tmp/c3-v21-historical-preview/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-integrated-preview
          path: /tmp/c3-integrated-preview/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-current-live-rehearsal
          path: /tmp/c3-live-rehearsal/
          retention-days: 90
          if-no-files-found: warn
  publish-rehearsal:
    needs: self-test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_report_handoff.py
            scripts/c3_telegram_inputs.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests --disable-pip-version-check
      - uses: actions/download-artifact@v4
        with:
          name: c3-current-live-rehearsal
          path: /tmp/c3-live-rehearsal
      - name: Verify atomic research-only handoff storage, without send secrets
        env:
          GH_TOKEN: ${{ github.token }}
          C3_PRESENTATION_ARTIFACT_NAME: c3-current-live-rehearsal
        run: python scripts/c3_report_handoff.py publish --outdir /tmp/c3-live-rehearsal
  recovery-check:
    if: >-
      github.repository == 'shdmfpsj-beep/krx-auto-scanner' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      recover: ${{ steps.plan.outputs.recover }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_report_handoff.py
            scripts/c3_telegram_inputs.py
            scripts/c3_telegram_notify.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pillow --disable-pip-version-check
      - name: Check late data and existing research runs before bounded recovery
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || 'live' }}
        run: python scripts/c3_report_handoff.py recovery --outdir /tmp/c3-recovery-check
  recover-data:
    needs: recovery-check
    if: needs.recovery-check.outputs.recover == 'true'
    permissions:
      contents: write
      actions: read
    uses: shdmfpsj-beep/krx-auto-scanner/.github/workflows/c3_daily_research_v8.yml@ab8439afc075b6e482887a8aad40f1a8d2d0fa1c
    with:
      engine_ref: ab8439afc075b6e482887a8aad40f1a8d2d0fa1c
      caller_mode: approved_daily
    secrets:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
  notify:
    needs: [recovery-check, recover-data]
    if: >-
      always() && !cancelled() &&
      github.repository == 'shdmfpsj-beep/krx-auto-scanner' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_telegram_notify.py
            scripts/c3_telegram_inputs.py
            scripts/c3_classic_theme.py
            scripts/c3_entry_geometry_gate.py
            scripts/c3_final_delivery_gate_v1.py
            scripts/c3_report_context.py
            scripts/c3_report_handoff.py
            scripts/krx_opendart_financial_v91.py
            config/c3_company_context_verified.json
            config/c3_telegram_example_request.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: ab8439afc075b6e482887a8aad40f1a8d2d0fa1c
          path: engine
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_supply_v11.py
            scripts/c3_archive_keys_v13.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report font and image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install pillow requests cryptography --disable-pip-version-check
      - name: Reuse public OpenDART corporation mapping
        uses: actions/cache@v4
        with:
          path: .cache/c3-dart/
          key: c3-dart-corp-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: c3-dart-corp-v1-${{ runner.os }}-
      - name: Validate explicit one-time historical request
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('config/c3_telegram_example_request.json').read_text())
          assert q=={'request_id':'integrated-white-gold-20261106','source_asof':'2026-11-05','mode':'past_example','photos':2,'caption':False,'text':False}
          PY
      - name: Render and deliver a single photo-only album, or record a silent skip
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          MODE: ${{ github.event_name == 'push' && 'past_example' || github.event.inputs.mode || 'live' }}
        run: python scripts/c3_telegram_notify.py --mode "$MODE" --outdir /tmp/c3-integrated-delivery
      - uses: actions/upload-artifact@v4
        id: delivery-evidence
        if: always()
        with:
          name: c3-integrated-delivery-evidence
          path: /tmp/c3-integrated-delivery/
          retention-days: 90
          if-no-files-found: warn
      - name: Surface unresolved live report errors as an actionable workflow failure
        if: always() && !cancelled()
        env:
          MODE: ${{ github.event_name == 'push' && 'past_example' || github.event.inputs.mode || 'live' }}
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          if os.environ['MODE']!='live':
              sys.exit(0)
          path=Path('/tmp/c3-integrated-delivery/delivery_status.json')
          if not path.exists():
              print('::error::C3 delivery status missing; cannot verify send/skip outcome')
              sys.exit(1)
          result=json.loads(path.read_text())
          status=result.get('status')
          reason=result.get('reason','')
          print(f'C3 delivery outcome: {status}, reason: {reason}, attempts: {result.get("send_attempts",0)}')
          if status=='SKIPPED' and reason in {
              'REPORT_HAS_UNRESOLVED_ERRORS','SOURCE_QUALITY_GATE_FAILED',
              'INCOMPLETE_MARKET_COVERAGE','MARKET_ROW_COUNT_MISMATCH',
              'INVALID_SOURCE_RECEIPT_TIMING','UNVERIFIED_MARKET_DATA'
          }:
              print(f'::error::C3 live report blocked by unresolved data/quality issue: {reason}')
              sys.exit(1)
          if status not in ('SKIPPED','DELIVERED','DUPLICATE_BLOCKED'):
              print(f'::error::C3 delivery did not reach a verified terminal outcome: {status}')
              sys.exit(1)
          PY
      - name: Publish only the derived same-source presentation for the existing ChatGPT report
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'push' && 'past_example' || github.event.inputs.mode || 'live' }}
          C3_PRESENTATION_ARTIFACT_ID: ${{ steps.delivery-evidence.outputs.artifact-id }}
        run: |
          if [ "$MODE" = 'live' ] && [ -f /tmp/c3-integrated-delivery/presentation.json ]; then
            python scripts/c3_report_handoff.py publish --outdir /tmp/c3-integrated-delivery
          fi
