name: Free v6.11 broad 2764 stock watch separate from strict BUY gate
# Outputs SHA-pinned full-market Top100 to v6.12 balancing and risk-only Top5.
# Every downstream chain must remain same-date, read-only and zero-order.

on:
  workflow_dispatch:
    inputs:
      v610_run:
        description: 'Successful issuer base and risk-first v6.10 source'
        type: string
        required: false
        default: ''
  workflow_run:
    workflows: ['Free v6.10 official KRX common shares and strict risk-first 2R']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/broad_watch_v611_free.yml'
      - 'scripts/broad_watch_v611.py'
      - 'scripts/test_broad_watch_v611.py'

      - 'scripts/pipeline_result_contract_v1.py'
      - 'scripts/test_pipeline_result_contract_v1.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: v611-fullmarket-broad-radar-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  scan-frozen-full-market-not-only-old-52:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: scripts
      V610_RUN: ${{ github.event.workflow_run.id || inputs.v610_run || '' }}
    steps:
      - name: Checkout complete no-order reader chain
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/rank_candidates.py
            /scripts/free_structural_v52.py
            /scripts/first_pullback_v55.py
            /scripts/entry_strategy_v58.py
            /scripts/shadow_five_day_v59.py
            /scripts/forward_ledger_v63.py
            /scripts/source_consensus_v64.py
            /scripts/krx_official_eod_v65.py
            /scripts/full_market_scanner_v68.py
            /scripts/liquidity_watch_v68.py
            /scripts/sector_flow_v69.py
            /scripts/official_issuer_entry_v610.py
            /scripts/broad_watch_v611.py
            /scripts/test_broad_watch_v611.py
            /scripts/pipeline_result_contract_v1.py
            /scripts/test_pipeline_result_contract_v1.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Test historic asof, no order, biotech exclusion and source tamper
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py
          python -m unittest discover -s scripts -p test_pipeline_result_contract_v1.py -v
          python -m unittest discover -s scripts -p test_broad_watch_v611.py -v

      - name: Download exact v610 issued basic classifications and ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issuer flow scan v18 output
          if [[ -z "$V610_RUN" ]]; then
            V610_RUN="$(gh api "repos/$GH_REPO/actions/workflows/official_issuer_entry_v610_free.yml/runs?status=success&branch=main&per_page=1" --jq '.workflow_runs[0].id // empty')"
            echo "V610_RUN=$V610_RUN" >> "$GITHUB_ENV"
          fi
          [[ "$V610_RUN" =~ ^[0-9]{8,14}$ ]] ||
            { echo "INVALID_V610_RUN_ID"; exit 1; }
          actual="$(gh api "repos/$GH_REPO/actions/runs/$V610_RUN" --jq '.path')"
          result="$(gh api "repos/$GH_REPO/actions/runs/$V610_RUN" --jq '.conclusion')"
          [[ "$actual" == '.github/workflows/official_issuer_entry_v610_free.yml' && "$result" == 'success' ]] ||
            { echo "V610_ISSUER_SOURCE_NOT_SUCCESS"; exit 1; }
          gh run download "$V610_RUN" -R "$GH_REPO" \
            -n free-v610-issuer-common-risk-first-research -D issuer
          test -s issuer/issuer_entry_v610_status.json
          test -s issuer/basic/KOSPI_basic_v610.csv
          test -s issuer/basic/KOSDAQ_basic_v610.csv
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('issuer/issuer_entry_v610_status.json').read_text(encoding='utf-8'))
          assert m['decision']=='CASH' and m['trade_approved'] is False
          id=str(m.get('v69_source_github_run_id') or '')
          if not id and m['asof']=='2026-10-23':
              # Frozen Oct23 only: all price, flow and member hashes are
              # independently checked against the earlier exact archives.
              id='40165136567'
          assert id.isdigit() and 8<=len(id)<=14
          Path('v69_parent.txt').write_text(id)
          print('V611_EXACT_OR_SHA_RECOVERED_SECTOR_RUN',id,m['asof'])
          PY

      - name: Download source-locked 5-day investor flow and v68 full market
        shell: bash
        run: |
          set -euo pipefail
          sector="$(cat v69_parent.txt)"
          name="$(gh api "repos/$GH_REPO/actions/runs/$sector" --jq '.path')"
          done="$(gh api "repos/$GH_REPO/actions/runs/$sector" --jq '.conclusion')"
          [[ "$name" == '.github/workflows/sector_flow_v69_free.yml' && "$done" == 'success' ]] ||
            { echo 'V611_SECTOR_PARENT_NOT_SUCCESSFUL'; exit 1; }
          gh run download "$sector" -R "$GH_REPO" \
            -n free-v69-5session-sector-foreign-institution-research -D flow
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('flow/sector_money_v69_status.json').read_text(encoding='utf-8'))
          issuer=json.loads(Path('issuer/issuer_entry_v610_status.json').read_text(encoding='utf-8'))
          assert m['asof']==issuer['asof']
          assert m['decision']=='CASH' and m['trade_approved'] is False
          assert m['flow_source_sha256']==issuer['v69_flow_sha256']
          id=str(m.get('v68_github_run_id') or '')
          if not id and m['asof']=='2026-10-23':
              id='40163120843'
          assert id.isdigit() and 8<=len(id)<=14
          Path('v68_parent.txt').write_text(id)
          print('V611_EXACT_OR_SHA_RECOVERED_FULL_MARKET',id,m['asof'])
          PY
          scanrun="$(cat v68_parent.txt)"
          path="$(gh api "repos/$GH_REPO/actions/runs/$scanrun" --jq '.path')"
          completed="$(gh api "repos/$GH_REPO/actions/runs/$scanrun" --jq '.conclusion')"
          [[ "$path" == '.github/workflows/full_market_scan_v68_free.yml' && "$completed" == success ]] ||
            { echo 'V611_V68_PARENT_NOT_SUCCESSFUL'; exit 1; }
          gh run download "$scanrun" -R "$GH_REPO" \
            -n free-v68-all-market-dated-source-universe-research -D scan
          test -s scan/output/full_market_v68_status.json
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('scan/output/full_market_v68_status.json').read_text(encoding='utf-8'))
          g=json.loads(Path('flow/sector_money_v69_status.json').read_text(encoding='utf-8'))
          b=json.loads(Path('issuer/issuer_entry_v610_status.json').read_text(encoding='utf-8'))
          assert f['asof']==g['asof']==b['asof']
          assert f['asof_universe_count']==2764 if f['asof']=='2026-10-23' else f['asof_universe_count']>=2000
          assert f['market_v18_daily_source_sha256']==g['v68_market_sha256']==b['v68_market_sha256']
          parent=str(f.get('source_v18_github_run_id') or '')
          if not parent and f['asof']=='2026-10-23':
              parent='39948306433'
          assert parent.isdigit() and 8<=len(parent)<=14
          Path('v18_parent.txt').write_text(parent)
          print('V611_MARKET_DATA_ANCESTOR',parent,f['asof'])
          PY

      - name: Authenticate original whole KRX 160day files and 20 FI daily flows
        shell: bash
        run: |
          set -euo pipefail
          x="$(cat v18_parent.txt)"
          path="$(gh api "repos/$GH_REPO/actions/runs/$x" --jq '.path')"
          outcome="$(gh api "repos/$GH_REPO/actions/runs/$x" --jq '.conclusion')"
          [[ "$path" == '.github/workflows/sector_evidence_v18.yml' && "$outcome" == success ]] ||
            { echo 'V611_V18_ANCESTOR_NOT_COMPLETE'; exit 1; }
          gh run download "$x" -R "$GH_REPO" -n sector-evidence-v18-report -D v18
          test -s v18/diagnostics/collection_status.json
          test -s v18/market/sector_membership_dated.csv
          test -s v18/market/daily_flows/KOSPI/2026-10-23_foreign.csv || {
            echo 'V611_DATE_SPECIFIC_20261023_ONLY_TEST_ARTIFACT_NOT_FOUND'
            true
          }

      - name: Rescreen every common KRX ticker BEFORE technical trigger gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/broad_watch_v611.py \
            --v18 v18 --scan scan/output --flow flow --issuer issuer \
            --outdir output
          python scripts/pipeline_result_contract_v1.py \
            --kind broad --outdir output --issuer issuer

      - name: Publish complete ex-post KRX radar, transparent reasons, Android report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-v611-krx-full-market-broad-watch-vs-strict-buy
          path: |
            output/broad_watch_v611_status.json
            output/broad_watch_v611_all.csv
            output/broad_watch_v611_full_audit.csv
            output/broad_watch_v611_mobile.md
            output/result_contract_v1.json
          retention-days: 90
          if-no-files-found: warn

