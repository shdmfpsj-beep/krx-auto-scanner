name: KRX sector pipeline daily health audit

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sector Evidence v18 (standalone)"]
    types: [completed]
    branches: [main]
  schedule:
    # 21:40 KST: provisional status; source may be in progress.
    # The completed v18 run triggers a second audit after it finishes.
    - cron: '40 12 * * 1-5'

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      V18_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      V18_TRIGGER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
    steps:
      - name: Secure sparse checkout of source integrity evaluator
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/sector_pipeline_health_gate.py
            /scripts/test_sector_pipeline_health_gate.py
            /scripts/krx_session_clock.py
            /.github/workflows/sector_pipeline_health.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Offline test source-quality verdicts
        run: |
          python -m py_compile scripts/sector_pipeline_health_gate.py scripts/test_sector_pipeline_health_gate.py
          python -m unittest discover -s scripts -p 'test_sector_pipeline_health_gate.py' -v
      - name: Check today scan and sector evidence results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path("scripts").resolve()))
          from krx_session_clock import nominal_last_completed_krx_session
          repo=os.environ["GH_REPO"]
          kst=timezone(timedelta(hours=9))
          now_kst=datetime.now(kst)
          today=now_kst.date().isoformat()
          created=os.environ.get("V18_TRIGGER_CREATED_AT","").strip()
          triggered_id=os.environ.get("V18_TRIGGER_RUN_ID","").strip()
          target_at=datetime.fromisoformat(created.replace("Z","+00:00")) if created else now_kst
          target=nominal_last_completed_krx_session(target_at.astimezone(kst))
          workflows={
              "krx_recovery_scan.yml":"krx_recovery",
              "sector_evidence_v18.yml":"sector_collection",
          }
          report={"date_kst":today,"target_session":target,
                  "triggered_v18_run_id":triggered_id or None,
                  "checks":{},"pipeline_ready":False,
                  "note":"Manual-only helper is not a required daily run; workflow success never certifies OHLC quality or BUY."}
          for wf,label in workflows.items():
              if wf=="sector_evidence_v18.yml" and triggered_id.isdigit():
                  p=subprocess.run(["gh","api","-X","GET",
                       f"repos/{repo}/actions/runs/{triggered_id}"],
                       capture_output=True,text=True)
                  if p.returncode:
                      report["checks"][label]={"status":"API_ERROR","message":p.stderr[:300]}
                      continue
                  try:
                      run=json.loads(p.stdout)
                      if not str(run.get("path","")).endswith("/sector_evidence_v18.yml"):
                          raise ValueError("TRIGGER_RUN_IS_NOT_V18_SOURCE")
                  except (ValueError,TypeError):
                      report["checks"][label]={"status":"TRIGGER_SOURCE_ID_INVALID"}
                      continue
              else:
                  p=subprocess.run(["gh","api","-X","GET",f"repos/{repo}/actions/workflows/{wf}/runs",
                     "-f","per_page=30"],capture_output=True,text=True)
                  if p.returncode:
                      report["checks"][label]={"status":"API_ERROR","message":p.stderr[:300]}
                      continue
                  try: runs=json.loads(p.stdout)["workflow_runs"]
                  except (ValueError,KeyError):
                      report["checks"][label]={"status":"PARSE_ERROR"}
                      continue
                  current=[r for r in runs
                           if datetime.fromisoformat(r["created_at"].replace("Z","+00:00")).astimezone(kst).date().isoformat()==target]
                  if not current:
                      report["checks"][label]={"status":"NO_RUN_FOR_TARGET_SESSION"}
                      continue
                  run=current[0]
              report["checks"][label]={"status":run.get("status"),"conclusion":run.get("conclusion"),
                "run_id":run.get("id"),"created_at":run.get("created_at"),"url":run.get("html_url")}
          report["workflow_execution_ready"]=all(
              report["checks"].get(k,{}).get("conclusion")=="success"
              for k in workflows.values())
          Path("audit/sector_pipeline_health.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not report["workflow_execution_ready"]:
              print("::warning::Pipeline not fully successful; sector report must show incomplete evidence.")
          PY

      - name: Validate actual sector evidence payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,zipfile
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path("scripts").resolve()))
          from sector_pipeline_health_gate import judge_collection
          health=Path("audit/sector_pipeline_health.json")
          report=json.loads(health.read_text())
          sector=report["checks"].get("sector_collection",{})
          result=judge_collection({},report["target_session"],sector.get("conclusion"))
          # Failed v18 runs may still upload their raw diagnostics. Read
          # these to diagnose source corruption without declaring success.
          if sector.get("run_id"):
              run_id=str(sector["run_id"])
              p=subprocess.run(["gh","api","-X","GET",
                f"repos/{os.environ['GH_REPO']}/actions/runs/{run_id}/artifacts"],
                capture_output=True,text=True)
              if p.returncode==0:
                  artifacts=json.loads(p.stdout).get("artifacts",[])
                  target=next((a for a in artifacts if a["name"]=="sector-evidence-v18-report" and not a.get("expired")),None)
                  if target:
                      z=Path("audit/evidence.zip")
                      with z.open("wb") as f:
                          d=subprocess.run(["gh","api","-X","GET","-H","Accept: application/vnd.github+json",
                            f"repos/{os.environ['GH_REPO']}/actions/artifacts/{target['id']}/zip"],stdout=f,stderr=subprocess.PIPE)
                      if d.returncode==0:
                          try:
                              with zipfile.ZipFile(z) as archive:
                                  names=[n for n in archive.namelist() if n.endswith("diagnostics/collection_status.json")]
                                  if names:
                                      status=json.loads(archive.read(names[0]))
                                      result=judge_collection(status,report["target_session"],
                                                              sector.get("conclusion"))
                          except (ValueError,zipfile.BadZipFile) as e:
                              result["reason"]=str(e)
                      z.unlink(missing_ok=True)
          report["sector_data_quality"]=result
          required=("prices","price_ohlc_integrity","flows","etf_prices","holdings","normalization")
          dataset_ok=all(result.get("datasets",{}).get(k)=="OK" for k in required)
          report["sector_evidence_verified"]=result.get("source_verified") is True
          report["sector_required_datasets_ok"]=dataset_ok
          report["pipeline_ready"]=bool(report.get("workflow_execution_ready")) and report["sector_evidence_verified"]
          report["sector_trade_ready"]=False
          report["decision_gate"]="CASH" if not report["pipeline_ready"] else "RESEARCH_ONLY_PENDING_STOCK_VALIDATION"
          report["diagnostic_note"]="A failed workflow can publish valid source-error evidence. It cannot certify a tradable market."
          health.write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload pipeline health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-pipeline-health
          path: audit/sector_pipeline_health.json
          if-no-files-found: warn
          retention-days: 30
