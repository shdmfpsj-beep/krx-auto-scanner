name: C3 30-minute schedule audit (NO LIVE QUOTES)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/c3_schedule_audit.yml']
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit scheduled diagnostic runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from datetime import datetime,timedelta,timezone
          from zoneinfo import ZoneInfo
          repo=os.environ['GH_REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/c3_top2_30min_research.yml/runs?event=schedule&per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=20) as resp: data=json.load(resp)
          now=datetime.now(ZoneInfo('Asia/Seoul'))
          today=now.date()
          runs=[]
          for x in data.get('workflow_runs',[]):
              created=datetime.fromisoformat(x['created_at'].replace('Z','+00:00')).astimezone(ZoneInfo('Asia/Seoul'))
              if created.date()==today:
                  runs.append((created,x['id'],x['conclusion']))
          lines=['# C3 30-minute schedule audit',f'- Audit KST: {now.isoformat(timespec="seconds")}',f'- Scheduled events observed today: {len(runs)}','- This is an execution audit, not a live quote feed.']
          for created,run_id,conclusion in sorted(runs):
              lines.append(f'- {created:%H:%M} KST | run {run_id} | {conclusion}')
          # Match each scheduled run to one expected slot within a 20-minute tolerance.
          # A delayed run may be counted for the closest slot; this is not proof of on-time execution.
          expected=[datetime.combine(today,datetime.min.time(),ZoneInfo('Asia/Seoul')).replace(hour=h,minute=m) for h in range(9,16) for m in (7,37)]
          pending=list(runs)
          matched=[]
          missing=[]
          for slot in expected:
              choices=[(abs((created-slot).total_seconds()),i) for i,(created,_,_) in enumerate(pending) if 0<=(created-slot).total_seconds()<=20*60]
              if choices:
                  _,i=min(choices)
                  matched.append((slot,pending.pop(i)))
              else:
                  missing.append(slot)
          lines.append(f'- Expected slots: {len(expected)}; matched: {len(matched)}; missing: {len(missing)}')
          for slot in missing:
              lines.append(f'- MISSING/UNVERIFIED slot: {slot:%H:%M} KST')
          if missing:
              lines.append('- WARNING: missing slots may reflect holidays, delayed GitHub runs, or API truncation; investigate before asserting a service outage.')
          else:
              lines.append('- All expected weekday slots matched within 20 minutes (not exchange-holiday aware).')
          result='\n'.join(lines)+'\n'
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:f.write(result)
          with open('c3_schedule_audit.md','w',encoding='utf-8') as f:f.write(result)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c3-schedule-audit
          path: c3_schedule_audit.md
          retention-days: 14
