                      price_map = {tk: {d: {"TurnoverKRW": 100000} for d in sessions} for tk in codes}
                      series = {tk: {d: bar(d, o=100 + i, h=103 + i, l=99 + i, c=101 + i) for i, d in enumerate(sessions)} for tk in codes}
                      flow = {(tk, d, inv): 100 for tk in codes for d in sessions for inv in CONFIG["investors"]}
