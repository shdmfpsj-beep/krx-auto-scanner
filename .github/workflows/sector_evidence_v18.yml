                  self.assertEqual(v.completed_candidate(now=datetime(2026, 10, 14, 18, 9, tzinfo=v.KST)), date(2026, 10, 13))
                  self.assertEqual(v.completed_candidate(now=datetime(2026, 10, 14, 18, 10, tzinfo=v.KST)), date(2026, 10, 14))
                  with self.assertRaises(v.EvidenceError):
                      v.completed_candidate("2026-10-14", datetime(2026, 10, 14, 15, 0, tzinfo=v.KST))
          
