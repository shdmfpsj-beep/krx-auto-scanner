          def artifact(name, run=100, ident=1, expired=False):
              return {"name": name, "id": ident, "expired": expired, "created_at": "2026-10-13T12:00:00Z",
                      "workflow_run": {"id": run, "head_sha": "fixture-only"}}
          
          
          def bar(d="2026-10-01", o=100, h=105, l=98, c=102, vol=10):
              return {"date": d, "open": o, "high": h, "low": l, "close": c, "volume": vol, "row_status": "OK"}
          
          
          class EvidenceTests(unittest.TestCase):
              def test_source_run_never_mix(self):
                  mixed = [artifact(n, 100 if i % 2 else 101, i + 1) for i, n in enumerate(v.REQUIRED_ARTIFACTS)]
                  with self.assertRaisesRegex(v.EvidenceError, "COMPLETE_V14_RUN_NOT_FOUND"):
                      v.select_source_run(mixed)
          
              def test_expired_or_incomplete_explicit_run_fails(self):
                  items = [artifact(n, ident=i, expired=i == 3) for i, n in enumerate(v.REQUIRED_ARTIFACTS)]
                  with self.assertRaisesRegex(v.EvidenceError, "SAME_RUN"):
                      v.select_source_run(items, "100")
          
              def test_latest_complete_run_and_override(self):
                  items = [artifact(n, 100, i + 1) for i, n in enumerate(v.REQUIRED_ARTIFACTS)]
                  items += [artifact(n, 101, i + 50) for i, n in enumerate(v.REQUIRED_ARTIFACTS)]
                  self.assertEqual(v.select_source_run(items)[0], "101")
                  self.assertEqual(v.select_source_run(items, "100")[0], "100")
          
              def test_reject_zip_traversal_and_symlinks(self):
                  with tempfile.TemporaryDirectory() as t:
                      for name, symlink in [("../escape.csv", False), ("/absolute.csv", False), ("link.csv", True)]:
                          zpath = Path(t) / "input.zip"
                          with zipfile.ZipFile(zpath, "w") as z:
                              info = zipfile.ZipInfo(name)
                              if symlink:
                                  info.external_attr = (stat.S_IFLNK | 0o777) << 16
                              z.writestr(info, "fixture")
                          with self.assertRaises(v.EvidenceError):
                              v.safe_extract(zpath, Path(t) / "output")
          
              def test_price_bytes_conflict_rejected(self):
                  with tempfile.TemporaryDirectory() as t:
                      roots = []
                      for i, text in enumerate(("Date,Close\n2026-10-01,100", "Date,Close\n2026-10-01,101")):
                          root = Path(t) / str(i) / "prices"
                          root.mkdir(parents=True)
                          (root / "005930.csv").write_text(text)
                          roots.append(root.parent)
                      with self.assertRaisesRegex(v.EvidenceError, "CONFLICTING"):
                          v.merge_raw_prices(roots, Path(t) / "merged")
          
