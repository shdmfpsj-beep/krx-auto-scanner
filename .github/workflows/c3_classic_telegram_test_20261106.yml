name: C3 classic theme Telegram visual test
on:
  push:
    branches: [main]
    paths:
      - 'reports/.c3_classic_theme_send_20261106.txt'
permissions:
  contents: read
concurrency:
  group: c3-classic-demo-20261106
  cancel-in-progress: false
jobs:
  send:
    if: github.repository == 'shdmfpsj-beep/krx-auto-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_classic_theme_demo.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Korean typography and image renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install pillow requests --disable-pip-version-check
      - name: Cross-check prices, render classic cards and deliver Telegram album
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/c3_classic_theme_demo.py --send
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-classic-top2-20261105-demo
          path: /tmp/c3-classic-cards/*.png
          retention-days: 7
          if-no-files-found: warn
