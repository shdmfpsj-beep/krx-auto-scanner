name: C3 historical replay of 2026-11-06 TOP2 (NO SEND / NO REGISTER)
on:
  push:
    branches:
      - research/c3-historical-replay-20261106
    paths:
      - '.github/workflows/c3_historical_replay_20261106.yml'
      - 'scripts/c3_historical_replay_20261106.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-historical-read-only-replay-20261106
  cancel-in-progress: false
jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/c3_historical_replay_20261106.py
            /scripts/c3_classic_theme.py
            /scripts/c3_telegram_inputs.py
            /scripts/c3_report_context.py
            /scripts/krx_opendart_financial_v91.py
            /config/c3_company_context_verified.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: 077113ac2f5e93fecc4c47850b36e5eda2173e3d
          path: engine
          persist-credentials: false
          sparse-checkout: |
            /scripts/c3_supply_v11.py
            /scripts/c3_archive_keys_v13.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install font and read-only renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install --disable-pip-version-check pillow requests cryptography
      - name: Reproduce immutable 2026-11-06 B-model decisions and render two images without Telegram access
        env:
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          PYTHONPATH: scripts
        run: python scripts/c3_historical_replay_20261106.py
      - name: Preserve read-only replay images, chart diagnostics and verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-20261106-frozen-replay-two-images
          path: |
            /tmp/c3-20261106-historical-replay/028050_integrated.png
            /tmp/c3-20261106-historical-replay/030530_integrated.png
            /tmp/c3-20261106-historical-replay/render_diagnostics.json
            /tmp/c3-20261106-historical-replay/historical_replay_manifest.json
            /tmp/c3-20261106-historical-replay/company_context.json
          retention-days: 30
          if-no-files-found: warn
