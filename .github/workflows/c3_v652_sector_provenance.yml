name: C3 v6.52 ETF membership PIT safeguard (research only)
on:
  workflow_dispatch:
  push:
    branches: [research/v615-usable-entry-frontier-20261025]
    paths:
      - 'research/c3_v652/**'
      - '.github/workflows/c3_v652_sector_provenance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/c3_v652/**'
      - '.github/workflows/c3_v652_sector_provenance.yml'
permissions:
  contents: read
jobs:
  validate_research_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: research/c3_v652
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run mandatory safe fixture checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/c3_v652/sector_provenance_gate.py
          python -m unittest discover -s research/c3_v652 -p 'test_sector_provenance_gate.py' -v
