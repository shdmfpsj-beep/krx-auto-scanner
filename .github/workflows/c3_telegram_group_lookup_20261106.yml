name: C3 one-time Telegram group ID lookup
on:
  push:
    branches: [main]
    paths:
      - 'reports/.c3_telegram_group_lookup_20261106.txt'
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Read group join events without exposing Telegram token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          t=os.getenv("TELEGRAM_BOT_TOKEN","").strip()
          if not t:
              print("NO_BOT_TOKEN_CONFIGURED")
              raise SystemExit(1)
          try:
              with urllib.request.urlopen("https://api.telegram.org/bot"+t+"/getUpdates",timeout=20) as r:
                  data=json.load(r)
              if not data.get("ok"):
                  print("BOT_API_ERROR")
                  raise SystemExit(1)
              groups={}
              for entry in data.get("result",[]):
                  for key in ("my_chat_member", "message", "channel_post"):
                      obj=entry.get(key) or {}
                      chat=obj.get("chat") or {}
                      if chat.get("type") in ("group","supergroup"):
                          cid=chat.get("id")
                          if isinstance(cid,int):
                              groups[cid]=max(groups.get(cid,0),entry.get("update_id",0))
              print("GROUP_CANDIDATE_COUNT="+str(len(groups)))
              for cid,uid in sorted(groups.items(),key=lambda x:x[1],reverse=True)[:5]:
                  print("GROUP_CANDIDATE_CHAT_ID="+str(cid)+" UPDATE_ID="+str(uid))
              if not groups:
                  print("NO_GROUP_EVENTS: send /c3connect to the newly added bot in the group and rerun lookup")
          except urllib.error.HTTPError as e:
              print("BOT_API_HTTP_ERROR="+str(e.code))
              raise SystemExit(1)
          except Exception as e:
              print("LOOKUP_ERROR_TYPE="+type(e).__name__)
              raise SystemExit(1)
          PY
