name: Legacy all-session sector research bridge (manual or CI only)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sector_evidence_bridge.py'
      - 'scripts/sector_first_daily.py'
      - 'scripts/c3_account_state.py'
      - 'config/c3_position_state.json'
      - 'scripts/test_sector_first_daily.py'
      - 'scripts/test_sector_evidence_bridge.py'
      - 'scripts/preignition_monthly_validation.py'
      - 'scripts/preignition_five_day_audit.py'
      - 'scripts/ten_day_holdout_research.py'
      - 'scripts/five_day_setup_comparison.py'
      - 'scripts/batch_five_day_setup_audit.py'
      - 'scripts/kiwoom_daily_readonly.py'
      - 'scripts/test_kiwoom_daily_readonly.py'
      - 'scripts/kiwoom_ten_day_pipeline.py'
      - 'scripts/test_kiwoom_ten_day_pipeline.py'
      - 'scripts/kiwoom_five_day_bridge.py'
      - 'scripts/test_kiwoom_five_day_bridge.py'
      - 'scripts/kiwoom_execution_audit.py'
      - 'scripts/test_kiwoom_execution_audit.py'
      - 'scripts/staged_entry_research.py'
      - 'scripts/test_staged_entry_research.py'
      - 'scripts/batch_staged_entry_comparison.py'
      - 'scripts/test_batch_staged_entry_comparison.py'
      - 'scripts/staged_entry_comparison.py'
      - 'scripts/test_staged_entry_comparison.py'
      - 'scripts/staged_robustness.py'
      - 'scripts/test_staged_robustness.py'
      - 'scripts/staged_temporal_holdout.py'
      - 'scripts/test_staged_temporal_holdout.py'
      - 'scripts/structural_support_comparison.py'
      - 'scripts/test_structural_support_comparison.py'
      - '.github/workflows/sector_research_bridge.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/sector_evidence_bridge.py
            /scripts/sector_first_daily.py
            /scripts/krx_session_clock.py
            /scripts/sector_source_pair.py
            /scripts/c3_account_state.py
            /config/c3_position_state.json
            /scripts/test_sector_first_daily.py
            /scripts/test_sector_evidence_bridge.py
            /scripts/preignition_monthly_validation.py
            /scripts/preignition_five_day_audit.py
            /scripts/ten_day_holdout_research.py
            /scripts/five_day_setup_comparison.py
            /scripts/batch_five_day_setup_audit.py
            /scripts/kiwoom_daily_readonly.py
            /scripts/test_kiwoom_daily_readonly.py
            /scripts/kiwoom_ten_day_pipeline.py
            /scripts/test_kiwoom_ten_day_pipeline.py
            /scripts/kiwoom_five_day_bridge.py
            /scripts/test_kiwoom_five_day_bridge.py
            /scripts/kiwoom_execution_audit.py
            /scripts/test_kiwoom_execution_audit.py
            /scripts/staged_entry_research.py
            /scripts/test_staged_entry_research.py
            /scripts/batch_staged_entry_comparison.py
            /scripts/test_batch_staged_entry_comparison.py
            /scripts/staged_entry_comparison.py
            /scripts/test_staged_entry_comparison.py
            /scripts/staged_robustness.py
            /scripts/test_staged_robustness.py
            /scripts/staged_temporal_holdout.py
            /scripts/test_staged_temporal_holdout.py
            /scripts/structural_support_comparison.py
            /scripts/test_structural_support_comparison.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify research bridge guardrails
        run: |
          python scripts/test_sector_evidence_bridge.py
          python scripts/test_sector_first_daily.py
          python scripts/test_kiwoom_daily_readonly.py
          python scripts/test_kiwoom_ten_day_pipeline.py
          python scripts/test_kiwoom_five_day_bridge.py
          python scripts/test_kiwoom_execution_audit.py
          python scripts/test_staged_entry_research.py
          python scripts/test_batch_staged_entry_comparison.py
          python scripts/test_staged_entry_comparison.py
          python scripts/test_staged_robustness.py
          python scripts/test_staged_temporal_holdout.py
          python scripts/test_structural_support_comparison.py
          python - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          from preignition_five_day_audit import audit,summarize
          def case(lows,highs):
              r={"entry":"100","stop":"95","target":"110"}
              for i,(lo,hi) in enumerate(zip(lows,highs),1):
                  r[f"f{i}_low"]=str(lo)
                  r[f"f{i}_high"]=str(hi)
              return r
          assert audit(case([94,100,100,100,100],[111,105,105,105,105]))=="AMBIGUOUS_SAME_DAY"
          assert audit(case([94,100,100,100,100],[105]*5))=="STOP_FIRST"
          assert audit(case([99]*5,[111,105,105,105,105]))=="TARGET_FIRST"
          assert audit(case([99]*5,[105]*5))=="NEITHER_WITHIN_5D"
          assert audit(case([99],[105]))=="INCOMPLETE_FORWARD_BARS"
          assert summarize([case([99]*5,[105]*5)])["trade_approval"]=="NO"
          from five_day_setup_comparison import inspect,pivot_stop
          bars=[{"date":str(i),"open":100,"high":101,"low":99,"close":100,"volume":1000}
                for i in range(80)]
          assert pivot_stop(bars,70) is None
          assert inspect(bars,70) is None
          bars[70]["close"]=103
          bars[70]["high"]=104
          assert inspect(bars,70)["status"]=="NO_STRUCTURAL_STOP"
          from ten_day_holdout_research import eligible,summarize as summarize_ten
          test_rows=[dict(window=str(w),ticker="000001",return_10d_pct=str(ret),
                          top10=str(hit),ma20_up="1",above_ma60="0",above_ma20="1",
                          prior5_pct="0",volume5_20=str(vol))
                     for w,ret,hit,vol in [(1,10,True,1.5),(1,-5,False,.8),
                                           (13,-3,False,1.5),(13,2,False,.7)]]
          assert eligible(test_rows[0]) and not eligible(test_rows[1])
          audited=summarize_ten(test_rows)
          assert [(x["scope"],x["rule"],x["n"]) for x in audited]==[
              ("TRAIN","ALL",2),("TRAIN","MA20_UP_VOLUME_1_2_TO_3",1),
              ("HOLDOUT","ALL",2),("HOLDOUT","MA20_UP_VOLUME_1_2_TO_3",1)]
          assert all(x["trade_approval"]=="NO" for x in audited)
          from preignition_monthly_validation import compute
          rows=[dict(month=m,top=t,ma20_up="1",above_ma60="1",
                     above_ma20="1",near_high="0",pre5="-2",vol_ratio="0.9")
                for m,t in [("2026-07","True"),("2026-07","False"),
                            ("2026-08","False"),("2026-08","False")]]
          out=compute(rows)
          a=next(r for r in out if r["scope"]=="TRAIN" and r["condition"]=="PREIGNITION_COMBO")
          b=next(r for r in out if r["scope"]=="HOLDOUT" and r["condition"]=="PREIGNITION_COMBO")
          assert (a["selected"],a["top10_hits"])==(2,1)
          assert (b["selected"],b["top10_hits"])==(2,0)
          PY
      - name: Download latest matching artifacts
        id: source_inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/scan inputs/evidence output
          python - <<'PY'
          import json,os,subprocess,zipfile,io
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import sys
          sys.path.insert(0,"scripts")
          from krx_session_clock import nominal_last_completed_krx_session
          from sector_source_pair import read_status,validate,assess
          repo=os.environ["GH_REPO"]
          source_errors=[]
          selected_sources={}
          selected_status={}
          source_rejections={}
          now=datetime.now(ZoneInfo("Asia/Seoul"))
          triggered=os.environ.get("V18_TRIGGER_CREATED_AT","")
          if triggered:
              now=datetime.fromisoformat(triggered.replace("Z","+00:00"))
          target_asof=nominal_last_completed_krx_session(now)
          print("EXPECTED_COMPLETED_KRX_SESSION",target_asof)
          for wf,name,dest in [
            ("krx_recovery_scan.yml","krx-recovery-scan","inputs/scan"),
            ("sector_evidence_v18.yml","sector-evidence-v18-report","inputs/evidence")]:
              p=subprocess.run(["gh","api","-X","GET",f"repos/{repo}/actions/workflows/{wf}/runs",
                                "-f","per_page=20"],capture_output=True,text=True,check=True)
              runs=json.loads(p.stdout)["workflow_runs"]
              candidates=[r for r in runs if r.get("conclusion")=="success"]
              if wf=="sector_evidence_v18.yml":
                # Scheduled and manually dispatched evidence are both eligible,
                # but the full ZIP provenance/completeness checks below still apply.
                candidates=[r for r in candidates
                            if r.get("event") in ("schedule","workflow_dispatch")]
              if not candidates:
                source_errors.append(f"NO_SUCCESSFUL_RUN:{wf}")
                continue
              found=False
              for run in candidates:
                a=subprocess.run(["gh","api","-X","GET",f"repos/{repo}/actions/runs/{run['id']}/artifacts"],
                                 capture_output=True,text=True,check=True)
                artifacts=json.loads(a.stdout).get("artifacts",[])
                match=next((x for x in artifacts if x["name"]==name and not x.get("expired")),None)
                if not match: continue
                z=subprocess.run(["gh","api","-X","GET",f"repos/{repo}/actions/artifacts/{match['id']}/zip"],
                                 capture_output=True,check=True)
                with zipfile.ZipFile(io.BytesIO(z.stdout)) as archive:
                  kind="v18" if wf=="sector_evidence_v18.yml" else "recovery"
                  source_status=read_status(archive,kind)
                  quality_errors=validate(kind,source_status,target_asof)
                  if quality_errors:
                    source_rejections.setdefault(wf,[]).append(
                        dict(run_id=run["id"],errors=quality_errors))
                    print(f"SKIP_SOURCE_DATE_OR_QUALITY workflow={wf} run_id={run['id']} reasons={quality_errors}")
                    continue
                  names=archive.namelist()
                  if wf=="sector_evidence_v18.yml":
                    # Baseline-only runs can succeed but have no current
                    # sector features. Prefer the latest complete backfill.
                    features=[n for n in names if n.endswith("research/sector_evidence_latest.csv")]
                    statuses=[n for n in names if n.endswith("diagnostics/collection_status.json")]
                    if len(features)!=1 or len(statuses)!=1:
                      print(f"SKIP_NON_BACKFILL run_id={run['id']}")
                      continue
                    state=json.loads(archive.read(statuses[0]))
                    needed=("prices","price_ohlc_integrity","flows","etf_prices","holdings","normalization")
                    if any(state.get("datasets",{}).get(k,{}).get("status")!="OK" for k in needed):
                      print(f"SKIP_INCOMPLETE_CORE_OR_OHLC run_id={run['id']} "
                            f"price_ohlc_integrity={state.get('datasets',{}).get('price_ohlc_integrity',{}).get('status','MISSING')}")
                      continue
                    if (state.get("orders_enabled") is not False or
                        state.get("overall_status")!="EVIDENCE_PARTIAL_CATALYST_PIT_PENDING"):
                      print(f"SKIP_NON_READONLY_OR_UNVERIFIED_SOURCE run_id={run['id']}")
                      continue
                  for entry in archive.infolist():
                    target=Path(dest,entry.filename)
                    if target.resolve()!=Path(dest).resolve() and Path(dest).resolve() not in target.resolve().parents:
                      raise SystemExit("UNSAFE_ARTIFACT_PATH")
                  archive.extractall(dest)
                print(f"SELECTED_ARTIFACT workflow={wf} run_id={run['id']} created_at={run.get('created_at')} artifact_id={match['id']}")
                selected_sources[wf]={"run_id":run["id"],"artifact_id":match["id"],
                                      "asof":target_asof}
                selected_status[kind]=source_status
                found=True
                break
              if not found:
                source_errors.append(f"ARTIFACT_UNAVAILABLE:{name}")
                if source_rejections.get(wf):
                  source_errors.extend(source_rejections[wf][0]["errors"])
          pair=assess(selected_status.get("recovery"),selected_status.get("v18"),target_asof)
          source_errors.extend(e for e in pair["errors"] if e not in source_errors)
          ready=(not source_errors and len(selected_sources)==2 and pair["ready"])
          payload={"schema":"sector_source_acquisition_v1",
                   "target_asof":target_asof,"source_pair":pair,
                   "ready":ready,"status":"VERIFIED_SOURCE_SELECTED" if ready else "PENDING_DATA_VALIDATION",
                   "errors":source_errors,"sources":selected_sources,
                   "research_only":True,"trade_approved":False,"decision":"CASH"}
          Path("output/source_selection_status.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2),encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("ready="+("true" if ready else "false")+chr(10))
          print("SOURCE_ACQUISITION",json.dumps(payload,ensure_ascii=False))
          PY
      - name: Produce research-only sector ranking
        if: steps.source_inputs.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import subprocess,sys
          from pathlib import Path
          root=Path("inputs/evidence")
          matches=list(root.rglob("diagnostics/collection_status.json"))
          scan=list(Path("inputs/scan").rglob("status.json"))
          if len(matches)!=1 or len(scan)!=1:
              raise SystemExit(f"AMBIGUOUS_OR_MISSING_INPUT evidence={len(matches)} scan={len(scan)}")
          subprocess.run([sys.executable,"scripts/sector_evidence_bridge.py",
                          "--evidence",str(matches[0].parent.parent),
                          "--scan-status",str(scan[0]),"--out","output"],check=True)
          PY
      - name: Publish simple sector TOP3 to stock TOP5 mobile report
        if: always()
        run: python scripts/sector_first_daily.py --input output --out output

      - name: Audit historical watchlist setups from real dated OHLC
        if: steps.source_inputs.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          root=Path("inputs/evidence")
          matches=list(root.rglob("diagnostics/collection_status.json"))
          watch=Path("output/sector_stock_watchlist.csv")
          summary=Path("output/sector_bridge_status.json")
          if len(matches)!=1 or not watch.exists():
              raise SystemExit("MISSING_EVIDENCE_OR_WATCHLIST")
          if summary.exists():
              data=json.loads(summary.read_text(encoding="utf-8-sig"))
              asof=data.get("asof")
          else:
              candidates=list(Path("output").glob("*summary*.json"))
              if not candidates:raise SystemExit("MISSING_ASOF_SUMMARY")
              asof=json.loads(candidates[0].read_text(encoding="utf-8-sig")).get("asof")
          if not asof:raise SystemExit("MISSING_ASOF")
          subprocess.run([sys.executable,"scripts/batch_five_day_setup_audit.py",
                          "--evidence",str(matches[0].parent.parent),
                          "--watchlist",str(watch),"--asof",asof,"--out","output"],check=True)
          PY
      - name: Compare staged entries on identical historical watchlist signals
        if: steps.source_inputs.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          matches=list(Path("inputs/evidence").rglob("diagnostics/collection_status.json"))
          watch=Path("output/sector_stock_watchlist.csv")
          state=Path("output/sector_bridge_status.json")
          if len(matches)!=1 or not watch.exists() or not state.exists():
              raise SystemExit("MISSING_PAIRED_RESEARCH_INPUT")
          asof=json.loads(state.read_text(encoding="utf-8-sig")).get("asof")
          if not asof:raise SystemExit("MISSING_ASOF")
          subprocess.run([sys.executable,"scripts/batch_staged_entry_comparison.py",
                          "--evidence",str(matches[0].parent.parent),
                          "--watchlist",str(watch),"--asof",asof,"--out","output"],check=True)
          PY
      - name: Evaluate paired-entry robustness by month and second fill
        if: steps.source_inputs.outputs.ready == 'true'
        run: |
          python scripts/staged_robustness.py --paired output/staged_entry_paired.csv --out output/staged_robustness.json
      - name: Evaluate fixed-rule temporal holdout
        if: steps.source_inputs.outputs.ready == 'true'
        run: |
          python scripts/staged_temporal_holdout.py --paired output/staged_entry_paired.csv --out output/staged_temporal_holdout.json
      - name: Compare structural second-entry supports
        if: steps.source_inputs.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          matches=list(Path("inputs/evidence").rglob("diagnostics/collection_status.json"))
          state=Path("output/sector_bridge_status.json")
          watch=Path("output/sector_stock_watchlist.csv")
          if len(matches)!=1 or not state.exists() or not watch.exists():
              raise SystemExit("MISSING_STRUCTURAL_SUPPORT_INPUT")
          asof=json.loads(state.read_text(encoding="utf-8-sig")).get("asof")
          if not asof:raise SystemExit("MISSING_ASOF")
          subprocess.run([sys.executable,"scripts/structural_support_comparison.py",
                          "--evidence",str(matches[0].parent.parent),
                          "--watchlist",str(watch),"--asof",asof,"--out","output"],check=True)
          PY
      - name: Verify structural research outputs and research-only status
        if: steps.source_inputs.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("output/structural_support_summary.json")
          q=Path("output/structural_support_comparison.csv")
          if not p.exists() or not q.exists():
              raise SystemExit("MISSING_STRUCTURAL_RESEARCH_OUTPUT")
          summary=json.loads(p.read_text(encoding="utf-8"))
          if summary.get("trade_approval")!="NO":
              raise SystemExit("UNSAFE_TRADE_APPROVAL")
          with q.open(encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          print("STRUCTURAL_OUTPUT_VERIFIED="+json.dumps({
              "rows":len(rows),"methods":summary.get("methods"),
              "trade_approval":summary.get("trade_approval")}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sector-research-bridge
          path: output/
          if-no-files-found: warn
          retention-days: 30
