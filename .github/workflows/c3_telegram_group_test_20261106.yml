name: C3 Telegram one-time GROUP connection test
on:
  push:
    branches: [main]
    paths:
      - 'reports/.c3_telegram_group_test_20261106.txt'
permissions:
  contents: read
concurrency:
  group: c3-telegram-group-connection-test
  cancel-in-progress: false
jobs:
  send-group-test:
    if: github.repository == 'shdmfpsj-beep/krx-auto-scanner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/c3_telegram_notify.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify expected group and send connection-only message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$TELEGRAM_CHAT_ID" != '-5578368803' ]; then
            echo "GROUP_CHAT_ID_NOT_MATCHED"
            exit 1
          fi
          python scripts/c3_telegram_notify.py --mode test
