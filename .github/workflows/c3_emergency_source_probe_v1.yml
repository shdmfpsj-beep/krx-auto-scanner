name: C3 emergency source recovery (no send, no ledger writes)
on:
  push:
    branches: ['research/c3-emergency-recovery-20261112']
    paths: ['scripts/c3_recovery_source_probe_v1.py','scripts/test_c3_recovery_source_probe_v1.py','scripts/c3_recovery_readonly_replay_v1.py','scripts/c3_chart_warmup_v1.py','scripts/test_c3_emergency_delivery_v1.py','.github/workflows/c3_emergency_source_probe_v1.yml']
  pull_request:
    paths: ['scripts/c3_recovery_source_probe_v1.py','scripts/test_c3_recovery_source_probe_v1.py','scripts/c3_recovery_readonly_replay_v1.py','scripts/c3_chart_warmup_v1.py','scripts/test_c3_emergency_delivery_v1.py','.github/workflows/c3_emergency_source_probe_v1.yml']
  workflow_dispatch:
    inputs:
      retry_configured_broker:
        description: Only after resolving 8050 device authorization; never bypass authorization
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  recover-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/*.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: 54e7120b01966930e176d431e85b679347210c41
          path: engine
          persist-credentials: false
          sparse-checkout: |
            /scripts/*.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the existing rendering and archive dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install requests pillow cryptography --disable-pip-version-check
      - name: Verify credentials stay private and read-only boundaries
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest discover -s scripts -p 'test_c3_recovery_source_probe_v1.py' -v
          python -m unittest discover -s scripts -p 'test_c3_emergency_delivery_v1.py' -v
          mkdir -p /tmp/c3-emergency-source
          echo '{"synthetic_tests":"PASSED","current_market_certified":false,"telegram_send_attempts":0}' > /tmp/c3-emergency-source/test_status.json
      - name: Recollect exact target and test the already configured providers
        if: github.event_name == 'workflow_dispatch' && inputs.retry_configured_broker == true
        env:
          PYTHONPATH: scripts:engine/scripts
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KIWOOM_APP_KEY: ${{ secrets.KTSCA_API_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/c3_recovery_source_probe_v1.py --date 2026-11-11 --outdir /tmp/c3-emergency-source
      - name: Verify real preserved original charts and unchanged owner ledgers
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PYTHONPATH: scripts:engine/scripts
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python scripts/c3_recovery_readonly_replay_v1.py --outdir /tmp/c3-emergency-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-emergency-source-recovery-20261111
          path: /tmp/c3-emergency-source/
          retention-days: 90
          if-no-files-found: error
