name: C3 Zone Entry V1 paired research (NO SEND / NO LEDGER WRITES)
on:
  push:
    branches: [research/c3-zone-entry-v1-20261111]
    paths:
      - 'scripts/c3_zone_*.py'
      - 'scripts/test_c3_zone_entry_v1.py'
      - 'config/c3_zone_entry_v1_protocol.json'
      - '.github/workflows/c3_zone_entry_v1_research.yml'
  pull_request:
    paths:
      - 'scripts/c3_zone_*.py'
      - 'scripts/test_c3_zone_entry_v1.py'
      - 'config/c3_zone_entry_v1_protocol.json'
      - '.github/workflows/c3_zone_entry_v1_research.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-zone-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: scripts:engine/scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/*.py
            /config/*.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: 54e7120b01966930e176d431e85b679347210c41
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          ref: da44b0225e228353a77a57998fc31c482ce8e11a
          path: state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing price-reader and chart dependencies
        run: python -m pip install --disable-pip-version-check requests pillow pandas==2.2.3 pykrx==1.2.9 'cryptography>=43,<47' exchange-calendars==4.13.2
      - name: Install existing Korean chart fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
      - name: Queued limits, integer shares, planned cash, order ambiguity and structural regressions
        run: |
          mkdir -p evidence/tests
          python -m unittest test_c3_zone_entry_v1 test_c3_dynamic_entry_v2 -v 2>&1 | tee evidence/tests/regression.log
      - name: Snapshot original signals, registered stops and receipt blobs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/c3_dynamic_integrity_v2.py --phase before --out evidence/integrity
      - name: Restore exact historical official-cache proof and original Nov05 preview ranges
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,subprocess,zipfile
          from pathlib import Path
          items=[(13905434320,'9caeeee78544337da9cda33d0a825ecc26303f1060ad857d529c77f49c348547','morning_source.json','evidence/source-original/morning_source.json'),(13878507537,'fac8e85c6de8ec76f2610723b75638694a48c37d3962e629cdddc058d7e335ba','render_diagnostics.json','evidence/case_source/render_diagnostics.json')]
          for aid,sha,member,target in items:
              raw=subprocess.check_output(['gh','api','repos/shdmfpsj-beep/krx-auto-scanner/actions/artifacts/'+str(aid)+'/zip'],timeout=60)
              assert hashlib.sha256(raw).hexdigest()==sha,'PINNED_RESEARCH_SOURCE_ARCHIVE_HASH_MISMATCH'
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.getinfo(member).file_size<4*1024*1024
                  p=Path(target);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(member))
          PY
          python scripts/c3_nov11_company_snapshot_reuse_v1.py --out evidence/company/company_quality.json
      - name: Reproduce frozen original 2769 / 1988 / 149 / 50 before new strategy comparison
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          C3_KEY_ENVELOPES_DIR: ${{ github.workspace }}/state/reports/c3_forward_v8/key_envelopes
        run: python scripts/c3_candidate_entry_review_v2.py --date 2026-11-11 --engine engine --state state --source-proof evidence/source-original/morning_source.json --outdir evidence/original
      - name: Run same-opportunity A/B/C, case replays, risk bounds and real charts
        if: github.event_name == 'push'
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          C3_KEY_ENVELOPES_DIR: ${{ github.workspace }}/state/reports/c3_forward_v8/key_envelopes
        run: python scripts/c3_zone_study_v1.py --engine engine --state state --old evidence/original --out evidence/zone
      - name: Verify protected originals and production main remain unchanged
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/c3_dynamic_integrity_v2.py --phase after --out evidence/integrity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-zone-entry-v1-paired-research
          path: |
            evidence/tests/
            evidence/integrity/
            evidence/source-original/
            evidence/case_source/
            evidence/company/
            evidence/original/reselection_summary.json
            evidence/zone/
            config/c3_zone_entry_v1_protocol.json
          if-no-files-found: error
          retention-days: 90
