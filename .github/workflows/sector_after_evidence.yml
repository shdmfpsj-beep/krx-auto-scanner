name: Refresh Sector First after verified v18 collection

# Refresh as soon as long-running scheduled 18:20 KST evidence backfill ends.
# The existing 22:00 daily report schedule remains a fallback.
on:
  workflow_run:
    workflows: ["Sector Evidence v18 (standalone)"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/sector_after_evidence.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: sector-after-v18-trigger
  cancel-in-progress: false

jobs:
  dispatch-if-complete:
    # Failed, cancelled, manually dispatched and baseline-only runs do not trigger.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch sector-first research after scheduled v18 success
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.event.repository.default_branch }}
          V18_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "v18 run $V18_RUN_ID succeeded; downstream report verifies actual source dates and artifact integrity."
          gh workflow run sector_first_daily.yml --repo "$GH_REPO" --ref "$GH_BRANCH"
          echo "SECTOR_REFRESH_DISPATCHED after_v18_run=$V18_RUN_ID"
