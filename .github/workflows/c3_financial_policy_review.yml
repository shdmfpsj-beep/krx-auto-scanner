name: C3 financial source and unapproved policy comparison (NO SEND)
on:
  pull_request:
    paths:
      - 'scripts/c3_official_attachment_review.py'
      - 'scripts/c3_financial_policy_comparison.py'
      - 'scripts/test_c3_official_attachment_review.py'
      - 'scripts/test_c3_financial_policy_comparison.py'
      - '.github/workflows/c3_financial_policy_review.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-financial-policy-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /scripts/*.py
            /.github/workflows/c3_top5_daily_telegram.yml
            /.github/workflows/c3_operating_recovery.yml
            /.github/workflows/c3_top5_dart_bridge_tests.yml
            /.github/workflows/c3_financial_policy_review.yml
            /receipts/c3_top5_daily/
            /reports/c3_paper/paper_ledger.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate review and existing operating workflows
        run: |
          set -o pipefail
          mkdir -p output/c3_financial_policy_review
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/c3-actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/c3-actionlint.tar.gz' | sha256sum -c -
          tar -xzf /tmp/c3-actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -shellcheck= -pyflakes= .github/workflows/c3_top5_daily_telegram.yml .github/workflows/c3_operating_recovery.yml .github/workflows/c3_top5_dart_bridge_tests.yml .github/workflows/c3_financial_policy_review.yml 2>&1 | tee output/c3_financial_policy_review/actionlint.log
      - name: Install the existing regression runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install pillow pandas==2.2.3 exchange-calendars==4.13.2 --disable-pip-version-check
      - name: Run all existing and read-only comparison regressions
        run: |
          set -o pipefail
          PYTHONPATH=scripts python -m unittest -v test_c3_financial_policy_comparison test_c3_official_attachment_review test_c3_technical_preflight test_c3_operating_recovery test_c3_watch5_delivery test_c3_release_connection_check test_c3_approval_scope test_c3_dart_normalization test_c3_dart_note_reconciliation test_c3_operational_integration test_c3_balanced_financials test_c3_dart_document_evidence test_c3_top5_dart_bridge test_c3_top5_financial_selection test_c3_top5_pipeline test_dart_financial_screen test_dart_interim_periods test_c3_top5_session_policy test_c3_top5_eligibility_audit test_c3_top5_independent_price_evidence 2>&1 | tee output/c3_financial_policy_review/regression.log
      - name: Verify and reuse existing real sources without another KRX or financial API collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/14994912183/zip > /tmp/c3-policy-source.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14994252507/zip > /tmp/c3-attachment-source.zip
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          sources=[('/tmp/c3-policy-source.zip','1720ea8890e8cce336ece09c7be8c44501e4a3bcb5379e3f9ab888ca8ea34c89','/tmp/c3-policy-source'),
            ('/tmp/c3-attachment-source.zip','d117b0ca282e35b9d59ecfb7f98b094ce8284901e2467ead72dcacfaa956b8e1','/tmp/c3-attachment-source')]
          for filename,expected,out in sources:
              path=Path(filename)
              if hashlib.sha256(path.read_bytes()).hexdigest()!=expected:raise ValueError('SOURCE_ARCHIVE_SHA_MISMATCH')
              with zipfile.ZipFile(path) as z:
                  if any(Path(n).is_absolute() or '..' in Path(n).parts for n in z.namelist()):raise ValueError('SOURCE_ARCHIVE_PATH')
                  z.extractall(out)
              print('VERIFIED_SOURCE_ARCHIVE',expected)
          PY
      - name: Compare existing and unapproved independent approval with all transport forbidden
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from unittest.mock import patch
          from c3_financial_policy_comparison import run
          with patch('urllib.request.urlopen',side_effect=AssertionError('COMPARISON_NETWORK_FORBIDDEN')):
              run(Path('/tmp/c3-policy-source'),Path('output/c3_financial_policy_review/comparison'))
          PY
      - name: Retrieve official corrected attachment sections only for still-pending approval candidates
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          from c3_official_attachment_review import capture
          root=Path('/tmp/c3-policy-source')
          selection=json.loads((root/'financial_selection_research.json').read_text())
          financial=json.loads((root/'financial_pool_gate.json').read_text())
          pending=set(selection['approval_required_codes']) & {r['ticker'] for r in financial['researched']+financial['excluded'] if r.get('financial_decision')=='REVIEW_REQUIRED'}
          source=Path('/tmp/c3-attachment-source/required_financial_evidence/required_source_probe')
          probe=json.loads((source/'source_probe.json').read_text())
          results=[]
          for company in probe['companies']:
              if company['ticker'] not in pending:continue
              amended={r['rcept_no'] for r in company['disclosure_version']['attachment_amendments']}
              for viewer in company.get('public_filing_viewers',[]):
                  if viewer['receipt_no'] not in amended:continue
                  if Path(viewer['file']).name!=viewer['file']:raise ValueError('VIEWER_SOURCE_PATH')
                  results.append(capture(source/viewer['file'],viewer['sha256'],viewer['receipt_no'],selection['asof'],
                      Path('output/c3_financial_policy_review/official_attachments')/viewer['receipt_no']))
          if not results or any(s['state']=='ERROR' for r in results for s in r['sections']+r.get('images',[])):
              raise ValueError('OFFICIAL_ATTACHMENT_CAPTURE_INCOMPLETE')
          print('OFFICIAL_ATTACHMENT_SECTIONS_CAPTURED',sum(len(r['sections']) for r in results),'NO_FINANCIAL_PROMOTION_OR_SEND')
          print('OFFICIAL_LINKED_IMAGES_CAPTURED',sum(len(r.get('images',[])) for r in results),'NO_FINANCIAL_PROMOTION_OR_SEND')
          PY
      - name: Preserve real source review and non-operating comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-financial-source-policy-review-NO-SEND
          path: output/c3_financial_policy_review/
          retention-days: 30
