name: C3 Nov11 whole-market entry-feasible TOP2 research replay (NO SEND / NO ORDERS)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c3_nov11_reselection_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  nov11-reselection:
    if: github.repository == 'shdmfpsj-beep/krx-auto-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      PYTHONPATH: engine/scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact approved original C3 engine
        uses: actions/checkout@v4
        with:
          ref: 54e7120b01966930e176d431e85b679347210c41
          path: engine
          persist-credentials: false
      - name: Read latest immutable research ledger (no edits)
        uses: actions/checkout@v4
        with:
          ref: research/c3-ledger-integrity-audit-20261104
          path: state
          persist-credentials: false
      - name: Read requested new diagnostics without modifying the model
        uses: actions/checkout@v4
        with:
          ref: main
          path: current
          persist-credentials: false
          sparse-checkout: |
            /scripts/c3_nov11_reselection_v1.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing read-only engine dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pykrx==1.2.9 'cryptography>=43,<47' requests
      - name: Reproduce original 2769-stock/149 A/50 B candidates, then reselect by original plan geometry
        run: |
          python -m py_compile current/scripts/c3_nov11_reselection_v1.py
          python current/scripts/c3_nov11_reselection_v1.py \
            --engine engine --state state --outdir audit_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-nov11-wholemarket-reselected-top2-research
          path: |
            audit_output/reselection_summary.json
            audit_output/b_pool_entry_diagnostics.json
          retention-days: 30
          if-no-files-found: warn
