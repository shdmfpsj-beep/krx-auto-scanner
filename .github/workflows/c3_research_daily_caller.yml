name: C3 approved research daily caller
on:
  schedule:
    # UTC Sun-Thu 23:10/20/30 = KST Mon-Fri 08:10/20/30.
    # Attempts, not a provider/Actions completion guarantee.
    - cron: '10 23 * * 0-4'
    - cron: '20 23 * * 0-4'
    - cron: '30 23 * * 0-4'
  push:
    branches: [main]
    paths: ['config/c3_morning_deploy_request.json']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/c3_research_daily_caller.yml','scripts/c3_morning_source_v1.py','.github/workflows/c3_morning_research_adapter_v1.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-approved-daily-caller
  cancel-in-progress: false
jobs:
  review-manifest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/workflows/c3_research_daily_caller.yml
            /.github/workflows/c3_morning_research_adapter_v1.yml
          sparse-checkout-cone-mode: false
      - name: Check the pinned caller without running production collection
        run: |
          python - <<'PYCODE'
          import re
          from pathlib import Path
          p=Path('.github/workflows/c3_research_daily_caller.yml').read_text()
          pin='54e7120b01966930e176d431e85b679347210c41'
          job=p.split('\n  research:\n',1)[1].split('\n  morning-review:\n',1)[0]
          called='uses: ./.github/workflows/c3_morning_research_adapter_v1.yml' in job
          configured=re.search(r'^      engine_ref: ([a-f0-9]{40})$',job,re.M)
          assert called and configured and configured[1]==pin
          adapter=Path('.github/workflows/c3_morning_research_adapter_v1.yml').read_text()
          assert 'require_morning_window' in adapter and 'SOURCE_DAY_CHANGED_AFTER_PREFLIGHT' in adapter
          assert 'source_day: ${{ needs.source-ready.outputs.source_day }}' in job
          secrets=job.split('\n    secrets:\n',1)[1]
          assert 'inherit' not in secrets
          assert set(re.findall(r'^      ([A-Z_]+):',secrets,re.M))=={'KRX_AUTH_KEY'}
          assert 'needs: source-ready' in job and 'needs.source-ready.outputs.run_id' in job
          assert 'caller_mode: approved_daily' in job and 'refs/heads/main' in job
          pre=p.split('\n  source-ready:\n',1)[1].split('\n  research:\n',1)[0]
          assert 'ref: '+pin in pre and 'scripts/c3_morning_source_v1.py' in pre and 'persist-credentials: false' in pre
          print('Pinned engine, read-only source preflight and explicit single secret valid; production disabled on PR')
          PYCODE
  source-ready:
    timeout-minutes: 8
    if: github.repository == 'shdmfpsj-beep/krx-auto-scanner' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      ready: ${{ steps.source.outputs.ready }}
      source_day: ${{ steps.source.outputs.source_day }}
      research_ready: ${{ steps.source.outputs.research_ready }}
      indices_ready: ${{ steps.source.outputs.indices_ready }}
      registration_window: ${{ steps.source.outputs.registration_window }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/*.py
            /config/c3_morning_deploy_request.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: 54e7120b01966930e176d431e85b679347210c41
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pandas==2.2.3 exchange-calendars==4.13.2 cryptography --disable-pip-version-check
      - name: Verify prior-session official KRX and cache before the existing engine
        id: source
        env:
          PYTHONPATH: scripts:engine/scripts
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python scripts/c3_morning_source_v1.py --outdir evidence --require-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-morning-source
          path: evidence/
          retention-days: 90
          if-no-files-found: error

  research:
    needs: source-ready
    if: github.repository == 'shdmfpsj-beep/krx-auto-scanner' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'push' && needs.source-ready.outputs.ready == 'true' && needs.source-ready.outputs.registration_window == 'OPEN'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/c3_morning_research_adapter_v1.yml
    with:
      engine_ref: 54e7120b01966930e176d431e85b679347210c41
      caller_mode: approved_daily
      source_day: ${{ needs.source-ready.outputs.source_day }}
      upstream_run_id: ${{ needs.source-ready.outputs.run_id }}
    secrets:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
  morning-review:
    needs: [source-ready, research, new-session-review]
    if: always() && !cancelled() && github.repository == 'shdmfpsj-beep/krx-auto-scanner' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.source-ready.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/*.py
            /config/*.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: 54e7120b01966930e176d431e85b679347210c41
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # Registered commit from this execution; branch fallback is read-only
          # deployment replay or a held status after registration failure.
          ref: ${{ needs.research.outputs.registered_state_sha || 'research/c3-ledger-integrity-audit-20261104' }}
          path: state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing report dependencies and Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum >/dev/null
          python -m pip install requests pillow pandas==2.2.3 pykrx==1.2.9 'cryptography>=43,<47' exchange-calendars==4.13.2 --disable-pip-version-check
      - uses: actions/download-artifact@v4
        with:
          name: c3-morning-source
          path: evidence
      - name: Verify registration commit, caller and date before analysis
        if: needs.research.result == 'success'
        env:
          PYTHONPATH: scripts
          REGISTRATION_PROOF: ${{ needs.research.outputs.registration_proof }}
          SOURCE_DAY: ${{ needs.source-ready.outputs.source_day }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from c3_morning_registration_v1 import check_review,canonical
          proof=json.loads(os.environ['REGISTRATION_PROOF'])
          head=subprocess.check_output(['git','-C','state','rev-parse','HEAD'],text=True).strip()
          check_review(proof,head,os.environ['SOURCE_DAY'],os.environ['GITHUB_RUN_ID'])
          Path('evidence/morning_registration.json').write_text(canonical(proof)+'\n')
          PY
      - name: Reproduce frozen A/B before all-candidate entry review
        # Deployment push replays the already registered immutable day only.
        # It cannot bypass the pinned engine's approved invocation contract.
        if: needs.research.result == 'success'
        env:
          PYTHONPATH: scripts:engine/scripts
          GH_TOKEN: ${{ github.token }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          C3_KEY_ENVELOPES_DIR: ${{ github.workspace }}/state/reports/c3_forward_v8/key_envelopes
          SOURCE_DAY: ${{ needs.source-ready.outputs.source_day }}
        run: |
          args=()
          if [ -f evidence/morning_registration.json ]; then args+=(--registration-proof evidence/morning_registration.json); fi
          python scripts/c3_candidate_entry_review_v2.py --date "$SOURCE_DAY" --engine engine --state state --source-proof evidence/morning_source.json --outdir evidence/entry "${args[@]}"
      - uses: actions/cache@v4
        with:
          path: .cache/c3-dart/
          key: c3-dart-corp-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: c3-dart-corp-v1-${{ runner.os }}-
      - name: Join dated company facts to all technical candidates
        # Deployment push replays the already registered immutable day only.
        # It cannot bypass the pinned engine's approved invocation contract.
        if: needs.research.result == 'success'
        env:
          PYTHONPATH: scripts
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_DAY: ${{ needs.source-ready.outputs.source_day }}
        run: |
          if [ "$SOURCE_DAY" = '2026-11-11' ]; then
            snapshot_sha=$(python scripts/c3_nov11_company_snapshot_reuse_v1.py --out /tmp/c3-nov11-company.json)
            python scripts/c3_company_quality_review_v1.py --candidates evidence/entry/technical_candidates.json --entry evidence/entry/reselection_summary.json --outdir evidence/company --reuse-file /tmp/c3-nov11-company.json --reuse-sha "$snapshot_sha"
          else
            python scripts/c3_company_quality_review_v1.py --candidates evidence/entry/technical_candidates.json --entry evidence/entry/reselection_summary.json --outdir evidence/company
          fi
      - uses: actions/download-artifact@v4
        if: always() && needs.new-session-review.result != 'skipped' && needs.new-session-review.result != 'cancelled'
        continue-on-error: true
        with:
          name: c3-new-session-research
          path: evidence/new-session
      - name: Record finality and image without sending before completion
        if: always() && !cancelled()
        env:
          PYTHONPATH: scripts:engine/scripts
          GH_TOKEN: ${{ github.token }}
        run: python scripts/c3_morning_final_v1.py --source evidence/morning_source.json --entry evidence/entry/reselection_summary.json --company evidence/company/combined_review.json --outdir evidence/final --publish --research evidence/new-session/research/report.json --research-publication evidence/new-session/publication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-morning-final-inputs
          path: |
            evidence/morning_source.json
            evidence/morning_registration.json
            evidence/entry/reselection_summary.json
            evidence/company/combined_review.json
            evidence/final/*.json
            evidence/final/*.png
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-morning-company-entry-evidence
          path: |
            evidence/entry/all_technical_entry_diagnostics.json
            evidence/entry/technical_candidates.json
            evidence/company/company_quality.json
          retention-days: 90
          if-no-files-found: warn

  new-session-review:
    needs: [source-ready, research]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.source-ready.outputs.research_ready == 'true' && needs.source-ready.outputs.indices_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      PYTHONPATH: scripts:v4/scripts:engine/scripts
      GH_TOKEN: ${{ github.token }}
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      C3_KEY_ENVELOPES_DIR: ${{ github.workspace }}/state/reports/c3_forward_v8/key_envelopes
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/*.py
            /config/*.json
            /.github/workflows/*.yml
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: 54e7120b01966930e176d431e85b679347210c41
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f3ed60f3fa0b967385df734ac54003aeee34d9d1
          path: v4
          persist-credentials: false
          sparse-checkout: |
            /scripts/*.py
            /config/*.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.research.outputs.registered_state_sha || 'research/c3-ledger-integrity-audit-20261104' }}
          path: state
          persist-credentials: false
          sparse-checkout: |
            /reports/c3_forward_v8/
            /reports/c3_new_session_v1/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pillow pandas==2.2.3 pykrx==1.2.9 'cryptography>=43,<47' exchange-calendars==4.13.2 yfinance==0.2.66 --disable-pip-version-check
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-nanum >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: c3-morning-source
          path: evidence
      - uses: actions/cache@v4
        with:
          path: .cache/c3-dart/
          key: c3-dart-corp-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: c3-dart-corp-v1-${{ runner.os }}-
      - name: Reuse dated global context without making it a past selection reason
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from global_macro_risk_v618 import collect
          clock=datetime.now(ZoneInfo('Asia/Seoul'))
          try:result=collect(clock.date(),clock.strftime('%H:%M'),Path('private-macro'),True)
          except Exception:result={}
          if 'generated_at_kst' in result:Path('evidence/macro.json').write_text(json.dumps(result))
          PY
      - name: Analyze only this new source; original A/B ledgers stay read-only
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python scripts/c3_source_recovery_analysis_v1.py --source evidence/recovery --engine engine --state state --out evidence/research --private private-inputs --macro evidence/macro.json
      - name: Preserve encrypted research source and review, never original signals
        run: python scripts/c3_new_source_publish_v1.py --source evidence/recovery --analysis evidence/research --out evidence/publication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-new-session-research
          path: |
            evidence/research/
            evidence/publication.json
            evidence/macro.json
          retention-days: 90
          if-no-files-found: error
