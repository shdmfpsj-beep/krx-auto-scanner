
name: Diagnose 000070 historical prices

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose historical prices
        run: python scripts/diagnose_000070.py

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-000070
          path: reports/
          if-no-files-found: warn
