name: C3 KRX reference API access probe (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
    steps:
      - name: Probe KRX basic-info access without exposing API credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,datetime,urllib.request,urllib.parse,urllib.error
          from zoneinfo import ZoneInfo
          key=os.environ.get('KRX_AUTH_KEY','')
          if not key:
              print('C3_KRX_REFERENCE_PROBE',json.dumps({'status':'MISSING_KRX_KEY'}))
              raise SystemExit(0)
          today=datetime.datetime.now(ZoneInfo('Asia/Seoul')).date()
          # Probe prior completed weekday; an empty response is not proof of denial.
          target=today-datetime.timedelta(days=1)
          while target.weekday()>4:target-=datetime.timedelta(days=1)
          result={'schema':'C3_KRX_REFERENCE_PROBE_V1','asof':target.strftime('%Y%m%d'),
                  'mode':'MANUAL_READ_ONLY_NO_TRADING_NO_TELEGRAM','endpoints':{}}
          for name in ('stk_isu_base_info','ksq_isu_base_info'):
              url='https://data-dbg.krx.co.kr/svc/apis/sto/'+name+'?'+urllib.parse.urlencode({'basDd':result['asof']})
              request=urllib.request.Request(url,headers={'AUTH_KEY':key,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=15) as response:
                      raw=response.read(8_000_001)
                      status=response.status
                  if len(raw)>8_000_000:raise ValueError('OVERSIZE')
                  obj=json.loads(raw)
                  rows=obj.get('OutBlock_1') if isinstance(obj,dict) else None
                  result['endpoints'][name]={'http_status':status,'response_kind':'ROW_ARRAY' if isinstance(rows,list) else 'OTHER',
                     'row_count':len(rows) if isinstance(rows,list) else None,
                     'field_names':sorted(rows[0].keys()) if isinstance(rows,list) and rows and isinstance(rows[0],dict) else [],
                     'status':'ACCESSIBLE' if isinstance(rows,list) and rows else 'EMPTY_OR_UNVERIFIED'}
              except urllib.error.HTTPError as e:
                  result['endpoints'][name]={'status':'HTTP_ERROR','http_status':e.code}
              except Exception as e:
                  result['endpoints'][name]={'status':'ERROR_'+type(e).__name__}
          print('C3_KRX_REFERENCE_PROBE',json.dumps(result,ensure_ascii=False))
          # No credentials, company rows or response bodies are logged or uploaded.
          PY
